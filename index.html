/* =================== LEITURA E PERSISTÊNCIA DE CARREGAMENTOS =================== */
function xlSerialToISO(v){ if(v==null||v==='') return null; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000); return d.toISOString().slice(0,10); } const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return null; }
function isoToDay(iso){ const [y,m,d]=iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d)-EPOCH)/86400000); }
function parseTimeStr(s){ s=String(s||'').trim().replace(',','.'); if(!s) return NaN; const p=s.split(':'); let t=0; for(const x of p) t=t*60+parseFloat(x); return t; }
async function parseRankingFile(file){
  if(!window.XLSX) throw new Error('A biblioteca de leitura de Excel não carregou. Verifique a ligação e tente de novo.');
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:false});
  const SM={Liv:'L',Cos:'C',Bru:'B',Mar:'M',Est:'E'};
  let year=null; const fm=file.name.match(/((?:19|20)\d\d)/);
  const sw=[], swK=new Map(), cl=[], clK=new Map(), mt=[], mtK=new Map(), evs=[...S.ev];
  const recs=new Map();
  for(const name of wb.SheetNames){
    if(/lap|top|4\s*x/i.test(name)) continue;
    const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null});
    if(a.length<3) continue;
    const title=String(a[0][0]||''); const ys=title.match(/\b(19|20)\d{2}\b/g); if(ys&&!year) year=+ys[ys.length-1];
    const h=a[1].map(x=>String(x||'').trim().toUpperCase()), ix=k=>h.indexOf(k);
    const I={co:ix('COURSE'),g:ix('GENDER'),d:ix('DISTANCE'),st:ix('STROKE'),nm:ix('FULLNAME'),bd:ix('BIRTHDATE'),nat:ix('NATION'),cc:ix('CLUBCODE'),t:ix('SWIMTIME'),tn:ix('SWIMTIME_N'),pt:ix('PTS_FINA'),md:ix('MEETDATE'),city:ix('MEETCITY'),mn:ix('MEETNAME'),cn:ix('CLUBNAME'),rg:ix('REGION')};
    if(I.nm<0||I.d<0||I.st<0||(I.t<0&&I.tn<0)) continue;
    for(const r of a.slice(2)){
      const dist=Number(r[I.d]); const st=SM[String(r[I.st]||'').trim()]; if(!dist||!st) continue;
      const ev=S.ev.indexOf(dist+st); if(ev<0) continue;
      const nm=String(r[I.nm]||'').trim(), bd=xlSerialToISO(r[I.bd]); if(!nm||!bd) continue;
      let t = I.tn>=0 && r[I.tn]!=null && r[I.tn]!=='' ? Number(r[I.tn]) : parseTimeStr(r[I.t]); if(!isFinite(t)||t<=0) continue;
      const co = String(r[I.co]||'').toUpperCase()==='SCM' ? 1 : 0;
      const g = String(r[I.g]||'').toUpperCase().startsWith('F') ? 'F' : 'M';
      const k1=nm+'|'+bd; let si=swK.get(k1); if(si===undefined){ si=sw.length; sw.push([nm,bd,g,String(r[I.nat]||'')]); swK.set(k1,si); }
      const cc=String(r[I.cc]||'?'); let ci=clK.get(cc); if(ci===undefined){ ci=cl.length; cl.push([cc,String(r[I.cn]||cc),String(r[I.rg]||'')]); clK.set(cc,ci); }
      const mn=String(r[I.mn]||''), mc=String(r[I.city]||''), k2=mn+'|'+mc; let mi=mtK.get(k2); if(mi===undefined){ mi=mt.length; mt.push([mn,mc]); mtK.set(k2,mi); }
      const mdI=xlSerialToISO(r[I.md]); const dt = mdI? isoToDay(mdI) : 0;
      const tm=Math.round(t*100), key=si+'_'+ev+'_'+co;
      const cur=recs.get(key); if(cur && cur.tm<=tm) continue;
      recs.set(key,{sw:si,tm,dt,pt:Number(r[I.pt])||0,mt:mi,cl:ci,ev,co});
    }
  }
  if(!year && fm) year=+fm[1];
  if(!year) throw new Error('Não foi possível identificar a época (ano) do ficheiro.');
  if(!recs.size) throw new Error('O ficheiro não tem o formato esperado: não foram encontradas folhas de provas individuais com as colunas FULLNAME, DISTANCE, STROKE e SWIMTIME.');
  const cols={sw:[],tm:[],dt:[],pt:[],mt:[],cl:[],ev:[],co:[]};
  for(const r of recs.values()) for(const k in cols) cols[k].push(r[k]);
  return {v:1, year, file:file.name, uploadedAt:new Date().toISOString(), sw, cl, mt, ev:evs, cols};
}

/* ---------- persistência dos carregamentos ---------- */
const CAP = {db:null, assets:null, dl:null};
function capInit(){
  const c=window.claude; if(!c||typeof c.use!=='function') return Promise.resolve();
  const t=(p)=>Promise.race([p.catch(()=>null), new Promise(r=>setTimeout(()=>r(null),12000))]);
  return Promise.all([t(c.use('db')).then(x=>CAP.db=x), t(c.use('assets')).then(x=>CAP.assets=x), t(c.use('downloads')).then(x=>CAP.dl=x)]);
}
const IDB = {
  open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('obs-np',1); r.onupgradeneeded=()=>r.result.createObjectStore('up'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); },
  async all(){ try{ const db=await this.open(); return await new Promise(res=>{ const out=[]; const tx=db.transaction('up'); const c=tx.objectStore('up').openCursor(); c.onsuccess=()=>{ const x=c.result; if(x){ out.push(x.value); x.continue(); } else res(out); }; c.onerror=()=>res(out); }); }catch(e){ return []; } },
  async put(p, key){ try{ const db=await this.open(); await new Promise((res,rej)=>{ const tx=db.transaction('up','readwrite'); tx.objectStore('up').put(p, key); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); return true; }catch(e){ return false; } },
  async del(y){ try{ const db=await this.open(); await new Promise(res=>{ const tx=db.transaction('up','readwrite'); tx.objectStore('up').delete(y); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} },
};
/* separa um payload (ficheiro) em listas por género e piscina */
function subPayload(p, idx, extra){
  const swm=new Map(), clm=new Map(), mtm=new Map(), sw=[], cl=[], mt=[], cols={sw:[],tm:[],dt:[],pt:[],mt:[],cl:[],ev:[],co:[]};
  const map=(m,arr,src,k)=>{ let v=m.get(k); if(v===undefined){ v=arr.length; arr.push(src[k]); m.set(k,v);} return v; };
  for(const i of idx){ const c=p.cols;
    cols.sw.push(map(swm,sw,p.sw,c.sw[i])); cols.cl.push(map(clm,cl,p.cl,c.cl[i])); cols.mt.push(map(mtm,mt,p.mt,c.mt[i]));
    cols.tm.push(c.tm[i]); cols.dt.push(c.dt[i]); cols.pt.push(c.pt[i]); cols.ev.push(c.ev[i]); cols.co.push(c.co[i]); }
  return Object.assign({v:2, year:p.year, file:p.file, uploadedAt:p.uploadedAt, sw, cl, mt, ev:p.ev, cols}, extra);
}
function splitPayload(p){
  const groups=new Map(), c=p.cols;
  for(let i=0;i<c.tm.length;i++){ const g=(p.sw[c.sw[i]][2]==='F')?'F':'M', co=+c.co[i], k=g+'_'+co; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(i); }
  return [...groups.entries()].map(([k,idx])=>{ const [g,co]=k.split('_'); return subPayload(p, idx, {g, co:+co, combined: groups.size>1}); });
}
function addLoaded(p){ const parts = (p.g && p.co!=null) ? [p] : splitPayload(p); for(const q of parts) S.uploads.set(slotKey(q.year,q.g,q.co), q); return parts.length; }
async function loadUploads(){
  let n=0;
  if(CAP.db){
    try{
      const snap=await CAP.db.collection('rankings').get();
      for(const d of snap.docs){ const m=d.data(); if(!m||!m.asset) continue; try{ const r=await fetch('/_blob/'+m.asset); if(!r.ok) continue; const p=await r.json(); p.uploadedAt=m.uploadedAt||p.uploadedAt; p.file=m.file||p.file; n+=addLoaded(p); }catch(e){ console.warn('upload',e); } }
    }catch(e){ console.warn('db',e); }
  } else {
    for(const p of await IDB.all()) n+=addLoaded(p);
  }
  return n;
}
async function saveUpload(p){
  const key=slotKey(p.year,p.g,p.co);
  if(CAP.db && CAP.assets){
    const ref=CAP.db.doc('rankings/y'+key); let old=null; try{ const s=await ref.get(); if(s.exists) old=s.data().asset; }catch(e){}
    const blob=new Blob([JSON.stringify(p)],{type:'application/json'});
    const a=await CAP.assets.upload(blob,{type:'application/json'});
    await ref.set({year:p.year, g:p.g, co:p.co, asset:a.id, file:p.file, uploadedAt:p.uploadedAt, rows:p.cols.tm.length});
    if(old && old!==a.id){ try{ await CAP.assets.delete(old); }catch(e){} }
    return 'shared';
  }
  if(!(await IDB.put(p, key))) throw new Error('Não foi possível guardar neste navegador (armazenamento indisponível).');
  return 'local';
}
async function removeUpload(key){
  if(CAP.db){ try{ const ref=CAP.db.doc('rankings/y'+key); const s=await ref.get(); const a=s.exists? s.data().asset : null; await ref.delete(); if(a&&CAP.assets){ try{ await CAP.assets.delete(a); }catch(e){} } }catch(e){ toast('Não foi possível remover: '+(e.message||e.code)); return false; } }
  else await IDB.del(key);
  S.uploads.delete(key); return true;
}

/* =================== ALERTAS =================== */
const AL = {y:null, top:'24', amin:'15', w:'1', basis:'global', stat:'mean', crit:'both', minev:'1', g:'', co:''};
function alertParams(p){ return {y:+(p.y||lastYear()), top:+p.top, amin:+p.amin, w:+p.w, basis:p.basis, stat:p.stat, crit:p.crit, minev:+p.minev, g:p.g, co:p.co}; }
function computeAlerts(pp){
  const p=alertParams(pp), ck='al'+JSON.stringify(p); if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, L=p.y, st = v => !v||!v.length? NaN : p.stat==='median'? quantile(v,.5) : mean(v);
  const cand=new Map(); let nCand=0, nPairs=0;
  for(let i=0;i<R.n;i++){
    if(R.yr[i]!==L || D.RK[i]>p.top || D.AGE[i]<p.amin) continue;
    if(p.g!==''&&D.G[i]!==+p.g) continue; if(p.co!==''&&R.co[i]!==+p.co) continue;
    nCand++;
    const ev=R.ev[i], co=R.co[i], g=D.G[i], a=pairMap(ev,co,g,'').get(R.sw[i]), prev=a&&a.get(L-p.w);
    let o=cand.get(R.sw[i]); if(!o){ o={sw:R.sw[i], top:[], evs:[], nopair:0}; cand.set(R.sw[i],o); }
    o.top.push(i);
    if(prev===undefined){ o.nopair++; continue; }
    nPairs++;
    const d=(R.tm[prev]-R.tm[i])/R.tm[prev]*100/p.w;
    const yrP=progRates(ev,co,g,'',L,L,p.w), allP=progRates(ev,co,g,'',null,null,p.w);
    const refY = p.basis==='age' ? st(yrP.get(D.AGE[i])) : st(yrP.all);
    const refA = p.basis==='age' ? st(allP.get(D.AGE[i])) : st(allP.all);
    const pass = p.crit==='both' ? (d>refY && d>refA) : p.crit==='year' ? d>refY : d>refA;
    const e={i, ev, co, prev, d, refY, refA, pass, ex: d-Math.max(isFinite(refY)?refY:-Infinity, isFinite(refA)?refA:-Infinity)};
    o.evs.push(e);
  }
  const list=[];
  for(const o of cand.values()){ const ok=o.evs.filter(e=>e.pass); if(ok.length<p.minev || !ok.length) continue; const s=S.sw[o.sw];
    const bestRk=Math.min(...o.top.map(i=>D.RK[i])); const bi=o.top.reduce((m,i)=>R.pt[i]>R.pt[m]?i:m,o.top[0]);
    list.push({sw:o.sw, year:L, age:L-s.by, g:s.g, esc:ESC_F[escF(L-s.by)].n, club:S.cl[R.cl[bi]].code, clubName:S.cl[R.cl[bi]].name, ntop:o.top.length, npair:o.evs.length, n:ok.length, evs:ok.sort((a,b)=>b.ex-a.ex), all:o.evs, ex:mean(ok.map(e=>e.ex)), bestRk, bpts:R.pt[bi], type: ok.length>=2?'Várias provas':'Prova específica'}); }
  list.sort((a,b)=>b.n-a.n||b.ex-a.ex);
  const res={p, list, nCand, nSw:cand.size, nPairs};
  D.cache.set(ck,res); return res;
}

  const evCount=new Map(); r.list.forEach(a=>a.evs.forEach(e=>{ const k=e.ev*2+e.co; evCount.set(k,(evCount.get(k)||0)+1); }));
  const ek=[...evCount.entries()].sort((a,b)=>b[1]-a[1]).slice(0,19);

      <div class="row" style="margin-top:12px"><button class="btn primary" id="daBk" ${hasData()?'':'disabled'}>Guardar base de dados (JSON)</button>${canW?`<label class="btn" for="daRs">Restaurar a partir de JSON</label><input type="file" id="daRs" accept=".json,application/json" hidden>`:''}</div>

    <li>Cada lista tem um número fixo de marcas por prova, por isso o número total de nadadores e a média geral de pontos dependem do corte de cada época. Para comparar épocas, use a média dos 50 melhores ou fixe uma pontuação mínima.</li>

    <li>Funil de talento: posição no ranking nacional do escalão (Cadetes, Infantis, Juvenis, Juniores, Seniores). Trajetórias semelhantes: nadadores anteriores do mesmo género com a pontuação por idade mais próxima.</li>

  const msg=$('#daMsg');

function logLine(el, html){ const d=document.createElement('div'); d.innerHTML=html; el.appendChild(d); return d; }
function afterDataChange(root, msgId, keep){ assemble(); _clubOpts=null; refreshHeader(); vDados(root); if(keep!=null) $('#'+msgId).innerHTML=keep; }
async function handleSlotUpload(file, key, root){
  const [y,g,co]=key.split('_'); const msg=$('#daMsg'); msg.innerHTML=''; let snap=null; try{ snap=newsSnapshot(); }catch(e){}
  const line=logLine(msg, `${esc(file.name)}: a ler…`);
  try{
    const p=await parseRankingFile(file); const parts=splitPayload(p);
    if(p.year!==+y) throw new Error(`o ficheiro é da época ${p.year}, não de ${y}. Use a linha ${p.year} ou a zona “Carregar vários ficheiros”.`);
    const part=parts.find(q=>q.g===g&&q.co===+co);
    if(!part) throw new Error(`o ficheiro não contém ${slotLabel(g,+co)}; contém ${parts.map(q=>slotLabel(q.g,q.co)).join(', ')}.`);
    part.file=file.name; part.uploadedAt=new Date().toISOString();
    line.innerHTML=`${esc(file.name)}: ${fN(part.cols.tm.length)} marcas de ${esc(slotLabel(g,+co))} ${y}. A guardar…`;
    const where=await saveUpload(part); S.uploads.set(key, part);
    const other = parts.length>1 ? ` O ficheiro tinha também ${parts.filter(q=>q!==part).map(q=>slotLabel(q.g,q.co)).join(', ')}, que não foram usados nesta célula.` : '';
    const keep=`<span><span class="pill good">${y} · ${esc(slotLabel(g,+co))}</span> ${fN(part.cols.tm.length)} marcas · ${where==='shared'?'guardado na plataforma':'guardado neste navegador'}.${other}</span>`;
    afterDataChange(root,'daMsg',keep); toast(`${slotLabel(g,+co)} ${y} carregado.`); showNews(snap);
  }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
}
async function handleUploads(files, root){
  const msg=$('#daMsg'); msg.innerHTML=''; msg.scrollIntoView({behavior:'smooth',block:'center'}); let ok=0, snap=null; try{ snap=newsSnapshot(); }catch(e){}
  files.sort((a,b)=>a.name.localeCompare(b.name));
  for(const file of files){
    const line=logLine(msg, `${esc(file.name)}: a ler…`);
    try{
      const p=await parseRankingFile(file), parts=splitPayload(p), out=[];
      for(const q of parts){ q.file=file.name; q.uploadedAt=new Date().toISOString(); const where=await saveUpload(q); S.uploads.set(slotKey(q.year,q.g,q.co), q); out.push(`${slotLabel(q.g,q.co)} (${fN(q.cols.tm.length)})`); ok++; }
      line.innerHTML=`<span><span class="pill good">${p.year}</span> ${esc(file.name)} → ${esc(out.join(' · '))}${parts.length>1?' <span class="pill gold">ficheiro combinado</span>':''}</span>`;
    }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
  }
  if(ok){ const keep=msg.innerHTML; afterDataChange(root,'daMsg',keep); toast(`${ok} lista${ok>1?'s':''} carregada${ok>1?'s':''}.`); showNews(snap); }
}
function refreshHeader(){ $('#hdrSub').textContent = hasData() ? `Rankings nacionais absolutos ${S.years[0]}–${lastYear()} · FPN · Direção Técnica Nacional` : 'Sem rankings carregados · FPN · Direção Técnica Nacional'; }
function buildBackup(){
  const lists=[...S.uploads.values()].sort((a,b)=>a.year-b.year||a.g.localeCompare(b.g)||a.co-b.co);
  const obj={format:'observatorio-natacao-pura', version:2, created:new Date().toISOString(), source:'Observatório Natação Pura · FPN · Direção Técnica Nacional', summary:{lists:lists.length, first:S.years[0], last:lastYear(), marks:S.n}, lists, standards:S.std, groups:S.groups, merges:{merges:S.merges, ignore:S.mergeIgnore}, targets:S.targets, relayRef:S.relayRef};
  const json=JSON.stringify(obj);
  const name=`Observatorio_NP_base_${S.years[0]}-${lastYear()}_${todayISO()}.json`;
  return {blob:new Blob([json],{type:'application/json'}), name, info:`${lists.length} listas · ${S.years.length} épocas · ${fN(S.n)} marcas · ${(json.length/1048576).toFixed(1).replace('.',',')} MB`};
}
async function restoreBackup(file, root){
  const msg=$('#daBkMsg'); msg.innerHTML=''; const l0=logLine(msg,'A ler o ficheiro…');
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ l0.innerHTML='<span class="pill bad">Erro</span> O ficheiro não é um JSON válido.'; return; }
  const src = obj && obj.format==='observatorio-natacao-pura' ? (obj.lists || obj.years) : (obj && obj.year && obj.cols ? [obj] : null);
  if(!Array.isArray(src)){ l0.innerHTML='<span class="pill bad">Erro</span> O ficheiro não é uma cópia de segurança do Observatório.'; return; }
  if(src.find(p=>!p||!p.year||!p.cols||!Array.isArray(p.cols.tm)||!Array.isArray(p.sw))){ l0.innerHTML='<span class="pill bad">Erro</span> A cópia de segurança está incompleta ou danificada.'; return; }
  if(obj.merges&&Array.isArray(obj.merges.merges)){ S.merges=obj.merges.merges; S.mergeIgnore=obj.merges.ignore||[]; buildMergeMap(); S.sw=[]; S.swKey=new Map(); try{ await saveMerges(); logLine(msg,'<span><span class="pill good">Unificação</span> '+S.merges.length+' fusões restauradas</span>'); }catch(e){} }
  if(obj.targets&&typeof obj.targets==='object'){ S.targets=obj.targets; try{ await cfgSave('targets',{targets:S.targets}); }catch(e){} }
  if(obj.relayRef&&typeof obj.relayRef==='object'){ S.relayRef=obj.relayRef; try{ await cfgSave('relayref',{refs:S.relayRef}); }catch(e){} }
  if(Array.isArray(obj.groups)&&obj.groups.length){ S.groups=obj.groups; try{ await saveGroups(); logLine(msg,'<span><span class="pill good">Grupos</span> '+obj.groups.length+' grupos restaurados</span>'); }catch(e){} }
  if(Array.isArray(obj.standards)&&obj.standards.length){ S.std=obj.standards; try{ await saveStandards(); logLine(msg,'<span><span class="pill good">Mínimos</span> '+obj.standards.length+' tabelas restauradas</span>'); }catch(e){ logLine(msg,'<span class="pill bad">Mínimos</span> não foi possível guardar as tabelas'); } }
  const parts=[]; for(const p of src){ if(p.g && p.co!=null) parts.push(p); else parts.push(...splitPayload(p)); }
  l0.innerHTML=`Cópia de ${obj.created?esc(new Date(obj.created).toLocaleString('pt-PT')):'data desconhecida'} · ${parts.length} listas.`;
  let saved=0, fail=0;
  for(const p of parts){
    const ln=logLine(msg, `${p.year} · ${esc(slotLabel(p.g,p.co))}: a guardar…`);
    try{ p.uploadedAt=p.uploadedAt||new Date().toISOString(); p.file=p.file||('restauro '+file.name); const where=await saveUpload(p); S.uploads.set(slotKey(p.year,p.g,p.co),p); saved++; ln.innerHTML=`<span><span class="pill good">${p.year}</span> ${esc(slotLabel(p.g,p.co))} · ${fN(p.cols.tm.length)} marcas · ${where==='shared'?'plataforma':'navegador'}</span>`; }
    catch(e){ fail++; ln.innerHTML=`<span><span class="pill bad">${p.year}</span> ${esc(slotLabel(p.g,p.co))}: ${esc(e.message||e.code||String(e))}</span>`; }
  }
  const keep=msg.innerHTML+`<div><b>Restauro concluído:</b> ${saved} lista${saved!==1?'s':''} restaurada${saved!==1?'s':''}${fail?`, ${fail} com erro`:''}.</div>`;
  afterDataChange(root,'daBkMsg',keep); toast('Restauro concluído.');
}

</script>
<script>
'use strict';
/* ============================================================
   Abandono do ranking · Picos de evolução
   ============================================================ */
const PEAK_P = 90;        // pico = índice (média das 3 provas com maior salto) ≥ percentil 90 da idade
const PEAK_P1 = 95;       // com uma só prova comparada, exige-se ≥ P95
const PEAK_MIN_REF = 10;  // mínimo de pares nacionais na idade/prova para servir de referência
function upperBound(arr, t){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<=t) lo=m+1; else hi=m; } return lo; }

/* todos os pares de épocas consecutivas (mesmo nadador, prova e piscina), com percentil face à mesma idade */
function pairsAll(){
  const ck='pairsAll'; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, out=[];
  for(let ev=0;ev<S.ev.length;ev++) for(let co=0;co<2;co++) for(let g=0;g<2;g++){
    const pm=pairMap(ev,co,g,''); if(!pm.size) continue; const ref=progRates(ev,co,g,'');
    for(const [sw,a] of pm) for(const [y,i] of a){ const p=a.get(y-1); if(p===undefined) continue; const age=D.AGE[i], arr=ref.get(age); if(!arr||arr.length<PEAK_MIN_REF) continue;
      const d=(R.tm[p]-R.tm[i])/R.tm[p]*100; const pc=(lowerBound(arr,d)+upperBound(arr,d))/2/arr.length*100;
      out.push({sw, g, age, y, co, ev, d, p:pc, i}); }
  }
  D.cache.set(ck,out); return out;
}
function pairsBySw(){ const ck='pairsSw'; if(D.cache.has(ck)) return D.cache.get(ck); const m=new Map(); for(const p of pairsAll()){ if(!m.has(p.sw)) m.set(p.sw,[]); m.get(p.sw).push(p); } D.cache.set(ck,m); return m; }
function groupAges(list){
  const m=new Map(); for(const p of list){ let o=m.get(p.age); if(!o){ o={age:p.age, y:p.y, sp:0, sd:0, n:0, evs:[]}; m.set(p.age,o);} o.sp+=p.p; o.sd+=p.d; o.n++; o.evs.push(p); }
  return [...m.values()].map(o=>{ const evs=o.evs.sort((a,b)=>b.p-a.p), top=evs.slice(0,3), p=top.reduce((s,e)=>s+e.p,0)/top.length; return {age:o.age, y:o.y, n:o.n, p, d:o.sd/o.n, evs, peak: o.n>=2 ? p>=PEAK_P : p>=PEAK_P1}; }).sort((a,b)=>a.age-b.age);
}
function swimmerPeaks(id, y0=null, y1=null){
  const list=(pairsBySw().get(id)||[]).filter(p=>y0==null||(p.y>=y0&&p.y<=y1));
  const ages=groupAges(list), peaks=ages.filter(a=>a.peak).sort((a,b)=>b.p-a.p), top=[...ages].sort((a,b)=>b.p-a.p).slice(0,2);
  return {ages, peaks, top};
}
function swFilter(f){ const rg=f.reg||''; return s=> (f.g===''||f.g==null||(s.g==='F'?'1':'0')===String(f.g)) && (!f.nat||(f.nat==='POR')===(s.nat==='POR')) && (!rg||(s.club>=0&&S.cl[s.club].reg===rg)); }
/* resumo nacional dos picos */
function peakSummary(f){
  const ck='pks'+JSON.stringify([f.g,f.co,f.nat,f.reg,f.y0,f.y1]); if(D.cache.has(ck)) return D.cache.get(ck);
  const okSw=swFilter(f), bySw=new Map();
  for(const p of pairsAll()){ if(f.co!==''&&f.co!=null&&p.co!==+f.co) continue; if(f.y0!=null&&(p.y<f.y0||p.y>f.y1)) continue; if(!okSw(S.sw[p.sw])) continue; if(!bySw.has(p.sw)) bySw.set(p.sw,[]); bySw.get(p.sw).push(p); }
  const G=[0,1].map(()=>({hist:new Map(), expo:new Map(), peakAges:[], maxAges:[], sw:0, sw2:0, sw1:0, d:new Map()}));
  for(const [sw,list] of bySw){ const g=S.sw[sw].g==='F'?1:0, o=G[g];
    for(const p of list){ if(!o.d.has(p.age)) o.d.set(p.age,[]); o.d.get(p.age).push(p.d); }
    const ages=groupAges(list); if(ages.length<3) continue;
    o.sw++; ages.forEach(a=>o.expo.set(a.age,(o.expo.get(a.age)||0)+1)); const pk=ages.filter(a=>a.peak); if(pk.length>=1) o.sw1++; if(pk.length>=2) o.sw2++;
    pk.forEach(a=>{ o.peakAges.push(a.age); o.hist.set(a.age,(o.hist.get(a.age)||0)+1); });
    o.maxAges.push(ages.reduce((m,a)=>a.p>m.p?a:m, ages[0]).age);
  }
  for(const o of G){ for(const [a,v] of o.d) v.sort((x,y)=>x-y); }
  D.cache.set(ck,G); return G;
}
/* abandono: última época no ranking anterior à última época carregada (menos a tolerância) */
function dropInfo(s, k=1){ if(!s||!s.n) return null; const L=lastYear(); if(s.last > L-k) return {active:true, last:s.last}; return {active:false, y:s.last, age:s.last-s.by}; }
function swYears(){ const ck='swYears'; if(D.cache.has(ck)) return D.cache.get(ck); const m=new Map(), R=S.R; for(let i=0;i<R.n;i++){ let x=m.get(R.sw[i]); if(!x){ x=new Set(); m.set(R.sw[i],x);} x.add(R.yr[i]); } D.cache.set(ck,m); return m; }
function dropSummary(f, k){
  const ck='drop'+JSON.stringify([f.g,f.nat,f.reg,f.y0,f.y1,k]); if(D.cache.has(ck)) return D.cache.get(ck);
  const Lk=lastYear()-k, okSw=swFilter(f), sy=swYears();
  const G=[0,1].map(()=>({ages:[], expo:new Map(), drop:new Map(), bySeason:new Map()}));
  for(const s of S.sw){ if(!s.n||!okSw(s)) continue; const o=G[s.g==='F'?1:0], ys=sy.get(s.id); if(!ys) continue;
    for(const y of ys){ if(y>Lk) continue; if(f.y0!=null&&(y<f.y0||y>f.y1)) continue; const a=y-s.by; o.expo.set(a,(o.expo.get(a)||0)+1);
      if(y===s.last){ o.drop.set(a,(o.drop.get(a)||0)+1); o.ages.push(a); if(!o.bySeason.has(y)) o.bySeason.set(y,[]); o.bySeason.get(y).push(a); } } }
  D.cache.set(ck,G); return G;
}

/* ---------- painel nacional: secções de abandono e picos ---------- */
function renderPnExtra(el){
  const single=P.y0===P.y1, y0=single?null:P.y0, y1=single?null:P.y1, k=+(P.dk||1);
  const f={g:P.g, co:P.co, nat:P.nat, reg:P.reg, y0, y1}, scope= single? 'todas as épocas carregadas' : `épocas ${P.y0}–${P.y1}`;
  const gs=P.g===''?[0,1]:[+P.g], Lk=lastYear()-k;
  const DR=dropSummary(f,k), PK=peakSummary(f);
  const ageL=[]; for(let a=10;a<=30;a++) ageL.push(a);
  const gl=g=>G_L[g];
  // abandono
  const drHist={type:'bar', labels:ageL.map(a=>a===30?'30+':String(a)), series:gs.map(g=>({label:gl(g), data:ageL.map(a=>{ if(a<30) return DR[g].drop.get(a)||0; let c=0; for(const [x,v] of DR[g].drop) if(x>=30) c+=v; return c; }), color:g?'s2':'s1'})), zero:true, barMax:14, xTitle:'Idade na última época no ranking'};
  const drRate={labels:ageL.slice(0,-1).map(String), series:gs.map(g=>({label:gl(g), data:ageL.slice(0,-1).map(a=>{ const e=DR[g].expo.get(a)||0, d=DR[g].drop.get(a)||0; return e>=20? +(d/e*100).toFixed(1) : null; }), color:g?'s2':'s1'})), yFmt:v=>fN(v)+'%', tipFmt:v=>f1(v)+'%', zero:true, xTitle:'Idade'};
  const seasons=[...new Set([...DR[0].bySeason.keys(),...DR[1].bySeason.keys()])].sort((a,b)=>b-a);
  const drRows=seasons.map(y=>{ const m=DR[0].bySeason.get(y)||[], w=DR[1].bySeason.get(y)||[]; return {y, m:m.length, f:w.length, am:mean(m), af:mean(w), t:m.length+w.length}; });
  // picos
  const pkHist={type:'bar', labels:ageL.map(String), series:gs.map(g=>{ const tot=PK[g].peakAges.length||1; return {label:gl(g), data:ageL.map(a=>+(((PK[g].hist.get(a)||0)/tot)*100).toFixed(1)), color:g?'s2':'s1'}; }), yFmt:v=>fN(v)+'%', tipFmt:v=>f1(v)+'% dos picos', zero:true, barMax:14, xTitle:'Idade do pico'};
  const pkRate={labels:ageL.map(String), series:gs.map(g=>({label:gl(g), data:ageL.map(a=>{ const e=PK[g].expo.get(a)||0; return e>=30? +(((PK[g].hist.get(a)||0)/e)*100).toFixed(1) : null; }), color:g?'s2':'s1'})), yFmt:v=>fN(v)+'%', tipFmt:v=>f1(v)+'% das transições nessa idade', zero:true, xTitle:'Idade'};
  const imp={labels:ageL.map(String), series:gs.map(g=>({label:gl(g), data:ageL.map(a=>{ const v=PK[g].d.get(a); return v&&v.length>=30? +quantile(v,.5).toFixed(2) : null; }), color:g?'s2':'s1'})), yFmt:v=>f1(v)+'%', tipFmt:v=>fPct(v), zero:true, xTitle:'Idade na época'};
  const pkRows=ageL.map(a=>{ const r={a}; gs.forEach(g=>{ const v=PK[g].d.get(a)||[]; r['n'+g]=v.length; r['m'+g]=v.length? quantile(v,.5):null; r['i'+g]=v.length? v.filter(x=>x>0).length/v.length*100:null; r['p'+g]=PK[g].hist.get(a)||0; r['r'+g]=(PK[g].expo.get(a)||0)>=30? (PK[g].hist.get(a)||0)/PK[g].expo.get(a)*100 : null; }); return r; }).filter(r=>gs.some(g=>r['n'+g]>0));
  const kpi=(l,v,d)=>`<div class="kpi"><div class="k">${l}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
  el.innerHTML = `
  <div class="card"><div class="card-h"><div><h3>Abandono do ranking</h3><p class="note">Considera-se que um nadador saiu quando a sua última época no ranking é anterior a ${Lk+1} (a última época carregada é ${lastYear()}${k>1?`, com tolerância de ${k} épocas`:''}). Pode tratar-se de abandono ou de descida abaixo do corte do ranking.${isPartial(lastYear())?` Como a época ${lastYear()} ainda está em curso, as saídas de ${lastYear()-1} podem estar sobrestimadas; para maior rigor escolha “Ausente nas 2 últimas épocas”.`:''} Âmbito: ${esc(scope)}. Os filtros de escalão, idade e pontuação não se aplicam a esta secção.</p></div>${selHTML('pnDk',[['1','Ausente na última época'],['2','Ausente nas 2 últimas épocas'],['3','Ausente nas 3 últimas épocas']],String(k),'Critério de saída')}</div>
    <div class="kpis">${gs.map(g=>kpi('Saídas · '+gl(g), fN(DR[g].ages.length), `idade média ${f1(mean(DR[g].ages))} · mediana ${fN(median(DR[g].ages))}`)).join('')}
      ${gs.map(g=>{ let mx=null; for(const [a,e] of DR[g].expo){ if(e<30) continue; const r=(DR[g].drop.get(a)||0)/e; if(!mx||r>mx.r) mx={a,r}; } return kpi('Idade de maior abandono · '+gl(g), mx?mx.a+' anos':'—', mx? f1(mx.r*100)+'% dos presentes nessa idade saíram':''); }).join('')}</div>
    <div class="grid g2" style="margin-top:14px"><div><h3 style="font-size:17px">Idade de saída</h3><p class="note">Número de nadadores por idade na última época em que apareceram.</p><div class="chart short" id="pnDr1"></div></div>
      <div><h3 style="font-size:17px">Taxa de abandono por idade</h3><p class="note">Percentagem dos nadadores presentes em cada idade que não voltaram a aparecer.</p><div class="chart short" id="pnDr2"></div></div></div>
    <h3 style="font-size:17px;margin-top:14px">Saídas por época</h3><div id="pnDrT" style="margin-top:8px"></div></div>
  <div class="card"><div class="card-h"><div><h3>Picos de evolução</h3><p class="note">Para cada nadador e idade, compara-se a melhoria de uma época para a seguinte em cada prova com a de todos os nadadores da mesma idade, prova e piscina (percentil). O índice da idade é a média dos percentis das 3 provas com maior salto (ou de todas, se forem menos). É pico quando o índice é ≥ P${PEAK_P} (com duas ou mais provas comparadas) ou ≥ P${PEAK_P1} (com uma só prova), ou seja, uma evolução claramente acima da habitual para a idade. Resumo com nadadores com pelo menos 3 transições de época (${esc(scope)}).</p></div></div>
    <div class="kpis">${gs.map(g=>kpi('Idade média dos picos · '+gl(g), f1(mean(PK[g].peakAges)), `mediana ${fN(median(PK[g].peakAges))} · ${fN(PK[g].peakAges.length)} picos`)).join('')}
      ${gs.map(g=>kpi('Idade do maior salto · '+gl(g), f1(mean(PK[g].maxAges)), `média da idade do maior pico de cada nadador (${fN(PK[g].sw)})`)).join('')}
      ${gs.map(g=>kpi('Com 2 ou mais picos · '+gl(g), PK[g].sw? f1(PK[g].sw2/PK[g].sw*100)+'%' : '—', `${fN(PK[g].sw1)} nadadores com pelo menos 1 pico`)).join('')}</div>
    <div class="grid g3" style="margin-top:14px"><div><h3 style="font-size:17px">Em que idades ocorrem os picos</h3><p class="note">Distribuição das idades de pico (percentagem do total de picos).</p><div class="chart short" id="pnPk1"></div></div>
      <div><h3 style="font-size:17px">Frequência de picos por idade</h3><p class="note">Percentagem das transições de época nessa idade classificadas como pico.</p><div class="chart short" id="pnPk3"></div></div>
      <div><h3 style="font-size:17px">Melhoria mediana por idade</h3><p class="note">Todas as provas: variação mediana do tempo de uma época para a seguinte.</p><div class="chart short" id="pnPk2"></div></div></div>
    <h3 style="font-size:17px;margin-top:14px">Referência nacional por idade</h3><div id="pnPkT" style="margin-top:8px"></div></div>`;
  draw('pnDr1',drHist); draw('pnDr2',drRate); draw('pnPk1',pkHist); draw('pnPk2',imp); draw('pnPk3',pkRate);
  $('#pnDk').onchange=e=>{ P.dk=e.target.value; PN.x=renderPnExtra(el); };
  const tD=new DataTable('pnDrT',[{k:'y',l:'Última época',num:1},{k:'t',l:'Saídas',num:1},...(gs.includes(0)?[{k:'m',l:'Masc.',num:1},{k:'am',l:'Idade méd. M',num:1,f:r=>f1(r.am)}]:[]),...(gs.includes(1)?[{k:'f',l:'Fem.',num:1},{k:'af',l:'Idade méd. F',num:1,f:r=>f1(r.af)}]:[])], drRows, {page:15});
  const tP=new DataTable('pnPkT',[{k:'a',l:'Idade',num:1,dir0:'asc'},...gs.flatMap(g=>{ const s=g?'F':'M'; return [{k:'n'+g,l:'Pares '+s,num:1},{k:'m'+g,l:'Melhoria med. '+s,num:1,f:r=>fPct(r['m'+g]),x:r=>r['m'+g]==null?'':+r['m'+g].toFixed(2)},{k:'i'+g,l:'% melhoraram '+s,num:1,f:r=>r['i'+g]==null?'—':f1(r['i'+g])+'%'},{k:'p'+g,l:'Picos '+s,num:1},{k:'r'+g,l:'Freq. picos '+s,num:1,f:r=>r['r'+g]==null?'—':f1(r['r'+g])+'%',x:r=>r['r'+g]==null?'':+r['r'+g].toFixed(1)}]; })], pkRows, {page:25});
  return {blocks:[
    {t:'h', text:'Abandono do ranking ('+scope+')'}, {t:'p', text:`Saída = última época no ranking anterior a ${Lk+1}. `+gs.map(g=>`${gl(g)}: ${DR[g].ages.length} saídas, idade média ${f1(mean(DR[g].ages))} anos.`).join(' ')},
    {t:'chart', title:'Idade de saída', spec:drHist}, {t:'chart', title:'Taxa de abandono por idade', spec:drRate},
    Object.assign({t:'table', sheet:'Saídas por época'}, tD.exportRows()),
    {t:'h', text:'Picos de evolução ('+scope+')'}, {t:'p', text:`Pico = índice de evolução da idade ≥ P${PEAK_P} (2+ provas) ou ≥ P${PEAK_P1} (1 prova). `+gs.map(g=>`${gl(g)}: idade média dos picos ${f1(mean(PK[g].peakAges))} anos; idade média do maior salto ${f1(mean(PK[g].maxAges))} anos; ${PK[g].sw?f1(PK[g].sw2/PK[g].sw*100):'—'}% com 2 ou mais picos.`).join(' ')},
    {t:'chart', title:'Em que idades ocorrem os picos', spec:pkHist}, {t:'chart', title:'Frequência de picos por idade', spec:pkRate}, {t:'chart', title:'Melhoria mediana por idade', spec:imp},
    Object.assign({t:'table', sheet:'Picos por idade'}, tP.exportRows()),
  ]};
}

/* ---------- ficha individual: picos e percurso ---------- */
function renderFichaPeaks(id){
  const el=$('#fiPk'); if(!el) return {blocks:[]};
  const s=S.sw[id], g=s.g==='F'?1:0, pk=swimmerPeaks(id, FS.y0, FS.y1), di=dropInfo(s,1), nat=peakSummary({g:String(g),co:'',nat:'',reg:'',y0:null,y1:null})[g];
  const chips = a => `<div class="chiplist">${a.evs.slice(0,4).map(e=>`<span class="${e.p>=PEAK_P?'hot':''}" title="${esc(evLabel(e.ev))} ${CO_S[e.co]}: ${fPct(e.d)} · P${fN(e.p)} da idade">${esc(evShort(e.ev))} ${CO_S[e.co]} <b>${fPct(e.d,1)}</b> · P${fN(e.p)}</span>`).join('')}</div>`;
  const statusTxt = di.active ? `Ativo · última época ${di.last}` : `Saiu do ranking após ${di.y}, aos ${di.age} anos`;
  if(!pk.ages.length){ el.innerHTML=`<div class="card-h"><div><h3>Picos de evolução e percurso</h3><p class="note">${esc(statusTxt)}. Sem épocas consecutivas na mesma prova suficientes para calcular a evolução por idade${FS.y0!==s.first||FS.y1!==s.last?' no período escolhido':''}.</p></div></div>`; return {blocks:[{t:'p',text:statusTxt+'.'}]}; }
  const spec={type:'bar', labels:pk.ages.map(a=>String(a.age)), series:[{label:'Índice de evolução (percentil na idade; dourado = pico)', data:pk.ages.map(a=>+a.p.toFixed(1)), color:'seq2', colors:pk.ages.map(a=>a.peak?'s2':'seq2')}], yFmt:v=>'P'+fN(v), tipFmt:(v,ctx)=>{ const a=pk.ages[ctx.dataIndex]; return 'P'+f1(v)+' · melhoria média '+fPct(a.d)+' em '+a.n+' prova'+(a.n>1?'s':''); }, yMin:0, yMax:100, zero:true, barMax:34, xTitle:'Idade (época de chegada)'};
  const pkTxt = pk.peaks.length ? pk.peaks.map(a=>a.age).sort((x,y)=>x-y).join(' · ')+' anos' : 'nenhum';

<script>
'use strict';
/* ============================================================
   Mínimos · perfil sectorial · projeção · funil de talento ·
   trajetórias semelhantes · diferencial PL/PC · estagnação
   ============================================================ */
const IDX_NAME = {4:'SEN-A',6:'SEN-B',7:'SUB23-A',8:'SEN-C',9:'SUB23-B',11:'SUB23-C',13:'PA-SUB23',15:'JUN-A',17:'JUN-B',19:'JUN-C',20:'PA-JUN',21:'JOV-A',23:'JOV-B',25:'JOV-C',27:'PA-JOV'};
const STK5 = ['M','C','B','L','E'];
/* Idades de acesso (Plano de Atividades 2027): JOV 14–16 · JUN 15–18 · SUB23 ≤ 23 · SEN > 18 · PA-JOV 15–16 · PA-JUN 17–18 · PA-SUB23 19–23.
   Idade = ano da época − ano de nascimento (idade a 31 de dezembro). */
const IDX_AGE = {4:[19,null],6:[19,null],8:[19,null],7:[null,23],9:[null,23],11:[null,23],13:[19,23],15:[15,18],17:[15,18],19:[15,18],20:[17,18],21:[14,16],23:[14,16],25:[14,16],27:[15,16]};
function stdAgeDefaults(t){ if(t.src==='PAR 2027'&&[7,9,11,13].includes(t.idx)&&t.amax===22) t.amax=23; if(t.amin===undefined&&t.amax===undefined){ const r=t.idx!=null?IDX_AGE[t.idx]:null; t.amin=r?r[0]:null; t.amax=r?r[1]:null; } return t; }
function stdAgeOK(t, age){ return (t.amin==null||age>=t.amin) && (t.amax==null||age<=t.amax); }
function stdAgeLabel(t){ if(t.amin==null&&t.amax==null) return 'todas as idades'; if(t.amin==null) return 'até '+t.amax+' anos'; if(t.amax==null) return t.amin+' ou mais anos'; return t.amin+'–'+t.amax+' anos'; }
const STK5_L = {M:'Mariposa',C:'Costas',B:'Bruços',L:'Livres',E:'Estilos'};
const evStroke = e => S.ev[e].slice(-1);
const evDist = e => parseInt(S.ev[e]);

/* ---------------- tabelas de mínimos ---------------- */
function stdFromRaw(id,name,co,grp,idx,evs,v){ const t={M:{},F:{}}; evs.forEach((e,k)=>{ t.M[e]=v.M[k]; t.F[e]=v.F[k]; }); return {id,name,co,grp,idx,t,src:'PAR 2027'}; }
function defaultStandards(){
  const out=[ stdFromRaw('WA-A','Mundial 2027 · Mínimo A (World Aquatics)',0,'Mundial Budapeste 2027',null,STD_RAW.plEv,STD_RAW.wa.A),
              stdFromRaw('WA-FPN','Mundial 2027 · Mínimo FPN (Mín. A + 0,5%)',0,'Mundial Budapeste 2027',null,STD_RAW.plEv,STD_RAW.wa.FPN) ];
  for(const co of [0,1]){ const raw=co?STD_RAW.pc:STD_RAW.pl, evs=co?STD_RAW.pcEv:STD_RAW.plEv;
    Object.keys(raw).map(Number).sort((a,b)=>a-b).forEach(ix=>out.push(stdFromRaw((co?'PC-':'PL-')+ix, `${IDX_NAME[ix]?IDX_NAME[ix]+' · ':''}Índice ${ix} · ${co?'PC':'PL'}`, co, co?'Índices PAR · Piscina curta':'Índices PAR · Piscina longa', ix, evs, raw[ix]))); }
  return out.map(stdAgeDefaults);
}
S.std = defaultStandards(); S.stdMeta = {src:'default'};
async function loadStandards(){
  try{
    let d=null;
    if(CAP.db){ const s=await CAP.db.doc('config/standards').get(); if(s.exists) d=s.data(); }
    else { const j=localStorage.getItem('obsnp_standards'); if(j) d=JSON.parse(j); }
    if(d && Array.isArray(d.tables) && d.tables.length){ S.std=d.tables.map(stdAgeDefaults); S.stdMeta={src:'saved', at:d.updatedAt}; }
  }catch(e){ console.warn('mínimos',e); }
}
async function saveStandards(){
  const d={tables:S.std, updatedAt:new Date().toISOString()};
  if(CAP.db){ await CAP.db.doc('config/standards').set(d); S.stdMeta={src:'saved',at:d.updatedAt}; return 'shared'; }
  localStorage.setItem('obsnp_standards', JSON.stringify(d)); S.stdMeta={src:'saved',at:d.updatedAt}; return 'local';
}
const stdById = id => S.std.find(s=>s.id===id);
function stdTime(tab, g, e){ if(!tab) return null; const v=tab.t[g] && tab.t[g][S.ev[e]]; return v>0? v : null; }
function stdOptions(co){ const groups=new Map(); S.std.filter(s=>co==null||s.co===co).forEach(s=>{ if(!groups.has(s.grp)) groups.set(s.grp,[]); groups.get(s.grp).push(s); }); return groups; }
function stdSelectHTML(id, val, co, label, age){
  const g=stdOptions(co); const opts=[...g.entries()].map(([k,arr])=>{ arr=arr.filter(s=>age==null||stdAgeOK(s,age)||s.id===val); return arr.length?`<optgroup label="${esc(k)}">${arr.map(s=>`<option value="${esc(s.id)}"${s.id===val?' selected':''}>${esc(s.name)} · ${esc(stdAgeLabel(s))}</option>`).join('')}</optgroup>`:''; }).join('');
  return `<label class="fld"><span>${esc(label||'Tabela de mínimos')}</span><select id="${id}" style="max-width:340px">${opts}</select></label>`;
}
function defaultStdId(age, co){ const p=co?'PC-':'PL-'; const ix = age<=16?21 : age<=18?15 : age<=23?7 : 4; const id=p+ix; const t=stdById(id); if(t&&stdAgeOK(t,age)) return id; const alt=S.std.find(s=>s.co===co&&stdAgeOK(s,age))||S.std.find(s=>stdAgeOK(s,age))||S.std[0]; return alt.id; }

/* ---------------- referências por estilo ---------------- */
function strokeTable(y, g, co){
  const ck=`stk${y}_${g}_${co}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, m=new Map();
  for(let i=0;i<R.n;i++){ if(R.yr[i]!==y) continue; if(g!==''&&g!=null&&D.G[i]!==+g) continue; if(co!==''&&co!=null&&R.co[i]!==+co) continue;
    let o=m.get(R.sw[i]); if(!o){ o={age:D.AGE[i], esc:D.ESC[i], g:D.G[i], v:[null,null,null,null,null]}; m.set(R.sw[i],o); }
    const k=STK5.indexOf(evStroke(R.ev[i])); if(o.v[k]==null||R.pt[i]>o.v[k]) o.v[k]=R.pt[i]; }
  D.cache.set(ck,m); return m;
}
const polIndex = v => { const mx=Math.max(...v.map(x=>x||0)); if(!mx) return null; return v.reduce((s,x)=>s+(x||0),0)/5/mx*100; };
function strokeRefs(y, g, co){
  const ck=`stkr${y}_${g}_${co}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const m=strokeTable(y,g,co), abs=[[],[],[],[],[]], esc=ESC_G.map(()=>[[],[],[],[],[]]), age=new Map(), polE=ESC_G.map(()=>[]);

/* ---------------- pares PL/PC ---------------- */
function plpcPairs(){
  const ck='plpc'; if(D.cache.has(ck)) return D.cache.get(ck);
  const out=[];
  for(let e=0;e<S.ev.length;e++) for(let g=0;g<2;g++){ const a=pairMap(e,0,g,''), b=pairMap(e,1,g,''); if(!a.size||!b.size) continue;
    for(const [sw,ya] of a){ const yb=b.get(sw); if(!yb) continue; for(const [y,i] of ya){ const j=yb.get(y); if(j===undefined) continue; out.push({sw,e,g,y,age:D.AGE[i],esc:D.ESC[i],pl:S.R.tm[i],pc:S.R.tm[j],gain:(S.R.tm[i]-S.R.tm[j])/S.R.tm[i]*100}); } } }
  D.cache.set(ck,out); return out;
}
function plpcRef(e, g, esc){

  const r=v.length? {n:v.length, p25:quantile(v,.25), p50:quantile(v,.5), p75:quantile(v,.75), lvl} : null; D.cache.set(ck,r); return r;
}

/* ---------------- pontuação por idade (trajetórias) ---------------- */
function ptsByAge(){
  const ck='ptsAge'; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, m=new Map();
  for(let i=0;i<R.n;i++){ let a=m.get(R.sw[i]); if(!a){ a=new Map(); m.set(R.sw[i],a);} const age=D.AGE[i], c=a.get(age); if(!c||R.pt[i]>c.p) a.set(age,{p:R.pt[i], i}); }

function similarSwimmers(id, k=10){
  const A=S.sw[id], PA=ptsByAge(), pa=PA.get(id); if(!pa) return null;
  const ages=[...pa.keys()].sort((a,b)=>a-b), c=ages[ages.length-1], a0=ages[0];
  const res=[];
  for(const s of S.sw){ if(!s.n||s.id===id||s.g!==A.g||s.by>=A.by) continue; const pb=PA.get(s.id); if(!pb||!pb.has(c)) continue;
    const bAges=[...pb.keys()]; const maxB=Math.max(...bAges); if(maxB<c+2) continue;
    let sw=0, sd=0, nc=0; for(const a of ages){ const x=pb.get(a); if(!x) continue; const w=1+(a-a0)/(c-a0+1); sd+=w*(pa.get(a).p-x.p)**2; sw+=w; nc++; }
    if(nc<Math.min(2,ages.length)) continue;
    res.push({s, d:Math.sqrt(sd/sw), nc});
  }
  res.sort((x,y)=>x.d-y.d);
  const top=res.slice(0,k).map(r=>{ const pb=PA.get(r.s.id); let best=null; for(const [a,x] of pb) if(a>c&&(!best||x.p>best.p)) best={a,p:x.p}; const rows=swRows(r.s.id).filter(i=>D.AGE[i]>c); const brk=rows.length? Math.min(...rows.map(i=>D.RK[i])) : null; return {id:r.s.id, by:r.s.by, d:r.d, nc:r.nc, atC:pb.get(c).p, fut:best, brk, last:r.s.last, di:dropInfo(r.s,1)}; });
  return {c, ages, list:top, pool:res.length};
}

      for(const y of ys){ const p=m.get(y); if(p>best){ best=p; lastPB=y; } if(y-first<2) continue; if(y<AN.y0||y>AN.y1) continue; const st=(y-lastPB)>=2; inc(G[g].age, y-s.by, st); inc(G[g].season, y, st); } }

/* ---------- tabela de tendência: evolução / estagnação / regressão ---------- */
function trendClass(d, thr){ if(d==null||!isFinite(d)) return ''; return d>thr ? (d>2*thr?'up2':'up') : d<-thr ? (d<-2*thr?'dn2':'dn') : 'eq'; }
const TR_SYM={up:'▲',up2:'▲',dn:'▼',dn2:'▼',eq:'▬'}, TR_L={up:'Evolução',up2:'Evolução',dn:'Regressão',dn2:'Regressão',eq:'Estagnação'};
function trendTable(rowsLab, years, vals, thr, head){
  const partial=years.map(y=>isPartial(y)), closed=years.map((y,j)=>!partial[j]);
  const sgn=v=>(v>0?'+':v<0?'−':'±')+fN(Math.abs(Math.round(v)));
  const rows=vals.map((r,k)=>{ const cells=r.map((v,j)=>{ let p=null; for(let q=j-1;q>=0;q--) if(r[q]!=null){ p=r[q]; break; } const d= v!=null&&p!=null ? v-p : null; return {v, d, c:trendClass(d,thr)}; });
    const pts=r.map((v,j)=>[years[j],v]).filter(([y,v],j)=>v!=null&&closed[years.indexOf(y)]);
    let slope=null; if(pts.length>=3){ const mx=mean(pts.map(p=>p[0])), my=mean(pts.map(p=>p[1])); let a=0,b=0; pts.forEach(([x,y])=>{ a+=(x-mx)*(y-my); b+=(x-mx)*(x-mx); }); slope=b? a/b : null; }
    const tot= pts.length>=2 ? pts[pts.length-1][1]-pts[0][1] : null;
    const cnt={up:0,eq:0,dn:0}; cells.forEach((c,j)=>{ if(!c.c||partial[j]) return; cnt[c.c.replace('2','')]++; });
    return {lab:rowsLab[k], cells, slope, tc:trendClass(slope, thr/2), tot, cnt, n0:pts.length?pts[0][0]:null, n1:pts.length?pts[pts.length-1][0]:null}; });
  const th=`<th>${esc(head)}</th>`+years.map((y,j)=>`<th class="num">${y}${partial[j]?'<br><span class="small muted">parcial</span>':''}</th>`).join('')+`<th class="num" title="Declive da reta de regressão (pontos por época), épocas fechadas">Tendência</th><th class="num" title="Épocas com evolução / estagnação / regressão">▲ / ▬ / ▼</th>`;
  const body=rows.map(r=>`<tr><td><b>${esc(r.lab)}</b></td>${r.cells.map((c,j)=> c.v==null? '<td class="num muted">·</td>' : `<td class="num trc t-${c.c}${partial[j]?' prov':''}" title="${esc(r.lab)} · ${years[j]}: ${fN(Math.round(c.v))} pts${c.d!=null?` · ${sgn(c.d)} face à época anterior · ${TR_L[c.c]}`:''}${partial[j]?' · época em curso (provisório)':''}"><span class="tv">${fN(Math.round(c.v))}</span>${c.d!=null?`<span class="td"><i>${TR_SYM[c.c]}</i>${sgn(c.d)}</span>`:''}</td>`).join('')}<td class="num trc t-${r.tc}" title="${r.slope==null?'':f1(r.slope)+' pts por época · '+TR_L[r.tc]+(r.tot!=null?` · ${sgn(r.tot)} pts entre ${r.n0} e ${r.n1}`:'')}">${r.slope==null?'—':`<span class="tv"><i>${TR_SYM[r.tc]}</i> ${(r.slope>0?'+':r.slope<0?'−':'')+f1(Math.abs(r.slope))}</span><span class="td">pts/época</span>`}</td><td class="num small">${r.cnt.up} / ${r.cnt.eq} / ${r.cnt.dn}</td></tr>`).join('');
  const html=`<div class="tbl-wrap"><table class="t trt"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
  const cols=['s1','s2','s3','seq0','bad'];
  const spec={labels:years.map(String), series:rows.map((r,k)=>({label:r.lab, data:r.cells.map(c=>c.v==null?null:Math.round(c.v)), color:cols[k%cols.length]})), zero:false, yFmt:fN, tipFmt:v=>fN(v)+' pts'};
  const asc=v=>(v>0?'+':v<0?'-':'')+Math.abs(Math.round(v));
  const exp={head:[head,...years.map(y=>String(y)+(isPartial(y)?' (parcial)':'')),'Tendência (pts/época)','Classificação','Evolução / estagnação / regressão'], rows:rows.map(r=>[r.lab,...r.cells.map(c=>c.v==null?'':Math.round(c.v)+(c.d!=null?' ('+(Math.abs(c.d)<0.5?'=':asc(c.d))+')':'')), r.slope==null?'':(r.slope>0?'+':'')+r.slope.toFixed(1), r.slope==null?'':TR_L[r.tc], `${r.cnt.up} / ${r.cnt.eq} / ${r.cnt.dn}`]), align:['l',...years.map(()=>'r'),'r','l','r']};
  const FILL={up:'#DCEFE4',up2:'#B3DDC4',dn:'#F7DEDB',dn2:'#EDB6B0',eq:null};
  exp.fills=rows.map(r=>[null,...r.cells.map(c=>FILL[c.c]||null),FILL[r.tc]||null,FILL[r.tc]||null,null]);
  return {html, spec, exp, rows, thr, partial:partial.some(Boolean)};
}

<script>
'use strict';
/* ============================================================
   Recordes por idade · densidade · géneros · idade de pico ·
   clubes formadores · eficiência territorial · afinação ·
   pré-convocatórias · relatório da época · grupos de alto rendimento
   ============================================================ */
const NAT_RE = /(campeonatos? nacion|nacionais|open de portugal|nacional (de )?(clubes|juvenis|juniores|absolutos|infantis|seniores))/i;
function meetType(i){ const n=S.mt[S.R.mt[i]].name; if(INTL_RE.test(n)) return 2; if(NAT_RE.test(n)) return 1; return 0; }
const MT_L = ['Outras competições','Campeonatos nacionais','Internacionais'];
const MONTHS_S = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const evCode = e => S.ev[e];
function monthOf(i){ return dayToDate(S.R.dt[i]).getUTCMonth(); }
/* melhor marca da época por nadador × prova × piscina */
function seasonBests(filt){
  const R=S.R, m=new Map();
  for(let i=0;i<R.n;i++){ if(filt && !filt(i)) continue; const k=(R.sw[i]*64+R.ev[i]*2+R.co[i])*4000+R.yr[i]; const c=m.get(k); if(c===undefined||R.tm[i]<R.tm[c]) m.set(k,i); }
  return [...m.values()];
}
/* pontos WA de referência para um tempo (estimados a partir dos dados: pts = 1000·(B/t)³) */
function baseTime(e, co, g){
  const ck=`bt${e}_${co}_${g}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, v=[]; for(let i=0;i<R.n&&v.length<400;i++){ if(R.ev[i]!==e||R.co[i]!==co||D.G[i]!==g||!R.pt[i]) continue; v.push(R.tm[i]*Math.cbrt(R.pt[i]/1000)); }
  const b=v.length? median(v) : null; D.cache.set(ck,b); return b;
}
function ptsOf(t, e, co, g){ const b=baseTime(e,co,g); return b? Math.round(1000*Math.pow(b/t,3)) : null; }

/* tempos (centésimos) ordenados de uma época × prova × piscina × género — um por nadador */
function groupTimes(y, e, co, g, nat=''){
  const ck=`gt${y}_${e}_${co}_${g}_${nat}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const pm=pairMap(e,co,g,nat), t=[]; for(const a of pm.values()){ const i=a.get(y); if(i!==undefined) t.push(S.R.tm[i]); }
  t.sort((a,b)=>a-b); D.cache.set(ck,t); return t;
}

/* ======================= ANÁLISES: secções 6 ======================= */
const AN6 = {rec:'1', recView:'one', recAge:'', dens:'', gg:'8', tf:'8', effMin:'20'};
function an6(sec, el, out){
  const R=S.R, sy=yearsRange(AN.y0,AN.y1), yl=sy.map(String);
  const co = AN.co===''? 0 : +AN.co;
  /* ---------- 1. melhores marcas de sempre por idade ---------- */
  if(sec==='recordes'){
    const g = AN.g===''? 0 : +AN.g;
    anExtra(segHTML('an6V',[['one','Uma prova · top‑3 por idade'],['all','Todas as provas']],AN6.recView,'Vista')+(AN6.recView==='one'?selHTML('an6E',evOpts(),AN6.rec,'Prova'):selHTML('an6A',[['','Por idade'],...ESC_G.map((e,k)=>['e'+k,'Escalão: '+e.n])],AN6.recAge,'Agrupar')), x=>{ bindSeg(x,'an6V',v=>{AN6.recView=v; anContent();}); const e=$('#an6E',x); if(e) e.onchange=ev=>{AN6.rec=ev.target.value; anContent();}; const a=$('#an6A',x); if(a) a.onchange=ev=>{AN6.recAge=ev.target.value; anContent();}; });
    const note=`${G_L[g]} · ${CO_L[co]} · ${esc(perLabel(AN))}${AN.g===''?' (género “Ambos” mostra masculinos)':''}${AN.co===''?' (piscina “Ambas” mostra PL)':''}. Idade = ano da época − ano de nascimento.`;
    const okRow=i=> R.yr[i]>=AN.y0&&R.yr[i]<=AN.y1 && (AN.nat!=='POR'||D.POR[i]) && (AN.nat!=='EST'||!D.POR[i]);
    if(AN6.recView==='one'){
      const e=+AN6.rec, pm=pairMap(e,co,g,''), byAge=new Map();
      for(const [sw,a] of pm){ const best=new Map(); for(const i of a.values()){ if(!okRow(i)) continue; const ag=D.AGE[i]; if(!best.has(ag)||R.tm[i]<R.tm[best.get(ag)]) best.set(ag,i); } for(const [ag,i] of best){ if(!byAge.has(ag)) byAge.set(ag,[]); byAge.get(ag).push(i); } }
      const ages=[...byAge.keys()].filter(a=>a>=10&&a<=35).sort((a,b)=>a-b);
      const rows=ages.map(a=>{ const l=byAge.get(a).sort((x,y)=>R.tm[x]-R.tm[y]); return {a, n:l.length, t:l.slice(0,3)}; });
      const cellF=i=> i==null?'—':`<b>${fT(R.tm[i])}</b> ${swLink(R.sw[i])} <span class="muted small">${R.yr[i]} · ${esc(S.cl[R.cl[i]].code)}</span>`;
      const cellX=i=> i==null?'':`${fT(R.tm[i])} ${niceName(S.sw[R.sw[i]].name)} (${R.yr[i]}, ${S.cl[R.cl[i]].code})`;
      const spec={labels:ages.map(String), series:[{label:'Melhor marca de sempre', data:rows.map(r=>R.tm[r.t[0]]/100), color:'s1'},{label:'3.ª melhor', data:rows.map(r=>r.t[2]!=null?R.tm[r.t[2]]/100:null), color:'s3', dash:true}], yRev:true, yFmt:fTs, zero:false, xTitle:'Idade'};
      el.innerHTML=`<div class="card"><div class="card-h"><div><h3>Melhores marcas de sempre por idade · ${esc(evLabel(e))}</h3><p class="note">${note}</p></div></div><div class="chart" id="an6Ch"></div></div><div class="card"><h3>Top‑3 de sempre em cada idade</h3><div id="an6T" style="margin-top:8px"></div></div>`;
      draw('an6Ch',spec);
      const t=new DataTable('an6T',[{k:'a',l:'Idade',num:1,dir0:'asc'},{k:'t1',l:'1.º',f:r=>cellF(r.t[0]),x:r=>cellX(r.t[0]),sv:r=>R.tm[r.t[0]]},{k:'t2',l:'2.º',f:r=>cellF(r.t[1]),x:r=>cellX(r.t[1]),nosort:1},{k:'t3',l:'3.º',f:r=>cellF(r.t[2]),x:r=>cellX(r.t[2]),nosort:1},{k:'n',l:'Nadadores',num:1}], rows, {page:40});
      out.blocks=[{t:'chart',title:'Melhores marcas de sempre por idade · '+evLabel(e),spec},Object.assign({t:'table',sheet:'Recordes por idade'},t.exportRows())];
    } else {
      const grp=AN6.recAge; const keyOf = i => grp===''? D.AGE[i] : D.ESC[i];
      const cols = grp===''? Array.from({length:13},(_,k)=>k+11) : ESC_G.map((e,k)=>k);
      const best=new Map(); for(let i=0;i<R.n;i++){ if(R.co[i]!==co||D.G[i]!==g||!okRow(i)) continue; const k=R.ev[i]*100+keyOf(i); const c=best.get(k); if(c===undefined||R.tm[i]<R.tm[c]) best.set(k,i); }
      const evs=S.ev.map((c,e)=>e).filter(e=>cols.some(a=>best.has(e*100+a)));
      const colL=grp===''? cols.map(a=>a+' anos') : cols.map(k=>ESC_G[k].n);
      el.innerHTML=`<div class="card"><div class="card-h"><div><h3>Melhores marcas de sempre por ${grp===''?'idade':'escalão'} · todas as provas</h3><p class="note">${note} Passe o cursor sobre o tempo para ver o nadador e a época.</p></div></div><div class="tbl-wrap"><table class="t"><thead><tr><th>Prova</th>${colL.map(c=>`<th class="num">${esc(c)}</th>`).join('')}</tr></thead><tbody>${evs.map(e=>`<tr><td><b>${esc(evLabel(e))}</b></td>${cols.map(a=>{ const i=best.get(e*100+a); return i==null?'<td class="num muted">·</td>':`<td class="num" title="${esc(niceName(S.sw[R.sw[i]].name))} · ${R.yr[i]} · ${esc(S.cl[R.cl[i]].code)}"><button class="lnk" data-sw="${R.sw[i]}">${fT(R.tm[i])}</button><br><span class="small muted">${R.yr[i]}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div></div>`;
      el.querySelector('table').addEventListener('click',ev=>{ const b=ev.target.closest('[data-sw]'); if(b) go('n'+b.dataset.sw); });
      out.blocks=[{t:'table',sheet:'Recordes por '+(grp===''?'idade':'escalão'),small:true,head:['Prova',...colL],rows:evs.map(e=>[evLabel(e),...cols.map(a=>{ const i=best.get(e*100+a); return i==null?'':fT(R.tm[i])+' '+niceName(S.sw[R.sw[i]].name)+' ('+R.yr[i]+')'; })]),align:['l',...cols.map(()=>'l')]}];
    }
    return;
  }
  /* ---------- 2. densidade competitiva ---------- */
  if(sec==='densidade'){
    anExtra(selHTML('an6D',[['','Todas as provas'],...S.ev.map((c,e)=>[String(e),evLabel(e)])],AN6.dens,'Evolução da prova'), x=>{ $('#an6D',x).onchange=ev=>{AN6.dens=ev.target.value; anContent();}; });
    const gs=AN.g===''?[0,1]:[+AN.g];
    const gap=(t,a,b)=> t.length>=b? (t[b-1]-t[a-1])/t[a-1]*100 : null;
    const calc=(e,g,y)=>{ const t=groupTimes(y,e,co,g,AN.nat); return {g18:gap(t,1,8), g824:gap(t,8,24), g124:gap(t,1,24)}; };
    const rows=[]; S.ev.forEach((c,e)=>gs.forEach(g=>{ const v=sy.map(y=>calc(e,g,y)).filter(x=>x.g18!=null); if(v.length) rows.push({e,g,n:v.length, g18:mean(v.map(x=>x.g18)), g824:mean(v.filter(x=>x.g824!=null).map(x=>x.g824)), g124:mean(v.filter(x=>x.g124!=null).map(x=>x.g124))}); }));
    const ev=AN6.dens===''? null : +AN6.dens;
    const specB={type:'bar', horizontal:true, labels:[...new Set(rows.map(r=>r.e))].map(e=>evLabel(e)), series:gs.map(g=>({label:G_L[g], data:[...new Set(rows.map(r=>r.e))].map(e=>{ const r=rows.find(x=>x.e===e&&x.g===g); return r? +r.g18.toFixed(2):null; }), color:g?'s2':'s1'})), yFmt:v=>f1(v)+'%', tipFmt:v=>f2(v)+'% entre o 1.º e o 8.º', zero:true, barMax:12};
    const specE= ev!=null ? {labels:yl, series:gs.flatMap(g=>[{label:G_L[g]+' · 1.º→8.º', data:sy.map(y=>{ const x=calc(ev,g,y).g18; return x==null?null:+x.toFixed(2); }), color:g?'s2':'s1'},{label:G_L[g]+' · 8.º→24.º', data:sy.map(y=>{ const x=calc(ev,g,y).g824; return x==null?null:+x.toFixed(2); }), color:g?'s2':'s1', dash:true}]), yFmt:v=>f1(v)+'%', zero:true} : null;
    el.innerHTML=`<div class="grid g2"><div class="card"><h3>Diferença entre o 1.º e o 8.º por prova</h3><p class="note">Média das épocas (${esc(perLabel(AN))}), ${CO_L[co].toLowerCase()}. Diferença pequena = mais concorrência interna; grande = nível dependente de poucos nadadores.</p><div class="chart tall" id="an6D1"></div></div>
      <div class="card">${specE?`<h3>Evolução da densidade · ${esc(evLabel(ev))}</h3><p class="note">Diferença percentual entre posições do ranking, por época.</p><div class="chart tall" id="an6D2"></div>`:`<h3>Evolução da densidade</h3><p class="note">Escolha uma prova em “Evolução da prova” para ver a série por época.</p>`}</div></div>
      <div class="card"><h3>Densidade por prova</h3><div id="an6DT" style="margin-top:8px"></div></div>`;
    draw('an6D1',specB); if(specE) draw('an6D2',specE);
    const t=new DataTable('an6DT',[{k:'e',l:'Prova',f:r=>evLabel(r.e),sv:r=>r.e,dir0:'asc'},{k:'g',l:'Género',f:r=>G_L[r.g],sv:r=>r.g},{k:'g18',l:'1.º → 8.º',num:1,f:r=>f2(r.g18)+'%',x:r=>+r.g18.toFixed(2)},{k:'g824',l:'8.º → 24.º',num:1,f:r=>isFinite(r.g824)?f2(r.g824)+'%':'—',x:r=>isFinite(r.g824)?+r.g824.toFixed(2):''},{k:'g124',l:'1.º → 24.º',num:1,f:r=>isFinite(r.g124)?f2(r.g124)+'%':'—',x:r=>isFinite(r.g124)?+r.g124.toFixed(2):''},{k:'n',l:'Épocas',num:1}], rows, {sorts:[{k:'g18',dir:'asc'}], page:40});
    out.blocks=[{t:'chart',title:'Diferença entre o 1.º e o 8.º por prova',spec:specB},...(specE?[{t:'chart',title:'Evolução da densidade · '+evLabel(ev),spec:specE}]:[]),Object.assign({t:'table',sheet:'Densidade'},t.exportRows())];
    return;
  }
  /* ---------- 3. diferença entre géneros ---------- */
  if(sec==='generos'){
    anExtra(selHTML('an6G',[['1','1.º classificado'],['8','Média top‑8'],['24','Média top‑24']],AN6.gg,'Referência'), x=>{ $('#an6G',x).onchange=ev=>{AN6.gg=ev.target.value; anContent();}; });
    const N=+AN6.gg, ref=(e,g,y)=>{ const t=groupTimes(y,e,co,g,AN.nat); return t.length>=N? mean(t.slice(0,N)) : null; };
    const rows=[]; S.ev.forEach((c,e)=>{ const v=sy.map(y=>{ const m=ref(e,0,y), f=ref(e,1,y); return m&&f? (f-m)/m*100 : null; }).filter(x=>x!=null); if(v.length) rows.push({e, gap:mean(v), n:v.length, stroke:STK5_L[evStroke(e)]}); });
    const avg=mean(rows.map(r=>r.gap)); rows.forEach(r=>r.rel=r.gap-avg);
    const spec={type:'bar', horizontal:true, labels:rows.map(r=>evLabel(r.e)), series:[{label:'Diferença F vs M', data:rows.map(r=>+r.gap.toFixed(2)), color:'s2', colors:rows.map(r=>r.rel<0?'s3':'s2')}], legend:false, yFmt:v=>f1(v)+'%', tipFmt:v=>'femininos '+f2(v)+'% mais lentos', zero:true, barMax:12};
    const byStroke=STK5.map(k=>{ const v=rows.filter(r=>evStroke(r.e)===k); return {s:STK5_L[k], gap:v.length?mean(v.map(r=>r.gap)):null, rel:v.length?mean(v.map(r=>r.rel)):null}; }).filter(x=>x.gap!=null);
    el.innerHTML=`<div class="grid g2"><div class="card"><h3>Diferença entre femininos e masculinos por prova</h3><p class="note">Quanto mais lentos são os femininos, em % (${N===1?'1.º classificado':'média do top‑'+N}), ${CO_L[co].toLowerCase()}, ${esc(perLabel(AN))}. Verde = diferença abaixo da média de todas as provas (${f2(avg)}%), ou seja, setor feminino relativamente mais forte.</p><div class="chart tall" id="an6G1"></div></div>
      <div class="card"><h3>Por estilo</h3><p class="note">Média das provas de cada estilo e desvio face à média geral. Negativo = setor feminino relativamente mais forte nesse estilo; positivo = setor masculino relativamente mais forte.</p><div id="an6GS" style="margin-top:8px"></div></div></div>
      <div class="card"><h3>Diferença por prova</h3><div id="an6GT" style="margin-top:8px"></div></div>`;
    draw('an6G1',spec);
    const ts=new DataTable('an6GS',[{k:'s',l:'Estilo'},{k:'gap',l:'Diferença F vs M',num:1,f:r=>f2(r.gap)+'%',x:r=>+r.gap.toFixed(2)},{k:'rel',l:'Face à média',num:1,f:r=>`<span class="pill ${r.rel<-0.2?'good':r.rel>0.2?'bad':''}">${fPct(r.rel)}</span>`,x:r=>+r.rel.toFixed(2)}], byStroke, {page:10, nosortbar:true});
    const t=new DataTable('an6GT',[{k:'e',l:'Prova',f:r=>evLabel(r.e),sv:r=>r.e,dir0:'asc'},{k:'stroke',l:'Estilo'},{k:'gap',l:'Diferença F vs M',num:1,f:r=>f2(r.gap)+'%',x:r=>+r.gap.toFixed(2)},{k:'rel',l:'Face à média',num:1,f:r=>fPct(r.rel),x:r=>+r.rel.toFixed(2)},{k:'n',l:'Épocas',num:1}], rows, {page:40});
    out.blocks=[{t:'chart',title:'Diferença entre femininos e masculinos por prova',spec},Object.assign({t:'table',sheet:'Géneros por estilo'},ts.exportRows()),Object.assign({t:'table',sheet:'Géneros por prova'},t.exportRows())];
    return;
  }
  /* ---------- 4. idade de melhor rendimento ---------- */
  if(sec==='idadepico'){
    anExtra('');
    const gs=AN.g===''?[0,1]:[+AN.g], rows=[];
    S.ev.forEach((c,e)=>{ const r={e}; let any=false; gs.forEach(g=>{ const pm=pairMap(e,co,g,''), ages=[]; for(const [sw,a] of pm){ const s=S.sw[sw]; if(dropInfo(s,1).active) continue; if(a.size<3) continue; if(AN.nat==='POR'&&s.nat!=='POR') continue; let b=null; for(const i of a.values()) if(b==null||R.tm[i]<R.tm[b]) b=i; if(R.yr[b]<AN.y0||R.yr[b]>AN.y1) continue; ages.push(D.AGE[b]); } ages.sort((x,y)=>x-y); r['n'+g]=ages.length; r['m'+g]=ages.length>=10?quantile(ages,.5):null; r['a'+g]=ages.length>=10?mean(ages):null; r['q'+g]=ages.length>=10?[quantile(ages,.25),quantile(ages,.75)]:null; if(ages.length>=10) any=true; }); if(any) rows.push(r); });
    const spec={type:'bar', horizontal:true, labels:rows.map(r=>evLabel(r.e)), series:gs.map(g=>({label:G_L[g], data:rows.map(r=>r['a'+g]==null?null:+r['a'+g].toFixed(1)), color:g?'s2':'s1'})), yFmt:v=>f1(v)+' anos', tipFmt:v=>f1(v)+' anos (média)', zero:false, yMin:14, barMax:12};
    el.innerHTML=`<div class="grid g2"><div class="card"><h3>Idade da melhor marca da carreira</h3><p class="note">Nadadores que já saíram do ranking, com pelo menos 3 épocas na prova (${CO_L[co].toLowerCase()}), cuja melhor marca foi feita em ${esc(perLabel(AN))}. Mostra quando, em média, se atinge o melhor rendimento em cada prova.</p><div class="chart tall" id="an6P1"></div></div>
      <div class="card"><h3>Idade de melhor rendimento por prova</h3><p class="note">Média, mediana e intervalo interquartil (P25–P75).</p><div id="an6PT" style="margin-top:8px"></div></div></div>`;
    draw('an6P1',spec);
    const t=new DataTable('an6PT',[{k:'e',l:'Prova',f:r=>evLabel(r.e),sv:r=>r.e,dir0:'asc'},...gs.flatMap(g=>{ const s=g?'F':'M'; return [{k:'n'+g,l:'Nadadores '+s,num:1},{k:'a'+g,l:'Média '+s,num:1,f:r=>f1(r['a'+g]),x:r=>r['a'+g]==null?'':+r['a'+g].toFixed(1)},{k:'m'+g,l:'Mediana '+s,num:1,f:r=>fN(r['m'+g])},{k:'q'+g,l:'P25–P75 '+s,num:1,f:r=>r['q'+g]?fN(r['q'+g][0])+'–'+fN(r['q'+g][1]):'—',sv:r=>r['m'+g]}]; })], rows, {page:40});
    out.blocks=[{t:'chart',title:'Idade da melhor marca da carreira',spec},Object.assign({t:'table',sheet:'Idade de melhor rendimento'},t.exportRows())];
    return;
  }
  /* ---------- 5. clubes formadores e de chegada ---------- */
  if(sec==='formadores'){
    anExtra(selHTML('an6F',[['3','Top‑3 nacional'],['8','Top‑8 nacional'],['16','Top‑16 nacional'],['24','Top‑24 nacional']],AN6.tf,'Alto nível'), x=>{ $('#an6F',x).onchange=ev=>{AN6.tf=ev.target.value; anContent();}; });
    const N=+AN6.tf, first=new Map(), arrive=new Map();
    for(let i=0;i<R.n;i++){ const sw=R.sw[i]; const f=first.get(sw); if(f===undefined||R.dt[i]<R.dt[f]) first.set(sw,i); }
    for(let i=0;i<R.n;i++){ if(D.RK[i]>N) continue; if(AN.g!==''&&D.G[i]!==+AN.g) continue; if(AN.co!==''&&R.co[i]!==+AN.co) continue; if(AN.nat==='POR'&&!D.POR[i]) continue; const sw=R.sw[i], a=arrive.get(sw); if(a===undefined||R.dt[i]<R.dt[a]) arrive.set(sw,i); }
    const list=[]; for(const [sw,a] of arrive){ if(R.yr[a]<AN.y0||R.yr[a]>AN.y1) continue; const f=first.get(sw); list.push({sw, f, a, cf:R.cl[f], ca:R.cl[a], same:R.cl[f]===R.cl[a], firstY:R.yr[f], age:D.AGE[a]}); }

async function loadGroups(){ try{ let d=null; if(CAP.db){ const s=await CAP.db.doc('config/groups').get(); if(s.exists) d=s.data(); } else { const j=localStorage.getItem('obsnp_groups'); if(j) d=JSON.parse(j); } if(d&&Array.isArray(d.groups)){ S.groups=d.groups; S.grMeta={src:'saved',at:d.updatedAt}; } }catch(e){ console.warn('grupos',e); } }
async function saveGroups(){ const d={groups:S.groups, updatedAt:new Date().toISOString()}; if(CAP.db){ await CAP.db.doc('config/groups').set(d); } else localStorage.setItem('obsnp_groups', JSON.stringify(d)); S.grMeta={src:'saved',at:d.updatedAt}; return CAP.db?'shared':'local'; }
function resolveMember(m){ const t=norm(m.name).split(/[\s,]+/).filter(Boolean); let best=null; for(const s of S.sw){ if(!s.n) continue; if(m.by&&s.by!==m.by) continue; if(t.every(w=>s.nn.includes(w))){ if(!best||s.last>best.last||(s.last===best.last&&s.bestPt>best.bestPt)) best=s; } } return best; }
function groupMembers(gid){ const g=S.groups.find(x=>x.id===gid); return g? g.members.map(m=>({m, s:resolveMember(m)})) : []; }
function groupSet(gids){ const set=new Set(); (gids||[]).forEach(gid=>groupMembers(gid).forEach(x=>{ if(x.s) set.add(x.s.id); })); return set; }

function cvRun(cfg){
  const R=S.R, d0=isoToDay(cfg.from), d1=isoToDay(cfg.to), res=new Map(); // sw -> {events:Map(key->{i,st,rule,refPts,margin})}
  const excl=(cfg.excl||[]).map(stdById).filter(Boolean);
  const gsets=cfg.rules.map(r=>r.groups&&r.groups.length? groupSet(r.groups) : null);
  // melhor marca por nadador × prova × piscina na janela
  const best=new Map();
  for(let i=0;i<R.n;i++){ if(R.dt[i]<d0||R.dt[i]>d1) continue; if(cfg.por&&!D.POR[i]) continue; if(CV.g!==''&&D.G[i]!==+CV.g) continue; const k=R.sw[i]*64+R.ev[i]*2+R.co[i]; const c=best.get(k); if(c===undefined||R.tm[i]<R.tm[c]) best.set(k,i); }
  const excluded=new Set();
  const cand=[];
  for(const i of best.values()){ const s=S.sw[R.sw[i]], age=cfg.refYear-s.by, gk=s.g==='F'?'F':'M';
    if(excl.some(tb=>tb.co===R.co[i]&&stdAgeOK(tb,age)&&stdTime(tb,gk,R.ev[i])&&R.tm[i]<=stdTime(tb,gk,R.ev[i]))) { excluded.add(R.sw[i]); continue; }
    cfg.rules.forEach((ru,ri)=>{ if(ru.ages[0]!=null&&age<ru.ages[0]) return; if(ru.ages[1]!=null&&age>ru.ages[1]) return; if(gsets[ri]&&!gsets[ri].has(R.sw[i])) return;
      for(const tid of ru.tables){ const tb=stdById(tid); if(!tb||tb.co!==R.co[i]) continue; const st=stdTime(tb,gk,R.ev[i]); if(!st) continue; const lim=st*(1+(ru.tol||0)/100); if(R.tm[i]<=lim){ const rp=ptsOf(st,R.ev[i],R.co[i],D.G[i]); cand.push({i, sw:R.sw[i], ev:R.ev[i], co:R.co[i], g:D.G[i], age, st, tab:tb, rule:ri, fb:!!ru.fallback, ref:rp, margin: rp!=null? R.pt[i]-rp : null}); } } }); }
  // regra "fallback": só nas provas sem ninguém pelas regras principais
  const mainEv=new Set(cand.filter(c=>!c.fb).map(c=>c.ev*4+c.co*2+c.g));
  let list=cand.filter(c=>!c.fb||!mainEv.has(c.ev*4+c.co*2+c.g));
  list=list.filter(c=>!excluded.has(c.sw));
  // uma entrada por nadador × prova (a mais favorável)
  const byKey=new Map(); list.forEach(c=>{ const k=c.sw*64+c.ev*2+c.co; const o=byKey.get(k); if(!o||(c.margin??-1e9)>(o.margin??-1e9)) byKey.set(k,c); });
  list=[...byKey.values()];
  // máximo por prova (ordem: pontos acima da referência, depois pontos)
  const perEv=new Map(); list.forEach(c=>{ const k=c.ev*4+c.co*2+c.g; if(!perEv.has(k)) perEv.set(k,[]); perEv.get(k).push(c); });
  for(const arr of perEv.values()){ arr.sort((a,b)=>(b.margin??-1e9)-(a.margin??-1e9)||S.R.pt[b.i]-S.R.pt[a.i]); arr.forEach((c,k)=>{ c.pos=k+1; c.within = !cfg.max || k<cfg.max; }); }
  // por nadador
  const sws=new Map(); list.forEach(c=>{ let o=sws.get(c.sw); if(!o){ o={sw:c.sw, evs:[]}; sws.set(c.sw,o);} o.evs.push(c); });
  const people=[...sws.values()].map(o=>{ const ok=o.evs.filter(c=>c.within); const bestM=Math.max(...o.evs.map(c=>c.margin??-1e9)); const bestP=Math.max(...o.evs.map(c=>S.R.pt[c.i])); return {sw:o.sw, evs:o.evs.sort((a,b)=>(b.margin??0)-(a.margin??0)), nOk:ok.length, sel: ok.length>0, bestM, bestP, sumM: ok.reduce((s,c)=>s+Math.max(0,c.margin||0),0)}; }).sort((a,b)=> (b.sel-a.sel) || b.bestM-a.bestM || b.bestP-a.bestP);
  let rank=0; people.forEach(p=>{ if(p.sel){ rank++; p.rank=rank; p.inQuota = !cfg.quota || rank<=cfg.quota; } else { p.rank=null; p.inQuota=false; } });
  return {people, perEv, excluded: excluded.size, list};
}

<script>

const swKeyOf = s => s.name+'|'+s.bd;

/* ======================= 1. UNIFICAÇÃO DE NADADORES ======================= */
S.merges=[]; S.mergeIgnore=[]; S.mergeMap=new Map();
function buildMergeMap(){
  const m=new Map(); for(const x of S.merges) if(x.a!==x.b) m.set(x.a, x.b);
  const res=new Map(); for(const k of m.keys()){ let t=m.get(k), g=0; while(m.has(t)&&g++<30) t=m.get(t); if(t!==k) res.set(k,t); }

}
async function loadMerges(){ const d=await cfgLoad('merges'); if(d){ S.merges=Array.isArray(d.merges)?d.merges:[]; S.mergeIgnore=Array.isArray(d.ignore)?d.ignore:[]; } buildMergeMap(); }
async function saveMerges(){ return cfgSave('merges',{merges:S.merges, ignore:S.mergeIgnore}); }
function rebuildSwimmers(){ buildMergeMap(); S.sw=[]; S.swKey=new Map(); assemble(); _clubOpts=null; }
/* remove marcas repetidas (mesmo nadador, prova, piscina e época) que resultem de uma fusão */
function dedupeRows(R){
  const seen=new Map(), keep=new Uint8Array(R.n).fill(1); let drop=0;
  for(let i=0;i<R.n;i++){ const k=((R.sw[i]*32+R.ev[i])*2+R.co[i])*4096+(R.yr[i]-1900); const p=seen.get(k); if(p===undefined){ seen.set(k,i); continue; } drop++; if(R.tm[i]<R.tm[p]){ keep[p]=0; seen.set(k,i); } else keep[i]=0; }
  if(!drop) return R;
  const n=R.n-drop, o={n}; for(const k of Object.keys(R)){ if(k==='n') continue; const a=new R[k].constructor(n); let j=0; for(let i=0;i<R.n;i++) if(keep[i]) a[j++]=R[k][i]; o[k]=a; }
  return o;
}
function mergeCandidates(){
  const R=S.R, act=S.sw.filter(s=>s.n>0), ign=new Set(S.mergeIgnore), out=[], seenPk=new Set();
  const tok=s=>{ const p=s.name.split(','); const sur=norm(p[0]).split(/[^a-z]+/).filter(w=>w.length>1), giv=norm(p.slice(1).join(' ')).split(/[^a-z]+/).filter(w=>w.length>1); return {sur,giv,all:new Set([...sur,...giv])}; };
  const lists=id=>{ const set=new Set(); for(const i of swRows(id)) set.add(R.yr[i]*64+R.ev[i]*2+R.co[i]); return set; };
  const clubs=id=>new Set(swRows(id).map(i=>R.cl[i]));
  const overlap=(a,b)=>{ const A=lists(a.id); for(const x of lists(b.id)) if(A.has(x)) return true; return false; };
  const push=(a,b,level,why)=>{ const pk=[swKeyOf(a),swKeyOf(b)].sort().join('||'); if(ign.has(pk)||seenPk.has(pk)) return; if(overlap(a,b)) return; seenPk.add(pk);
    const [keep,alias]=(b.last>a.last||(b.last===a.last&&b.n>a.n))? [b,a] : [a,b]; out.push({keep, alias, level, why, pk}); };
  const byBd=new Map(); act.forEach(s=>{ const k=s.bd+'|'+s.g; if(!byBd.has(k)) byBd.set(k,[]); byBd.get(k).push(s); });
  for(const l of byBd.values()){ if(l.length<2) continue;
    for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){ const a=tok(l[i]), b=tok(l[j]); if(!a.giv.length||!b.giv.length||a.giv[0]!==b.giv[0]) continue;
      const sh=[...a.all].filter(w=>b.all.has(w)).length, sub=[...a.all].every(w=>b.all.has(w))||[...b.all].every(w=>a.all.has(w));
      if(sub||sh>=2) push(l[i],l[j],'forte', sub? 'Mesma data de nascimento; um nome contém o outro' : `Mesma data de nascimento, mesmo primeiro nome e ${sh} nomes em comum`); } }
  const byN=new Map(); act.forEach(s=>{ const k=norm(s.name).replace(/[^a-z]+/g,' ').trim()+'|'+s.g; if(!byN.has(k)) byN.set(k,[]); byN.get(k).push(s); });
  for(const l of byN.values()){ if(l.length<2) continue;
    for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){ const a=l[i], b=l[j]; if(a.bd===b.bd) continue; const [ya,ma,da]=String(a.bd).split('-'), [yb,mb,db]=String(b.bd).split('-');
      const swap = ya===yb && ma===db && da===mb; if(!swap && Math.abs(a.by-b.by)>1) continue;
      const ca=clubs(a.id); if(!swap && ![...clubs(b.id)].some(c=>ca.has(c))) continue;
      push(a,b, swap?'forte':'possível', swap? 'Mesmo nome; dia e mês de nascimento trocados' : `Mesmo nome e clube em comum; datas de nascimento diferentes (${fBD(a.bd)} e ${fBD(b.bd)})`); } }
  const lv={forte:0,'possível':1}; out.sort((x,y)=>lv[x.level]-lv[y.level] || y.keep.bestPt-x.keep.bestPt);

}
function swBrief(s){ const R=S.R, cl=[...new Set(swRows(s.id).sort((a,b)=>R.dt[a]-R.dt[b]).map(i=>S.cl[R.cl[i]].code))]; return `<b>${esc(niceName(s.name))}</b> <span class="muted small">${fBD(s.bd)} · ${s.g}</span><br><span class="small">${s.first}–${s.last} · ${fN(s.n)} marcas · ${esc(cl.slice(-4).join(', '))}</span><br><span class="small muted">${esc(s.name)}</span>`; }
let MGX=null;

    {k:'alias',l:'Fundir',f:r=>swBrief(r.alias),x:r=>r.alias.name+' ('+r.alias.bd+')',sv:r=>r.alias.nn},
    {k:'why',l:'Motivo',cls:'wrap'},
    ...(canW?[{k:'act',l:'',nosort:1,noexp:1,f:(r,ix)=>`<div class="row" style="gap:4px;flex-wrap:wrap"><button class="btn small" data-mg="${esc(r.pk)}">Fundir</button><button class="btn ghost small" data-mgs="${esc(r.pk)}" title="Trocar o nadador mantido">⇄</button><button class="btn ghost small" data-mgi="${esc(r.pk)}">Não é o mesmo</button></div>`}]:[]),

    if(b.dataset.mg){ const c=byPk(b.dataset.mg); S.merges.push({a:swKeyOf(c.alias), b:swKeyOf(c.keep)}); await done('Nadadores fundidos.'); }

    else if(b.dataset.mgi){ const c=byPk(b.dataset.mgi); S.mergeIgnore.push(c.pk); await done('Par marcado como pessoas diferentes.'); } });

  if(canW){ let A=null,B=null; swPicker('mgA',{placeholder:'Nadador a manter…',onPick:id=>A=id}); swPicker('mgB',{placeholder:'Nadador a fundir…',onPick:id=>B=id});
    $('#mgDo').onclick=async()=>{ if(A==null||B==null||A===B){ toast('Escolha dois nadadores diferentes.'); return; } const a=S.sw[A], b=S.sw[B]; if(a.g!==b.g){ toast('Os nadadores têm géneros diferentes.'); return; } S.merges.push({a:swKeyOf(b), b:swKeyOf(a)}); await done('Nadadores fundidos.'); }; }

/* ======================= 7. NOVIDADES AO CARREGAR ======================= */
function newsSnapshot(y){
  if(!hasData()) return null; y=y||lastYear(); const R=S.R, key=id=>swKeyOf(S.sw[id]);
  const al=computeAlerts(Object.assign({},AL,{y:String(y)}));
  const alerts=new Map(al.list.map(a=>[key(a.sw), a]));
  const mins=new Map(); S.std.forEach(tb=>{ (mnAll(tb).get(y)||[]).forEach(x=>{ if(!D.POR[x.i]) return; mins.set(key(R.sw[x.i])+'#'+tb.id+'#'+R.ev[x.i], {sw:key(R.sw[x.i]), tb:tb.id, i:x.i, st:x.st}); }); });
  const gp=new Map(); S.groups.forEach(g=>groupMembers(g.id).forEach(({s})=>{ if(!s) return; const pb=swPBs(s.id); const b=swByYearBestPts(s.id).get(y); gp.set(swKeyOf(s), {pts:b!=null?R.pt[b]:null, pb:new Map([...pb].map(([k,i])=>[k,R.tm[i]]))}); }));
  return {y, years:[...S.years], n:S.n, alerts, mins, gp};
}
function newsModel(prev){
  const now=newsSnapshot(); if(!now) return null;
  const y=now.y, R=S.R, diff = prev && prev.y===y, base = diff? prev : newsSnapshot(y-1)||{alerts:new Map(), mins:new Map(), gp:new Map(), years:[]};
  const byKey=k=>{ const id=S.swKey.get(k); return id==null? null : S.sw[id]; };

  const alNew=[...now.alerts.entries()].filter(([k])=>!diff||!base.alerts.has(k)).map(([k,a])=>a).sort((a,b)=>b.n-a.n||b.ex-a.ex);
  const minKey=m=>diff? m.sw+'#'+m.tb+'#'+R.ev[m.i] : m.sw+'#'+m.tb;
  const baseMin=new Set(diff? [...base.mins.keys()] : [...base.mins.values()].map(m=>m.sw+'#'+m.tb));

    const pbs=[...a.pb].filter(([ek,t])=>{ const o=b&&b.pb.get(ek); return diff? (o==null||t<o) : false; }).map(([ek])=>evShort(ek>>1)+' '+CO_S[ek&1]);

  const alRows=alNew.map(a=>({id:a.sw, name:niceName(S.sw[a.sw].name), g:a.g, age:a.age, club:a.club, n:a.n, evs:a.evs.map(e=>evShort(e.ev)+' '+CO_S[e.co]+' '+fPct(e.d,1)).join('; ')}));

  return {title, sub, y, diff, alRows, mnRows, gRows, kpis:[['Novos alertas',fN(alRows.length)],['Novos mínimos / índices',fN(mnRows.length)],['Nadadores dos grupos com MP',fN(gRows.filter(r=>r.pbs).length)+' de '+gRows.length],['Grupos: 2+ épocas sem MP',fN(gRows.filter(r=>r.since>=2).length)]]};
}

    for(const a of C[0]) for(const b of C[1]){ if(b.sw===a.sw) continue; const ab=a.t+b.t; if(ab>=bt) continue; for(const c of C[2]){ if(c.sw===a.sw||c.sw===b.sw) continue; const abc=ab+c.t; if(abc>=bt) continue; for(const d of C[3]){ if(d.sw===a.sw||d.sw===b.sw||d.sw===c.sw) continue; const tt=abc+d.t; if(tt>=bt) continue; if(gsel==='X'){ const nf=a.g+b.g+c.g+d.g; if(nf!==2) continue; } bt=tt; best=[a,b,c,d]; } } }

/* ======================= 5. ÍNDICE DE TALENTO ======================= */
const TBIN = v => Math.max(0, Math.min(9, Math.floor((v-600)/50)));
const TBIN_L = ['< 650','650–700','700–750','750–800','800–850','850–900','900–950','950–1000','1000–1050','≥ 1050'];
function talentBase(){
  const ck='talent'; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, grp=new Map(), key=i=>(((R.ev[i]*2+R.co[i])*2+D.G[i])*32+D.AGE[i]);
  for(let i=0;i<R.n;i++){ const a=D.AGE[i]; if(a<9||a>24) continue; const k=key(i); let arr=grp.get(k); if(!arr){ arr=[]; grp.set(k,arr); } arr.push(R.tm[i]); }
  for(const a of grp.values()) a.sort((x,y)=>x-y);
  const ref=new Map(); for(const [k,a] of grp) if(a.length>=40) ref.set(k, mean(a.slice(0,10)));
  const ub=(arr,t)=>{ let lo=0,hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<=t) lo=m+1; else hi=m; } return lo; };
  const ss=new Map();
  for(let i=0;i<R.n;i++){ const a=D.AGE[i]; if(a<10||a>21) continue; const arr=grp.get(key(i)); if(!arr||arr.length<40) continue; const t=R.tm[i], lo=lowerBound(arr,t), hi=ub(arr,t); const p=100*(arr.length-hi+0.5*(hi-lo))/arr.length, v=1000*Math.pow(ref.get(key(i))/t,3);
    const k=R.sw[i]*4096+R.yr[i]; let o=ss.get(k); if(!o){ o={sw:R.sw[i], y:R.yr[i], a, g:D.G[i], ev:new Map()}; ss.set(k,o); } const c=o.ev.get(R.ev[i]); if(!c||v>c.v) o.ev.set(R.ev[i],{p,v,i}); }
  const list=[...ss.values()]; list.forEach(o=>{ const v=[...o.ev.values()].sort((x,y)=>y.v-x.v); o.best=v[0]; o.second=v[1]||null; o.nev=v.length; o.score = v.length>1? (v[0].v+v[1].v)/2 : v[0].v; o.q=qOf(S.sw[o.sw]); delete o.ev; });
  // correção da idade relativa: desvio médio de cada trimestre, por género e idade
  const acc=new Map(); list.forEach(o=>{ for(const q of [o.q,4]){ const k=(o.g*32+o.a)*5+q; const x=acc.get(k)||[0,0]; x[0]+=o.score; x[1]++; acc.set(k,x); } });
  const mean_=(g,a,q)=>{ const x=acc.get((g*32+a)*5+q); return x&&x[1]? x[0]/x[1] : null; };
  list.forEach(o=>{ const mq=mean_(o.g,o.a,o.q), m=mean_(o.g,o.a,4); o.rae = mq!=null&&m!=null? mq-m : 0; o.adj=o.score-o.rae; });
  // desfecho: top‑8 / top‑3 absoluto numa época posterior
  const best8=new Map(); for(let i=0;i<R.n;i++){ if(D.RK[i]>8) continue; const sw=R.sw[i]; const x=best8.get(sw)||{y8:[],y3:[]}; x.y8.push(R.yr[i]); if(D.RK[i]<=3) x.y3.push(R.yr[i]); best8.set(sw,x); }
  const last=lastYear(), bins=new Map();
  list.forEach(o=>{ const x=best8.get(o.sw); o.hit8=!!(x&&x.y8.some(v=>v>o.y)); o.hit3=!!(x&&x.y3.some(v=>v>o.y)); o.train = o.y + Math.max(3, 20-o.a) <= last && o.a<=19;
    if(o.train){ const k=(o.g*32+o.a)*10+TBIN(o.adj); const b=bins.get(k)||{n:0,h8:0,h3:0}; b.n++; if(o.hit8) b.h8++; if(o.hit3) b.h3++; bins.set(k,b); } });
  const prob=(g,a,adj)=>{ const aa=Math.min(19,a), b=TBIN(adj); let n=0,h8=0,h3=0; [[b,1],[b-1,.5],[b+1,.5]].forEach(([bb,w])=>{ if(bb<0||bb>9) return; const x=bins.get((g*32+aa)*10+bb); if(x){ n+=w*x.n; h8+=w*x.h8; h3+=w*x.h3; } }); return n>=8? {p8:h8/n*100, p3:h3/n*100, n:Math.round(n)} : {p8:null,p3:null,n:Math.round(n)}; };
  list.forEach(o=>{ const p=prob(o.g,o.a,o.adj); o.p8=p.p8; o.p3=p.p3; o.pn=p.n; });
  const byKey=new Map(list.map(o=>[o.sw*4096+o.y,o]));
  const out={list, byKey, prob, bins}; D.cache.set(ck,out); return out;
}
