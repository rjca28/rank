const CE={type:'club', club:null, reg:null, y0:null, y1:null};
let CEX=null;
function ceDefault(){ const R=S.R, y=lastYear(), m=new Map(); for(let i=0;i<R.n;i++) if(R.yr[i]===y) m.set(R.cl[i],(m.get(R.cl[i])||0)+1); let b=null,bn=-1; for(const [c,n] of m) if(n>bn&&S.cl[c].code!=='?'){ bn=n; b=c; } return b; }
function vEntidades(root){
  perNorm(CE,'all'); if(CE.club==null) CE.club=ceDefault(); if(CE.reg==null) CE.reg=S.cl[CE.club]?S.cl[CE.club].reg:S.regions[0];
  const clubs=clubOptsC().filter(o=>o[0]!=='');
  root.innerHTML=`<div class="view-head"><div><h2>Clubes e associações</h2><div class="sub">Ficha de cada clube ou associação territorial: evolução do número de nadadores e do nível, nadadores formados e retidos, entradas e saídas, mínimos e índices, alertas e membros dos grupos de alto rendimento. Pronta a exportar e enviar.</div></div>${expHTML('ce')}</div>
  <div class="fbar sticky">${segHTML('ceT',[['club','Clube'],['reg','Associação']],CE.type,'Ficha de')}
    <span id="ceSelW">${CE.type==='club'? selHTML('ceSel',clubs,CE.club,'Clube','style="max-width:320px"') : selHTML('ceSel',[...S.regions].sort().map(r=>[r,regLabel(r)]),CE.reg,'Associação')}</span>
    ${perHTML('ce',CE,'Período','all')}</div>
  <div id="ceC" class="view"></div>`;
  bindSeg(root,'ceT',v=>{ CE.type=v; vEntidades(root); });
  $('#ceSel').onchange=e=>{ if(CE.type==='club') CE.club=+e.target.value; else CE.reg=e.target.value; ceContent(); };
  bindPer(root,'ce',CE,ceContent); bindExp(root,'ce',ceModel); ceContent();
}
function ceContent(){
  const el=$('#ceC'), R=S.R, isC=CE.type==='club', key=isC?+CE.club:CE.reg, y1=CE.y1, sy=yearsRange(CE.y0,y1);
  const inE = isC? (i=>R.cl[i]===key) : (i=>S.cl[R.cl[i]].reg===key);
  const name = isC? S.cl[key].name+' ('+S.cl[key].code+')' : regLabel(key);
  // por época: nadador → melhor linha (pts)
  const per=new Map(S.years.map(y=>[y,new Map()]));
  for(let i=0;i<R.n;i++){ if(!inE(i)) continue; const m=per.get(R.yr[i]), c=m.get(R.sw[i]); if(c===undefined||R.pt[i]>R.pt[c]) m.set(R.sw[i],i); }
  const t24=new Map(), t8=new Map(); for(let i=0;i<R.n;i++){ if(!inE(i)) continue; if(D.RKE[i]<=24){ const k=R.yr[i]; if(!t24.has(k)) t24.set(k,new Set()); t24.get(k).add(R.sw[i]); if(D.RKE[i]<=8){ if(!t8.has(k)) t8.set(k,new Set()); t8.get(k).add(R.sw[i]); } } }
  const minsY=y=>{ const s=new Set(), wa=new Set(); S.std.forEach(tb=>(mnAll(tb).get(y)||[]).forEach(x=>{ if(inE(x.i)&&D.POR[x.i]){ s.add(R.sw[x.i]); if(/^WA/.test(tb.id)) wa.add(R.sw[x.i]); } })); return {s,wa}; };
  const evo=sy.map(y=>{ const m=per.get(y), p=per.get(y-1), sw=[...m.keys()]; const pts=[...m.values()].map(i=>R.pt[i]).sort((a,b)=>b-a); const mm=minsY(y);
    const ret = p&&p.size? [...p.keys()].filter(s=>m.has(s)).length/p.size*100 : null;
    return {y, n:m.size, nM:sw.filter(s=>S.sw[s].g==='M').length, nF:sw.filter(s=>S.sw[s].g==='F').length, novos:sw.filter(s=>S.sw[s].first===y).length, ret, lvl:pts.length? mean(pts.slice(0,10)) : null, med:pts.length? median(pts) : null, t24:(t24.get(y)||new Set()).size, t8:(t8.get(y)||new Set()).size, mins:mm.s.size, wa:mm.wa.size}; });
  const cur=evo[evo.length-1]||{}, prev=evo[evo.length-2]||null;
  // posição entre entidades do mesmo tipo em y1
  const ents=new Map(); for(let i=0;i<R.n;i++){ if(R.yr[i]!==y1) continue; const k=isC? R.cl[i] : S.cl[R.cl[i]].reg; if(!k&&k!==0) continue; let o=ents.get(k); if(!o){ o={sw:new Set(), t24:new Set()}; ents.set(k,o);} o.sw.add(R.sw[i]); if(D.RKE[i]<=24) o.t24.add(R.sw[i]); }
  const rankBy=f=>{ const arr=[...ents.entries()].map(([k,o])=>[k,f(o)]).sort((a,b)=>b[1]-a[1]); const ix=arr.findIndex(([k])=>k===key); return ix<0? null : {r:ix+1, n:arr.length}; };
  const rkN=rankBy(o=>o.sw.size), rk24=rankBy(o=>o.t24.size);
  const al=alertIndex(); const grpOf=new Map(); S.groups.forEach(gr=>groupMembers(gr.id).forEach(({s})=>{ if(s) grpOf.set(s.id, gr.id.toUpperCase()); }));
  const m1=per.get(y1)||new Map(); const mm1=minsY(y1);
  const swRowsC=[...m1.entries()].map(([sw,i])=>{ const s=S.sw[sw]; let bRk=null, bRkE=null; for(let j of swRows(sw)){ if(R.yr[j]!==y1||!inE(j)) continue; if(bRk==null||D.RK[j]<bRk) bRk=D.RK[j]; if(bRkE==null||D.RKE[j]<bRkE) bRkE=D.RKE[j]; } return {id:sw, name:niceName(s.name), g:s.g, age:y1-s.by, esc:ESC_G[escG(y1-s.by)].n, club:S.cl[R.cl[i]].code, ev:evShort(R.ev[i])+' '+CO_S[R.co[i]], pts:R.pt[i], rk:bRk, rke:bRkE, min:mm1.s.has(sw), al:al.has(sw), grp:grpOf.get(sw)||''}; });
  // entradas e saídas (mudança de clube/associação entre y1-1 e y1)
  const where=(sw,y)=>{ let last=null; for(const j of swRows(sw)) if(R.yr[j]===y&&(last==null||R.dt[j]>R.dt[last])) last=j; return last; };
  const p1=per.get(y1-1)||new Map(), moves=[];
  for(const sw of m1.keys()) if(!p1.has(sw)){ const w=where(sw,y1-1); if(w!=null) moves.push({t:'Entrada', id:sw, name:niceName(S.sw[sw].name), from:S.cl[R.cl[w]].code, to:S.cl[R.cl[m1.get(sw)]].code, pts:R.pt[m1.get(sw)]}); }
  for(const sw of p1.keys()) if(!m1.has(sw)){ const w=where(sw,y1); moves.push({t: w!=null?'Saída':'Saiu do ranking', id:sw, name:niceName(S.sw[sw].name), from:S.cl[R.cl[p1.get(sw)]].code, to: w!=null? S.cl[R.cl[w]].code : '—', pts:R.pt[p1.get(sw)]}); }
  // formados: primeira marca no clube/associação e chegada ao top‑8 nacional absoluto
  const first=new Map(); for(let i=0;i<R.n;i++){ const f=first.get(R.sw[i]); if(f===undefined||R.dt[i]<R.dt[f]) first.set(R.sw[i],i); }
  const form=[]; const top8=new Map(); for(let i=0;i<R.n;i++){ if(D.RK[i]>8) continue; const t=top8.get(R.sw[i]); if(t===undefined||R.dt[i]<R.dt[t]) top8.set(R.sw[i],i); }
  for(const [sw,f] of first){ if(!inE(f)) continue; const t=top8.get(sw); if(t===undefined) continue; const s=S.sw[sw]; form.push({id:sw, name:niceName(s.name), g:s.g, fy:R.yr[f], ty:R.yr[t], age:D.AGE[t], ev:evShort(R.ev[t])+' '+CO_S[R.co[t]], at:S.cl[R.cl[t]].code, now:s.club>=0?S.cl[s.club].code:'—', same:inE(t)}); }
  // força por estilo (média da melhor pontuação por estilo, época y1) vs nacional
  const stk=STK5.map(st=>{ const own=[], nat=[]; for(let i=0;i<R.n;i++){ if(R.yr[i]!==y1) continue; if(evStroke(R.ev[i])!==st) continue; (inE(i)?own:nat).push(R.pt[i]); } return {st, own:own.length?mean(own):null, nat:nat.length?mean(nat):null}; });
  const specN={type:'bar', labels:sy.map(String), stacked:true, series:[{label:'Masculinos',data:evo.map(r=>r.nM),color:'s1'},{label:'Femininos',data:evo.map(r=>r.nF),color:'s2'}], zero:true};
  const specL={labels:sy.map(String), series:[{label:'Média top‑10',data:evo.map(r=>r.lvl==null?null:Math.round(r.lvl)),color:'s1'},{label:'Mediana',data:evo.map(r=>r.med==null?null:Math.round(r.med)),color:'s3',dash:true}], zero:false};
  const escD=ESC_G.map((e,k)=>swRowsC.filter(r=>escG(r.age)===k).length);
  const specE={type:'bar', labels:ESC_G.map(e=>e.n), series:[{label:'Nadadores '+y1,data:escD,color:'s1'}], legend:false, zero:true};
  const specS={type:'bar', labels:stk.map(x=>STK5_L[x.st]), series:[{label:isC?'Clube':'Associação',data:stk.map(x=>x.own==null?null:Math.round(x.own)),color:'s1'},{label:'Nacional',data:stk.map(x=>x.nat==null?null:Math.round(x.nat)),color:'seq3'}], zero:false, yMin:300};
  const d=(a,b,f=fSgn)=> prev&&a!=null&&b!=null? f(a-b) : '';
  el.innerHTML=`<div class="row"><span class="pill acc">${esc(name)}</span><span class="muted small">${esc(perLabel(CE))} · indicadores da época ${yearLabel(y1)}</span></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Nadadores ${y1}</div><div class="v">${fN(cur.n)}</div><div class="d">${cur.nM} M · ${cur.nF} F${rkN?` · ${ord(rkN.r)} de ${rkN.n}`:''}</div></div>
      <div class="kpi"><div class="k">Novos no ranking</div><div class="v">${fN(cur.novos)}</div><div class="d">retenção ${cur.ret==null?'—':f1(cur.ret)+'%'} face a ${y1-1}</div></div>
      <div class="kpi"><div class="k">Nível (média top‑10)</div><div class="v">${cur.lvl==null?'—':f1(cur.lvl)}</div><div class="d">${d(cur.lvl,prev&&prev.lvl,v=>fSgn(Math.round(v)))} face a ${y1-1}</div></div>
      <div class="kpi"><div class="k">Top‑24 do escalão</div><div class="v">${fN(cur.t24)}</div><div class="d">${cur.t8} no top‑8${rk24?` · ${ord(rk24.r)} de ${rk24.n}`:''}</div></div>
      <div class="kpi"><div class="k">Mínimos e índices</div><div class="v">${fN(cur.mins)}</div><div class="d">${cur.wa} com mínimo internacional</div></div>
      <div class="kpi"><div class="k">Alertas · grupos AR</div><div class="v">${swRowsC.filter(r=>r.al).length} · ${swRowsC.filter(r=>r.grp).length}</div><div class="d">nadadores com alerta · membros de grupos</div></div></div>
    <div class="grid g2"><div class="card"><h3>Nadadores por época</h3><div class="chart" id="ceCh1"></div></div><div class="card"><h3>Nível por época</h3><p class="note">Melhor pontuação de cada nadador na época.</p><div class="chart" id="ceCh2"></div></div></div>
    <div class="grid g2"><div class="card"><h3>Por escalão · ${y1}</h3><div class="chart short" id="ceCh3"></div></div><div class="card"><h3>Força por estilo · ${y1}</h3><p class="note">Pontuação média das marcas de cada estilo, face à média nacional.</p><div class="chart short" id="ceCh4"></div></div></div>
    <div class="card"><h3>Evolução por época</h3><div id="ceT0" style="margin-top:8px"></div></div>
    <div class="card"><h3>Nadadores · ${y1}</h3><div id="ceT1" style="margin-top:8px"></div></div>
    <div class="grid g2" style="align-items:start"><div class="card"><h3>Entradas e saídas · ${y1-1} → ${y1}</h3><p class="note">Nadadores que mudaram de ${isC?'clube':'associação'} ou saíram do ranking.</p><div id="ceT2" style="margin-top:8px"></div></div>
      <div class="card"><h3>Formados que chegaram ao top‑8 nacional</h3><p class="note">Primeira marca no ranking feita ${isC?'no clube':'na associação'}; top‑8 absoluto de alguma prova, em qualquer época.</p><div id="ceT3" style="margin-top:8px"></div></div></div>
    ${!isC?'<div class="card"><h3>Clubes da associação · '+y1+'</h3><div id="ceT4" style="margin-top:8px"></div></div>':''}`;
  draw('ceCh1',specN); draw('ceCh2',specL); draw('ceCh3',specE); draw('ceCh4',specS);
  const t0=new DataTable('ceT0',[{k:'y',l:'Época',f:r=>yearLabel(r.y),x:r=>r.y},{k:'n',l:'Nadadores',num:1},{k:'nM',l:'M',num:1},{k:'nF',l:'F',num:1},{k:'novos',l:'Novos',num:1},{k:'ret',l:'Retenção',num:1,f:r=>r.ret==null?'—':f1(r.ret)+'%',x:r=>r.ret==null?'':+r.ret.toFixed(1)},{k:'lvl',l:'Nível top‑10',num:1,f:r=>r.lvl==null?'—':f1(r.lvl),x:r=>r.lvl==null?'':+r.lvl.toFixed(1)},{k:'t24',l:'Top‑24 esc.',num:1},{k:'t8',l:'Top‑8 esc.',num:1},{k:'mins',l:'Mín./índices',num:1},{k:'wa',l:'Mín. intern.',num:1}], [...evo].reverse(), {page:30});
  const t1=new DataTable('ceT1',[{k:'name',l:'Nadador',f:r=>swLink(r.id,r.name)+(r.grp?` <span class="pill acc">${esc(r.grp)}</span>`:'')+(r.al?' <span class="pill gold" title="Alerta de evolução">⚑</span>':'')+(r.min?' <span class="pill good" title="Mínimo ou índice na época">Mín.</span>':''),x:r=>r.name+(r.grp?' ('+r.grp+')':'')+(r.min?' [mínimo]':'')},{k:'g',l:'G'},{k:'age',l:'Id.',num:1},{k:'esc',l:'Escalão',sv:r=>r.age},...(isC?[]:[{k:'club',l:'Clube'}]),{k:'ev',l:'Melhor prova'},{k:'pts',l:'Pts',num:1},{k:'rk',l:'Rk nac.',num:1,f:r=>r.rk?ord(r.rk):'—',x:r=>r.rk??'',dir0:'asc'},{k:'rke',l:'Rk esc.',num:1,f:r=>r.rke?ord(r.rke):'—',x:r=>r.rke??'',dir0:'asc'}], swRowsC, {sorts:[{k:'pts',dir:'desc'}], page:25});
  const t2=new DataTable('ceT2',[{k:'t',l:'Tipo',f:r=>`<span class="pill ${r.t==='Entrada'?'good':r.t==='Saída'?'bad':''}">${r.t}</span>`,x:r=>r.t},{k:'name',l:'Nadador',f:r=>swLink(r.id,r.name),x:r=>r.name},{k:'from',l:'De'},{k:'to',l:'Para'},{k:'pts',l:'Pts',num:1}], moves, {sorts:[{k:'pts',dir:'desc'}], page:15});
  const t3=new DataTable('ceT3',[{k:'name',l:'Nadador',f:r=>swLink(r.id,r.name),x:r=>r.name},{k:'g',l:'G'},{k:'fy',l:'1.ª marca',num:1},{k:'ty',l:'Top‑8',num:1},{k:'age',l:'Idade',num:1},{k:'ev',l:'Prova'},{k:'at',l:'Clube no top‑8'},{k:'now',l:'Clube atual'}], form, {sorts:[{k:'ty',dir:'desc'}], page:15});
  let t4=null; if(!isC){ const cm=new Map(); for(const [sw,i] of m1){ const c=R.cl[i]; let o=cm.get(c); if(!o){ o={c,n:0,pts:[],t24:0}; cm.set(c,o);} o.n++; o.pts.push(R.pt[i]); if(t24.get(y1)&&t24.get(y1).has(sw)) o.t24++; }
    t4=new DataTable('ceT4',[{k:'club',l:'Clube',cls:'wrap'},{k:'code',l:'Cód.'},{k:'n',l:'Nadadores',num:1},{k:'lvl',l:'Nível top‑10',num:1,f:r=>f1(r.lvl),x:r=>+r.lvl.toFixed(1)},{k:'t24',l:'Top‑24 esc.',num:1}], [...cm.values()].map(o=>({club:S.cl[o.c].name, code:S.cl[o.c].code, n:o.n, lvl:mean(o.pts.sort((a,b)=>b-a).slice(0,10)), t24:o.t24})), {sorts:[{k:'n',dir:'desc'}], page:25}); }
  CEX={name, isC, y1, specN, specL, specE, specS, t0, t1, t2, t3, t4, cur, rkN, rk24};
}
async function ceModel(){
  const x=CEX, c=x.cur;
  return {title:(x.isC?'Ficha de clube — ':'Ficha de associação — ')+x.name, subtitle:perLabel(CE)+' · indicadores da época '+x.y1, filename:(x.isC?'Clube_':'Associacao_')+slug(x.name)+'_'+x.y1, orientation:'p', blocks:[
    {t:'kpis',items:[['Nadadores '+x.y1, fN(c.n), `${c.nM} M · ${c.nF} F`+(x.rkN?` · ${ord(x.rkN.r)} de ${x.rkN.n}`:'')],['Novos', fN(c.novos), 'retenção '+(c.ret==null?'—':f1(c.ret)+'%')],['Nível (top‑10)', c.lvl==null?'—':f1(c.lvl)],['Top‑24 escalão', fN(c.t24), c.t8+' no top‑8'],['Mínimos e índices', fN(c.mins), c.wa+' internacionais']]},

<script>
'use strict';
/* ============================================================
   Exportação: Excel (SheetJS) · PDF (jsPDF) · Word (DOCX via JSZip)
   ============================================================ */
const NAVY=[4,44,83], BLUE=[24,95,165], GOLD=[186,117,23];
async function saveFile(filename, data){
  if(CAP.dl){
    try{ await CAP.dl.save({filename, data}); toast('Ficheiro pronto: '+filename); }
    catch(e){ if(e&&e.code==='declined') return; toast('Não foi possível guardar o ficheiro ('+(e.code||e.message)+').'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
  toast('Ficheiro gerado: '+filename);
}
function pairCharts(m){
  if(m.orientation!=='l') return m;
  const out=[]; const bl=m.blocks;
  for(let k=0;k<bl.length;k++){ if(bl[k].t==='chart' && bl[k+1] && bl[k+1].t==='chart'){ out.push({t:'charts', items:[bl[k],bl[k+1]]}); k++; } else out.push(bl[k]); }
  return Object.assign({}, m, {blocks:out});
}
async function exportModel(m, fmt){
  if(fmt!=='xlsx') m = pairCharts(m);
  const stamp = new Date().toLocaleDateString('pt-PT');
  if(fmt==='xlsx') return saveFile(m.filename+'.xlsx', buildXLSX(m, stamp));
  if(fmt==='pdf') return saveFile(m.filename+'.pdf', await buildPDF(m, stamp));
  if(fmt==='docx') return saveFile(m.filename+'.docx', await buildDOCX(m, stamp));
}

/* ---------- Excel ---------- */
function buildXLSX(m, stamp){
  if(!window.XLSX) throw new Error('Biblioteca Excel indisponível');
  const wb=XLSX.utils.book_new(), used=new Set();
  const sname = s => { let b=String(s||'Folha').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31).trim()||'Folha', n=b, k=2; while(used.has(n)){ n=b.slice(0,28)+' '+k++; } used.add(n); return n; };
  const info=[[m.title],[m.subtitle||''],['Gerado em '+stamp+' · Observatório Natação Pura · FPN']];
  const kp=m.blocks.find(b=>b.t==='kpis'); if(kp){ info.push([]); kp.items.forEach(it=>info.push([it[0], it[1], it[2]||''])); }
  const p=m.blocks.filter(b=>b.t==='p'); if(m.decl) p.forEach(b=>info.push([],[b.text]));
  const ws0=XLSX.utils.aoa_to_sheet(info); ws0['!cols']=[{wch:34},{wch:18},{wch:50}]; XLSX.utils.book_append_sheet(wb, ws0, sname('Informação'));
  m.blocks.filter(b=>b.t==='table').forEach(b=>{
    const rows=b.rows.map(r=>r.map(v=>{ if(typeof v==='string' && /^[-+]?\d+(\.\d+)?$/.test(v.trim()) && v.trim().length<12 && !/^0\d/.test(v.trim())) return Number(v); return v; }));
    const ws=XLSX.utils.aoa_to_sheet([b.head, ...rows]);
    ws['!cols']=b.head.map((h,k)=>({wch: Math.min(48, Math.max(String(h).length, ...rows.slice(0,300).map(r=>String(r[k]??'').length))+2)}));
    ws['!autofilter']={ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:b.head.length-1}})};
    ws['!freeze']={xSplit:0,ySplit:1};
    XLSX.utils.book_append_sheet(wb, ws, sname(b.sheet||'Tabela'));
  });
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}

/* ---------- PDF ---------- */
async function buildPDF(m, stamp){
  if(!window.jspdf) throw new Error('Biblioteca PDF indisponível');

  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdF" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${rels.join('')}</Relationships>`);
  for(const [name,b64] of imgs) zip.file('word/'+name, b64, {base64:true});
  return await zip.generateAsync({type:'arraybuffer', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

</script>
<script>
'use strict';
/* ============================================================
   Navegação e arranque
   ============================================================ */
const VIEWS = {painel:vPainel, evolucao:vEvolucao, rankings:vRankings, nadadores:vNadadores, comparar:vComparar, analises:vAnalises, alertas:vAlertas, minimos:vMinimos, grupos:vGrupos, convocatorias:vConvocatorias, estafetas:vEstafetas, talento:vTalento, entidades:vEntidades, metas:vMetas, declaracoes:vDeclaracoes, dados:vDados};
let READY=false, LOADING_UP=true;
function go(v){ if(location.hash.slice(1)===v) route(); else location.hash=v; }
function route(){
  if(!READY) return;
  const h=location.hash.slice(1)||'painel', main=$('#main');
  let tab=h, fn=VIEWS[h];
  if(/^n\d+$/.test(h)){ tab='nadadores'; fn=root=>vFicha(root, +h.slice(1)); }
  if(!fn){ tab='painel'; fn=vPainel; }
  if(!hasData() && tab!=='dados' && tab!=='minimos'){ const t=tab; fn=root=>{ root.innerHTML = LOADING_UP ? `<div class="loading"><div>A carregar os rankings guardados…</div><div class="bar"><i></i></div></div>` : `<div class="card empty" style="padding:40px"><h3 style="margin-bottom:8px">Ainda não há rankings carregados</h3><p class="muted">Carregue, para cada época, os rankings masculinos e femininos de piscina curta e de piscina longa.</p><button class="btn primary" onclick="go('dados')" style="margin-top:12px">Ir para Dados</button></div>`; }; }
  $$('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.v===tab)));
  $$('.has-chart').forEach(el=>{ if(el.__chart){ el.__chart.destroy(); el.__chart=null; } });
  main.innerHTML='<div class="view" id="view"></div>';
  try{ fn($('#view')); }catch(e){ console.error(e); $('#view').innerHTML=`<div class="card empty">Ocorreu um erro ao mostrar esta vista: ${esc(e.message)}</div>`; }
  window.scrollTo({top:0});
}
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t) go(t.dataset.v); });
window.addEventListener('hashchange', route);
(async function init(){
  try{
    const capP = capInit();
    await loadBase();
    assemble();
    READY=true;
    $('#hdrSub').textContent = 'A carregar… · FPN · Direção Técnica Nacional';
    route();
    await capP;
    await loadUploads();
    await loadStandards();
    await loadGroups();
    await Promise.all([loadMerges(), loadTargets(), loadRelayRef()]);
    LOADING_UP=false;
    rebuildSwimmers(); refreshHeader();
    if(!hasData() && !location.hash.slice(1)) location.hash='dados'; else route();
  }catch(e){
    console.error(e); LOADING_UP=false;
    $('#main').innerHTML=`<div class="card empty">Não foi possível carregar os dados: ${esc(e.message||e)}</div>`;
  }
})();

</script>

</body>
</html>
