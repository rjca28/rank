function fiGrid(id, rows, yrs){
  const R=S.R, co=+FS.gco, el=$('#fiGrid');
  const evs=[...new Set(rows.filter(i=>R.co[i]===co).map(i=>R.ev[i]))].sort((a,b)=>a-b);
  if(!evs.length){ el.innerHTML=`<div class="empty">Sem marcas em ${CO_L[co].toLowerCase()} no período.</div>`; return {head:[],rows:[]}; }
  const cell=new Map(); for(const i of rows) if(R.co[i]===co) cell.set(R.ev[i]*10000+R.yr[i], i);
  const best=new Map(); for(const i of rows) if(R.co[i]===co){ const b=best.get(R.ev[i]); if(b==null||R.tm[i]<R.tm[b]) best.set(R.ev[i],i); }
  const html = `<div class="tbl-wrap"><table class="t grid-t"><thead><tr><th>Prova</th>${yrs.map(y=>`<th class="num">${y}</th>`).join('')}</tr></thead><tbody>${evs.map(e=>`<tr><td style="text-align:left"><b>${esc(evLabel(e))}</b></td>${yrs.map(y=>{ const i=cell.get(e*10000+y); if(i==null) return '<td class="muted">·</td>'; const p=cell.get(e*10000+y-1); const cls = p==null?'': R.tm[i]<R.tm[p]?'up-c':R.tm[i]>R.tm[p]?'dn-c':''; return `<td class="${cls}" title="${esc(evLabel(e))} ${y}: ${fT(R.tm[i])} · ${R.pt[i]} pts · ${D.RK[i]}.º nacional">${best.get(e)===i?'<b>'+fT(R.tm[i])+'</b>':fT(R.tm[i])}<small>${D.RK[i]}.º · ${R.pt[i]}</small></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.innerHTML = tblWrap('fiGrid', html, evs.length);
  return {head:['Prova',...yrs.map(String)], rows:evs.map(e=>[evLabel(e), ...yrs.map(y=>{ const i=cell.get(e*10000+y); return i==null?'':fT(R.tm[i])+' ('+D.RK[i]+'.º)'; })]), align:['l',...yrs.map(()=>'r')]};
}
function fiEvoSpec(id){
  const s=S.sw[id], key=FS.key, er=evoRows(id,key,FS.ref,FS.y0,FS.y1), cmp=FS.cmp;
  const cr = cmp!=null ? evoRows(cmp,key,FS.ref) : [];
  let labels, A, Rf, B;
  if(FS.axis==='age'){
    const ages=[...er.map(r=>r.age), ...cr.map(r=>r.age)]; const a0=Math.min(...ages), a1=Math.max(...ages); labels=[]; for(let a=a0;a<=a1;a++) labels.push(a);
    const at=(arr,a)=>{ const r=arr.find(x=>x.age===a); return r? r.tm/100 : null; };
    A=labels.map(a=>at(er,a)); B=labels.map(a=>at(cr,a)); Rf=labels.map(a=>{ const r=er.find(x=>x.age===a); return r&&isFinite(r.ref)? r.ref/100 : null; });
  } else {
    const ys=[...er.map(r=>r.y), ...cr.map(r=>r.y)]; const y0=Math.min(...ys), y1=Math.max(...ys); labels=[]; for(let y=y0;y<=y1;y++) labels.push(y);
    const at=(arr,y)=>{ const r=arr.find(x=>x.y===y); return r? r.tm/100 : null; };
    A=labels.map(y=>at(er,y)); B=labels.map(y=>at(cr,y)); Rf=labels.map(y=>{ const r=er.find(x=>x.y===y); return r&&isFinite(r.ref)? r.ref/100 : null; });
  }
  const series=[{label:niceName(s.name), data:A, color:'s1', spanGaps:true}, {label:REF_L[FS.ref], data:Rf, color:'s3', dash:true, points:false}];

function projFor(e, co, g, age, tLast, stdT){

  if(!arr||!arr.length) return null;
  const q=[.25,.5,.75].map(p=>quantile(arr,p)), proj=q.map(d=>tLast*(1-d/100));
  let prob=null; if(stdT){ const req=(tLast-stdT)/tLast*100; prob = req<=0? 100 : arr.filter(d=>d>=req).length/arr.length*100; }
  return {proj, prob, base, n:arr.length};
}

function mnMeets(tab, y, gsel){

  return [...best.entries()].map(([i,st])=>({i, st}));

  const excl=(cfg.excl||[]).map(stdById).filter(Boolean);

      for(const tid of ru.tables){ const tb=stdById(tid); if(!tb||tb.co!==R.co[i]) continue; const st=stdTime(tb,gk,R.ev[i]); if(!st) continue; const lim=st*(1+((ru.tol||0)+(cfg.adj||0))/100); if(R.tm[i]<=lim){ const rp=ptsOf(st,R.ev[i],R.co[i],D.G[i]), mp=ptsOf(R.tm[i],R.ev[i],R.co[i],D.G[i]); cand.push({i, sw:R.sw[i], ev:R.ev[i], co:R.co[i], g:D.G[i], age, st, lim, tab:tb, rule:ri, fb:!!ru.fallback, ref:rp, margin: rp!=null&&mp!=null? mp-rp : null}); } } }); }

  const mainEv=new Set(base.filter(c=>!c.fb).map(c=>c.ev*4+c.co*2+c.g));
  let list=base.filter(c=>!c.fb||!mainEv.has(c.ev*4+c.co*2+c.g));

  const byKey=new Map(); list.forEach(c=>{ const k=c.sw*64+c.ev*2+c.co; const o=byKey.get(k); if(!o||(c.margin??-1e9)>(o.margin??-1e9)) byKey.set(k,c); });

  // por nadador
  const sws=new Map(); list.forEach(c=>{ let o=sws.get(c.sw); if(!o){ o={sw:c.sw, evs:[]}; sws.set(c.sw,o);} o.evs.push(c); });

  let rank=0; people.forEach(p=>{ if(p.sel){ rank++; p.rank=rank; p.inQuota = !cfg.quota || rank<=cfg.quota; } else { p.rank=null; p.inQuota=false; } });
  return {people, perEv, excluded: excluded.size, excludedSet:excluded, list, best};

  const R=S.R, n=R.n, out=[], today=Math.floor((Date.now()-EPOCH)/86400000);
  const row=(type,i,sev,txt,ctx)=>out.push({k:type+'#'+rowKey(i), type, sev, i, sw:R.sw[i], ev:R.ev[i], co:R.co[i], yr:R.yr[i], tm:R.tm[i], dt:R.dt[i], txt, ctx});
  const swf=(type,sw,y,i,sev,txt,ctx)=>out.push({k:type+'#'+qcSwKey(sw)+(y?'|'+y:''), type, sev, i, sw, ev:i>=0?R.ev[i]:-1, co:i>=0?R.co[i]:-1, yr:y||(i>=0?R.yr[i]:0), tm:i>=0?R.tm[i]:0, dt:i>=0?R.dt[i]:0, txt, ctx});
  // 1. melhorias anormais entre épocas consecutivas (mesma prova e piscina)
  const by=new Map(); for(let i=0;i<n;i++){ const k=R.sw[i]*64+R.ev[i]*2+R.co[i]; let a=by.get(k); if(!a){ a=[]; by.set(k,a); } a.push(i); }
  const pairs=[]; for(const a of by.values()){ if(a.length<2) continue; a.sort((x,y)=>R.yr[x]-R.yr[y]); for(let t=1;t<a.length;t++){ const i=a[t-1], j=a[t]; if(R.yr[j]!==R.yr[i]+1) continue; const nx=a[t+1]!==undefined&&R.yr[a[t+1]]===R.yr[j]+1? a[t+1] : -1; pairs.push([i,j,1-R.tm[j]/R.tm[i],nx]); } }
  const bk=i=>Math.min(Math.max(D.AGE[i],11),20)*2+D.G[i]; const imps=new Map(); for(const p of pairs){ const b=bk(p[1]); let v=imps.get(b); if(!v){ v=[]; imps.set(b,v); } v.push(p[2]); }
  const th=new Map(); for(const [b,v] of imps){ v.sort((x,y)=>x-y); th.set(b,{p995:Math.max(.04,quantile(v,.995)), p999:Math.max(.06,quantile(v,.999))}); }
  for(const [i,j,imp,nx] of pairs){ const t=th.get(bk(j)); if(imp<=t.p995) continue; const back= nx>=0? R.tm[nx]/R.tm[j]-1 : null; const spike= back!=null && back>t.p995/2; if(imp<=t.p999 && !spike) continue;
    row('salto', j, spike?2:1, `Melhoria de ${f1(imp*100)}% numa época${spike?` e regressão de ${f1(back*100)}% na seguinte`:''}`, `${fT(R.tm[i])} (${R.yr[i]}) → ${fT(R.tm[j])} (${R.yr[j]})${nx>=0?' → '+fT(R.tm[nx])+' ('+R.yr[nx]+')':''} · habitual aos ${D.AGE[j]} anos: até ${f1(t.p995*100)}%`); }
  // 2. melhor de sempre da idade muito à frente da segunda (outro nadador)
  const best=new Map(); for(let i=0;i<n;i++){ const a=D.AGE[i]; if(a>18) continue; const k=((a*32+R.ev[i])*2+R.co[i])*2+D.G[i]; let o=best.get(k); if(!o){ o={b:-1,s:Infinity,n:0}; best.set(k,o); } o.n++;
    if(o.b<0||R.tm[i]<R.tm[o.b]){ if(o.b>=0&&R.sw[o.b]!==R.sw[i]) o.s=Math.min(o.s,R.tm[o.b]); o.b=i; } else if(R.sw[i]!==R.sw[o.b]&&R.tm[i]<o.s) o.s=R.tm[i]; }
  const isolated=i=>{ let sec=-1; for(const j of swRows(R.sw[i])){ if(j===i||R.yr[j]!==R.yr[i]) continue; if(R.pt[j]>sec) sec=R.pt[j]; } return sec>=0 && R.pt[i]-sec>100 ? sec : null; };
  for(const o of best.values()){ if(o.n<30||!isFinite(o.s)) continue; const g=o.s/R.tm[o.b]-1; const sec= g>0.04? isolated(o.b) : null; if(sec!=null) row('idade', o.b, g>0.07?2:1, `${f1(g*100)}% mais rápida do que a segunda melhor de sempre aos ${D.AGE[o.b]} anos, muito acima das outras provas do nadador`, `Esta: ${fT(R.tm[o.b])} (${R.pt[o.b]} pts) · segunda de sempre: ${fT(o.s)} · restantes provas do nadador na época: até ${sec} pts`); }
  // 3. mesmo tempo e data em provas diferentes
  const dup=new Map(); for(let i=0;i<n;i++){ const k=R.sw[i]+'|'+R.dt[i]+'|'+R.tm[i]; const p=dup.get(k); if(p===undefined) dup.set(k,i); else if(R.ev[p]!==R.ev[i]) row('duplo', i, 2, `Tempo igual ao de ${evLabel(R.ev[p])} ${CO_S[R.co[p]]} no mesmo dia`, `${fT(R.tm[i])} em ${evLabel(R.ev[i])} e em ${evLabel(R.ev[p])}`); }
  // 4. data fora da época
  for(let i=0;i<n;i++){ const y=dayToDate(R.dt[i]).getUTCFullYear(); if(y!==R.yr[i]||R.dt[i]>today) row('data', i, R.dt[i]>today?2:1, R.dt[i]>today? 'Data posterior a hoje' : `Data de ${y} no ranking de ${R.yr[i]}`, fD(R.dt[i])); }
  // 5. género
  for(const [sw,g] of S.qcGender||[]){ const s=S.sw[sw]; if(!s||!s.n) continue; swf('genero', sw, 0, s.bestRow??-1, 2, `Registado como ${s.g==='F'?'feminino':'masculino'} mas também aparece no ranking ${g==='F'?'feminino':'masculino'}`, ''); }
  // 6. clube por identificar ou 3+ clubes numa época
  const bad=new Set(S.cl.map((c,k)=>(!c.code||c.code==='?')?k:-1).filter(k=>k>=0)); const cls=new Map();
  for(let i=0;i<n;i++){ if(bad.has(R.cl[i])) row('clube', i, 1, 'Marca sem código de clube', S.cl[R.cl[i]].name||'—'); const k=R.sw[i]+'|'+R.yr[i]; let c=cls.get(k); if(!c){ c=new Map(); cls.set(k,c); } if(!c.has(R.cl[i])&&!/^IND/.test(S.cl[R.cl[i]].code||'')) c.set(R.cl[i],i); }
  for(const [k,c] of cls){ if(c.size<3) continue; const [sw,y]=k.split('|').map(Number); swf('clube', sw, y, [...c.values()][0], 1, `${c.size} clubes diferentes em ${y}`, [...c.keys()].map(x=>S.cl[x].code).join(', ')); }
  const res={list:out, th}; D.cache.set(ck,res); return res;
}

/* ---------- estado de cada sinal: por rever, validado, excluído ---------- */
function qcState(){ const ok=new Set(S.qc.ok); const L=computeQC().list; return {ok, rev:L.filter(f=>!ok.has(f.k)), val:L.filter(f=>ok.has(f.k)), ex:S.qc.ex}; }
function qcCounts(){ if(!hasData()) return {rev:0,ex:0}; const x=qcState(); return {rev:x.rev.length, hi:x.rev.filter(f=>f.sev>=2).length, ex:x.ex.length}; }
async function qcValidate(keys, on){ const ok=new Set(S.qc.ok); keys.forEach(k=>on? ok.add(k) : ok.delete(k)); S.qc.ok=[...ok]; await saveQC(); }
async function qcExclude(f, why){
  const s=S.sw[f.sw]; const e={k:rowKey(f.i), name:s.name, bd:s.bd, ev:S.ev[f.ev], co:f.co, yr:f.yr, tm:f.tm, dt:f.dt, why:QC_T[f.type][0]+': '+stripTags(f.txt), at:new Date().toISOString()};
  S.qc.ex=S.qc.ex.filter(x=>x.k!==e.k).concat([e]); S.qcEx=new Set(S.qc.ex.map(x=>x.k)); await saveQC(); rebuildSwimmers(); refreshHeader(); }
async function qcRestore(k){ S.qc.ex=S.qc.ex.filter(x=>x.k!==k); S.qcEx=new Set(S.qc.ex.map(x=>x.k)); await saveQC(); rebuildSwimmers(); refreshHeader(); }

function vQualidade(root){
  const canW=dataMode()!=='reader';
  root.innerHTML=`<div class="view-head"><div><h2>Qualidade dos dados</h2><div class="sub">Marcas que merecem verificação antes de entrarem nas análises: melhorias fora do habitual, tempos repetidos, datas e clubes inconsistentes. Cada sinal pode ser <b>validado</b> (a marca está correta e deixa de aparecer) ou a marca <b>excluída</b> (deixa de contar em rankings, alertas, projeções e relatórios, mas pode ser reposta).</div></div>${expHTML('qc')}</div>
  <div id="qcK"></div>
  <div class="fbar sticky">${segHTML('qcSt',[['rev','Por rever'],['val','Validadas'],['ex','Excluídas']],QC.st,'Estado')}${selHTML('qcTy',[['','Todos os tipos'],...Object.entries(QC_T).map(([k,v])=>[k,v[0]])],QC.type,'Tipo')}${selHTML('qcY',[['','Todas as épocas'],...S.years.map(y=>[y,yearLabel(y)]).reverse()],QC.y,'Época')}</div>
  <div id="qcC" class="view"></div>`;
  bindSeg(root,'qcSt',v=>{ QC.st=v; qcContent(); }); $('#qcTy').onchange=e=>{ QC.type=e.target.value; qcContent(); }; $('#qcY').onchange=e=>{ QC.y=e.target.value; qcContent(); };
  bindExp(root,'qc',qcModel); qcContent();
  $('#qcC').addEventListener('click', async e=>{ const b=e.target.closest('[data-qa]'); if(!b||!canW) return; const k=b.dataset.k, a=b.dataset.qa; b.disabled=true;
    try{ if(a==='ok') await qcValidate([k],true); else if(a==='unok') await qcValidate([k],false); else if(a==='rest'){ await qcRestore(k); toast('Marca reposta nas análises.'); }
      else if(a==='ex'){ const f=computeQC().list.find(x=>x.k===k); if(f){ await qcExclude(f); toast('Marca excluída das análises.'); } } qcContent(); }catch(err){ console.error(err); toast('Erro: '+(err.message||err)); b.disabled=false; } });
}
function qcContent(){
  const el=$('#qcC'), canW=dataMode()!=='reader', x=qcState(), cnt=t=>x.rev.filter(f=>f.type===t).length;
  const mc=(()=>{ try{ return mergeCandidates().length; }catch(e){ return 0; } })();
  $('#qcK').innerHTML=`<div class="kpis"><div class="kpi"><div class="k">Por rever</div><div class="v">${fN(x.rev.length)}</div><div class="d">${fN(x.rev.filter(f=>f.sev>=2).length)} de prioridade alta</div></div><div class="kpi"><div class="k">Validadas</div><div class="v">${fN(x.val.length)}</div><div class="d">marcadas como corretas</div></div><div class="kpi"><div class="k">Excluídas das análises</div><div class="v">${fN(x.ex.length)}</div><div class="d">podem ser repostas</div></div><div class="kpi"><div class="k">Possíveis nadadores duplicados</div><div class="v">${fN(mc)}</div><div class="d">${mc?'<button class="lnk" id="qcMg">rever em Dados › Unificação</button>':'nenhum por rever'}</div></div></div>`;
  const mg=$('#qcMg'); if(mg) mg.onclick=()=>{ go('dados'); setTimeout(()=>{ const c=$('#mgCard'); if(c) c.scrollIntoView({behavior:'smooth'}); },300); };
  const ins=[]; if(x.rev.length){ const top=Object.keys(QC_T).map(t=>[t,cnt(t)]).filter(a=>a[1]).sort((a,b)=>b[1]-a[1]); ins.push(`${fN(x.rev.length)} sinais por rever: ${top.map(([t,n])=>fN(n)+' '+QC_T[t][0].toLowerCase()).join(', ')}.`); ins.push('Comece pelos de prioridade alta (picos isolados, tempos repetidos, género inconsistente): são os que mais provavelmente resultam de erro de introdução.'); }
  else ins.push('Sem sinais por rever.');
  if(x.ex.length) ins.push(`${fN(x.ex.length)} marca${x.ex.length>1?'s':''} excluída${x.ex.length>1?'s':''} das análises.`);
  if(!canW) ins.push('<span class="muted">Só quem tem permissão de edição pode validar ou excluir marcas.</span>');
  let rows, cols;
  const act=(r)=>!canW? '' : QC.st==='rev'? `<button class="btn sm" data-qa="ok" data-k="${esc(r.k)}" title="A marca está correta">Validar</button> ${r.i>=0&&r.type!=='genero'?`<button class="btn sm" data-qa="ex" data-k="${esc(r.k)}" title="Deixa de contar nas análises">Excluir</button>`:''}` : QC.st==='val'? `<button class="btn sm" data-qa="unok" data-k="${esc(r.k)}">Voltar a rever</button>` : `<button class="btn sm" data-qa="rest" data-k="${esc(r.k)}">Repor</button>`;
  if(QC.st==='ex'){
    rows=x.ex.filter(e=>!QC.y||e.yr===+QC.y).map(e=>({k:e.k, name:niceName(e.name), ev:evLabel(S.ev.indexOf(e.ev))+' '+CO_S[e.co], yr:e.yr, tm:e.tm, dt:e.dt, why:e.why, at:e.at}));
    cols=[{k:'name',l:'Nadador'},{k:'ev',l:'Prova'},{k:'yr',l:'Época',num:1},{k:'tm',l:'Marca',num:1,f:r=>fT(r.tm),x:r=>fT(r.tm)},{k:'dt',l:'Data',f:r=>fD(r.dt)},{k:'why',l:'Motivo',cls:'wrap'},{k:'at',l:'Excluída em',f:r=>new Date(r.at).toLocaleDateString('pt-PT')},{k:'a',l:'',nosort:1,noexp:1,f:act}];
  } else {
    const L=(QC.st==='rev'?x.rev:x.val).filter(f=>(!QC.type||f.type===QC.type)&&(!QC.y||f.yr===+QC.y));
    rows=L.map(f=>({...f, tyl:QC_T[f.type][0], name:niceName(S.sw[f.sw].name), evl:f.ev>=0? evLabel(f.ev)+' '+CO_S[f.co] : '—', meet:f.i>=0? S.mt[S.R.mt[f.i]].name : '', club:f.i>=0? S.cl[S.R.cl[f.i]].code : ''}));
    cols=[{k:'sev',l:'Prioridade',f:r=>`<span class="pill ${r.sev>=2?'bad':'gold'}" title="${r.sev>=2?'Prioridade alta':'Verificar'}">${r.sev>=2?'Alta':'Média'}</span>`,x:r=>r.sev>=2?'Alta':'Média',sv:r=>-r.sev},{k:'tyl',l:'Tipo'},{k:'name',l:'Nadador',f:r=>swLink(r.sw,r.name),x:r=>r.name},{k:'evl',l:'Prova'},{k:'yr',l:'Época',num:1},{k:'tm',l:'Marca',num:1,f:r=>r.tm?fT(r.tm):'—',x:r=>r.tm?fT(r.tm):''},{k:'txt',l:'Sinal',cls:'wrap',f:r=>esc(r.txt)+(r.ctx?`<br><span class="muted small">${esc(r.ctx)}</span>`:''),x:r=>r.txt+(r.ctx?' — '+r.ctx:'')},{k:'meet',l:'Competição',cls:'wrap',f:r=>r.meet?esc(r.meet)+' <span class="muted small">'+fD(r.dt)+'</span>':'—',x:r=>r.meet?r.meet+' '+fD(r.dt):''},{k:'a',l:'',nosort:1,noexp:1,f:act}];
  }
  el.innerHTML=insightHTML(ins)+`<div class="card"><div class="card-h"><div><h3>${QC.st==='rev'?'Sinais por rever':QC.st==='val'?'Sinais validados':'Marcas excluídas das análises'}</h3><p class="note">${QC.st==='ex'?'Estas marcas foram retiradas de todos os cálculos. “Repor” volta a incluí-las.':Object.entries(QC_T).filter(([k])=>!QC.type||k===QC.type).map(([k,v])=>`<b>${esc(v[0])}</b>: ${esc(v[1])}`).join(' ')}</p></div></div><div id="qcT"></div></div>`;
  const t=new DataTable('qcT',cols,rows,{page:50, sorts:QC.st==='ex'?[{k:'at',dir:'desc'}]:[{k:'sev',dir:'asc'},{k:'yr',dir:'desc'}], empty:QC.st==='rev'?'Nenhum sinal por rever com estes filtros.':'Nenhuma marca.'});
  QCX={t, ins};
}
async function qcModel(){ const x=QCX; return {title:'Qualidade dos dados — '+(QC.st==='rev'?'sinais por rever':QC.st==='val'?'sinais validados':'marcas excluídas'), subtitle:(QC.type?QC_T[QC.type][0]+' · ':'')+(QC.y?'época '+QC.y:'todas as épocas'), filename:'Qualidade_dados_'+QC.st+'_'+todayISO(), orientation:'l', blocks:[{t:'p',text:'Leitura rápida\n'+insTxt(x.ins.map(stripTags))}, Object.assign({t:'table',sheet:'Sinais',small:true},x.t.exportRows()), {t:'src',text:Object.values(QC_T).map(v=>v[0]+': '+v[1]).join(' ')}]}; }
HELP.push([/^Sinais por rever|^Sinais validados|^Marcas excluídas das análises/, 'Lista de marcas com sinais de possível erro. Validar = a marca está correta; Excluir = deixa de contar nas análises (pode ser reposta).', 'Comece pelos sinais de prioridade alta. Confirme no resultado oficial da competição antes de excluir.']);

  const rowsHTML = ys.map(y=>{ const o=S.yinfo[y]; const nsl=SLOTS.filter(([g,co])=>S.uploads.has(slotKey(y,g,co))).length;
    return `<tr><td><b>${y}</b>${o&&isPartial(y)?' <span class="pill gold">parcial</span>':''}<br><span class="small muted">${nsl}/4 listas</span></td>${SLOTS.map(([g,co])=>slotCell(y,g,co)).join('')}<td class="num">${o?fN(o.nsw):'—'}</td><td class="num">${o?fN(o.rows):'—'}</td><td>${o?fD(o.maxDt):'—'}</td><td>${canW&&nsl?`<button type="button" class="btn ghost small" data-rmy="${y}">Remover época</button>`:''}</td></tr>`; }).join('');
  root.innerHTML = `

  ${!hasData()?`<div class="card" style="border-color:var(--gold)"><h3>Ainda não há rankings carregados</h3><p class="note">Comece por carregar os rankings de uma época na tabela abaixo (uma lista por célula) ou arraste vários ficheiros para a zona “Carregar vários ficheiros”. A época, o género e a piscina são lidos do conteúdo de cada ficheiro.</p></div>`:''}

    ${canW?`<div class="row"><label class="fld"><span>Acrescentar época</span><input type="number" id="daNewY" min="1990" max="${cy+1}" value="${nextY}"></label><button class="btn" id="daAddY">Acrescentar</button></div>`:''}</div>
    <div class="tbl-wrap"><table class="t slots-t"><thead><tr><th>Época</th>${SLOTS.map(([g,co])=>`<th>${esc(slotLabel(g,co))}</th>`).join('')}<th class="num">Nadadores</th><th class="num">Marcas</th><th>Última marca</th><th></th></tr></thead><tbody>${rowsHTML}</tbody></table></div>
    <div id="daMsg" class="small" style="margin-top:10px;display:grid;gap:4px"></div>${hasData()?'<div class="row" style="margin-top:10px"><button class="btn" id="daNews">Novidades da última época</button></div>':''}</div>
  <div class="card" id="mgCard"></div>
  <div class="grid g2">
    ${canW?`<div class="card"><h3>Carregar vários ficheiros</h3><p class="note">Vários rankings de uma vez, de uma ou mais épocas. Cada ficheiro é colocado automaticamente na época, género e piscina corretos. Uma lista já existente é substituída.</p><label class="drop" id="daDrop" for="daFile" style="display:block;margin-top:12px"><b>Escolher ficheiros</b> ou arrastar para aqui<br><span class="small">.xlsx · um ou mais ficheiros</span></label><input type="file" id="daFile" accept=".xlsx,.xls" multiple hidden></div>`:''}
    <div class="card"><h3>Cópia de segurança</h3><p class="note">Guarda todos os rankings carregados num ficheiro JSON, que pode ser restaurado noutro computador ou noutra cópia desta plataforma.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="daBk" ${hasData()?'':'disabled'}>Guardar base de dados (JSON)</button>${canW?`<label class="btn" for="daRs">Restaurar a partir de JSON</label><input type="file" id="daRs" accept=".json,application/json" hidden>`:''}</div>
      <div id="daBkMsg" class="small" style="margin-top:8px;display:grid;gap:4px"></div></div>
  </div>
  <div class="card"><details class="method"><summary>Notas metodológicas</summary><ul>
    <li>Fonte: rankings nacionais absolutos anuais (1 jan–31 dez) exportados pela FPN, um ficheiro por género e piscina (uma folha por prova). Se carregar um ficheiro com várias piscinas ou géneros, é dividido automaticamente, mas nesse caso cada nadador pode ter apenas a melhor marca entre PL e PC.</li>
    <li>Cada lista tem um número fixo de marcas por prova, por isso o número total de nadadores e a média geral de pontos dependem do corte de cada época. Para comparar épocas, use a média dos 50 melhores ou fixe uma pontuação mínima.</li>
    <li>São usadas as provas individuais. Parciais (folhas “Lap”), estafetas e a folha “Top Results” ficam de fora.</li>
    <li>Pontuação: a que vem em cada ficheiro (tabela World Aquatics indicada na exportação). Para comparar épocas, convém exportar todos os anos com a mesma tabela de pontos.</li>
    <li>Idade = ano do ranking − ano de nascimento. Escalões FPN 2025/26 aplicados a todas as épocas: Cadetes ≤12, Infantis 13–14, Juvenis 15–16, Juniores 17–18, Seniores 19+ (com subdivisões A/B).</li>
    <li>Posição nacional: ordem por tempo na prova, piscina, género e época, incluindo todos os nadadores presentes no ranking. Ranking histórico: posição entre as melhores marcas de sempre de cada nadador presente na base.</li>
    <li>Médias nacionais, percentis e taxas de melhoria referem-se aos nadadores presentes no ranking. A taxa de melhoria usa pares de épocas do mesmo nadador na mesma prova e piscina.</li>
    <li>Mínimos: tabelas iniciais com os índices PAR 2025–2028 do Plano de Atividades 2027 (piscina longa e curta) e os mínimos do Mundial de Budapeste 2027, editáveis no separador Mínimos. A projeção e a probabilidade de atingir um mínimo usam as taxas de melhoria nacionais da idade seguinte, na mesma prova e piscina.</li>
    <li>Funil de talento: posição no ranking nacional do escalão (Cadetes, Infantis, Juvenis, Juniores, Seniores). Trajetórias semelhantes: nadadores anteriores do mesmo género com a pontuação por idade mais próxima.</li>
    <li>Um nadador é identificado por nome e data de nascimento. Grafias diferentes do nome entre listas ou épocas originam registos separados; use a Unificação de nadadores para os fundir.</li><li>Índice de talento: 1000 × (média dos 10 melhores tempos de sempre na mesma idade, prova, piscina e género ÷ tempo)³, média das duas melhores provas da época e correção do trimestre de nascimento. Probabilidades = frequências históricas de chegada ao top‑8/top‑3 absoluto.</li><li>Estafetas: soma das melhores marcas individuais no período (partida da plataforma), sem nadadores repetidos entre equipas.</li>
  </ul></details></div>`;
  const msg=$('#daMsg');

  const inp=$('#daFile'), drop=$('#daDrop');
  if(inp){ inp.onchange=()=>{ if(inp.files.length) handleUploads([...inp.files], root); };
    drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');}); drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); const f=[...e.dataTransfer.files].filter(f=>/\.xlsx?$/i.test(f.name)); if(f.length) handleUploads(f, root);}); }
  $('#daBk').onclick=async()=>{ const b=$('#daBk'); b.disabled=true; b.textContent='A preparar…'; try{ const {blob,name,info}=buildBackup(); $('#daBkMsg').innerHTML=`<span>${esc(info)}</span>`; await saveFile(name, blob); }catch(e){ console.error(e); toast('Erro: '+(e.message||e)); } finally{ b.disabled=false; b.textContent='Guardar base de dados (JSON)'; } };

  { const mgc=$('#mgCard',root); if(mgc&&hasData()){ mgc.insertAdjacentHTML('beforebegin', reportBarHTML()); bindReportBar(root); } }

  { const mgc=$('#mgCard',root); if(mgc&&hasData()){ const q=qcCounts(); mgc.insertAdjacentHTML('beforebegin', `<div class="repbar ${q.hi?'due':''}"><div><b>Qualidade dos dados</b> <span class="muted">${q.rev? fN(q.rev)+' sinais por rever'+(q.hi?' ('+fN(q.hi)+' de prioridade alta)':'') : 'Sem sinais por rever'}${q.ex? ' · '+fN(q.ex)+' marca'+(q.ex>1?'s':'')+' excluída'+(q.ex>1?'s':'')+' das análises':''}.</span></div><button class="btn${q.hi?' primary':''}" id="daQc">Abrir</button></div>`); $('#daQc',root).onclick=()=>go('qualidade'); } }

function logLine(el, html){ const d=document.createElement('div'); d.innerHTML=html; el.appendChild(d); return d; }
function afterDataChange(root, msgId, keep){ assemble(); _clubOpts=null; refreshHeader(); if(!root.isConnected) return; vDados(root); if(keep!=null) $('#'+msgId).innerHTML=keep; }
async function handleSlotUpload(file, key, root){
  const [y,g,co]=key.split('_'); const msg=$('#daMsg'); msg.innerHTML=''; let snap=null; try{ snap=newsSnapshot(); }catch(e){}
  const line=logLine(msg, `${esc(file.name)}: a ler…`);
  try{
    const p=await parseRankingFile(file); const parts=splitPayload(p);
    if(p.year!==+y) throw new Error(`o ficheiro é da época ${p.year}, não de ${y}. Use a linha ${p.year} ou a zona “Carregar vários ficheiros”.`);
    const part=parts.find(q=>q.g===g&&q.co===+co);
    if(!part) throw new Error(`o ficheiro não contém ${slotLabel(g,+co)}; contém ${parts.map(q=>slotLabel(q.g,q.co)).join(', ')}.`);
    part.file=file.name; part.uploadedAt=new Date().toISOString();
    line.innerHTML=`${esc(file.name)}: ${fN(part.cols.tm.length)} marcas de ${esc(slotLabel(g,+co))} ${y}. A guardar…`;
    const where=await saveUpload(part); S.uploads.set(key, part);
    const other = parts.length>1 ? ` O ficheiro tinha também ${parts.filter(q=>q!==part).map(q=>slotLabel(q.g,q.co)).join(', ')}, que não foram usados nesta célula.` : '';
    const keep=`<span><span class="pill good">${y} · ${esc(slotLabel(g,+co))}</span> ${fN(part.cols.tm.length)} marcas · ${where==='shared'?'guardado na plataforma':'guardado neste navegador'}.${other}</span>`;
    afterDataChange(root,'daMsg',keep); toast(`${slotLabel(g,+co)} ${y} carregado.`); showNews(snap);
  }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
}
async function handleUploads(files, root){
  const msg=$('#daMsg'); msg.innerHTML=''; msg.scrollIntoView({behavior:'smooth',block:'center'}); let ok=0, snap=null; try{ snap=newsSnapshot(); }catch(e){}
  files.sort((a,b)=>a.name.localeCompare(b.name));
  for(const file of files){
    const line=logLine(msg, `${esc(file.name)}: a ler…`);
    try{
      const p=await parseRankingFile(file), parts=splitPayload(p), out=[];
      for(const q of parts){ q.file=file.name; q.uploadedAt=new Date().toISOString(); const where=await saveUpload(q); S.uploads.set(slotKey(q.year,q.g,q.co), q); out.push(`${slotLabel(q.g,q.co)} (${fN(q.cols.tm.length)})`); ok++; }
      line.innerHTML=`<span><span class="pill good">${p.year}</span> ${esc(file.name)} → ${esc(out.join(' · '))}${parts.length>1?' <span class="pill gold">ficheiro combinado</span>':''}</span>`;
    }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
  }
  if(ok){ const keep=msg.innerHTML; afterDataChange(root,'daMsg',keep); toast(`${ok} lista${ok>1?'s':''} carregada${ok>1?'s':''}.`); showNews(snap); }
}
function refreshHeader(){ $('#hdrSub').textContent = S.scope? `Versão de consulta · ${scopeName()} · FPN · Direção Técnica Nacional` : hasData() ? `Rankings nacionais absolutos ${S.years[0]}–${lastYear()} · FPN · Direção Técnica Nacional` : 'Sem rankings carregados · FPN · Direção Técnica Nacional'; }
function mergeCandidates(){
  const R=S.R, act=S.sw.filter(s=>s.n>0), ign=new Set(S.mergeIgnore), out=[], seenPk=new Set();
  const tok=s=>{ const p=s.name.split(','); const sur=norm(p[0]).split(/[^a-z]+/).filter(w=>w.length>1), giv=norm(p.slice(1).join(' ')).split(/[^a-z]+/).filter(w=>w.length>1); return {sur,giv,all:new Set([...sur,...giv])}; };
  const lists=id=>{ const set=new Set(); for(const i of swRows(id)) set.add(R.yr[i]*64+R.ev[i]*2+R.co[i]); return set; };
  const clubs=id=>new Set(swRows(id).map(i=>R.cl[i]));
  const overlap=(a,b)=>{ const A=lists(a.id); for(const x of lists(b.id)) if(A.has(x)) return true; return false; };
  const push=(a,b,level,why)=>{ const pk=[swKeyOf(a),swKeyOf(b)].sort().join('||'); if(ign.has(pk)||seenPk.has(pk)) return; if(overlap(a,b)) return; seenPk.add(pk);
    const [keep,alias]=(b.last>a.last||(b.last===a.last&&b.n>a.n))? [b,a] : [a,b]; out.push({keep, alias, level, why, pk}); };
  const byBd=new Map(); act.forEach(s=>{ const k=s.bd+'|'+s.g; if(!byBd.has(k)) byBd.set(k,[]); byBd.get(k).push(s); });
  for(const l of byBd.values()){ if(l.length<2) continue;
    for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){ const a=tok(l[i]), b=tok(l[j]); if(!a.giv.length||!b.giv.length||a.giv[0]!==b.giv[0]) continue;
      const sh=[...a.all].filter(w=>b.all.has(w)).length, sub=[...a.all].every(w=>b.all.has(w))||[...b.all].every(w=>a.all.has(w));
      if(sub||sh>=2) push(l[i],l[j],'forte', sub? 'Mesma data de nascimento; um nome contém o outro' : `Mesma data de nascimento, mesmo primeiro nome e ${sh} nomes em comum`); } }
  const byN=new Map(); act.forEach(s=>{ const k=norm(s.name).replace(/[^a-z]+/g,' ').trim()+'|'+s.g; if(!byN.has(k)) byN.set(k,[]); byN.get(k).push(s); });
  for(const l of byN.values()){ if(l.length<2) continue;
    for(let i=0;i<l.length;i++) for(let j=i+1;j<l.length;j++){ const a=l[i], b=l[j]; if(a.bd===b.bd) continue; const [ya,ma,da]=String(a.bd).split('-'), [yb,mb,db]=String(b.bd).split('-');
      const swap = ya===yb && ma===db && da===mb; if(!swap && Math.abs(a.by-b.by)>1) continue;
      const ca=clubs(a.id); if(!swap && ![...clubs(b.id)].some(c=>ca.has(c))) continue;
      push(a,b, swap?'forte':'possível', swap? 'Mesmo nome; dia e mês de nascimento trocados' : `Mesmo nome e clube em comum; datas de nascimento diferentes (${fBD(a.bd)} e ${fBD(b.bd)})`); } }
  const lv={forte:0,'possível':1}; out.sort((x,y)=>lv[x.level]-lv[y.level] || y.keep.bestPt-x.keep.bestPt);
  return out;
}
function swBrief(s){ const R=S.R, cl=[...new Set(swRows(s.id).sort((a,b)=>R.dt[a]-R.dt[b]).map(i=>S.cl[R.cl[i]].code))]; return `<b>${esc(niceName(s.name))}</b> <span class="muted small">${fBD(s.bd)} · ${s.g}</span><br><span class="small">${s.first}–${s.last} · ${fN(s.n)} marcas · ${esc(cl.slice(-4).join(', '))}</span><br><span class="small muted">${esc(s.name)}</span>`; }
let MGX=null;
function renderMerges(root){
  const el=$('#mgCard'); if(!el) return; if(!hasData()){ el.innerHTML=''; return; }
  const canW=dataMode()!=='reader', cands=mergeCandidates(), strong=cands.filter(c=>c.level==='forte');
  el.innerHTML=`<div class="card-h"><div><h3>Unificação de nadadores</h3><p class="note">Um nadador é identificado por nome e data de nascimento. Grafias diferentes entre listas ou épocas (apelidos acrescentados, acentos, data trocada) partem a carreira em duas fichas. Aqui estão os prováveis duplicados; ao fundir, as marcas passam para o nadador mantido e o nome antigo fica como alternativo na pesquisa. Nunca são propostos pares que aparecem na mesma lista (mesma prova, piscina e época) — são pessoas diferentes.</p></div>
    ${canW&&strong.length?`<button class="btn" id="mgAll">Fundir as ${strong.length} fortes</button>`:''}</div>
    <div class="kpis"><div class="kpi"><div class="k">Prováveis duplicados</div><div class="v">${cands.length}</div><div class="d">${strong.length} fortes · ${cands.length-strong.length} possíveis</div></div>
      <div class="kpi"><div class="k">Fusões feitas</div><div class="v">${S.merges.length}</div><div class="d">${S.mergeIgnore.length} pares marcados como pessoas diferentes</div></div></div>
    <div id="mgT" style="margin-top:10px"></div>
    ${canW?`<div class="row" style="margin-top:14px;gap:10px;align-items:flex-end;flex-wrap:wrap"><div class="fld" style="min-width:260px"><span>Fusão manual · manter</span><div id="mgA"></div></div><div class="fld" style="min-width:260px"><span>fundir neste</span><div id="mgB"></div></div><button class="btn" id="mgDo">Fundir</button></div>`:''}
    ${S.merges.length?`<details class="method" style="margin-top:12px"><summary>Fusões feitas (${S.merges.length})</summary><div id="mgDone" style="margin-top:8px"></div></details>`:''}
    <div id="mgMsg" class="small" style="margin-top:8px"></div>`;
  const t=new DataTable('mgT',[
    {k:'level',l:'Confiança',f:r=>`<span class="pill ${r.level==='forte'?'good':'gold'}">${r.level}</span>`,x:r=>r.level},
    {k:'keep',l:'Manter',f:r=>swBrief(r.keep),x:r=>r.keep.name+' ('+r.keep.bd+')',sv:r=>r.keep.nn},
    {k:'alias',l:'Fundir',f:r=>swBrief(r.alias),x:r=>r.alias.name+' ('+r.alias.bd+')',sv:r=>r.alias.nn},
    {k:'why',l:'Motivo',cls:'wrap'},
    ...(canW?[{k:'act',l:'',nosort:1,noexp:1,f:(r,ix)=>`<div class="row" style="gap:4px;flex-wrap:wrap"><button class="btn small" data-mg="${esc(r.pk)}">Fundir</button><button class="btn ghost small" data-mgs="${esc(r.pk)}" title="Trocar o nadador mantido">⇄</button><button class="btn ghost small" data-mgi="${esc(r.pk)}">Não é o mesmo</button></div>`}]:[]),
  ], cands, {page:15, empty:'Não foram encontrados prováveis duplicados.'});
  MGX={cands, t};
  const byPk=pk=>cands.find(c=>c.pk===pk);
  const done=async(msg)=>{ try{ const w=await saveMerges(); rebuildSwimmers(); refreshHeader(); vDados(root); toast(msg); $('#mgMsg').innerHTML=`<span class="pill good">Guardado</span> ${w==='shared'?'na plataforma':'neste navegador'}.`; }catch(e){ console.error(e); toast('Erro ao guardar: '+(e.message||e)); } };
  $('#mgT').addEventListener('click',async e=>{ const b=e.target.closest('button'); if(!b) return;
    if(b.dataset.mg){ const c=byPk(b.dataset.mg); S.merges.push({a:swKeyOf(c.alias), b:swKeyOf(c.keep)}); await done('Nadadores fundidos.'); }
    else if(b.dataset.mgs){ const c=byPk(b.dataset.mgs); [c.keep,c.alias]=[c.alias,c.keep]; t.render(); }
    else if(b.dataset.mgi){ const c=byPk(b.dataset.mgi); S.mergeIgnore.push(c.pk); await done('Par marcado como pessoas diferentes.'); } });
  const all=$('#mgAll'); if(all) all.onclick=async()=>{ if(all.dataset.c!=='1'){ all.dataset.c='1'; all.textContent='Confirmar fusão de '+strong.length; all.classList.add('danger'); return; } strong.forEach(c=>S.merges.push({a:swKeyOf(c.alias), b:swKeyOf(c.keep)})); await done(strong.length+' pares fundidos.'); };
  if(canW){ let A=null,B=null; swPicker('mgA',{placeholder:'Nadador a manter…',onPick:id=>A=id}); swPicker('mgB',{placeholder:'Nadador a fundir…',onPick:id=>B=id});
    $('#mgDo').onclick=async()=>{ if(A==null||B==null||A===B){ toast('Escolha dois nadadores diferentes.'); return; } const a=S.sw[A], b=S.sw[B]; if(a.g!==b.g){ toast('Os nadadores têm géneros diferentes.'); return; } S.merges.push({a:swKeyOf(b), b:swKeyOf(a)}); await done('Nadadores fundidos.'); }; }
  if(S.merges.length){ new DataTable('mgDone',[{k:'a',l:'Registo fundido',f:r=>esc(r.a.replace('|',' · '))},{k:'b',l:'Mantido',f:r=>esc(r.b.replace('|',' · '))},...(canW?[{k:'u',l:'',nosort:1,noexp:1,f:(r,ix)=>`<button class="btn ghost small" data-mgu="${S.merges.indexOf(r)}">Desfazer</button>`}]:[])], S.merges, {page:20, nosortbar:true});
    $('#mgDone').addEventListener('click',async e=>{ const b=e.target.closest('[data-mgu]'); if(!b) return; S.merges.splice(+b.dataset.mgu,1); await done('Fusão desfeita.'); }); }
}

<script>
'use strict';
/* ============================================================
   Base partilhada: quem carregou o quê, aviso de dados novos de outros utilizadores
   (plataforma) e base publicada base.json (versão GitHub / local)
   ============================================================ */
const SYNC = {pend:new Map(), eu:new Map(), cfg:new Set(), by:new Set(), started:false, base:null};
const CFG_L = {merges:'unificação de nadadores', groups:'grupos AR', standards:'tabelas de mínimos', targets:'metas PAR', relayref:'referências de estafetas', views:'vistas guardadas', qc:'qualidade dos dados', repsnap:'relatório de acompanhamento'};
const CFG_LOAD = {merges:()=>loadMerges(), groups:()=>loadGroups(), standards:()=>loadStandards(), targets:()=>loadTargets(), relayref:()=>loadRelayRef(), views:()=>loadViews(), qc:()=>loadQC(), repsnap:()=>loadRepSnap()};

async function initSharing(){
  if(CAP.db){ startSync(); return; }
  await checkPublishedBase();
}
/* ---------- plataforma: subscrição das listas de rankings e da configuração ---------- */
function startSync(){
  if(!CAP.db||SYNC.started) return; SYNC.started=true;
  const mine=d=>d&&((d.uploadedAt&&MY_WRITES.has(d.uploadedAt))||(d.updatedAt&&MY_WRITES.has(d.updatedAt)));
  let f1=true, f2=true;
  try{ CAP.db.collection('rankings').onSnapshot(snap=>{ if(f1){ f1=false; return; } let n=0;
    for(const ch of snap.docChanges()){ const key=ch.doc.id.replace(/^y/,''), d=ch.type==='removed'? null : ch.doc.data(); if(mine(d)) continue;
      const cur=S.uploads.get(key); if(d&&cur&&cur.uploadedAt===d.uploadedAt) continue; if(!d&&!cur) continue;
      SYNC.pend.set(key,d); if(d&&d.by) SYNC.by.add(d.by); n++; }
    if(n) syncBar(); }, e=>console.warn('sincronização',e)); }catch(e){ console.warn(e); }
  let f3=true;
  try{ CAP.db.collection('eurank').onSnapshot(snap=>{ if(f3){ f3=false; return; } let n=0;
    for(const ch of snap.docChanges()){ const key=ch.doc.id.replace(/^e/,''), d=ch.type==='removed'? null : ch.doc.data(); if(mine(d)) continue; const cur=S.eu.get(key); if(d&&cur&&cur.uploadedAt===d.uploadedAt) continue; if(!d&&!cur) continue; SYNC.eu.set(key,d); if(d&&d.by) SYNC.by.add(d.by); n++; }
    if(n) syncBar(); }, e=>console.warn('sincronização',e)); }catch(e){ console.warn(e); }
  try{ CAP.db.collection('config').onSnapshot(snap=>{ if(f2){ f2=false; return; } let n=0;
    for(const ch of snap.docChanges()){ const d=ch.type==='removed'? null : ch.doc.data(); if(mine(d)||!CFG_LOAD[ch.doc.id]) continue; SYNC.cfg.add(ch.doc.id); if(d&&d.by) SYNC.by.add(d.by); n++; }
    if(n) syncBar(); }, e=>console.warn('sincronização',e)); }catch(e){ console.warn(e); }
}
async function whoNames(ids){ ids=[...ids].filter(Boolean); if(!ids.length||!CAP.user) return ''; try{ const ps=await CAP.user.profiles(ids); const n=ids.map(i=>(ps[i]&&ps[i].name)||'').filter(Boolean); return n.join(', '); }catch(e){ return ''; } }
async function syncBar(){
  let bar=$('#syncBar'); if(!bar){ bar=document.createElement('div'); bar.id='syncBar'; bar.className='syncbar'; bar.setAttribute('role','status'); document.body.appendChild(bar); }
  const lists=[...SYNC.pend.entries()]; const who=await whoNames(SYNC.by);
  const parts=[]; if(lists.length) parts.push(`${lists.length} lista${lists.length>1?'s':''} de rankings (${lists.slice(0,4).map(([k,d])=>{ const [y,g,co]=k.split('_'); return y+' '+slotLabel(g,+co); }).join(', ')}${lists.length>4?'…':''})`);
  if(SYNC.eu.size) parts.push(`${SYNC.eu.size} ranking${SYNC.eu.size>1?'s':''} europeu${SYNC.eu.size>1?'s':''}`);

<script>
'use strict';
/* ============================================================
   Rankings europeus (swimrankings.net · "Ranking Melhores 100"): leitura dos PDF,
   armazenamento por época e carregamento no separador Dados
   ============================================================ */
S.eu = new Map(); let EUV = 0;            // listas europeias; EUV muda a cada alteração (invalida cálculos)
const EU_CATS = [['abs','Absolutos'],['jun','Juniores']];
const EU_SLOTS = [['M',1],['M',0],['F',1],['F',0]];
const euKey = (y,cat,g,co) => `${y}_${cat}_${g}_${co}`;
/* lista parcial: o intervalo de datas do PDF termina antes do fim habitual da época (PL: 15 set; PC: 31 jul) */
const euPartial = p => !!p && p.d1!=null && p.d1 < Math.round((Date.UTC(p.season, p.co?6:8, p.co?31:15)-EPOCH)/86400000);
const EU_MON = {jan:0,fev:1,feb:1,mar:2,abr:3,apr:3,mai:4,may:4,jun:5,jul:6,ago:7,aug:7,set:8,sep:8,out:9,oct:9,nov:10,dez:11,dec:11};
const EU_STK = {livres:'L',freestyle:'L',costas:'C',backstroke:'C','bruços':'B',breaststroke:'B',mariposa:'M',butterfly:'M',estilos:'E',medley:'E'};
const EU_EVRE = /^(\d{2,4})m\s+(Livres|Costas|Bruços|Mariposa|Estilos|Freestyle|Backstroke|Breaststroke|Butterfly|Medley)$/i;

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); }catch(e){ rej(e); } };
    s.onerror=()=>rej(new Error('Não foi possível carregar o leitor de PDF (é necessária ligação à internet).')); document.head.appendChild(s); });
}
/* lê um PDF "Ranking Melhores 100" e devolve a lista por prova: [nome, país, tempo (centésimas), dia] */
async function parseEuPdf(file){
  const lib=await loadPdfJs(); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
  const pages=[]; for(let p=1;p<=doc.numPages;p++){ const tc=await (await doc.getPage(p)).getTextContent(); pages.push(tc.items.map(it=>({s:it.str.trim(), x:it.transform[4], y:it.transform[5]})).filter(it=>it.s)); }
  const P1=pages[0]||[]; const evY=Math.max(...P1.filter(it=>EU_EVRE.test(it.s)).map(it=>it.y), -1); if(evY<0) throw new Error('Não parece um ranking do swimrankings (sem provas reconhecidas).');
  const head=P1.filter(it=>it.y>evY+1).sort((a,b)=>b.y-a.y||a.x-b.x).map(it=>it.s), H=head.join(' | ');
  const co=/longa|long course|\(50 ?m\)/i.test(H)? 0 : /curta|short course|\(25 ?m\)/i.test(H)? 1 : null;
  const g=/\bMasc|\bMen\b|\bMale/i.test(H)? 'M' : /Femin|Women|Female/i.test(H)? 'F' : null;
  const sm=H.match(/(?:Época|Season)\s+(\d{4})/i); const season=sm? +sm[1] : null;
  const rg=head.find(t=>/^\d{1,2} \S{3}( \d{4})? - \d{1,2} \S{3} \d{4}$/.test(t))||'';
  const region=head[0]||''; const ageT=head.filter(t=>t!==rg&&!/Época|Season|Ranking|Piscina|Course|^Europe$/i.test(t)).map(t=>{ const m=t.match(/(\d{1,2})\s*[-–]\s*(\d{1,2})|(\d{1,2})\s*(anos|years)|J[uú]nior/i); return m? m[0] : null; }).filter(Boolean)[0]||'';
  if(co==null||!g||!season) throw new Error('Não foi possível identificar o género, a piscina ou a época no cabeçalho do PDF.');
  // anos das datas: a época pode atravessar dois anos civis (piscina curta: agosto a julho)
  const rm=rg.match(/^(\d{1,2}) (\S{3})( (\d{4}))? - (\d{1,2}) (\S{3}) (\d{4})$/); const y1=rm? +rm[7] : season, y0=rm&&rm[4]? +rm[4] : y1, m0=rm? (EU_MON[rm[2].toLowerCase()]??0) : 0;
  const ev={}; let n=0;
  for(const items of pages){
    const hdr=items.filter(it=>EU_EVRE.test(it.s)); if(!hdr.length) continue;
    const xs=[]; hdr.map(h=>h.x).sort((a,b)=>a-b).forEach(x=>{ if(!xs.length||x-xs[xs.length-1]>20) xs.push(x); });
    const topY=Math.max(...hdr.map(h=>h.y));
    const cols=xs.map(()=>new Map()); for(const it of items){ if(it.y>topY+1||it.y<45) continue; let k=0; while(k+1<xs.length&&it.x>=xs[k+1]-4) k++; const yk=Math.round(it.y*2)/2; const m=cols[k]; if(!m.has(yk)) m.set(yk,[]); m.get(yk).push(it); }
    for(const m of cols){ let cur=null;
      for(const yk of [...m.keys()].sort((a,b)=>b-a)){ const line=m.get(yk).sort((a,b)=>a.x-b.x).map(it=>it.s).join(' ').replace(/\s+/g,' ').trim();
        if(/^(\d{2,4}m|4 ?x ?\d+ ?m)\b.*(Livres|Costas|Bruços|Mariposa|Estilos|Freestyle|Backstroke|Breaststroke|Butterfly|Medley)\b.*$/i.test(line)&&!EU_EVRE.test(line)){ cur=null; continue; }   // estafetas e listas "Lap": ignoradas
        const h=line.match(EU_EVRE); if(h){ const code=h[1]+(EU_STK[h[2].toLowerCase()]||'?'); cur=S.ev.includes(code)? code : null; if(cur&&!ev[cur]) ev[cur]=[]; continue; }
        if(!cur) continue; const e=line.match(/^(.*?),?\s*([A-Z]{3})\s+(?:(\d{1,2}):)?(\d{1,2}\.\d{2})\s+(\d{1,2})\s+(\S{3})\.?$/); if(!e) continue;
        const mo=EU_MON[e[6].toLowerCase()]; if(mo==null) continue; const yr=(y0<y1&&mo>=m0)? y0 : y1;
        ev[cur].push([e[1].replace(/,\s*$/,'').trim(), e[2], Math.round(((e[3]?+e[3]*60:0)+parseFloat(e[4]))*100), Math.round((Date.UTC(yr,mo,+e[5])-EPOCH)/86400000)]); n++; } } }
  for(const k in ev) ev[k].sort((a,b)=>a[2]-b[2]);
  if(!n) throw new Error('Nenhuma marca encontrada no PDF.');
  const d1=rm? Math.round((Date.UTC(y1,EU_MON[rm[6].toLowerCase()]??11,+rm[5])-EPOCH)/86400000) : Math.round((Date.UTC(season,11,31)-EPOCH)/86400000), d0=rm? Math.round((Date.UTC(y0,m0,+rm[1])-EPOCH)/86400000) : Math.round((Date.UTC(season,0,1)-EPOCH)/86400000);
  return {kind:'eu', v:1, season, g, co, ages:ageT, region, range:rg, d0, d1, file:file.name, ev, n};
}
/* ---------- armazenamento ---------- */
async function loadEu(){
  S.eu=new Map();
  if(CAP.db){ try{ const snap=await CAP.db.collection('eurank').get(); for(const d of snap.docs){ const m=d.data(); if(!m||!m.asset) continue; try{ const r=await fetch('/_blob/'+m.asset); if(!r.ok) continue; const p=await r.json(); p.uploadedAt=m.uploadedAt||p.uploadedAt; p.by=m.by||null; S.eu.set(euKey(p.season,p.cat,p.g,p.co),p); }catch(e){ console.warn('eu',e); } } }catch(e){ console.warn('eu',e); } }
  else for(const p of await IDB.all('eu')) S.eu.set(euKey(p.season,p.cat,p.g,p.co),p);
  EUV++;
}
async function saveEu(p){
  const key=euKey(p.season,p.cat,p.g,p.co); p.uploadedAt=p.uploadedAt||new Date().toISOString();
  if(CAP.db&&CAP.assets){ const ref=CAP.db.doc('eurank/e'+key); let old=null; try{ const s=await ref.get(); if(s.exists) old=s.data().asset; }catch(e){}
    const a=await CAP.assets.upload(new Blob([JSON.stringify(p)],{type:'application/json'}),{type:'application/json'}); MY_WRITES.add(p.uploadedAt); p.by=CAP.me||null;
    await ref.set({season:p.season, cat:p.cat, g:p.g, co:p.co, asset:a.id, file:p.file, uploadedAt:p.uploadedAt, n:p.n, by:p.by}); if(old&&old!==a.id){ try{ await CAP.assets.delete(old); }catch(e){} } }
  else if(!(await IDB.put(p,key,'eu'))) throw new Error('Não foi possível guardar neste navegador.');
  S.eu.set(key,p); EUV++;
}
async function removeEu(key){
  if(CAP.db){ const ref=CAP.db.doc('eurank/e'+key); const s=await ref.get(); const a=s.exists? s.data().asset : null; await ref.delete(); if(a&&CAP.assets){ try{ await CAP.assets.delete(a); }catch(e){} } }
  else await IDB.del(key,'eu');
  S.eu.delete(key); EUV++;
}
/* ---------- cartão no separador Dados ---------- */
const EU_UI = {extra:new Set()};
function euCardHTML(canW){
  const ys=[...new Set([...S.years, ...[...S.eu.values()].map(p=>p.season), ...EU_UI.extra])].sort((a,b)=>b-a);
  const cell=(y,cat,g,co)=>{ const k=euKey(y,cat,g,co), p=S.eu.get(k), id='eu_'+k;
    if(p) return `<td><div class="slot ok"><div><b>${fN(p.n)}</b> marcas${p.ages?` · ${esc(p.ages)}`:''}</div><small title="${esc(p.file)}">${esc(p.range||'')}${euPartial(p)?' · <b>parcial</b>':''}</small>${canW?` <button class="lnk small" data-eurm="${k}" title="Remover">remover</button>`:''}</div></td>`;
    return `<td>${canW?`<label class="slot empty" for="${id}">+</label><input type="file" id="${id}" data-euslot="${k}" accept=".pdf,application/pdf" hidden>`:'<span class="muted small">—</span>'}</td>`; };
  const nOf=(y,cat)=>EU_SLOTS.filter(([g,co])=>S.eu.has(euKey(y,cat,g,co))).length;
  const rows=ys.map(y=>`<tr><td><b>${y}</b><br><span class="small muted">${nOf(y,'abs')}/4 abs. · ${nOf(y,'jun')}/4 jun.</span>${canW?`<div class="row" style="gap:4px;margin-top:4px"><label class="btn sm" for="euA_${y}">Absolutos</label><input type="file" id="euA_${y}" data-euyear="${y}" data-eucat="abs" multiple accept=".pdf,application/pdf" hidden><label class="btn sm" for="euJ_${y}">Juniores</label><input type="file" id="euJ_${y}" data-euyear="${y}" data-eucat="jun" multiple accept=".pdf,application/pdf" hidden></div>`:''}</td>${EU_CATS.map(([cat])=>EU_SLOTS.map(([g,co])=>cell(y,cat,g,co)).join('')).join('')}</tr>`).join('');
  return `<div class="card" id="euCard"><div class="card-h"><div><h3>Rankings europeus</h3><p class="note">PDF “Ranking Melhores 100” do swimrankings.net (Europa), uma época de cada vez: em cada linha, “Absolutos” recebe os 4 ficheiros da época (masculinos e femininos, piscina curta e longa) e “Juniores” os 4 ficheiros do escalão júnior. Género, piscina e época são lidos do próprio PDF. Em piscina curta, a época europeia vai de agosto a julho.</p></div>${canW?`<div class="row"><label class="fld"><span>Acrescentar época</span><input type="number" id="euNewY" min="1990" max="${new Date().getFullYear()+1}" value="${ys.length?Math.min(...ys)-1:new Date().getFullYear()}"></label><button class="btn" id="euAddY">Acrescentar</button></div>`:''}</div>
    <div class="tbl-wrap"><table class="t slots-t eu-t"><thead><tr><th rowspan="2">Época</th><th colspan="4" class="c">Absolutos</th><th colspan="4" class="c">Juniores</th></tr><tr>${EU_CATS.map(()=>EU_SLOTS.map(([g,co])=>`<th>${esc(slotLabel(g,co))}</th>`).join('')).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="9" class="muted">Ainda sem rankings europeus.</td></tr>`}</tbody></table></div>
    <div id="euMsg" class="small" style="margin-top:10px;display:grid;gap:4px"></div></div>`;
}
function bindEuCard(root){
  const card=$('#euCard',root); if(!card) return; const msg=$('#euMsg',root);
  const redraw=()=>{ card.outerHTML=euCardHTML(dataMode()!=='reader'); bindEuCard(root); };
  const handle=async(files, year, cat, slotKey0)=>{ msg.innerHTML=''; let ok=0;
    for(const f of files){ const ln=logLine(msg,`${esc(f.name)}: a ler…`);
      try{ const p=await parseEuPdf(f); let c=cat; if(p.ages&&c==='abs') c='jun'; p.cat=c;
        if(slotKey0){ const [y,ct,g,co]=slotKey0.split('_'); if(+y!==p.season||g!==p.g||+co!==p.co){ ln.innerHTML=`<span><span class="pill bad">Não carregado</span> ${esc(f.name)}: o PDF é de ${p.season} · ${esc(slotLabel(p.g,p.co))}, não da célula escolhida.</span>`; continue; } p.cat=ct; }
        if(year&&p.season!==+year){ ln.innerHTML=`<span><span class="pill bad">Não carregado</span> ${esc(f.name)}: é da época ${p.season}, não de ${year}. Carregue-o na linha ${p.season}.</span>`; continue; }
        if(p.region&&!/europ/i.test(p.region)) ln.innerHTML+=` <span class="pill gold">Região: ${esc(p.region)}</span>`;
        await saveEu(p); ok++; ln.innerHTML=`<span><span class="pill good">${p.season}</span> ${p.cat==='jun'?'Juniores':'Absolutos'} · ${esc(slotLabel(p.g,p.co))} · ${fN(p.n)} marcas em ${Object.keys(p.ev).length} provas${p.ages?' · idades '+esc(p.ages):''}</span>`; }
      catch(e){ console.error(e); ln.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(f.name)}: ${esc(e.message||String(e))}</span>`; } }
    const keep=msg.innerHTML; if(ok){ redraw(); $('#euMsg',root).innerHTML=keep; toast(ok+' ranking'+(ok>1?'s':'')+' europeu'+(ok>1?'s':'')+' carregado'+(ok>1?'s':'')+'.'); } };
  $$('input[data-euyear]',card).forEach(i=>i.onchange=()=>{ if(i.files.length) handle([...i.files], i.dataset.euyear, i.dataset.eucat); });
  $$('input[data-euslot]',card).forEach(i=>i.onchange=()=>{ if(i.files[0]){ const [y,cat]=i.dataset.euslot.split('_'); handle([i.files[0]], y, cat, i.dataset.euslot); } });
  $$('[data-eurm]',card).forEach(b=>b.onclick=async()=>{ b.disabled=true; try{ await removeEu(b.dataset.eurm); redraw(); toast('Ranking europeu removido.'); }catch(e){ toast('Erro: '+(e.message||e)); b.disabled=false; } });
  const ad=$('#euAddY',card); if(ad) ad.onclick=()=>{ const y=+$('#euNewY',card).value; if(y>1990){ EU_UI.extra.add(y); redraw(); } };
}

<script>

function stEval(d, cy, target){
  const Lc=lastClosed(), base=cy.y0-1, ys=[]; for(let y=base;y<=Math.max(Lc,lastYear());y++) if(S.years.includes(y)||(d.id.startsWith('eu')&&S.eu&&[...S.eu.values()].some(p=>p.season===y))) ys.push(y);

  let vb=d.f(base), vbY=base; if(vb==null){ const k=ser.findIndex((v,j)=>v!=null&&ys[j]>=base); if(k>=0){ vb=ser[k]; vbY=ys[k]; } }

  let tg=target, sug=false; if((tg==null||tg==='')&&vb!=null){ sug=true; tg= d.pct? vb+5 : /^lv|jov|prof/.test(d.id)? vb+10 : Math.max(vb+1, Math.ceil(vb*1.25)); }

  if(pts.length>=2){ const mx=mean(pts.map(o=>o.y)), my=mean(pts.map(o=>o.v)); let a=0,b=0; pts.forEach(o=>{ a+=(o.y-mx)*(o.v-my); b+=(o.y-mx)**2; }); const sl=b? a/b : 0; proj=my+sl*(cy.y1-mx); } else if(cur) proj=cur.v;

  for(const a of best.values()){ a.sort((x,y)=>R.tm[x]-R.tm[y]); a.slice(0,3).forEach(i=>top.add(R.sw[i])); }

async function stReportModel(onStep){
  const main=$('#main'), keep=document.createDocumentFragment(); while(main.firstChild) keep.appendChild(main.firstChild);
  const host=document.createElement('div'); host.className='view'; host.id='view'; host.style.cssText='position:absolute;left:-20000px;top:0;width:1400px'; main.appendChild(host);

    // 1. ciclo

    // 2. Europa e prioridades
    const eu={}, pr={};
    if(hasEU) for(const g of ['0','1']){ eu[g]=await run('Europa '+g, ()=>{ Object.assign(EU,{sec:'pos', cat:'abs', g, co:'0', y:null}); euContent(); return EUX; }); pr[g]=await run('Prioridades '+g, ()=>{ Object.assign(EU,{sec:'prior', cat:'abs', g, co:'0', y:null}); euContent(); return EUX; }); }
    // 3. sucessão
    const su={}; for(const g of ['0','1']) su[g]=await run('Sucessão '+g, ()=>{ Object.assign(ST,{sec:'suc', g}); stSuc($('#stC')); return STX; });

    const pg=await run('Programas', ()=>{ ST.sec='prog'; stProg($('#stC')); return STX; });
    const ce=hasEU? await run('Cenários', ()=>{ Object.assign(ST,{sec:'cen', cG:''}); stCen($('#stC')); return STX; }) : null;
    // 5. abandono (cálculo direto)
    const ab=await run('Abandono', ()=>{ const X=abList(); if(!X) return null; const Lt=X.list.filter(r=>r.nat==='POR'&&r.age>=13&&r.age<=19&&r.pct>=75&&r.risk>=40&&!r.seen).sort((a,b)=>b.risk-a.risk); return {X, Lt}; });
    const q=qcCounts();
    // ---- recomendações ----
    if(ciclo&&ciclo.E){ const bad=ciclo.E.filter(e=>e.st.k==='bad'), risk=ciclo.E.filter(e=>e.st.k==='gold'); if(bad.length) rec.push(`Metas do ciclo fora do caminho (${bad.map(e=>e.d.l).join('; ')}): rever as ações associadas ou ajustar as metas.${ciclo.E.some(e=>e.sug)?' Algumas metas são sugestões automáticas e devem ser confirmadas.':''}`); if(risk.length) rec.push(`Metas em risco: ${risk.map(e=>e.d.l).join('; ')} — acompanhamento trimestral.`); }
    for(const g of ['0','1']){ const P=pr[g]; if(!P||!P.rows) continue; const inv=P.rows.filter(r=>r.cl==='inv'), man=P.rows.filter(r=>r.cl==='man'), dev=P.rows.filter(r=>r.cl==='dev');
      if(inv.length) rec.push(`${G_L[+g]}: concentrar recursos de alto rendimento em ${inv.map(r=>evLabel(r.e)).join(', ')} (perto da final europeia de ${P.T} e com base de apoio).`);
      if(man.length) rec.push(`${G_L[+g]}: reduzir a dependência de um só nadador em ${man.map(r=>evLabel(r.e)+' ('+(r.best?niceName(S.sw[r.best.sw].name):'')+')').join(', ')} — reforçar a base nessas provas.`);
      if(dev.length) rec.push(`${G_L[+g]}: desenvolver ${dev.map(r=>evLabel(r.e)).join(', ')} (base de nadadores a aproximar-se do nível europeu).`); }
    for(const g of ['0','1']){ const U=su[g]; if(!U||!U.rows) continue; const hi=U.rows.filter(r=>r.risk[0]==='Alto'); if(hi.length) rec.push(`Sucessão ${G_L[+g].toLowerCase()} até ${U.H}: risco alto em ${hi.length} provas (${hi.slice(0,6).map(r=>evShort(r.e)).join(', ')}${hi.length>6?'…':''}). Identificar e apoiar já os jovens dessas provas.`); }
    if(te&&te.rows){ const low=te.rows.filter(r=>r.idx!=null&&r.idx<=85&&r.pop>=400000); if(low.length) rec.push(`Território: ${low.map(r=>r.reg+' (índice '+Math.round(r.idx)+')').join(', ')} têm população significativa e rendem abaixo da média em talentos — prioridade para apoio técnico regional e deteção de talento.`); }
    if(ab&&ab.Lt.length) rec.push(`Retenção: ${ab.Lt.length} talentos (13–19 anos, quartil superior) com risco de abandono de 40% ou mais${ab.X.cur>ab.X.L?' e ainda sem marcas em '+ab.X.cur:''} — contacto com clubes e treinadores.`);
    if(pg&&pg.prog){ const G=pg.prog.groups.filter(x=>x.A.eff!=null); G.forEach(x=>rec.push(`${x.g.name}: efeito de ${sg(Math.round(x.A.eff))} pts por época face a nadadores semelhantes (antes do início do apoio: ${x.B.eff==null?'—':sg(Math.round(x.B.eff))}) — ${x.A.eff>10?'manter o programa':x.A.eff>0?'efeito modesto: rever o acompanhamento':'sem efeito visível: rever critérios e acompanhamento'}.`)); }
    if(ce&&ce.cen){ const c=ce.cen; rec.push(`Investimento: com o mesmo número de apoios, o cenário “${c.best[0].toLowerCase()}” é o que mais aumenta as presenças esperadas em ${c.lv} europeias de ${c.T} (${f1(c.best[1])} vs ${f1(c.E0)} sem apoio adicional); prioridade: ${c.best[2].slice(0,5).map(o=>niceName(S.sw[o.sw].name)).join(', ')}.`); }
    if(q.hi) rec.push(`Qualidade dos dados: ${q.hi} sinais de prioridade alta por rever antes de decisões nominais.`);

    const sec=async(title, X, intro)=>{ if(!X||!X.model) return; const m=await X.model(); blocks.push({t:'h',text:title}); if(intro) blocks.push({t:'p',text:intro}); blocks.push(...m.blocks.filter(b=>b.t!=='src')); };
    blocks.push({t:'h',text:'Sumário executivo e recomendações'});
    blocks.push({t:'p',text:'Recomendações\n'+rec.map(r=>'• '+r).join('\n')});
    if(ciclo&&ciclo.E) blocks.push({t:'kpis',items:ciclo.E.slice(0,8).map(e=>[e.d.l, e.cur? e.d.fmt(e.cur.v) : '—'])});
    await sec('1. Painel do ciclo', ciclo);
    if(hasEU){ await sec('2. Portugal na Europa · masculinos', eu['0']); await sec('2. Portugal na Europa · femininos', eu['1']); await sec('3. Provas prioritárias · masculinos', pr['0']); await sec('3. Provas prioritárias · femininos', pr['1']); }
    else blocks.push({t:'h',text:'2–3. Portugal na Europa e provas prioritárias'},{t:'p',text:'Sem rankings europeus carregados: secções omitidas.'});
    await sec('4. Plano de sucessão · masculinos', su['0']); await sec('4. Plano de sucessão · femininos', su['1']);
    if(ab&&ab.X){ blocks.push({t:'h',text:'5. Talento e risco de abandono'},{t:'p',text:`${ab.Lt.length} talentos (13–19 anos, quartil superior para a idade em ${ab.X.L}) com risco estimado de 40% ou mais.`},{t:'table',sheet:'Risco de abandono',small:true,head:['Nadador','Id.','Clube','Pts','Nível','Risco','Fatores'],rows:ab.Lt.slice(0,25).map(r=>[r.name,r.age,r.club,r.pt,'P'+Math.round(r.pct),Math.round(r.risk)+'%',abFactors(ab.X.M,r.id,r.m,ab.X.L,r.x).join(' · ')]),align:['l','r','l','r','r','r','l']}); }
    await sec('6. Território', te); await sec('7. Programas de apoio', pg); if(ce) await sec('8. Cenários de investimento', ce);
    blocks.push({t:'h',text:'Notas metodológicas'},{t:'src',text:'Fontes: rankings nacionais absolutos FPN e rankings europeus swimrankings.net (100 melhores). Marcas de acesso europeias estimadas (8.º e 16.º, 2 por país) e projetadas pela tendência das épocas carregadas. Probabilidades por simulação com nadadores semelhantes (fiabilidade testada em Guia de leitura › Fiabilidade dos modelos). Risco de abandono: modelo logístico treinado nas épocas passadas. Programas: comparação com nadadores semelhantes não apoiados. População: estimativas PORDATA/INE. Documento de apoio à decisão.'});
  } finally { host.remove(); main.appendChild(keep); Object.assign(EU,sEU); Object.assign(ST,sST); }
  return {title:'Relatório estratégico — natação pura · '+MONTHS[new Date().getMonth()]+' '+new Date().getFullYear(), subtitle:'Direção Técnica Nacional · ciclo '+stCycle().name+' · dados até '+fD(Math.max(...Object.values(S.yinfo).map(o=>o.maxDt))), filename:'Relatorio_estrategico_'+todayISO(), orientation:'l', blocks};
}

/* raias do ciclo: cada meta é uma piscina — partida (valor no início do ciclo) à parede de chegada (meta); o nadador marca o valor atual */
function inLanes(card){
  const cy=stCycle(), lib=stIndicators();
  const E=cy.items.map(it=>{ const d=lib.find(x=>x.id===it.id); return d? stEval(d,cy,it.target==null||it.target===''?null:+it.target) : null; }).filter(e=>e&&e.cur&&e.tg!=null&&e.vb!=null);
  if(!E.length){ card.remove(); return; }
  const lane=e=>{ const p=e.tg===e.vb? 100 : Math.max(0,Math.min(100,(e.cur.v-e.vb)/(e.tg-e.vb)*100)), k=e.st.k==='na'?'':e.st.k, x=4+p*0.92;
    return `<div class="ln ${k}"><div class="ln-l"><b>${esc(e.d.l)}</b><span>${esc(e.st.l)}${e.sug?' · meta sugerida':''}</span></div>
      <div class="ln-t" role="img" aria-label="${esc(e.d.l)}: ${esc(e.d.fmt(e.cur.v))} em ${e.cur.y}; partida ${esc(e.d.fmt(e.vb))}, meta ${esc(e.d.fmt(e.tg))}"><i class="ln-w s"></i><i class="ln-w e"></i><i class="ln-wake" style="width:calc(${x}% - 6px)"></i><i class="ln-sw" style="left:${x}%"></i><span class="ln-v" style="left:${Math.min(92,Math.max(8,x))}%">${esc(e.d.fmt(e.cur.v))} <span class="muted" style="font-weight:500">${e.cur.y}</span></span><span class="ln-a">${esc(e.d.fmt(e.vb))} (${e.base})</span><span class="ln-b">meta ${esc(e.d.fmt(e.tg))}</span></div></div>`; };
  const cnt=k=>E.filter(e=>e.st.k===k).length;
  card.innerHTML=`<div class="card-h"><div><h3>Ciclo olímpico em raias</h3><p class="note">${esc(cy.name)} (${cy.y0}–${cy.y1}): cada meta é uma raia, da partida (valor antes do ciclo) à parede de chegada (meta). ${cnt('good')} no caminho ou atingidas, ${cnt('gold')} em risco, ${cnt('bad')} fora do caminho.</p></div><button class="btn sm" id="inLnGo">Abrir painel do ciclo</button></div>
    <div class="lanes">${E.map(lane).join('')}</div>
    <div class="ln-leg"><span><i style="background:var(--good)"></i>No caminho ou meta atingida</span><span><i style="background:var(--gold)"></i>Em risco</span><span><i style="background:var(--bad)"></i>Fora do caminho</span><span><i style="background:var(--muted)"></i>Sem comparação</span></div>`;
  $('#inLnGo',card).onclick=goSec('estrategia',()=>{ ST.sec='ciclo'; });
}

function openGoTo(){
  if($('#goModal')) return; const idx=goToIndex();
  const bg=document.createElement('div'); bg.className='modal-bg'; bg.id='goModal';
  bg.innerHTML=`<div class="modal card go-m" role="dialog" aria-modal="true" aria-label="Ir para"><input id="goQ" type="search" placeholder="Nadador, clube, associação, prova ou análise…" autocomplete="off"><div id="goR" class="go-r"></div><p class="note" style="margin-top:6px">↑ ↓ para escolher · Enter para abrir · Esc para fechar</p></div>`;
  document.body.appendChild(bg); const q=$('#goQ'), R=$('#goR'); let items=[], cur=0;
  const close=()=>bg.remove();
  const render=()=>{ const v=q.value.trim(), t=norm(v).split(/\s+/).filter(Boolean); items=[];
    if(t.length&&hasData()){
      searchSwimmers(v,6).forEach(s=>items.push({grp:'Nadadores', l:niceName(s.name), d:(s.g==='F'?'F':'M')+' · '+(lastYear()-s.by)+' anos · '+(S.cl[s.club]?S.cl[s.club].code:''), fn:()=>{ FS.id=null; go('n'+s.id); }}));
      S.cl.filter(c=>c.code&&c.code!=='?'&&t.every(w=>norm(c.name+' '+c.code).includes(w))).slice(0,5).forEach(c=>items.push({grp:'Clubes', l:c.name, d:c.code+(c.reg?' · '+c.reg:''), fn:goSec('entidades',()=>{ CE.type='club'; CE.club=c.id; })}));
      S.regions.filter(r=>t.every(w=>norm(r+' '+regLabel(r)).includes(w))).slice(0,3).forEach(r=>items.push({grp:'Associações', l:regLabel(r), d:r, fn:goSec('entidades',()=>{ CE.type='reg'; CE.reg=r; })}));
      S.ev.forEach((c,e)=>{ const lab=evLabel(e); if(t.every(w=>norm(lab+' '+c+' ranking').includes(w))) items.push({grp:'Rankings', l:'Ranking · '+lab, d:'piscina longa e curta', fn:goSec('rankings',()=>{ K.ev=String(e); })}); });
    }
    const st=goToIndex().filter(o=>!t.length||t.every(w=>o.k.includes(w))).slice(0, t.length? 8 : 14); items=items.slice(0,18).concat(st.map(o=>({grp:o.grp, l:o.l, d:'', fn:o.fn})));
    cur=Math.min(cur,Math.max(0,items.length-1));
    let g=''; R.innerHTML=items.map((it,k)=>{ const h= it.grp!==g? `<div class="go-g">${esc(it.grp)}</div>` : ''; g=it.grp; return h+`<button type="button" class="go-i${k===cur?' on':''}" data-gi="${k}"><b>${esc(it.l)}</b>${it.d?`<span>${esc(it.d)}</span>`:''}</button>`; }).join('')||'<p class="note">Sem resultados.</p>'; };
  const pick=k=>{ const it=items[k]; if(!it) return; close(); it.fn(); };
  q.oninput=()=>{ cur=0; render(); }; R.onclick=e=>{ const b=e.target.closest('[data-gi]'); if(b) pick(+b.dataset.gi); };
  bg.addEventListener('click',e=>{ if(e.target===bg) close(); });
  q.onkeydown=e=>{ if(e.key==='Escape'){ close(); } else if(e.key==='ArrowDown'){ cur=Math.min(items.length-1,cur+1); render(); e.preventDefault(); } else if(e.key==='ArrowUp'){ cur=Math.max(0,cur-1); render(); e.preventDefault(); } else if(e.key==='Enter'){ pick(cur); } };
  render(); setTimeout(()=>q.focus(),0);
}

let TOURI=-1;
async function startTour(){ const m=$('#goModal'); if(m) m.remove(); TOURI=0; await tourShow(); }
function tourEnd(){ TOURI=-1; ['tourHL','tourPop','tourBg'].forEach(id=>{ const e=$('#'+id); if(e) e.remove(); }); lsSet('tour','1'); window.removeEventListener('resize',tourPlace); }
async function tourShow(){
  const s=TOUR[TOURI]; if(!s) return tourEnd();
  if(s.go){ try{ s.go(); }catch(e){} }
  let el=null; for(let k=0;k<40&&!el;k++){ await new Promise(r=>setTimeout(r,150)); el=$(s.sel); if(el&&!el.offsetParent&&el.id!=='areas') el=null; }
  if(TOURI<0) return;
  let bg=$('#tourBg'); if(!bg){ bg=document.createElement('div'); bg.id='tourBg'; document.body.appendChild(bg); }
  let hl=$('#tourHL'); if(!hl){ hl=document.createElement('div'); hl.id='tourHL'; document.body.appendChild(hl); }
  let pop=$('#tourPop'); if(!pop){ pop=document.createElement('div'); pop.id='tourPop'; pop.setAttribute('role','dialog'); document.body.appendChild(pop); }

  $('#tpX').onclick=tourEnd; $('#tpN').onclick=()=>{ TOURI++; tourShow(); }; const b=$('#tpB'); if(b) b.onclick=()=>{ TOURI--; tourShow(); };
  hl.dataset.sel=el? s.sel : ''; if(el){ const r0=el.getBoundingClientRect(); if(el.id==='areas'||el.id==='goBtn'){ window.scrollTo({top:0, behavior:'instant'}); const ar=$('#areas'); if(ar) ar.scrollLeft= el.id==='goBtn'? ar.scrollWidth : 0; } else if(r0.height>innerHeight*0.45) window.scrollBy({top:r0.top-Math.round(innerHeight*0.45), behavior:'instant'}); else el.scrollIntoView({block:'center', behavior:'instant'}); }
  tourPlace(); window.removeEventListener('resize',tourPlace); window.addEventListener('resize',tourPlace);
}
function tourPlace(){
  const hl=$('#tourHL'), pop=$('#tourPop'); if(!hl||!pop) return; const el=hl.dataset.sel? $(hl.dataset.sel) : null, W=innerWidth, H=innerHeight;
  if(!el){ hl.style.display='none'; pop.style.left=Math.max(16,(W-pop.offsetWidth)/2)+'px'; pop.style.top=Math.max(16,(H-pop.offsetHeight)/2)+'px'; return; }
  const r=el.getBoundingClientRect(), pad=6; hl.style.display='block'; Object.assign(hl.style,{left:(r.left-pad)+'px', top:(r.top-pad)+'px', width:(r.width+2*pad)+'px', height:(Math.max(0,Math.min(r.bottom,H-pad)-r.top)+2*pad)+'px'});
  const pw=pop.offsetWidth, ph=pop.offsetHeight; let top=r.bottom+14; if(top+ph>H-10) top=Math.max(10, r.top-ph-14); if(top<10) top=Math.min(H-ph-10, r.top+20);
  pop.style.left=Math.min(Math.max(12, r.left), W-pw-12)+'px'; pop.style.top=top+'px';
}
document.addEventListener('keydown',e=>{ if(TOURI<0) return; if(e.key==='Escape') tourEnd(); else if(e.key==='ArrowRight'){ TOURI++; tourShow(); } else if(e.key==='ArrowLeft'&&TOURI>0){ TOURI--; tourShow(); } });

<script>
'use strict';
/* ============================================================

const VIEWS = {inicio:vInicio, estrategia:vEstrategia, europa:vEuropa, abandono:vAbandono, qualidade:vQualidade, painel:vPainel, evolucao:vEvolucao, rankings:vRankings, nadadores:vNadadores, comparar:vComparar, analises:vAnalises, alertas:vAlertas, minimos:vMinimos, grupos:vGrupos, convocatorias:vConvocatorias, estafetas:vEstafetas, talento:vTalento, entidades:vEntidades, metas:vMetas, guia:vGuia, resumo:vResumo, quadrante:vQuadrante, declaracoes:vDeclaracoes, dados:vDados};
let READY=false, LOADING_UP=true;
function go(v){ if(location.hash.slice(1)===v) route(); else location.hash=v; }
function route(){
  if(!READY) return;
  const h=location.hash.slice(1)||'inicio', main=$('#main');
  let tab=h, fn=VIEWS[h];
  if(/^n\d+$/.test(h)){ tab='nadadores'; fn=root=>vFicha(root, +h.slice(1)); }
  if(!fn){ tab='inicio'; fn=vInicio; }
  if(h==='sair-consulta'){ setScope(null); location.hash=''; return; }
  if(S.scope){ scopeApplyState(); if(!CONSULT_TABS.has(tab)){ tab='entidades'; fn=VIEWS.entidades; } }
  if(!hasData() && tab!=='dados' && tab!=='minimos'){ const t=tab; fn=root=>{ root.innerHTML = LOADING_UP ? `<div class="loading"><div>A carregar os rankings guardados…</div><div class="bar"><i></i></div></div>` : `<div class="card empty" style="padding:40px"><h3 style="margin-bottom:8px">Ainda não há rankings carregados</h3><p class="muted">Carregue, para cada época, os rankings masculinos e femininos de piscina curta e de piscina longa.</p><button class="btn primary" onclick="go('dados')" style="margin-top:12px">Ir para Dados</button></div>`; }; }
  $$('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.v===tab)));
  $$('.has-chart').forEach(el=>{ if(el.__chart){ el.__chart.destroy(); el.__chart=null; } });
  main.innerHTML='<div class="view" id="view"></div>';
  try{ fn($('#view')); }catch(e){ console.error(e); $('#view').innerHTML=`<div class="card empty">Ocorreu um erro ao mostrar esta vista: ${esc(e.message)}</div>`; }
  window.scrollTo({top:0});
}
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t) go(t.dataset.v); });
window.addEventListener('hashchange', route);
(async function init(){
  try{
    const capP = capInit();
    await loadBase();
    assemble();
    READY=true; applyScopeUI();
    $('#hdrSub').textContent = 'A carregar… · FPN · Direção Técnica Nacional';
    route();
    await capP;
    await loadUploads();
    await loadStandards();
    await loadGroups();
    await Promise.all([loadMerges(), loadTargets(), loadRelayRef(), loadViews(), loadRepSnap(), loadQC(), loadEu(), loadStrategy(), loadConvDec()]);
    LOADING_UP=false;
    rebuildSwimmers(); refreshHeader();
    try{ await initSharing(); }catch(e){ console.warn('partilha',e); }
    if(!hasData() && !location.hash.slice(1)) location.hash='dados'; else route();
  }catch(e){
    console.error(e); LOADING_UP=false;
    $('#main').innerHTML=`<div class="card empty">Não foi possível carregar os dados: ${esc(e.message||e)}</div>`;
  }
})();

</script>
