<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório Natação Pura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#042C53; --blue:#185FA5; --gold:#BA7517;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface2:#EEF2F7; --ink:#0E1B2B; --muted:#56667A; --faint:#8494A7;
  --line:#DCE3EC; --line2:#C9D3DF; --accent:#185FA5; --accent-ink:#FFFFFF; --accent-soft:#E3EDF8;
  --s1:#185FA5; --s2:#BA7517; --s3:#16876A;
  --seq1:#062A52; --seq2:#185FA5; --seq3:#4C8ED6; --seq4:#8DB8E8;
  --good:#1D7A4E; --bad:#B3372F; --good-soft:#E3F3EA; --bad-soft:#F8E6E4;
  --heat:24,95,165;
  --hdr:#042C53; --hdr-ink:#FFFFFF; --hdr-muted:#A9BFD8;
  --shadow:0 1px 2px rgba(4,44,83,.06),0 2px 8px rgba(4,44,83,.05);
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Source Sans 3','Segoe UI',Calibri,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A121D; --surface:#111C2B; --surface2:#172538; --ink:#E4ECF5; --muted:#9AAABD; --faint:#6F8198;
    --line:#22334A; --line2:#2E4260; --accent:#4A8FDB; --accent-ink:#06121F; --accent-soft:#16304F;
    --s1:#4A8FDB; --s2:#BA7A20; --s3:#2FA684;
    --seq1:#D6E6F8; --seq2:#8DB8E8; --seq3:#4C8ED6; --seq4:#2A5E9E;
    --good:#4CC38A; --bad:#EE7A70; --good-soft:#12301F; --bad-soft:#3A1A18;
    --heat:74,143,219;
    --hdr:#07192D; --hdr-ink:#E4ECF5; --hdr-muted:#8FA6C2;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A121D; --surface:#111C2B; --surface2:#172538; --ink:#E4ECF5; --muted:#9AAABD; --faint:#6F8198;
  --line:#22334A; --line2:#2E4260; --accent:#4A8FDB; --accent-ink:#06121F; --accent-soft:#16304F;
  --s1:#4A8FDB; --s2:#BA7A20; --s3:#2FA684;
  --seq1:#D6E6F8; --seq2:#8DB8E8; --seq3:#4C8ED6; --seq4:#2A5E9E;
  --good:#4CC38A; --bad:#EE7A70; --good-soft:#12301F; --bad-soft:#3A1A18;
  --heat:74,143,219;
  --hdr:#07192D; --hdr-ink:#E4ECF5; --hdr-muted:#8FA6C2;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.tab-num,td.num,th.num,.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);padding-inline:16px}
.hdr-in{max-width:1400px;margin:0 auto;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.brand-mark{width:38px;height:38px;flex:none}
.brand h1{font-size:26px;line-height:1;font-weight:700;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:var(--hdr-muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--hdr-muted);padding:10px 14px 12px;font-family:var(--fd);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--hdr-ink)}
.tab[aria-selected="true"]{color:var(--hdr-ink);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.view{display:grid;gap:18px}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.view-head h2{font-size:30px;line-height:1.05}
.view-head .sub{color:var(--muted);font-size:14px;margin-top:3px;max-width:75ch}
/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.fbar.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;min-height:34px;max-width:100%}
input[type=number]{width:78px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;min-height:34px}
.seg button{background:var(--surface);border:0;padding:5px 11px;cursor:pointer;font-size:14px;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.syncbar{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:60;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between;max-width:min(920px,calc(100vw - 32px));padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.eu-t th.c{text-align:center}.eu-t td{min-width:92px}
.stbar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.stbar i{display:block;height:100%;background:var(--s1)}
.view>*{min-width:0} select{max-width:100%}
.vlog{display:grid;gap:12px;margin-top:8px}.vlog-h{margin-bottom:2px}
.btn.sm{padding:3px 9px;font-size:12px;min-height:0}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:default}
.exp{display:flex;gap:6px;flex-wrap:wrap}
.exp .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;align-self:center;margin-right:2px}
/* cards */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:980px){.g2,.g3,.g32{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:19px;line-height:1.15}
.card .note{color:var(--muted);font-size:13px;margin:2px 0 0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart{position:relative;height:300px}
.chart.tall{height:380px}
.chart.short{height:240px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--fd);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:13px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
.tbl-wrap.scroll{max-height:560px;overflow-y:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
table.t th.sortable{cursor:pointer;user-select:none}
table.t th.sortable:hover{color:var(--ink)}
table.t th[data-dir="asc"]::after{content:" ▲";font-size:9px}
table.t th[data-dir="desc"]::after{content:" ▼";font-size:9px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface2)}
table.t td.num,table.t th.num{text-align:right}
table.t td.wrap{white-space:normal;min-width:180px}
table.t .time{font-weight:700}
.lnk{color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;padding:0;text-align:left}
.lnk:hover{text-decoration:underline}
.more{display:flex;justify-content:center;gap:10px;align-items:center;padding:10px;color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* swimmer header */
.sw-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:760px){.sw-hd{grid-template-columns:minmax(0,1fr)}}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--fd);font-size:26px;font-weight:700}
.sw-name{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
/* search */
.search{position:relative;min-width:260px;flex:1;max-width:420px}
.search input{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;max-height:340px;overflow:auto}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;padding:8px 10px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button.act{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
/* heat table */
td.heat{position:relative}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* declaration preview */
.decl-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.decl-grid{grid-template-columns:minmax(0,1fr)}}
.decl-form{display:grid;gap:12px}
.decl-form .fld input:not([type=checkbox]),.decl-form .fld select,.decl-form .fld textarea{width:100%}
.decl-form .row>.fld{flex:1;min-width:90px}
.paper-wrap{overflow-x:auto;background:var(--surface2);border-radius:10px;padding:18px}
.paper{background:#fff;color:#1a1a1a;width:210mm;max-width:none;min-height:297mm;margin:0 auto;padding:18mm 20mm;box-shadow:0 4px 20px rgba(0,0,0,.15);font-family:Calibri,'Source Sans 3',Arial,sans-serif;font-size:11pt;line-height:1.5}
.paper .lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #042C53;padding-bottom:8px;margin-bottom:22px}
.paper .lh b{display:block;color:#042C53;font-size:14pt;letter-spacing:.02em}
.paper .lh span{color:#185FA5;font-size:10pt}
.paper .lh .ref{color:#555;font-size:9pt;text-align:right}
.paper h4{text-align:center;color:#042C53;font-size:16pt;letter-spacing:.2em;margin:10px 0 18px;font-family:Calibri,Arial,sans-serif}
.paper p{text-align:justify;margin:0 0 10px}
.paper table{border-collapse:collapse;width:100%;font-size:9pt;margin:8px 0 14px}
.paper th{background:#042C53;color:#fff;padding:4px 5px;text-align:left;font-weight:600}
.paper td{padding:3px 5px;border-bottom:1px solid #d7dde5}
.paper tr:nth-child(even) td{background:#f4f7fb}
.paper .sign{margin-top:36px;text-align:center}
.paper .sign .ln{width:60%;margin:40px auto 4px;border-top:1px solid #333}
.paper .src{font-size:8pt;color:#666;margin-top:26px;border-top:1px solid #ddd;padding-top:6px}
@media (max-width:760px){.fbar.sticky{position:static}.brand h1{font-size:21px}.view-head h2{font-size:26px}.sw-name{font-size:27px}}
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg-s button{padding:4px 8px;font-size:13px}
.grid4{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.alert-badge{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px;cursor:pointer}
table.grid-t td{text-align:right;font-variant-numeric:tabular-nums}
table.grid-t td.up-c{background:var(--good-soft)} table.grid-t td.dn-c{background:var(--bad-soft)}
table.grid-t td small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.subnav button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}}
.chiplist{display:flex;flex-wrap:wrap;gap:4px}
.chiplist span{background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:12.5px;white-space:nowrap}
.chiplist span.hot{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.sortbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:13px}
.sortbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sortbar select{min-height:28px;padding:2px 8px;font-size:13px}
.sortbar .hint{color:var(--faint);font-size:12px;margin-left:auto}
.schip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:2px 4px 2px 4px;font-weight:600}
.schip b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px}
.schip button{border:0;background:none;cursor:pointer;color:var(--accent);font-size:12px;padding:1px 4px;border-radius:4px;font-weight:600}
.schip button:hover{background:var(--surface)}
sup.slv{font-size:9px;color:var(--accent);margin-left:2px}
@media (max-width:760px){.sortbar .hint{display:none}}
.slots-t td.slot-td{min-width:170px;vertical-align:top;white-space:normal}
.slots-t td.slot-td.over{outline:2px dashed var(--accent);outline-offset:-4px}
.slot{display:block;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.3}
.slot.ok{background:var(--good-soft)}
.slot.ok small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.slot.ok small.warn{color:var(--gold);font-weight:600}
.slot.empty{border:1.5px dashed var(--line2);color:var(--accent);font-weight:600;text-align:center;cursor:pointer;padding:10px}
.slot.empty:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot-act{display:flex;gap:10px;margin-top:3px}
.lnkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.lnkbtn:hover{text-decoration:underline}
.lnkbtn.danger,.btn.danger{color:var(--bad)}
details.tblx>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--accent);user-select:none}
details.tblx>summary::-webkit-details-marker{display:none}
details.tblx>summary::before{content:"▸";font-size:12px;transition:transform .15s}
details.tblx[open]>summary::before{transform:rotate(90deg)}
details.tblx>summary:hover{border-color:var(--accent)}
details.tblx>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
details.tblx .tx-o{display:none} details.tblx[open] .tx-o{display:inline} details.tblx[open] .tx-c{display:none}
details.tblx .tx-n{color:var(--muted);font-weight:400;font-size:13px}
details.tblx .tblx-in{margin-top:10px}
@media (prefers-reduced-motion:reduce){details.tblx>summary::before{transition:none}}
/* misc */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.sep{height:1px;background:var(--line);margin:4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);gap:10px;text-align:center}
.bar{height:6px;width:240px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.evchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;font-size:14px}
.evchecks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.evchecks input{margin:0;flex:none}
details.method summary{cursor:pointer;font-weight:600}
details.method ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.cmp-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.bestA{color:var(--s1);font-weight:700}.bestB{color:var(--s2);font-weight:700}
.repopt{position:relative;display:inline-block}
.repopt>summary{list-style:none;cursor:pointer}
.repopt>summary::-webkit-details-marker{display:none}
.repopt .repbox{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:min(560px,calc(100vw - 32px));padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);text-align:left}
.repopt .chk{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0;cursor:pointer}

      const sel=o.sel===reg; s+=`<g><title>${xs(regLabel(reg)+': '+(v==null?'—':o.fmt(v))+(o.sub&&o.sub.get(reg)!=null?' · '+o.sub.get(reg):''))}</title><rect x="${x}" y="${y}" width="${t}" height="${t}" rx="12" fill="${f}" stroke="${sel?'#BA7517':'none'}" stroke-width="${sel?5:0}"/>
        <text x="${x+t/2}" y="${y+24}" text-anchor="middle" font-size="14" font-weight="700" fill="${dark?'#fff':'#0E1B2B'}">${xs(reg)}</text>
        <text x="${x+t/2}" y="${y+50}" text-anchor="middle" font-size="20" font-weight="700" fill="${dark?'#fff':'#0E1B2B'}">${xs(v==null?'—':o.fmt(v))}</text>
        ${o.sub&&o.sub.get(reg)!=null?`<text x="${x+t/2}" y="${y+71}" text-anchor="middle" font-size="12.5" fill="${dark?'#E3ECF7':'#56667A'}">${xs(o.sub.get(reg))}</text>`:''}</g>`; }

/* Barras de distância aos mínimos (uma linha por prova) */
function bulletSpec(rows, title){
  const H=Math.max(170, 80+rows.length*62);
  return {kind:'svg', w:1400, h:H, title, svg:(th, exp)=>{
    const W=1400, lw=230, rw=190, x0=lw, x1=W-rw, A=12, B=-4; const X=g=>x0+(x1-x0)*(A-Math.max(B,Math.min(A,g)))/(A-B);
    const ink=th.ink||'#0E1B2B', mut=th.muted||'#56667A', good=th.good||'#1D7A4E', gold='#BA7517', line=th.grid||'#E3E8EF';
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${xs(title)}" style="font-family:${xs(LIGHT.font)}">`;
    if(exp) s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
    [12,8,4,0,-4].forEach(g=>{ s+=`<line x1="${X(g)}" x2="${X(g)}" y1="30" y2="${H-26}" stroke="${g===0?ink:line}" stroke-width="${g===0?2:1}" ${g===0?'':'stroke-dasharray="3 4"'}/><text x="${X(g)}" y="${H-8}" text-anchor="middle" font-size="13" fill="${mut}">${g>0?'falta '+g+'%':g<0?'folga '+(-g)+'%':'melhor marca'}</text>`; });
    s+=`<text x="${x0}" y="18" font-size="13" fill="${mut}">← quanto falta melhorar para cada referência</text><text x="${x1}" y="18" text-anchor="end" font-size="13" fill="${good}">referências já cumpridas →</text>`;
    rows.forEach((r,k)=>{ const y=50+k*62, cy=y+14;
      s+=`<text x="${lw-14}" y="${cy-2}" text-anchor="end" font-size="16" font-weight="700" fill="${ink}">${xs(r.ev)}</text><text x="${lw-14}" y="${cy+16}" text-anchor="end" font-size="13" fill="${mut}">${xs(r.pb)}</text>`;
      s+=`<rect x="${x0}" y="${cy-5}" width="${x1-x0}" height="10" rx="5" fill="${line}"/>`;
      if(r.next) s+=`<rect x="${X(r.next.g)}" y="${cy-5}" width="${Math.max(0,X(0)-X(r.next.g))}" height="10" rx="5" fill="${gold}" opacity=".55"/>`;
      const ms=[...r.marks].sort((a,b)=>X(a.g)-X(b.g)); const lastX={up:-1e9, dn:-1e9}; let side='up';
      ms.forEach(m=>{ const x=X(m.g), ok=m.g<=0, c = m.nat? '#185FA5' : m.eu? '#042C53' : ok? good : mut; const tip=xs(m.label+': '+m.t+' ('+(m.g>0?'falta '+f2(m.g)+'%':'cumprido, folga '+f2(-m.g)+'%')+')');
        s+= m.eu? `<rect x="${x-3}" y="${cy-14}" width="6" height="28" rx="2" fill="${c}"><title>${tip}</title></rect>` : m.nat? `<path d="M${x},${cy-9} L${x+7},${cy} L${x},${cy+9} L${x-7},${cy} Z" fill="${c}"><title>${tip}</title></path>` : `<rect x="${x-2}" y="${cy-11}" width="4" height="22" rx="1.5" fill="${c}"><title>${tip}</title></rect>`;
        if(x-lastX[side]<70) side = side==='up'?'dn':'up';
        if(x-lastX[side]>=70){ s+=`<text x="${x}" y="${side==='up'?cy-15:cy+27}" text-anchor="middle" font-size="12.5" fill="${c}" font-weight="${ok||m.nat||m.eu?700:500}">${xs(m.label)}${m.g>A?' ◂':m.g<B?' ▸':''}</text>`; lastX[side]=x; }
        side = side==='up'?'dn':'up'; });
      s+=`<text x="${x1+14}" y="${cy+5}" font-size="14" fill="${r.next?gold:good}" font-weight="600">${xs(r.next? 'próx.: '+r.next.label+' a '+f2(r.next.g)+'%' : 'todas cumpridas')}</text>`; });
    return s+'</svg>';
  }};
}
function dumbbellSpec(rows, la, lb, fmt, title, unit, lowerBetter, WW=1400){
  const H=Math.max(200, 80+rows.length*30);
  return {kind:'svg', w:WW, h:H, title, svg:(th, exp)=>{
    const W=WW, l=WW<1000?120:260, r=W-(WW<1000?95:150), t=46, b=H-34; const vs=rows.flatMap(o=>[o.a,o.b]).filter(v=>v!=null); let mn=Math.min(...vs), mx=Math.max(...vs); const pad=(mx-mn)*.06||1; mn-=pad; mx+=pad;
    const X=v=>l+(r-l)*(v-mn)/(mx-mn), ink=th.ink||'#0E1B2B', mut=th.muted||'#56667A', line=th.grid||'#E3E8EF', good=th.good||'#1D7A4E', bad=th.bad||'#B3372F';
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${xs(title)}" style="font-family:${xs(LIGHT.font)}">`; if(exp) s+=`<rect width="${W}" height="${H}" fill="#fff"/>`;
    s+=`<circle cx="${l}" cy="16" r="7" fill="${mut}" opacity=".55"/><text x="${l+12}" y="21" font-size="14" fill="${mut}">${xs(la)}</text> <circle cx="${l+(WW<1000?90:170)}" cy="16" r="7" fill="${good}"/><text x="${l+(WW<1000?102:182)}" y="21" font-size="14" fill="${mut}">${xs(lb)} ${lowerBetter?'(verde = mais rápido, vermelho = mais lento)':'(verde = subiu, vermelho = desceu)'}</text>`;
    for(let k=0;k<=5;k++){ const v=mn+(mx-mn)*k/5; s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${t-6}" y2="${b}" stroke="${line}"/><text x="${X(v)}" y="${H-12}" text-anchor="middle" font-size="13" fill="${mut}">${xs(fmt(v))}</text>`; }
    rows.forEach((o,k)=>{ const y=t+k*30+8; s+=`<text x="${l-14}" y="${y+5}" text-anchor="end" font-size="14" fill="${ink}">${xs(o.lab)}</text>`; if(o.a==null||o.b==null){ s+=`<text x="${l}" y="${y+5}" font-size="12" fill="${mut}">sem dados nas duas épocas</text>`; return; }
      const c=(lowerBetter? o.b<=o.a : o.b>=o.a)?good:bad; s+=`<line x1="${X(o.a)}" x2="${X(o.b)}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="4" opacity=".55"/><circle cx="${X(o.a)}" cy="${y}" r="7" fill="${mut}" opacity=".55"/><circle cx="${X(o.b)}" cy="${y}" r="8" fill="${c}"><title>${xs(o.lab+': '+fmt(o.a)+' → '+fmt(o.b))}</title></circle><text x="${r+14}" y="${y+5}" font-size="14" font-weight="700" fill="${c}">${o.b-o.a>=0?'+':'−'}${xs(fmt(Math.abs(o.b-o.a)))}${unit||''}</text>`; });
    return s+'</svg>'; }};
}

const RELIAB=[];   // outros modelos acrescentam aqui funções (el) => blocos de exportação
function guReliability(){
  const el=$('#guFi'), T=lastClosed(), B=projBacktest(T), a=B.all; if(!a){ el.innerHTML='<h3>Fiabilidade dos modelos</h3><p class="note">Épocas insuficientes para o teste.</p>'; return ()=>[]; }
  const ok=v=>Math.abs(v-50)<=5, ok8=v=>Math.abs(v-80)<=5;
  const ins=[`Projeção para a época seguinte, testada em ${T}: com os dados só até ${T-1}, ${f1(a.in50)}% das marcas reais de ${T} caíram no intervalo central (P25–P75) — o esperado é 50% — e ${f1(a.in80)}% no intervalo largo (P10–P90; esperado 80%). ${ok(a.in50)&&ok8(a.in80)?'Os intervalos estão bem calibrados.':'Os intervalos estão '+(a.in50<45?'demasiado estreitos':'demasiado largos')+'.'}`,
    `Erro mediano da projeção: ${f2(a.err)}% do tempo, contra ${f2(a.err0)}% se se assumisse que o nadador repete a marca. ${a.err<a.err0*0.9?'A projeção acrescenta informação sobretudo nos mais novos, onde a evolução é maior.':'Nos mais velhos a projeção pouco melhora face a repetir a marca: a evolução é pequena e imprevisível.'}`,
    `Probabilidades: quando o modelo dá cerca de ${fN(B.cal.length?B.cal[Math.floor(B.cal.length/2)].pred:50)}% de hipóteses de melhorar, a frequência observada foi ${fN(B.cal.length?B.cal[Math.floor(B.cal.length/2)].obs:50)}%. Quanto mais próximas as duas linhas do gráfico, mais fiáveis as probabilidades mostradas na ficha.`];
  const spec={labels:B.cal.map(c=>fN(c.b*10)+'–'+fN(c.b*10+10)+'%'), series:[{label:'Probabilidade prevista',data:B.cal.map(c=>+c.pred.toFixed(1)),color:'muted'},{label:'Frequência observada',data:B.cal.map(c=>+c.obs.toFixed(1)),color:'s1'}], type:'line', yFmt:v=>fN(v)+'%', tipFmt:v=>f1(v)+'%', zero:true, legend:true, xTitle:'Probabilidade prevista de melhorar a marca'};
  el.innerHTML=`<div class="card-h"><div><h3>Fiabilidade dos modelos</h3><p class="note">Teste retrospetivo: os modelos são aplicados a uma época passada usando só os dados anteriores, e o resultado é comparado com o que realmente aconteceu. Abrange ${fN(a.n)} nadador‑prova com marca em ${T-1} e em ${T} (10 a 30 anos). Quem deixou de nadar não entra no teste.</p></div></div>${insightHTML(ins)}
    <div class="grid g2" style="align-items:start"><div><h3 style="font-size:15px">Projeção de marca · calibração das probabilidades</h3><div class="chart short" id="guFiCh"></div></div><div><h3 style="font-size:15px">Projeção de marca · por idade</h3><div id="guFiT"></div></div></div><div id="guFiMore"></div>`;
  draw('guFiCh',spec);
  const t=new DataTable('guFiT',[{k:'l',l:'Idade'},{k:'n',l:'Casos',num:1},{k:'in50',l:'Dentro P25–P75',num:1,f:r=>r.n?`<span class="pill ${ok(r.in50)?'good':'gold'}">${f1(r.in50)}%</span>`:'—',x:r=>r.n?+r.in50.toFixed(1):'',title:'Esperado: 50%'},{k:'in80',l:'Dentro P10–P90',num:1,f:r=>r.n?`<span class="pill ${ok8(r.in80)?'good':'gold'}">${f1(r.in80)}%</span>`:'—',x:r=>r.n?+r.in80.toFixed(1):'',title:'Esperado: 80%'},{k:'err',l:'Erro mediano',num:1,f:r=>r.n?f2(r.err)+'%':'—',x:r=>r.n?+r.err.toFixed(2):''},{k:'err0',l:'Repetir a marca',num:1,f:r=>r.n?f2(r.err0)+'%':'—',x:r=>r.n?+r.err0.toFixed(2):'',title:'Erro se se assumisse a mesma marca'}], B.bands, {page:10, nosortbar:true});
  const more=RELIAB.map(f=>{ try{ return f($('#guFiMore')); }catch(e){ console.warn(e); return ()=>[]; } });
  return ()=>[{t:'h',text:'Fiabilidade dos modelos'},{t:'p',text:'Leitura rápida\n'+insTxt(ins)},{t:'chart',title:'Projeção de marca: probabilidade prevista vs frequência observada',spec},Object.assign({t:'table',sheet:'Fiabilidade projeção'},t.exportRows()), ...more.flatMap(f=>f())];
}

function xlSerialToISO(v){ if(v==null||v==='') return null; if(v instanceof Date) return v.toISOString().slice(0,10); if(typeof v==='number'){ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000); return d.toISOString().slice(0,10); } const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0]; m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/); if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); return null; }

function parseRelaySheet(ws, out, D2){

    const m=String(r[I.d]||'').match(/4\s*x\s*(\d+)/i); const st={Liv:'L',Est:'E'}[String(r[I.st]||'').trim()]; if(!m||!st) continue;
    const rel='4x'+m[1]+st; let t = I.tn>=0 && r[I.tn]!=null && r[I.tn]!=='' ? Number(r[I.tn]) : parseTimeStr(r[I.t]); if(!isFinite(t)||t<=0) continue;

async function parseRankingFile(file){

      const mn=String(r[I.mn]||''), mc=String(r[I.city]||''), k2=mn+'|'+mc; let mi=mtK.get(k2); if(mi===undefined){ mi=mt.length; mt.push([mn,mc]); mtK.set(k2,mi); }

/* separa um payload (ficheiro) em listas por género e piscina */
function subPayload(p, idx, extra, lidx){
  const swm=new Map(), clm=new Map(), mtm=new Map(), sw=[], cl=[], mt=[], mk=()=>({sw:[],tm:[],dt:[],pt:[],mt:[],cl:[],ev:[],co:[]}), cols=mk(), lcols=mk();

}
function splitPayload(p){

}
function addLoaded(p){ const parts = (p.g && p.co!=null) ? [p] : splitPayload(p); for(const q of parts) S.uploads.set(slotKey(q.year,q.g,q.co), q); return parts.length; }

  const best8=new Map(); for(let i=0;i<R.n;i++){ if(D.RK[i]>8) continue; const sw=R.sw[i]; const x=best8.get(sw)||{y8:[],y3:[]}; x.y8.push(R.yr[i]); if(D.RK[i]<=3) x.y3.push(R.yr[i]); best8.set(sw,x); }
  const last=lastClosed(), bins=new Map();
  list.forEach(o=>{ const x=best8.get(o.sw); o.hit8=!!(x&&x.y8.some(v=>v>o.y)); o.hit3=!!(x&&x.y3.some(v=>v>o.y)); o.train = o.y + Math.max(3, 20-o.a) <= last && o.a<=19;

  const prob=(g,a,adj)=>{ const aa=Math.min(19,a), b=TBIN(adj); let n=0,h8=0,h3=0; [[b,1],[b-1,.5],[b+1,.5]].forEach(([bb,w])=>{ if(bb<0||bb>9) return; const x=bins.get((g*32+aa)*10+bb); if(x){ n+=w*x.n; h8+=w*x.h8; h3+=w*x.h3; } }); return n>=8? {p8:h8/n*100, p3:h3/n*100, n:Math.round(n)} : {p8:null,p3:null,n:Math.round(n)}; };
  list.forEach(o=>{ const p=prob(o.g,o.a,o.adj); o.p8=p.p8; o.p3=p.p3; o.pn=p.n; });
  const byKey=new Map(list.map(o=>[o.sw*4096+o.y,o]));
  const out={list, byKey, prob, bins}; D.cache.set(ck,out); return out;
}

  const euI= S.eu&&S.eu.size? [{id:'eu', l:'Provas com português em zona de final europeia (PL, absolutos)', f:y=>{ const ps=['M','F'].map(g=>euList(y,'abs',g,0)).filter(Boolean); if(ps.length<2) return null; return ps.reduce((n,p)=>n+euRows(p).filter(r=>r.g8!=null&&r.g8<=0).length,0); }, fmt:fN}] : [];
  return [...euI, 
    {id:'nov', l:'Nadadores novos no ranking', f:novos, fmt:fN},

const CG_BINS={nev:[['1',n=>n===1],['2–3',n=>n>=2&&n<=3],['4–6',n=>n>=4&&n<=6],['7–9',n=>n>=7&&n<=9],['10+',n=>n>=10]], nmt:[['1',n=>n===1],['2',n=>n===2],['3–4',n=>n>=3&&n<=4],['5–7',n=>n>=5&&n<=7],['8+',n=>n>=8]]};
function cargaData(){
  const R=S.R, ck='carga'+AN.g+AN.co+AN.nat; let base=D.cache.get(ck);
  if(!base){

      const k=R.sw[i]*4096+R.yr[i]; let o=m.get(k); if(!o){ o={sw:R.sw[i], y:R.yr[i], evs:new Set(), mts:new Set(), d0:1e9, d1:-1e9, best:-1, intl:0}; m.set(k,o); }
      o.evs.add(R.ev[i]*2+R.co[i]); o.mts.add(R.mt[i]); if(R.dt[i]>0){ o.d0=Math.min(o.d0,R.dt[i]); o.d1=Math.max(o.d1,R.dt[i]); } if(o.best<0||R.pt[i]>R.pt[o.best]) o.best=i; if(isIntl(i)) o.intl++; }
    const list=[]; for(const o of m.values()){ const p=m.get(o.sw*4096+o.y-1); if(!p) continue; const age=o.y-S.sw[o.sw].by; list.push({sw:o.sw, y:o.y, age, esc:escG(age), g:D.G[o.best], nev:o.evs.size, nmt:o.mts.size, span:o.d1>=o.d0?(o.d1-o.d0)/30.4:0, intl:o.intl, pt:R.pt[o.best], d:R.pt[o.best]-R.pt[p.best]}); }
    const byA=new Map(); list.forEach(o=>{ const k=o.g*100+o.age; if(!byA.has(k)) byA.set(k,[]); byA.get(k).push(o.d); });
    const med=new Map([...byA].map(([k,v])=>[k, v.length>=15? median(v) : null]));
    list.forEach(o=>{ const e=med.get(o.g*100+o.age); o.ev = e==null? null : o.d-e; });
    base=list.filter(o=>o.ev!=null); D.cache.set(ck,base);
  }

/* intervalo provável para a época seguinte: variação observada em nadadores do mesmo género, idade, prova e piscina com marca semelhante (±3%, alarga até ±6%) */
/* pares de épocas consecutivas (mesma prova, piscina e género), ordenados pelo tempo da 1.ª época: base das projeções */
function pairIndex(e, co, g){
  const ck='pix'+e+'_'+co+'_'+g; if(D.cache.has(ck)) return D.cache.get(ck);
  const pm=pairMap(e,co,g,''), R=S.R, L=[];
  for(const a of pm.values()) for(const [y,i] of a){ const j=a.get(y+1); if(j===undefined) continue; L.push([R.tm[i], D.AGE[i], R.tm[j]/R.tm[i], y+1]); }
  L.sort((p,q)=>p[0]-q[0]);
  const X={t:Float64Array.from(L,x=>x[0]), age:Uint8Array.from(L,x=>x[1]), r:Float64Array.from(L,x=>x[2]), y1:Uint16Array.from(L,x=>x[3])};
  D.cache.set(ck,X); return X;
}
/* intervalo provável da marca na época seguinte: variação observada em nadadores do mesmo género, prova e piscina,
   com idade igual ou próxima e marca semelhante (±3%, alarga até ±6%). maxY: usa só pares que terminam até essa época (teste retrospetivo) */
function projectMark(e, co, g, age, t, maxY=9999){
  const X=pairIndex(e,co,g), n=X.t.length; let rat=[], tol=0.03, aw=0;
  const okAge=(x,w)=> age>=20 ? x>=Math.max(19,age-2-w) && x<=age+2+w : Math.abs(x-age)<=w;
  const lb=v=>{ let lo=0, hi=n; while(lo<hi){ const m=(lo+hi)>>1; if(X.t[m]<v) lo=m+1; else hi=m; } return lo; };
  outer: for(aw=0; aw<=2; aw++){ for(tol=0.03; tol<=0.0601; tol+=0.015){ rat=[]; for(let k=lb(t*(1-tol)*0.999999); k<n && X.t[k]<=t*(1+tol)*1.000001; k++){ if(X.y1[k]>maxY) continue; if(!okAge(X.age[k],aw)) continue; if(Math.abs(X.t[k]/t-1)>tol) continue; rat.push(X.r[k]); } if(rat.length>=25) break outer; } }
  if(rat.length<12) return null; rat.sort((x,y)=>x-y); aw=Math.min(aw,2); tol=Math.min(tol,0.06);
  return {n:rat.length, tol, aw, rat, p10:t*quantile(rat,.1), p25:t*quantile(rat,.25), p50:t*quantile(rat,.5), p75:t*quantile(rat,.75), p90:t*quantile(rat,.9), prob:st=>rat.filter(r=>t*r<=st).length/rat.length*100};
}
/* projeção com recurso: quando a marca é mais rápida do que quase todos os nadadores comparáveis (elite), usa a evolução
   de nadadores um pouco mais lentos (3%, 6%, 10%) e, nos seniores, uma idade abaixo; a projeção aplica-se sempre à marca do próprio */
function projectMarkF(e, co, g, age, t, maxY=9999){
  const p=projectMark(e,co,g,age,t,maxY); if(p) return p;
  for(const [f,a] of [[1.03,age],[1.06,age],[1.06,Math.max(19,age-1)],[1.10,age],[1.10,Math.max(19,age-1)],[1.15,Math.max(19,age-2)]]){ const q=projectMark(e,co,g,a,t*f,maxY); if(!q) continue;
    const rat=q.rat; return {n:q.n, tol:q.tol, aw:q.aw, rat, fb:f, p10:t*quantile(rat,.1), p25:t*quantile(rat,.25), p50:t*quantile(rat,.5), p75:t*quantile(rat,.75), p90:t*quantile(rat,.9), prob:st=>rat.filter(r=>t*r<=st).length/rat.length*100}; }
  return null;
}
/* probabilidade de chegar a st até daqui a n épocas: simulação encadeada com as variações de nadadores semelhantes (idade e marca) em cada época */
function projectReach(e, co, g, age, t, st, n, sims=400, boost=0){
  const ck='reach'+e+'_'+co+'_'+g; let C=D.cache.get(ck); if(!C){ C=new Map(); D.cache.set(ck,C); }
  const dist0=(a,tt)=>{ const b=Math.round(Math.log(tt)/0.004), k=a+'|'+b; if(C.has(k)) return C.get(k); const p=projectMark(e,co,g,Math.min(a,40),Math.exp(b*0.004)); const r=p? p.rat : null; C.set(k,r); return r; };
  /* sem casos comparáveis (marca mais rápida do que quase todos os portugueses): usa os nadadores um pouco mais lentos */
  const dist=(a,tt)=> dist0(a,tt) || dist0(a,tt*1.03) || dist0(a,tt*1.06) || dist0(Math.max(19,a-1),tt*1.06) || dist0(Math.max(19,a-1),tt*1.10);
  let seed=97531; const rnd=()=>{ seed=(Math.imul(seed,1103515245)+12345)&0x7fffffff; return seed/0x7fffffff; };
  const med=[t], q25=[t]; let tm=t, tq=t;
  for(let k=0;k<n;k++){ const r1=dist(age+k,tm), r2=dist(age+k,tq); tm= r1? Math.min(tm, tm*quantile(r1,.5)) : tm; tq= r2? Math.min(tq, tq*quantile(r2,.25)) : tq; med.push(tm); q25.push(tq); }
  /* probabilidade de estar ao nível st na época-alvo (melhor marca da época T ≤ st); "atinge" = em alguma época até T */
  let hit=0, hitAny=0, ok=0; for(let s=0;s<sims;s++){ let tt=t, any=false, fine=true; for(let k=0;k<n;k++){ const r=dist(age+k,tt); if(!r){ fine=false; break; } tt*=r[Math.floor(rnd()*r.length)]*(1-boost/100); if(tt<=st) any=true; } if(!fine) continue; ok++; if(tt<=st) hit++; if(any) hitAny++; }
  return ok>=50? {prob:hit/ok*100, probAny:hitAny/ok*100, med, q25, req:n>0? (1-Math.pow(st/t,1/n))*100 : null, typ:(()=>{ const r=dist(age,t); return r? (1-quantile(r,.5))*100 : null; })()} : null;
}
/* teste retrospetivo: projeta a época T só com dados até T-1 e compara com as marcas reais de T */
function projBacktest(T){
  const ck='pbt'+T; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, nx=new Map(); for(let i=0;i<R.n;i++) if(R.yr[i]===T) nx.set((R.sw[i]*32+R.ev[i])*2+R.co[i], i);
  const cases=[]; for(let i=0;i<R.n;i++){ if(R.yr[i]!==T-1) continue; const a=D.AGE[i]; if(a<10||a>30) continue; const j=nx.get((R.sw[i]*32+R.ev[i])*2+R.co[i]); if(j===undefined) continue;
    const p=projectMark(R.ev[i],R.co[i],D.G[i],a,R.tm[i],T-1); if(!p) continue; const act=R.tm[j];
    cases.push({a, g:D.G[i], pt:R.pt[i], t:R.tm[i], act, in50:act>=p.p25&&act<=p.p75, in80:act>=p.p10&&act<=p.p90, err:Math.abs(act/p.p50-1)*100, err0:Math.abs(act/R.tm[i]-1)*100, pImp:p.prob(R.tm[i]-0.5), imp:act<R.tm[i]}); }
  const sum=L=>!L.length? null : {n:L.length, in50:L.filter(c=>c.in50).length/L.length*100, in80:L.filter(c=>c.in80).length/L.length*100, err:quantile(L.map(c=>c.err).sort((x,y)=>x-y),.5), err0:quantile(L.map(c=>c.err0).sort((x,y)=>x-y),.5)};
  const bands=[['10–12',10,12],['13–14',13,14],['15–16',15,16],['17–18',17,18],['19–22',19,22],['23–30',23,30]].map(([l,a0,a1])=>Object.assign({l},sum(cases.filter(c=>c.a>=a0&&c.a<=a1))||{n:0}));
  const cal=[]; for(let b=0;b<10;b++){ const L=cases.filter(c=>Math.min(9,Math.floor(c.pImp/10))===b); if(L.length>=20) cal.push({b, pred:mean(L.map(c=>c.pImp)), obs:L.filter(c=>c.imp).length/L.length*100, n:L.length}); }
  const res={T, all:sum(cases), bands, cal}; D.cache.set(ck,res); return res;
}
function swProjection(id){
  const s=S.sw[id], R=S.R, L=lastYear(), g=s.g==='F'?1:0, age=L-s.by, gk=s.g==='F'?'F':'M';
  const cur=new Map(); for(const i of swRows(id)){ if(R.yr[i]<L-1) continue; const k=R.ev[i]*2+R.co[i]; if(!cur.has(k)||R.tm[i]<R.tm[cur.get(k)]) cur.set(k,i); }
  const tabs=S.std.filter(tb=>stdAgeOK(tb,age+1));
  const ordK=[...cur.entries()].sort((a,b)=>R.pt[b[1]]-R.pt[a[1]]), topKey=ordK.length? ordK[0][0] : null;
  /* as 3 provas mais pontuadas em piscina longa e as 3 em piscina curta (procura a seguinte quando uma não tem projeção) */
  const rows=[], nCo=[0,0]; for(const [k,i] of ordK){ const co0=k&1; if(nCo[co0]>=3) continue; const e=k>>1, co=k&1, t=R.tm[i]; let p;
    if(R.yr[i]===L) p=projectMarkF(e,co,g,age,t);
    else { /* base em L−1: duas épocas encadeadas (L e L+1) */ const p1=projectMarkF(e,co,g,age-1,t); if(!p1) continue; const p2=projectMarkF(e,co,g,age,p1.p50); if(!p2) continue;
      const rr=[]; for(const a of p1.rat) for(let j=0;j<p2.rat.length;j+=Math.max(1,Math.floor(p2.rat.length/40))) rr.push(a*p2.rat[j]); rr.sort((x,y)=>x-y);
      p={n:p1.n, tol:p1.tol, aw:p1.aw, rat:rr, two:true, fb:p1.fb||p2.fb, p10:t*quantile(rr,.1), p25:t*quantile(rr,.25), p50:t*quantile(rr,.5), p75:t*quantile(rr,.75), p90:t*quantile(rr,.9), prob:st=>rr.filter(r=>t*r<=st).length/rr.length*100}; }
    if(!p) continue;
    const refs=tabs.filter(tb=>tb.co===co).map(tb=>({tb, st:stdTime(tb,gk,e)})).filter(x=>x.st&&x.st<t).sort((x,y)=>y.st-x.st); const nx=refs[0]||null;
    nCo[co0]++; rows.push({k, co:co0, top:k===topKey, ev:evLabel(e)+' '+CO_S[co], t, y:R.yr[i], p, next:nx? {label:nx.tb.id.startsWith('WA')?nx.tb.id:nx.tb.name.split(' · ')[0], st:nx.st, prob:p.prob(nx.st)} : null}); }
  rows.sort((a,b)=>a.co-b.co||R.pt[cur.get(b.k)]-R.pt[cur.get(a.k)]);
  return {rows, age, L};
}

let RKX=null;
function rkContent(){

  let idx=[];
  if(perSw){
    const m=new Map();
    for(let i=0;i<R.n;i++){ if(!filt(i)) continue; const c=m.get(R.sw[i]); if(c===undefined || (byTime? R.tm[i]<R.tm[c] : R.pt[i]>R.pt[c])) m.set(R.sw[i],i); }
    idx=[...m.values()];
  } else { for(let i=0;i<R.n;i++) if(filt(i)) idx.push(i); }
  idx.sort(byTime ? (a,b)=>R.tm[a]-R.tm[b]||R.dt[a]-R.dt[b] : (a,b)=>R.pt[b]-R.pt[a]||R.tm[a]-R.tm[b]);

  const cols=[

    {k:'age',l:'Id.',num:1,f:r=>D.AGE[r.i],sv:r=>D.AGE[r.i]},
    {k:'esc',l:'Escalão',f:r=>ESC_F[escF(D.AGE[r.i])].n,sv:r=>D.AGE[r.i]},
    ...(K.g===''?[{k:'g',l:'G',f:r=>D.G[r.i]?'F':'M',sv:r=>D.G[r.i]}]:[]),
    {k:'club',l:'Clube',f:r=>esc(S.cl[R.cl[r.i]].name),sv:r=>S.cl[R.cl[r.i]].name,cls:'wrap'},
    {k:'reg',l:'Assoc.',f:r=>esc(S.cl[R.cl[r.i]].reg),sv:r=>S.cl[R.cl[r.i]].reg},
    ...(showEv?[{k:'ev',l:'Prova',f:r=>evLabel(R.ev[r.i]),sv:r=>R.ev[r.i]}]:[]),
    ...(showCo?[{k:'co',l:'Pisc.',f:r=>CO_S[R.co[r.i]],sv:r=>R.co[r.i]}]:[]),
    {k:'tm',l:'Tempo',num:1,f:r=>`<span class="time">${fT(R.tm[r.i])}</span>`,x:r=>fT(R.tm[r.i]),sv:r=>R.tm[r.i],dir0:'asc'},
    {k:'pt',l:'Pts',num:1,f:r=>R.pt[r.i],sv:r=>R.pt[r.i]},
    {k:'rk',l:'Rk nac.',num:1,f:r=>D.RK[r.i]+'.º',x:r=>D.RK[r.i],sv:r=>D.RK[r.i],dir0:'asc',title:'Posição no ranking nacional da época (prova, piscina e género)'},
    ...(multi?[{k:'yr',l:'Época',num:1,f:r=>R.yr[r.i],sv:r=>R.yr[r.i]}]:[]),
    {k:'dt',l:'Data',f:r=>fD(R.dt[r.i]),sv:r=>R.dt[r.i]},

}

  const escU=escR.filter(r=>r.dl!=null).sort((a,b)=>b.dl-a.dl)[0]; if(escU&&escU.dl>3) pos.push(`Maior subida de nível: ${esc(escU.esc)} (${sg(escU.dl)} pts no top‑20).`);
  if(wlist.length) pos.push(`${new Set(wlist.filter(r=>r.tb==='WA-A').map(r=>r.sw)).size} nadador(es) com Mínimo A do Mundial e ${new Set(wlist.map(r=>r.sw)).size} com algum mínimo internacional.`);
  return {esc:escR, escSpec, top, prog, grp, wlist, att, pos};
}
function esc_(a){ return lst(a.map(x=>esc(x))); }
/* pontos fortes/atenção, escalões, destaques, progressões, mínimos internacionais e grupos AR */
function rxDetails(){ const el=$('#rxC'); if(!el||!RXX) return; const y=RXX.y, X=rxSections(y); RX10=X;

      <div class="card"><h3>Mínimos internacionais · ${y}</h3><p class="note">Marcas portuguesas dentro dos mínimos World Aquatics (Mínimo A e Mínimo FPN).</p><div id="rxWa" style="margin-top:8px"></div></div></div>
    <div class="card"><h3>Grupos de alto rendimento · ${y}</h3><p class="note">Pontuação, variação, melhor marca pessoal na época e distância ao Mínimo A do Mundial (melhor prova de PL das duas últimas épocas).</p><div id="rxGrp" style="margin-top:8px"></div></div>`);
  draw('rxEsc', X.escSpec);
  const tE=new DataTable('rxEscT',[{k:'esc',l:'Escalão'},{k:'n',l:'Nadadores '+y,num:1},{k:'dn',l:'Δ %',num:1,f:r=>r.dn==null?'—':`<span class="${r.dn>=0?'up':'down'}">${sg1(r.dn)}%</span>`,x:r=>r.dn==null?'':+r.dn.toFixed(1)},{k:'lv',l:'Nível '+y,num:1,f:r=>r.lv==null?'—':f1(r.lv),x:r=>r.lv==null?'':+r.lv.toFixed(1)},{k:'dl',l:'Δ nível',num:1,f:r=>r.dl==null?'—':`<span class="${r.dl>=0?'up':'down'}">${sg(r.dl)}</span>`,x:r=>r.dl==null?'':Math.round(r.dl)}], X.esc, {page:10, nosortbar:true});
  const tT=new DataTable('rxTop',[{k:'k',l:'#',num:1,dir0:'asc'},{k:'name',l:'Nadador',f:r=>swLink(r.sw,r.name),x:r=>r.name},{k:'g',l:'G'},{k:'age',l:'Id.',num:1},{k:'club',l:'Clube'},{k:'ev',l:'Prova'},{k:'t',l:'Tempo',num:1,f:r=>fT(r.t)},{k:'pt',l:'Pts',num:1},{k:'d',l:'Δ',num:1,f:r=>r.d==null?'—':sg(r.d),x:r=>r.d??''}], X.top, {page:10, nosortbar:true});
  const tP=new DataTable('rxProg',[{k:'k',l:'#',num:1,dir0:'asc'},{k:'name',l:'Nadador',f:r=>swLink(r.sw,r.name),x:r=>r.name},{k:'g',l:'G'},{k:'age',l:'Id.',num:1},{k:'club',l:'Clube'},{k:'ev',l:'Melhor prova'},{k:'pt',l:'Pts',num:1},{k:'d',l:'Subida',num:1,f:r=>`<span class="up">${sg(r.d)}</span>`,x:r=>r.d}], X.prog, {page:10, nosortbar:true});
  const tW=new DataTable('rxWa',[{k:'name',l:'Nadador',f:r=>swLink(r.sw,r.name),x:r=>r.name},{k:'g',l:'G'},{k:'ev',l:'Prova'},{k:'t',l:'Tempo',num:1,f:r=>fT(r.t)},{k:'tb',l:'Mínimo',f:r=>`<span class="pill ${r.tb==='WA-A'?'good':'gold'}">${esc(r.tb)}</span>`,x:r=>r.tb},{k:'st',l:'Referência',num:1,f:r=>fT(r.st)}], X.wlist, {page:20, nosortbar:true, empty:'Nenhuma marca portuguesa dentro dos mínimos internacionais nesta época.'});
  const tG=new DataTable('rxGrp',[{k:'g',l:'Grupo',cls:'wrap'},{k:'name',l:'Nadador',f:r=>r.found?swLink(r.id,r.name):esc(r.name),x:r=>r.name},{k:'age',l:'Id.',num:1,f:r=>r.found?r.age:'—'},{k:'sp',l:'Pts por época',nosort:1,noexp:1,f:r=>r.found?sparkSw(r.id):''},{k:'pt',l:'Pts '+y,num:1,f:r=>r.pt??'—'},{k:'d',l:'Δ',num:1,f:r=>r.d==null?'—':`<span class="${r.d>=0?'up':'down'}">${sg(r.d)}</span>`,x:r=>r.d??''},{k:'pb',l:'MP na época',f:r=>r.found?(r.pb?'<span class="pill good">Sim</span>':'<span class="pill bad">Não</span>'):'—',x:r=>r.found?(r.pb?'Sim':'Não'):''},{k:'gap',l:'Mín. A Mundial',num:1,f:r=>r.gap?`<span class="pill ${r.gap.g<=0?'good':r.gap.g<=1?'gold':''}">${r.gap.g<=0?'✓ ':''}${fPct(r.gap.g)}</span> <span class="muted small">${esc(evShort(r.gap.e))}</span>`:'—',x:r=>r.gap?r.gap.g.toFixed(2)+'% ('+evLabel(r.gap.e)+')':''}], X.grp, {page:30, nosortbar:true});
  Object.assign(RX10,{tE,tT,tP,tW,tG});
}
function rxModelDetails(m){ const X=RX10; if(!X) return; const src=m.blocks.pop();
  m.blocks.push({t:'table',sheet:'Pontos',head:['Pontos fortes','Pontos de atenção'],rows:Array.from({length:Math.max(X.pos.length,X.att.length)},(_,k)=>[stripTags(X.pos[k]||''),stripTags(X.att[k]||'')]),align:['l','l'],fills:Array.from({length:Math.max(X.pos.length,X.att.length)},()=>['#E8F4EC','#FBE9E7'])},
    {t:'h',text:`Por escalão · ${RXX.y-1} → ${RXX.y}`},{t:'chart',title:'Nível por escalão (média dos 20 melhores)',spec:X.escSpec},Object.assign({t:'table',sheet:'Por escalão'},X.tE.exportRows()),
    {t:'h',text:'Destaques individuais'},Object.assign({t:'table',sheet:'Destaques',small:true},X.tT.exportRows()),
    {t:'h',text:'Maiores progressões'},Object.assign({t:'table',sheet:'Progressões',small:true},X.tP.exportRows()),
    {t:'h',text:'Mínimos internacionais'},Object.assign({t:'table',sheet:'Mínimos internacionais',small:true},X.tW.exportRows()),
    {t:'h',text:'Grupos de alto rendimento'},Object.assign({t:'table',sheet:'Grupos AR',small:true},X.tG.exportRows()), src);
  return;
}

<script>
'use strict';
/* ============================================================
   Área Nacional: Análises (todas as secções, esquemas e leituras rápidas)
   ============================================================ */
const AN = {sec:'perfil', y0:null, y1:null, g:'0', co:'0', depth:'8', am:'n', nat:''};
const AN_SECS = [['perfil','Perfil sectorial'],['recordes','Melhores de sempre por idade'],['densidade','Densidade competitiva'],['generos','Diferença entre géneros'],['idadepico','Idade de melhor rendimento'],['formadores','Clubes formadores'],['eficiencia','Eficiência territorial'],['afinacao','Afinação'],['funil','Funil de talento'],['plpc','Diferencial PL/PC'],['estag','Estagnação'],['provas','Nível por prova'],['idade','Idade dos melhores'],['assoc','Associações'],['clubes','Clubes'],['rae','Idade relativa'],['coortes','Coortes e abandono'],['espec','Especialização']];
let ANX = null;
function vAnalises(root){
  perNorm(AN,'all');
  root.innerHTML = `
  <div class="view-head"><div><h2>Análises globais</h2><div class="sub">Leituras complementares da natação nacional no período escolhido: nível e idade por prova, território, clubes, efeito da idade relativa, coortes e especialização.</div></div>${expHTML('an')}</div>
  <div class="subnav" id="anNav">${AN_SECS.map(([k,l])=>`<button type="button" data-s="${k}" aria-pressed="${AN.sec===k}">${esc(l)}</button>`).join('')}</div>
  <div class="fbar sticky">
    ${perHTML('an', AN, 'Período', 'all')}
    ${segHTML('anG', [['0','Masculinos'],['1','Femininos'],['','Ambos']], AN.g, 'Género')}
    ${segHTML('anCo', coOpts, AN.co, 'Piscina')}
    ${selHTML('anNat', natOpts, AN.nat, 'Nacionalidade')}
    <span id="anExtra" class="row"></span>
  </div>
  <div id="anC" class="view"></div>`;
  $('#anNav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; AN.sec=b.dataset.s; $$('#anNav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); anContent(); });
  bindSeg(root,'anG',v=>{AN.g=v;anContent();}); bindSeg(root,'anCo',v=>{AN.co=v;anContent();});
  $('#anNat').onchange=e=>{AN.nat=e.target.value; anContent();};
  bindPer(root,'an',AN,anContent);
  bindExp(root,'an',async()=>({title:'Análises — '+AN_SECS.find(s=>s[0]===AN.sec)[1], subtitle:perLabel(AN)+' · '+descFilters({g:AN.g,co:AN.co,nat:AN.nat},['y']), filename:'Analise_'+AN.sec+'_'+AN.y0+'_'+AN.y1, orientation:'l', blocks:ANX.blocks}));
  anContent();
}
function anRowOK(i){ const R=S.R, y=R.yr[i]; if(y<AN.y0||y>AN.y1) return false; if(AN.g!==''&&D.G[i]!==+AN.g) return false; if(AN.co!==''&&R.co[i]!==+AN.co) return false; if(AN.nat==='POR'&&!D.POR[i]) return false; if(AN.nat==='EST'&&D.POR[i]) return false; return true; }
/* épocas fechadas do período (a época em curso só conta se for a única escolhida) */
function anClosed(sy){ const c=sy.filter(y=>!isPartial(y)); return c.length? c : sy; }
/* posição no ranking só entre portugueses (mesma época × prova × piscina × género; empates partilham posição) */
function rkPOR(){ const ck='anRKP'; if(D.cache.has(ck)) return D.cache.get(ck); const R=S.R, idx=[]; for(let i=0;i<R.n;i++) if(D.POR[i]) idx.push(i); idx.sort((a,b)=>(D.GK[a]-D.GK[b])||(R.tm[a]-R.tm[b])); const rk=new Uint16Array(R.n).fill(65535); let pg=-1,r=0,lt=-1,lr=0; for(const i of idx){ if(D.GK[i]!==pg){ pg=D.GK[i]; r=0; lt=-1; } r++; if(R.tm[i]===lt) rk[i]=lr; else { rk[i]=r; lt=R.tm[i]; lr=r; } } D.cache.set(ck,rk); return rk; }
const anRK = i => AN.nat==='POR'? rkPOR()[i] : D.RK[i];
const anNatOK = i => !(AN.nat==='POR'&&!D.POR[i]) && !(AN.nat==='EST'&&D.POR[i]);
const dtKey = i => S.R.dt[i]>0? S.R.dt[i] : 1e9; // data em falta (dt=0) nunca é a "primeira"
function anExtra(html, bind){ const el=$('#anExtra'); el.innerHTML=html||''; if(bind) bind(el); }
function anSection(){
  const el=$('#anC'), sy=yearsRange(AN.y0,AN.y1), yl=sy.map(String), R=S.R;
  const out={blocks:[]}; ANX=out;
  const sec=AN.sec;
  if(['perfil','funil','plpc','estag'].includes(sec)){ an5(sec, el, out); return; }
  if(['recordes','densidade','generos','idadepico','formadores','eficiencia','afinacao'].includes(sec)){ an6(sec, el, out); return; }
  if(sec==='provas' || sec==='idade'){
    anExtra(sec==='provas'? selHTML('anDepth',[['1','1.º classificado'],['8','Média top‑8'],['16','Média top‑16'],['24','Média top‑24']],AN.depth,'Indicador') : selHTML('anDepth',[['8','Top‑8'],['16','Top‑16'],['24','Top‑24']],AN.depth==='1'?'8':AN.depth,'Grupo'), x=>{ $('#anDepth',x).onchange=e=>{AN.depth=e.target.value; anContent();}; });
    const N=+(sec==='idade'&&AN.depth==='1'?8:AN.depth), cos = AN.co===''?[0,1]:[+AN.co], gs=AN.g===''?[0,1]:[+AN.g];
    const acc=new Map();
    for(let i=0;i<R.n;i++){ if(!anRowOK(i)||anRK(i)>N) continue;
      const k=(R.ev[i]*2+R.co[i])*1000+(R.yr[i]-S.y0); let o=acc.get(k); if(!o){o={s:0,c:0,a:0}; acc.set(k,o);} o.s+=R.pt[i]; o.a+=D.AGE[i]; o.c++; }
    const keys=[]; S.ev.forEach((c,e)=>cos.forEach(co=>{ if([...sy].some(y=>acc.has((e*2+co)*1000+(y-S.y0)))) keys.push(e*2+co); }));
    const val=(k,y,f)=>{ const o=acc.get(k*1000+(y-S.y0)); return o&&o.c? f(o) : null; };
    const lab=keys.map(k=>evLabel(k>>1)+(cos.length>1?' '+CO_S[k&1]:''));
    if(sec==='provas'){
      const vals=keys.map(k=>sy.map(y=>val(k,y,o=>o.s/o.c)));
      const cy=anClosed(sy), cj=sy.map(y=>cy.includes(y));
      const dcol=vals.map(r=>{ const rr=r.filter((v,j)=>cj[j]); const a=rr.find(v=>v!=null), b=[...rr].reverse().find(v=>v!=null); return a!=null&&b!=null? b-a : null; });
      const pNote = cy.length<sy.length? ' A época em curso é mostrada mas não entra na variação.' : '';
      el.innerHTML=`<div class="card"><div class="card-h"><div><h3>Nível por prova (${N===1?'1.º classificado':'média dos pontos do top‑'+N})</h3><p class="note">Pontuação AQUA 2026 dos ${N===1?'primeiros classificados':N+' primeiros'} do ranking de cada prova e época${gs.length>1?' (masculinos e femininos em conjunto)':''}${AN.nat==='POR'?'; posições recalculadas só entre nadadores portugueses':''}. A última coluna mostra a variação entre a primeira e a última época ${cy.length<sy.length?'fechada ':''}com valor no período.${pNote}</p></div></div>${heatHTML(lab, [...sy.map(yearLabel),'Δ período'], vals.map((r,k)=>[...r, null]), null, f1, 'Prova')}</div>
      <div class="card"><h3>Variação do nível no período por prova</h3><p class="note">Diferença de pontos entre a primeira e a última época ${cy.length<sy.length?'fechada ':''}com valor no período.${pNote}</p><div class="chart tall" id="anCh1"></div></div>`;
      // escrever coluna Δ
      $$('#anC table.t tbody tr').forEach((tr,k)=>{ const td=tr.lastElementChild; const v=dcol[k]; td.className='num'; td.innerHTML= v==null?'—':`<span class="${v>=0?'up':'down'}">${fSgn(v)}</span>`; td.style.background=''; });
      const sp={type:'bar', horizontal:true, labels:lab, series:[{label:'Δ pontos', data:dcol.map(v=>v==null?null:Math.round(v)), color:'s1'}], legend:false, zero:true, barMax:14};
      draw('anCh1', sp);
      out.ins=insProvas(lab,dcol,N);
      out.blocks=[{t:'table',sheet:'Nível por prova',small:true,head:['Prova',...yl,'Δ período'],rows:vals.map((r,k)=>[lab[k],...r.map(v=>v==null?'':Math.round(v*10)/10), dcol[k]==null?'':Math.round(dcol[k])]),align:['l',...yl.map(()=>'r'),'r']},{t:'chart',title:'Variação do nível no período por prova',spec:sp}];
    } else {
      const vals=keys.map(k=>sy.map(y=>val(k,y,o=>o.a/o.c)));
      // idade média do top-N por época e género (todas as provas da piscina)
      const ag=new Map(); for(let i=0;i<R.n;i++){ const y=R.yr[i]; if(y<AN.y0||y>AN.y1) continue; if(AN.co!==''&&R.co[i]!==+AN.co) continue; if(!anNatOK(i)||anRK(i)>N) continue; const k=D.G[i]*1000+(y-S.y0); let o=ag.get(k); if(!o){o={s:0,c:0}; ag.set(k,o);} o.s+=D.AGE[i]; o.c++; }
      const sp={labels:yl, series:[0,1].map(g=>({label:G_L[g], data:sy.map(y=>{ const o=ag.get(g*1000+(y-S.y0)); return o? +(o.s/o.c).toFixed(2):null; }), color:g?'s2':'s1'})), yFmt:v=>f1(v), tipFmt:v=>f1(v)+' anos', zero:false};
      el.innerHTML=`<div class="card"><div class="card-h"><div><h3>Idade média do top‑${N} por época</h3><p class="note">Todas as provas${AN.co===''?'':' em '+CO_L[+AN.co].toLowerCase()}, masculinos e femininos (o filtro de género aplica-se à tabela por prova)${AN.nat==='POR'?'; posições recalculadas só entre nadadores portugueses':''}. Mostra se o alto nível nacional está a ficar mais jovem ou mais velho.</p></div></div><div class="chart" id="anCh1"></div></div>
      <div class="card"><div class="card-h"><div><h3>Idade média do top‑${N} por prova</h3><p class="note">Tom mais escuro = grupo mais velho.</p></div></div>${heatHTML(lab, yl, vals, null, f1, 'Prova')}</div>`;
      draw('anCh1', sp);
      out.ins=insIdade(sp,N);
      out.blocks=[{t:'chart',title:'Idade média do top-'+N+' por época',spec:sp},{t:'table',sheet:'Idade top-'+N,small:true,head:['Prova',...yl],rows:vals.map((r,k)=>[lab[k],...r.map(v=>v==null?'':Math.round(v*10)/10)]),align:['l',...yl.map(()=>'r')]}];
    }
    return;
  }
  if(sec==='assoc'){
    anExtra(segHTML('anAm',[['n','Nadadores'],['pts','Média top‑10 pts']],AN.am,'Indicador'), x=>bindSeg(x,'anAm',v=>{AN.am=v;anContent();}));
    const per=new Map(), tot=new Map(); // reg -> year -> Map(sw->pts)
    for(let i=0;i<R.n;i++){ if(!anRowOK(i)) continue; const r=S.cl[R.cl[i]].reg||'—'; let m=per.get(r); if(!m){ m=new Map(); per.set(r,m);} let yy=m.get(R.yr[i]); if(!yy){ yy=new Map(); m.set(R.yr[i],yy);} const c=yy.get(R.sw[i]); if(c==null||R.pt[i]>c) yy.set(R.sw[i],R.pt[i]); let t=tot.get(r); if(!t){t=new Set(); tot.set(r,t);} t.add(R.sw[i]); }
    const regs=[...per.keys()].sort((a,b)=>tot.get(b).size-tot.get(a).size), all=new Set([...tot.values()].flatMap(x=>[...x])).size||1, cy=anClosed(sy), y0c=cy[0], y1c=cy[cy.length-1];
    const vals=regs.map(r=>sy.map(y=>{ const m=per.get(r).get(y); if(!m) return null; if(AN.am==='n') return m.size; const v=[...m.values()].sort((a,b)=>b-a).slice(0,10); return v.length>=3? mean(v) : null; }));
    const rows=regs.map((r,k)=>({reg:r, name:REGIONS[r]||r, n:tot.get(r).size, share:tot.get(r).size/all*100, first:vals[k][sy.indexOf(y0c)], last:vals[k][sy.indexOf(y1c)]}));
    rows.forEach(r=>r.d = r.first!=null&&r.last!=null&&r.first? (r.last-r.first)/(AN.am==='n'?r.first/100:1) : null);
    el.innerHTML=`<div class="card"><div class="card-h"><div><h3>${AN.am==='n'?'Nadadores ranqueados':'Média dos 10 melhores (pontos)'} por associação e época</h3><p class="note">Associação territorial do clube de cada marca.</p></div></div>${heatHTML(regs, sy.map(yearLabel), vals, null, AN.am==='n'?fN:f1, 'Associação', k=>esc(regLabel(regs[k])))}</div>
    <div class="grid g32"><div class="card"><h3>Resumo do período</h3><p class="note">Nadadores distintos no período e peso de cada associação. Variação entre ${y0c} e ${y1c}${cy.length<sy.length?' (épocas fechadas; a época em curso não entra)':''}.</p><div id="anT1" style="margin-top:10px"></div></div><div class="card"><h3>Peso no período</h3><p class="note">Percentagem dos nadadores distintos do período com marcas por cada associação (quem mudou de associação conta em ambas, por isso a soma pode passar 100%).</p><div class="chart" id="anCh1"></div></div></div>`;
    const t=new DataTable('anT1',[{k:'reg',l:'Assoc.'},{k:'name',l:'Nome'},{k:'n',l:'Nadadores',num:1},{k:'share',l:'Peso',num:1,f:r=>f1(r.share)+'%'},{k:'first',l:String(y0c),num:1,f:r=>AN.am==='n'?fN(r.first):f1(r.first)},{k:'last',l:String(y1c),num:1,f:r=>AN.am==='n'?fN(r.last):f1(r.last)},{k:'d',l:AN.am==='n'?'Δ %':'Δ pts',num:1,f:r=>r.d==null?'—':AN.am==='n'?fPct(r.d,1):fSgn(r.d)}], rows, {sort:{k:'n',dir:'desc'},page:30});
    const sp={type:'bar',horizontal:true,labels:regs,series:[{label:'Peso (%)',data:rows.map(r=>+r.share.toFixed(1)),color:'s1'}],legend:false,yFmt:v=>f1(v)+'%',tipTitle:it=>regLabel(it[0].label),barMax:16};
    draw('anCh1', sp);
    out.ins=insAssoc(rows,AN.am);
    out.blocks=[{t:'table',sheet:'Associações por época',small:true,head:['Associação',...yl],rows:vals.map((r,k)=>[regs[k],...r.map(v=>v==null?'':Math.round(v*10)/10)]),align:['l',...yl.map(()=>'r')]},Object.assign({t:'table',sheet:'Resumo período'},t.exportRows()),{t:'chart',title:'Peso de cada associação',spec:sp}];

  if(DC.type==='pb'){ const m=new Map(); for(const i of rows){ const k=R.ev[i]*2+R.co[i]; if(!m.has(k)||R.tm[i]<R.tm[m.get(k)]) m.set(k,i); } rows=[...m.values()].filter(i=>!DC.top||D.RK[i]<=+DC.top).sort((a,b)=>R.co[a]-R.co[b]||R.ev[a]-R.ev[b]); }

function quadSpec(list, thr, title){

    const xT=X(thr), y0=Y(0);

    [0,20,40,60,80,100].forEach(p=>{ s+=`<line x1="${X(p)}" x2="${X(p)}" y1="${t}" y2="${b}" stroke="${line}"/><text x="${X(p)}" y="${b+22}" text-anchor="middle" font-size="14" fill="${mut}">P${p}</text>`; });
    [-lim,-lim/2,0,lim/2,lim].forEach(v=>{ s+=`<line x1="${l}" x2="${r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===0?mut:line}" ${v===0?'stroke-width="1.5"':''}/><text x="${l-8}" y="${Y(v)+5}" text-anchor="end" font-size="14" fill="${mut}">${v>0?'+':''}${fN(v)}</text>`; });
    s+=`<line x1="${xT}" x2="${xT}" y1="${t}" y2="${b}" stroke="${mut}" stroke-width="1.5" stroke-dasharray="6 4"/>`;

    const lab=[...list].filter(o=>o.q==='R'&&Math.abs(o.ev)<lim*0.97).sort((a,b)=>b.pc+b.ev/10-(a.pc+a.ev/10)).slice(0,10).map(o=>o.sw); const labS=new Set(lab); const used=[];
    [...list].sort((a,b)=>(a.grp?1:0)-(b.grp?1:0)).forEach(o=>{ const x=X(o.pc), y=Y(o.ev), c=qc[o.quad];

      if(labS.has(o.sw)||o.grp){ const right=x>r-140, tx=right? x-11 : x+11; if(used.some(u=>Math.abs(u[0]-tx)<70&&Math.abs(u[1]-y)<14)) return; used.push([tx,y]); s+=`<text x="${tx}" y="${y+5}" text-anchor="${right?'end':'start'}" font-size="13" fill="${ink}" font-weight="${o.grp?700:500}" paint-order="stroke" stroke="${th.surface||'#fff'}" stroke-width="3">${xs(niceName(S.sw[o.sw].name).split(' ').slice(-1)[0])}</text>`; } });

  const t=new DataTable('qdTab',[{k:'quad',l:'Zona',f:o=>`<span class="pill ql-${o.quad}">${esc(QL[o.quad][0])}</span>`,x:o=>QL[o.quad][0],sv:o=>ZO[o.quad]},{k:'name',l:'Nadador',f:o=>swLink(o.sw)+(o.grp?` <span class="pill acc">${esc(o.grp)}</span>`:'')+(o.al?' <span class="pill gold">⚑</span>':''),x:o=>niceName(S.sw[o.sw].name),sv:o=>S.sw[o.sw].nn},{k:'age',l:'Id.',num:1},{k:'club',l:'Clube',f:o=>esc(S.cl[S.R.cl[o.i]].code),sv:o=>S.cl[S.R.cl[o.i]].code},{k:'sp',l:'Pts por época',nosort:1,noexp:1,f:o=>sparkSw(o.sw)},{k:'pt',l:'Pts '+y,num:1},{k:'pc',l:'Percentil',num:1,f:o=>'P'+fN(o.pc),x:o=>Math.round(o.pc)},{k:'d',l:'Δ pts',num:1,f:o=>sg(o.d)},{k:'exp',l:'Esperado',num:1,f:o=>sg(o.exp),x:o=>Math.round(o.exp)},{k:'ev',l:'Face ao esperado',num:1,f:o=>`<span class="${o.ev>=0?'up':'down'}">${sg(o.ev)}</span>`,x:o=>Math.round(o.ev)}], list, {sorts:[{k:'quad',dir:'asc'},{k:'pc',dir:'desc'}], page:30});
  QDX={spec, t, ins, y};
}
async function qdModel(){ const x=QDX; return {title:`Quadrante de decisão — ${G_L[+QD.g]} ${QD.a0}–${QD.a1} anos · ${x.y}`, subtitle:`Nível alto a partir do percentil ${QD.thr} · ${QD.nat==='POR'?'nacionalidade portuguesa':'todas as nacionalidades'}`, filename:`Quadrante_${x.y}_${+QD.g?'F':'M'}`, orientation:'l', blocks:[{t:'p',text:'Leitura rápida\n'+insTxt(x.ins)},{t:'chart',title:'Quadrante de decisão',spec:x.spec},Object.assign({t:'table',sheet:'Nadadores',small:true},x.t.exportRows()),{t:'src',text:'Nível: percentil da melhor pontuação da época entre os nadadores ranqueados da mesma idade e género. Evolução face ao esperado: variação da melhor pontuação face à época anterior menos a mediana nacional dessa variação na mesma idade e género. Zonas: Investir (nível alto, evolução acima), Consolidar (nível alto, evolução abaixo), Em ascensão (nível abaixo do limiar, evolução acima), Monitorizar (ambos abaixo).'}]}; }

<script>
'use strict';
/* ============================================================
   Risco individual de abandono: modelo logístico treinado nas épocas passadas
   ============================================================ */
const AB = {g:'', a0:'13', a1:'19', lvl:'50', only:'1', nat:'POR', min:'0'};
let ABX=null;
const AB_F = ['a12','a13','a17','a19','a23','pct','dp','hasPrev','dp2','nev','evr','last','seas','club','fem','pb'];

/* uma linha por nadador e época: melhor pontuação, n.º de provas, última marca, clube, melhor marca pessoal */
function abSeasons(){
  const ck='abSeas'; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, out=new Map();   // sw -> Map(y -> o)
  for(let id=0; id<S.sw.length; id++){ const s=S.sw[id]; if(!s.n) continue; const rows=swRows(id); if(!rows.length) continue;
    rows.sort((a,b)=>R.yr[a]-R.yr[b]); const m=new Map(), pbBest=new Map();
    let k=0; while(k<rows.length){ const y=R.yr[rows[k]]; const o={y, pt:0, bi:-1, nev:0, last:-1e9, cl:new Map(), pb:0}; const yearRows=[];
      while(k<rows.length&&R.yr[rows[k]]===y){ const i=rows[k++]; yearRows.push(i); o.nev++; if(R.pt[i]>o.pt){ o.pt=R.pt[i]; o.bi=i; } if(R.dt[i]>o.last) o.last=R.dt[i]; o.cl.set(R.cl[i],(o.cl.get(R.cl[i])||0)+1); }
      for(const i of yearRows){ const e=R.ev[i]*2+R.co[i], b=pbBest.get(e); if(b!==undefined&&R.tm[i]<b) o.pb=1; }
      for(const i of yearRows){ const e=R.ev[i]*2+R.co[i], b=pbBest.get(e); if(b===undefined||R.tm[i]<b) pbBest.set(e,R.tm[i]); }
      o.club=[...o.cl.entries()].sort((a,b)=>b[1]-a[1])[0][0]; o.age=y-s.by; m.set(y,o); }
    out.set(id,m); }
  // percentil da melhor pontuação entre os da mesma época, idade e género
  const grp=new Map(); for(const [id,m] of out) for(const o of m.values()){ const k=o.y*256+o.age*2+(S.sw[id].g==='F'?1:0); let a=grp.get(k); if(!a){ a=[]; grp.set(k,a); } a.push(o); }
  for(const a of grp.values()){ a.sort((x,y)=>x.pt-y.pt); a.forEach((o,r)=>o.pct= a.length>1? r/(a.length-1) : .5); }
  D.cache.set(ck,out); return out;
}
function abFeatures(id, m, y){
  const o=m.get(y), p=m.get(y-1), p2=m.get(y-2), s=S.sw[id], a=o.age; const doy=d=>{ const x=dayToDate(d); return (x-Date.UTC(x.getUTCFullYear(),0,1))/86400000/365; };
  let seas=0; for(const yy of m.keys()) if(yy<=y) seas++;
  const v={a12:a<=12?1:0, a13:a>=13&&a<=14?1:0, a17:a>=17&&a<=18?1:0, a19:a>=19&&a<=22?1:0, a23:a>=23?1:0, pct:o.pct, dp:p? Math.max(-1.5,Math.min(1.5,(o.pt-p.pt)/100)) : 0, hasPrev:p?1:0,
    dp2:p&&p2? Math.max(-1.5,Math.min(1.5,(p.pt-p2.pt)/100)) : 0, nev:Math.log1p(o.nev), evr:p? Math.max(-1,Math.min(1,(o.nev-p.nev)/Math.max(p.nev,1))) : 0, last:doy(o.last), seas:Math.log1p(seas), club:p&&p.club!==o.club?1:0, fem:s.g==='F'?1:0, pb:o.pb};
  return AB_F.map(k=>v[k]);
}
/* regressão logística por Newton-Raphson (IRLS) com pequena penalização */
function fitLogit(X, Y, lam=1){
  const n=X.length, d=X[0].length+1; let w=new Float64Array(d);
  for(let it=0; it<25; it++){
    const g=new Float64Array(d), H=Array.from({length:d},()=>new Float64Array(d));
    for(let i=0;i<n;i++){ const x=X[i]; let z=w[0]; for(let k=1;k<d;k++) z+=w[k]*x[k-1]; const p=1/(1+Math.exp(-z)), e=p-Y[i], h=p*(1-p);
      g[0]+=e; for(let k=1;k<d;k++) g[k]+=e*x[k-1];
      H[0][0]+=h; for(let k=1;k<d;k++){ const hk=h*x[k-1]; H[0][k]+=hk; for(let l=k;l<d;l++) H[k][l]+=hk*x[l-1]; } }
    for(let k=0;k<d;k++){ for(let l=0;l<k;l++) H[k][l]=H[l][k]; if(k) { H[k][k]+=lam; g[k]+=lam*w[k]; } }
    const step=solveLin(H,g); let mx=0; for(let k=0;k<d;k++){ w[k]-=step[k]; mx=Math.max(mx,Math.abs(step[k])); } if(mx<1e-6) break; }
  return w;
}
function solveLin(A, b){ const n=b.length, M=A.map((r,i)=>[...r, b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r; [M[c],M[p]]=[M[p],M[c]]; const v=M[c][c]||1e-12;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/v; if(!f) continue; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
  return M.map((r,i)=>r[n]/(r[i]||1e-12)); }
const logitP=(w,x)=>{ let z=w[0]; for(let k=0;k<x.length;k++) z+=w[k+1]*x[k]; return 1/(1+Math.exp(-z)); };
function aucOf(P, Y){ const idx=P.map((p,i)=>i).sort((a,b)=>P[a]-P[b]); let r=0, n1=0; idx.forEach((i,k)=>{ if(Y[i]){ r+=k+1; n1++; } }); const n0=Y.length-n1; return n1&&n0? (r-n1*(n1+1)/2)/(n1*n0) : null; }

/* treino (épocas com as duas seguintes conhecidas e fechadas, sem 2020 como partida ou seguimento), validação na época mais recente possível
   com treino só em épocas cujo desfecho (y+1, y+2) termina antes do período de desfecho do teste */
function abModel(){
  const ck='abModel'; if(D.cache.has(ck)) return D.cache.get(ck);
  const L=lastClosed(), SE=abSeasons(), ys=new Set(S.years), samples=[];
  for(const [id,m] of SE) for(const y of m.keys()){ if(y+2>L||!ys.has(y+1)||!ys.has(y+2)) continue; if(y===2020||y+1===2020||y+2===2020) continue; /* pandemia: 2020 nem como época de partida nem de seguimento */ const a=m.get(y).age; if(a<10||a>30) continue;
    samples.push({id, y, x:abFeatures(id,m,y), out:(!m.has(y+1)&&!m.has(y+2))?1:0, a, pct:m.get(y).pct}); }
  if(samples.length<500) { D.cache.set(ck,null); return null; }
  const yT=Math.max(...samples.map(s=>s.y)), tr=samples.filter(s=>s.y<=yT-2), te=samples.filter(s=>s.y===yT);   // treino só com desfechos conhecidos antes de yT+1
  let val=null; if(tr.length>500&&te.length>100){ const w0=fitLogit(tr.map(s=>s.x), tr.map(s=>s.out)); const P=te.map(s=>logitP(w0,s.x)), Y=te.map(s=>s.out);
    const cal=[]; for(let b=0;b<10;b++){ const k=P.map((p,i)=>i).filter(i=>Math.min(9,Math.floor(P[i]*10))===b); if(k.length>=15) cal.push({b, pred:mean(k.map(i=>P[i]))*100, obs:mean(k.map(i=>Y[i]))*100, n:k.length}); }
    const top=P.map((p,i)=>i).sort((a,b)=>P[b]-P[a]); const q=Math.floor(top.length/5); const capt=top.slice(0,q).filter(i=>Y[i]).length/Math.max(1,Y.filter(Boolean).length)*100;
    val={y:yT, n:te.length, auc:aucOf(P,Y), base:mean(Y)*100, cal, capt}; }
  const w=fitLogit(samples.map(s=>s.x), samples.map(s=>s.out));
  const mu=AB_F.map((_,k)=>mean(samples.map(s=>s.x[k])));
  // taxa observada por idade e nível (contexto)
  const rate=[]; for(let a=11;a<=22;a++){ const L1=samples.filter(s=>s.a===a&&s.pct>=.75), L0=samples.filter(s=>s.a===a&&s.pct<.75); rate.push({a, hi:L1.length>=30? mean(L1.map(s=>s.out))*100 : null, lo:L0.length>=30? mean(L0.map(s=>s.out))*100 : null}); }
  const res={w, mu, val, n:samples.length, y0:Math.min(...samples.map(s=>s.y)), y1:yT, rate, base:mean(samples.map(s=>s.out))*100}; D.cache.set(ck,res); return res;
}
/* fatores que mais pesam no risco de um nadador (contribuição face ao nadador médio) */
function abFactors(M, id, m, y, x){
  const o=m.get(y), p=m.get(y-1), F=[]; const c=k=>M.w[k+1]*(x[k]-M.mu[k]); const i=n=>AB_F.indexOf(n);
  const add=(v,t)=>{ if(v>0.12) F.push([v,t]); };
  const ageK=['a12','a13','a17','a19','a23'].map(i).reduce((s,k)=>s+c(k),0); add(ageK, `idade (${o.age} anos) com abandono frequente`);
  const dir=n=>x[i(n)]-M.mu[i(n)];   // sentido face ao nadador médio: o texto descreve o que o nadador realmente tem
  add(c(i('pct')), `nível ${dir('pct')<0?'baixo':'alto'} para a idade (P${fN(Math.round(o.pct*100))})`);
  add(c(i('dp'))+c(i('hasPrev')), p? `pontuação ${o.pt<p.pt-5?'desceu':o.pt<=p.pt+5?'estagnou':'pouco subiu'} (${o.pt-p.pt>0?'+':o.pt<p.pt?'−':'±'}${Math.abs(o.pt-p.pt)} pts)` : 'primeira época no ranking');
  const p2=m.get(y-2); if(p&&p2) add(c(i('dp2')), p.pt<=p2.pt+5? 'já tinha estagnado ou descido na época anterior' : `subiu ${p.pt-p2.pt} pts na época anterior`);
  add(c(i('nev'))+c(i('evr')), p&&o.nev<p.nev? `menos provas ranqueadas (${o.nev} vs ${p.nev})` : p&&o.nev>p.nev? `mais provas ranqueadas (${o.nev} vs ${p.nev})` : `${dir('nev')<0?'poucas':'muitas'} provas ranqueadas (${o.nev})`);
  add(c(i('last')), `última marca em ${MONTHS[dayToDate(o.last).getUTCMonth()].toLowerCase()}`);
  add(c(i('club')), x[i('club')]? 'mudou de clube' : 'manteve o clube');
  add(c(i('pb')), x[i('pb')]? 'com melhor marca pessoal na época' : 'sem melhor marca pessoal na época');
  add(c(i('seas')), dir('seas')>0? 'muitas épocas no ranking' : 'poucas épocas no ranking');
  return F.sort((a,b)=>b[0]-a[0]).slice(0,3).map(f=>f[1]);
}
function abList(){
  const M=abModel(); if(!M) return null; const L=lastClosed(), cur=lastYear(), SE=abSeasons(), R=S.R, out=[];
  for(const [id,m] of SE){ const o=m.get(L); if(!o) continue; const s=S.sw[id]; const x=abFeatures(id,m,L), r=logitP(M.w,x)*100;
    out.push({id, name:niceName(s.name), g:s.g, nat:s.nat, age:o.age, club:S.cl[o.club].code, clubN:S.cl[o.club].name, pt:o.pt, pct:o.pct*100, d:m.has(L-1)? o.pt-m.get(L-1).pt : null, nev:o.nev, last:o.last, risk:r, seen:cur>L&&m.has(cur), x, m}); }
  return {M, L, cur, list:out};
}

function vAbandono(root){
  root.innerHTML=`<div class="view-head"><div><h2>Risco de abandono</h2><div class="sub">Probabilidade de cada nadador deixar de aparecer nos rankings nacionais nas duas épocas seguintes, estimada com o que aconteceu a milhares de nadadores em épocas passadas (idade, nível para a idade, evolução, número de provas, altura da última marca, mudança de clube). Serve para uma conversa a tempo com o clube e o treinador — não é uma certeza: inclui quem muda para o estrangeiro, se lesiona ou passa a nadar só em masters.</div></div>${expHTML('ab')}</div>
  <div class="fbar sticky">${segHTML('abG',gOpts,AB.g,'Género')}<label class="fld"><span>Idades</span><div class="row" style="gap:4px"><input type="number" id="abA0" style="width:64px" value="${esc(AB.a0)}"><input type="number" id="abA1" style="width:64px" value="${esc(AB.a1)}"></div></label>
    ${selHTML('abL',[['90','Percentil 90+'],['75','Percentil 75+'],['50','Percentil 50+'],['0','Todos']],AB.lvl,'Nível para a idade')}${selHTML('abM',[['0','Qualquer risco'],['30','Risco ≥ 30%'],['50','Risco ≥ 50%']],AB.min,'Risco')}${selHTML('abO',[['1','Só sem marcas na época em curso'],['0','Todos']],AB.only,'Época em curso')}${selHTML('abN',[['POR','Portuguesa'],['','Todas']],AB.nat,'Nacionalidade')}</div>
  <div id="abC" class="view"><div class="loading"><div>A treinar o modelo com as épocas passadas…</div><div class="bar"><i></i></div></div></div>`;
  const u=()=>abContent(); bindSeg(root,'abG',v=>{ AB.g=v; u(); });

}
function abContent(){
  const el=$('#abC'); const X=abList(); if(!X){ el.innerHTML='<div class="card empty">Épocas insuficientes para treinar o modelo (são precisas pelo menos 4 épocas fechadas).</div>'; ABX=null; return; }
  const {M,L,cur}=X, a0=+AB.a0||10, a1=+AB.a1||30, partial=cur>L;
  const rows=X.list.filter(r=>(AB.g===''||(r.g==='F')===(AB.g==='1'))&&r.age>=a0&&r.age<=a1&&r.pct>=+AB.lvl&&r.risk>=+AB.min&&(AB.nat!=='POR'||r.nat==='POR')&&(AB.only!=='1'||!partial||!r.seen));
  rows.forEach(r=>{ r.f=abFactors(M,r.id,r.m,L,r.x); }); rows.sort((a,b)=>b.risk-a.risk);
  const hi=rows.filter(r=>r.risk>=50).length, v=M.val;
  const ins=[`${fN(rows.length)} nadadores de ${L} com estes filtros${partial&&AB.only==='1'?` que ainda não têm marcas em ${cur}`:''}; ${fN(hi)} com risco de 50% ou mais.`,
    rows.length? `Risco mais alto: ${rows.slice(0,3).map(r=>`${esc(r.name)} (${fN(r.risk)}%${r.f[0]?' — '+esc(r.f[0]):''})`).join('; ')}.` : '',
    (()=>{ const r15=M.rate.find(r=>r.a===15), r18=M.rate.find(r=>r.a===18); return `Em média, ${fN(M.base)}% dos nadadores de uma época deixam de aparecer nas duas seguintes.`+(r15&&r18&&r15.hi!=null&&r18.hi!=null? ` Entre os 25% melhores para a idade, o abandono passa de ${fN(r15.hi)}% aos 15 anos para ${fN(r18.hi)}% aos 18; nos restantes, de ${fN(r15.lo)}% para ${fN(r18.lo)}%.` : ''); })(),
    v? `Fiabilidade: testado em ${v.y}, os 20% de nadadores com risco mais alto incluíam ${fN(v.capt)}% de quem realmente abandonou (AUC ${f2(v.auc)}; 0,5 = acaso, 1 = perfeito).` : ''];
  const spec={labels:M.rate.map(r=>String(r.a)), series:[{label:'Nível P75+ para a idade',data:M.rate.map(r=>r.hi==null?null:+r.hi.toFixed(1)),color:'s1'},{label:'Restantes',data:M.rate.map(r=>r.lo==null?null:+r.lo.toFixed(1)),color:'muted'}], type:'line', yFmt:v=>fN(v)+'%', tipFmt:v=>f1(v)+'%', zero:true, legend:true, xTitle:'Idade', noAnnot:true};
  el.innerHTML=insightHTML(ins)+`<div class="card"><div class="card-h"><div><h3>Nadadores com risco de abandono · ${L}</h3><p class="note">Risco = probabilidade estimada de não aparecer nos rankings em ${L+1} nem em ${L+2}. Fatores = o que mais aumenta o risco deste nadador face ao nadador médio.${partial?` “${cur}” indica quem já tem marcas na época em curso.`:''}</p></div></div><div id="abT"></div></div>
  <div class="card"><div class="card-h"><div><h3>Abandono por idade e nível</h3><p class="note">Percentagem de nadadores que deixaram de aparecer nas duas épocas seguintes, épocas de partida ${M.y0}–${M.y1} (excluídas 2018–2020: 2020 como época de partida ou de seguimento).</p></div></div><div class="chart short" id="abCh"></div></div>`;
  const t=new DataTable('abT',[{k:'risk',l:'Risco',num:1,f:r=>`<span class="pill ${r.risk>=50?'bad':r.risk>=30?'gold':''}">${fN(r.risk)}%</span>`,x:r=>Math.round(r.risk)},{k:'name',l:'Nadador',f:r=>swLink(r.id,r.name),x:r=>r.name},{k:'sp',l:'Pts por época',nosort:1,noexp:1,f:r=>sparkSw(r.id)},{k:'age',l:'Id.',num:1},{k:'club',l:'Clube',f:r=>`<span title="${esc(r.clubN)}">${esc(r.club)}</span>`,x:r=>r.club},{k:'pt',l:'Pts '+L,num:1},{k:'pct',l:'Nível',num:1,f:r=>'P'+fN(Math.round(r.pct)),x:r=>Math.round(r.pct),title:'Percentil entre os da mesma idade e género'},{k:'d',l:'Δ pts',num:1,f:r=>r.d==null?'—':`<span class="${r.d>=0?'up':'down'}">${sg(r.d)}</span>`,x:r=>r.d??''},{k:'nev',l:'Provas',num:1},{k:'last',l:'Última marca',f:r=>fD(r.last),sv:r=>r.last},...(partial?[{k:'seen',l:String(cur),f:r=>r.seen?'<span class="pill good">Já competiu</span>':'<span class="muted">—</span>',x:r=>r.seen?'Sim':'Não'}]:[]),{k:'f',l:'Fatores',cls:'wrap',f:r=>r.f.length? esc(r.f.join(' · ')) : '<span class="muted">sem fator dominante</span>',x:r=>r.f.join(' · ')}], rows, {page:30, sorts:[{k:'risk',dir:'desc'}]});
  draw('abCh',spec); ABX={t, ins:ins.filter(Boolean), spec, L, M};
}
async function abModelExp(){ const x=ABX; return {title:'Risco de abandono — '+x.L, subtitle:`${AB.g===''?'Ambos os géneros':G_L[+AB.g]} · ${AB.a0}–${AB.a1} anos · nível ${AB.lvl==='0'?'todos':'P'+AB.lvl+'+'}`, filename:'Risco_abandono_'+x.L, orientation:'l', blocks:[{t:'p',text:'Leitura rápida\n'+insTxt(x.ins.map(stripTags))}, Object.assign({t:'table',sheet:'Risco',small:true},x.t.exportRows()), {t:'chart',title:'Abandono por idade e nível',spec:x.spec}, {t:'src',text:`Modelo de regressão logística treinado com ${fN(x.M.n)} nadador-época (épocas de partida ${x.M.y0}–${x.M.y1}, sem 2018–2020). Abandono = sem marcas nos rankings nacionais nas duas épocas seguintes. Inclui saídas para o estrangeiro, lesões ou passagem a masters. É uma estimativa estatística para apoiar o acompanhamento, não uma previsão individual.`}]}; }
