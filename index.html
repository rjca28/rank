/* =================== ALERTAS =================== */
const AL = {y:null, top:'24', amin:'15', w:'1', basis:'global', stat:'mean', crit:'both', minev:'1', g:'', co:''};
function alertParams(p){ return {y:+(p.y||lastYear()), top:+p.top, amin:+p.amin, w:+p.w, basis:p.basis, stat:p.stat, crit:p.crit, minev:+p.minev, g:p.g, co:p.co}; }
function computeAlerts(pp){
  const p=alertParams(pp), ck='al'+JSON.stringify(p); if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, L=p.y, st = v => !v||!v.length? NaN : p.stat==='median'? quantile(v,.5) : mean(v);
  const cand=new Map(); let nCand=0, nPairs=0;
  for(let i=0;i<R.n;i++){
    if(R.yr[i]!==L || D.RK[i]>p.top || D.AGE[i]<p.amin) continue;
    if(p.g!==''&&D.G[i]!==+p.g) continue; if(p.co!==''&&R.co[i]!==+p.co) continue;
    nCand++;
    const ev=R.ev[i], co=R.co[i], g=D.G[i], a=pairMap(ev,co,g,'').get(R.sw[i]), prev=a&&a.get(L-p.w);
    let o=cand.get(R.sw[i]); if(!o){ o={sw:R.sw[i], top:[], evs:[], nopair:0}; cand.set(R.sw[i],o); }
    o.top.push(i);
    if(prev===undefined){ o.nopair++; continue; }
    nPairs++;
    const d=(R.tm[prev]-R.tm[i])/R.tm[prev]*100/p.w;
    const yrP=progRates(ev,co,g,'',L,L,p.w), allP=progRates(ev,co,g,'',null,null,p.w);
    const refY = p.basis==='age' ? st(yrP.get(D.AGE[i])) : st(yrP.all);
    const refA = p.basis==='age' ? st(allP.get(D.AGE[i])) : st(allP.all);
    const pass = p.crit==='both' ? (d>refY && d>refA) : p.crit==='year' ? d>refY : d>refA;
    const e={i, ev, co, prev, d, refY, refA, pass, ex: d-Math.max(isFinite(refY)?refY:-Infinity, isFinite(refA)?refA:-Infinity)};
    o.evs.push(e);
  }
  const list=[];
  for(const o of cand.values()){ const ok=o.evs.filter(e=>e.pass); if(ok.length<p.minev || !ok.length) continue; const s=S.sw[o.sw];
    const bestRk=Math.min(...o.top.map(i=>D.RK[i])); const bi=o.top.reduce((m,i)=>R.pt[i]>R.pt[m]?i:m,o.top[0]);
    list.push({sw:o.sw, year:L, age:L-s.by, g:s.g, esc:ESC_F[escF(L-s.by)].n, club:S.cl[R.cl[bi]].code, clubName:S.cl[R.cl[bi]].name, ntop:o.top.length, npair:o.evs.length, n:ok.length, evs:ok.sort((a,b)=>b.ex-a.ex), all:o.evs, ex:mean(ok.map(e=>e.ex)), bestRk, bpts:R.pt[bi], type: ok.length>=2?'Várias provas':'Prova específica'}); }
  list.sort((a,b)=>b.n-a.n||b.ex-a.ex);
  const res={p, list, nCand, nSw:cand.size, nPairs};
  D.cache.set(ck,res); return res;
}
function alertIndex(){ const ck='alidx'; if(D.cache.has(ck)) return D.cache.get(ck); const r=computeAlerts(AL); const m=new Map(r.list.map(a=>[a.sw,{year:a.year, evs:a.evs}])); D.cache.set(ck,m); return m; }

  const slotCell=(y,g,co)=>{ const key=slotKey(y,g,co), p=S.uploads.get(key), id='sf_'+key;
    if(p) return `<td class="slot-td" data-drop="${key}"><div class="slot ok"><div><b>${fN(p.cols.tm.length)}</b> marcas · ${fN(p.sw.length)} nad.</div><small title="${esc(p.file||'')}">${esc((p.file||'').slice(0,34))}${p.uploadedAt?' · '+esc(new Date(p.uploadedAt).toLocaleDateString('pt-PT')):''}</small>${p.combined?'<small class="warn" title="Ficheiro com várias piscinas ou géneros: cada nadador pode ter só a melhor marca entre PL e PC.">⚠ ficheiro combinado</small>':''}${canW?`<div class="slot-act"><label class="lnkbtn" for="${id}">Substituir</label><button type="button" class="lnkbtn" data-rm="${key}">Remover</button></div><input type="file" id="${id}" data-slot="${key}" accept=".xlsx,.xls" hidden>`:''}</div></td>`;
    return `<td class="slot-td" data-drop="${key}">${canW?`<label class="slot empty" for="${id}">+ Carregar</label><input type="file" id="${id}" data-slot="${key}" accept=".xlsx,.xls" hidden>`:'<span class="muted small">—</span>'}</td>`; };
  const rowsHTML = ys.map(y=>{ const o=S.yinfo[y]; const nsl=SLOTS.filter(([g,co])=>S.uploads.has(slotKey(y,g,co))).length;
    return `<tr><td><b>${y}</b>${o&&isPartial(y)?' <span class="pill gold">parcial</span>':''}<br><span class="small muted">${nsl}/4 listas</span></td>${SLOTS.map(([g,co])=>slotCell(y,g,co)).join('')}<td class="num">${o?fN(o.nsw):'—'}</td><td class="num">${o?fN(o.rows):'—'}</td><td>${o?fD(o.maxDt):'—'}</td><td>${canW&&nsl?`<button type="button" class="btn ghost small" data-rmy="${y}">Remover época</button>`:''}</td></tr>`; }).join('');
  root.innerHTML = `
  <div class="view-head"><div><h2>Dados e atualização</h2><div class="sub">Para cada época, carregue os quatro rankings nacionais absolutos: masculinos em piscina curta e em piscina longa, femininos em piscina curta e em piscina longa. Assim cada nadador fica com as suas marcas de PL e de PC, sem limitação à mais pontuada.</div></div></div>
  ${!hasData()?`<div class="card" style="border-color:var(--gold)"><h3>Ainda não há rankings carregados</h3><p class="note">Comece por carregar os rankings de uma época na tabela abaixo (uma lista por célula) ou arraste vários ficheiros para a zona “Carregar vários ficheiros”. A época, o género e a piscina são lidos do conteúdo de cada ficheiro.</p></div>`:''}
  <div class="card"><div class="card-h"><div><h3>Rankings por época</h3><p class="note">${hasData()?`${fN(S.n)} marcas individuais · ${fN(S.sw.filter(s=>s.n).length)} nadadores · ${S.years.length} época${S.years.length>1?'s':''}`:'Sem dados'} · ${esc(modeTxt)}</p></div>
    ${canW?`<div class="row"><label class="fld"><span>Acrescentar época</span><input type="number" id="daNewY" min="1990" max="${cy+1}" value="${nextY}"></label><button class="btn" id="daAddY">Acrescentar</button></div>`:''}</div>
    <div class="tbl-wrap"><table class="t slots-t"><thead><tr><th>Época</th>${SLOTS.map(([g,co])=>`<th>${esc(slotLabel(g,co))}</th>`).join('')}<th class="num">Nadadores</th><th class="num">Marcas</th><th>Última marca</th><th></th></tr></thead><tbody>${rowsHTML}</tbody></table></div>
    <div id="daMsg" class="small" style="margin-top:10px;display:grid;gap:4px"></div></div>
  <div class="grid g2">
    ${canW?`<div class="card"><h3>Carregar vários ficheiros</h3><p class="note">Vários rankings de uma vez, de uma ou mais épocas. Cada ficheiro é colocado automaticamente na época, género e piscina corretos. Uma lista já existente é substituída.</p><label class="drop" id="daDrop" for="daFile" style="display:block;margin-top:12px"><b>Escolher ficheiros</b> ou arrastar para aqui<br><span class="small">.xlsx · um ou mais ficheiros</span></label><input type="file" id="daFile" accept=".xlsx,.xls" multiple hidden></div>`:''}
    <div class="card"><h3>Cópia de segurança</h3><p class="note">Guarda todos os rankings carregados num ficheiro JSON, que pode ser restaurado noutro computador ou noutra cópia desta plataforma.</p>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="daBk" ${hasData()?'':'disabled'}>Guardar base de dados (JSON)</button>${canW?`<label class="btn" for="daRs">Restaurar a partir de JSON</label><input type="file" id="daRs" accept=".json,application/json" hidden>`:''}</div>
      <div id="daBkMsg" class="small" style="margin-top:8px;display:grid;gap:4px"></div></div>
  </div>
  <div class="card"><details class="method"><summary>Notas metodológicas</summary><ul>
    <li>Fonte: rankings nacionais absolutos anuais (1 jan–31 dez) exportados pela FPN, um ficheiro por género e piscina (uma folha por prova). Se carregar um ficheiro com várias piscinas ou géneros, é dividido automaticamente, mas nesse caso cada nadador pode ter apenas a melhor marca entre PL e PC.</li>
    <li>Cada lista tem um número fixo de marcas por prova, por isso o número total de nadadores e a média geral de pontos dependem do corte de cada época. Para comparar épocas, use a média dos 50 melhores ou fixe uma pontuação mínima.</li>
    <li>São usadas as provas individuais. Parciais (folhas “Lap”), estafetas e a folha “Top Results” ficam de fora.</li>
    <li>Pontuação: a que vem em cada ficheiro (tabela World Aquatics indicada na exportação). Para comparar épocas, convém exportar todos os anos com a mesma tabela de pontos.</li>
    <li>Idade = ano do ranking − ano de nascimento. Escalões FPN 2025/26 aplicados a todas as épocas: Cadetes ≤12, Infantis 13–14, Juvenis 15–16, Juniores 17–18, Seniores 19+ (com subdivisões A/B).</li>
    <li>Posição nacional: ordem por tempo na prova, piscina, género e época, incluindo todos os nadadores presentes no ranking. Ranking histórico: posição entre as melhores marcas de sempre de cada nadador presente na base.</li>
    <li>Médias nacionais, percentis e taxas de melhoria referem-se aos nadadores presentes no ranking. A taxa de melhoria usa pares de épocas do mesmo nadador na mesma prova e piscina.</li>
    <li>Um nadador é identificado por nome e data de nascimento. Grafias diferentes do nome entre épocas originam registos separados.</li>
  </ul></details></div>`;
  const msg=$('#daMsg');
  $$('input[data-slot]',root).forEach(inp=>inp.onchange=()=>{ if(inp.files[0]) handleSlotUpload(inp.files[0], inp.dataset.slot, root); });
  $$('td[data-drop]',root).forEach(td=>{ if(!canW) return; td.addEventListener('dragover',e=>{e.preventDefault(); td.classList.add('over');}); td.addEventListener('dragleave',()=>td.classList.remove('over')); td.addEventListener('drop',e=>{ e.preventDefault(); td.classList.remove('over'); const f=[...e.dataTransfer.files].find(f=>/\.xlsx?$/i.test(f.name)); if(f) handleSlotUpload(f, td.dataset.drop, root); }); });
  root.querySelector('.slots-t').addEventListener('click',async e=>{
    const b=e.target.closest('[data-rm],[data-rmy]'); if(!b) return;
    if(b.dataset.confirm!=='1'){ b.dataset.confirm='1'; b.textContent='Confirmar'; b.classList.add('danger'); return; }
    b.disabled=true;
    const keys = b.dataset.rm ? [b.dataset.rm] : SLOTS.map(([g,co])=>slotKey(+b.dataset.rmy,g,co)).filter(k=>S.uploads.has(k));
    for(const k of keys) await removeUpload(k);
    if(b.dataset.rmy) DA.extra.add(+b.dataset.rmy);
    assemble(); _clubOpts=null; refreshHeader(); toast(keys.length>1?'Época removida.':'Lista removida.'); vDados(root);
  });
  const ay=$('#daAddY'); if(ay) ay.onclick=()=>{ const y=+$('#daNewY').value; if(y>=1990&&y<=cy+1){ DA.extra.add(y); vDados(root); } };
  const inp=$('#daFile'), drop=$('#daDrop');
  if(inp){ inp.onchange=()=>{ if(inp.files.length) handleUploads([...inp.files], root); };
    drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('over');}); drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('over'); const f=[...e.dataTransfer.files].filter(f=>/\.xlsx?$/i.test(f.name)); if(f.length) handleUploads(f, root);}); }
  $('#daBk').onclick=async()=>{ const b=$('#daBk'); b.disabled=true; b.textContent='A preparar…'; try{ const {blob,name,info}=buildBackup(); $('#daBkMsg').innerHTML=`<span>${esc(info)}</span>`; await saveFile(name, blob); }catch(e){ console.error(e); toast('Erro: '+(e.message||e)); } finally{ b.disabled=false; b.textContent='Guardar base de dados (JSON)'; } };
  const rs=$('#daRs'); if(rs) rs.onchange=()=>{ if(rs.files[0]) restoreBackup(rs.files[0], root); };
}
function logLine(el, html){ const d=document.createElement('div'); d.innerHTML=html; el.appendChild(d); return d; }
function afterDataChange(root, msgId, keep){ assemble(); _clubOpts=null; refreshHeader(); vDados(root); if(keep!=null) $('#'+msgId).innerHTML=keep; }
async function handleSlotUpload(file, key, root){
  const [y,g,co]=key.split('_'); const msg=$('#daMsg'); msg.innerHTML='';
  const line=logLine(msg, `${esc(file.name)}: a ler…`);
  try{
    const p=await parseRankingFile(file); const parts=splitPayload(p);
    if(p.year!==+y) throw new Error(`o ficheiro é da época ${p.year}, não de ${y}. Use a linha ${p.year} ou a zona “Carregar vários ficheiros”.`);
    const part=parts.find(q=>q.g===g&&q.co===+co);
    if(!part) throw new Error(`o ficheiro não contém ${slotLabel(g,+co)}; contém ${parts.map(q=>slotLabel(q.g,q.co)).join(', ')}.`);
    part.file=file.name; part.uploadedAt=new Date().toISOString();
    line.innerHTML=`${esc(file.name)}: ${fN(part.cols.tm.length)} marcas de ${esc(slotLabel(g,+co))} ${y}. A guardar…`;
    const where=await saveUpload(part); S.uploads.set(key, part);
    const other = parts.length>1 ? ` O ficheiro tinha também ${parts.filter(q=>q!==part).map(q=>slotLabel(q.g,q.co)).join(', ')}, que não foram usados nesta célula.` : '';
    const keep=`<span><span class="pill good">${y} · ${esc(slotLabel(g,+co))}</span> ${fN(part.cols.tm.length)} marcas · ${where==='shared'?'guardado na plataforma':'guardado neste navegador'}.${other}</span>`;
    afterDataChange(root,'daMsg',keep); toast(`${slotLabel(g,+co)} ${y} carregado.`);
  }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
}
async function handleUploads(files, root){
  const msg=$('#daMsg'); msg.innerHTML=''; msg.scrollIntoView({behavior:'smooth',block:'center'}); let ok=0;
  files.sort((a,b)=>a.name.localeCompare(b.name));
  for(const file of files){
    const line=logLine(msg, `${esc(file.name)}: a ler…`);
    try{
      const p=await parseRankingFile(file), parts=splitPayload(p), out=[];
      for(const q of parts){ q.file=file.name; q.uploadedAt=new Date().toISOString(); const where=await saveUpload(q); S.uploads.set(slotKey(q.year,q.g,q.co), q); out.push(`${slotLabel(q.g,q.co)} (${fN(q.cols.tm.length)})`); ok++; }
      line.innerHTML=`<span><span class="pill good">${p.year}</span> ${esc(file.name)} → ${esc(out.join(' · '))}${parts.length>1?' <span class="pill gold">ficheiro combinado</span>':''}</span>`;
    }catch(e){ console.error(e); line.innerHTML=`<span><span class="pill bad">Erro</span> ${esc(file.name)}: ${esc(e.message||String(e))}</span>`; }
  }
  if(ok){ const keep=msg.innerHTML; afterDataChange(root,'daMsg',keep); toast(`${ok} lista${ok>1?'s':''} carregada${ok>1?'s':''}.`); }
}
function refreshHeader(){ $('#hdrSub').textContent = hasData() ? `Rankings nacionais absolutos ${S.years[0]}–${lastYear()} · FPN · Direção Técnica Nacional` : 'Sem rankings carregados · FPN · Direção Técnica Nacional'; }
function buildBackup(){
  const lists=[...S.uploads.values()].sort((a,b)=>a.year-b.year||a.g.localeCompare(b.g)||a.co-b.co);
  const obj={format:'observatorio-natacao-pura', version:2, created:new Date().toISOString(), source:'Observatório Natação Pura · FPN · Direção Técnica Nacional', summary:{lists:lists.length, first:S.years[0], last:lastYear(), marks:S.n}, lists};
  const json=JSON.stringify(obj);
  const name=`Observatorio_NP_base_${S.years[0]}-${lastYear()}_${todayISO()}.json`;
  return {blob:new Blob([json],{type:'application/json'}), name, info:`${lists.length} listas · ${S.years.length} épocas · ${fN(S.n)} marcas · ${(json.length/1048576).toFixed(1).replace('.',',')} MB`};
}
async function restoreBackup(file, root){
  const msg=$('#daBkMsg'); msg.innerHTML=''; const l0=logLine(msg,'A ler o ficheiro…');
  let obj; try{ obj=JSON.parse(await file.text()); }catch(e){ l0.innerHTML='<span class="pill bad">Erro</span> O ficheiro não é um JSON válido.'; return; }
  const src = obj && obj.format==='observatorio-natacao-pura' ? (obj.lists || obj.years) : (obj && obj.year && obj.cols ? [obj] : null);
  if(!Array.isArray(src)){ l0.innerHTML='<span class="pill bad">Erro</span> O ficheiro não é uma cópia de segurança do Observatório.'; return; }
  if(src.find(p=>!p||!p.year||!p.cols||!Array.isArray(p.cols.tm)||!Array.isArray(p.sw))){ l0.innerHTML='<span class="pill bad">Erro</span> A cópia de segurança está incompleta ou danificada.'; return; }
  const parts=[]; for(const p of src){ if(p.g && p.co!=null) parts.push(p); else parts.push(...splitPayload(p)); }
  l0.innerHTML=`Cópia de ${obj.created?esc(new Date(obj.created).toLocaleString('pt-PT')):'data desconhecida'} · ${parts.length} listas.`;
  let saved=0, fail=0;
  for(const p of parts){
    const ln=logLine(msg, `${p.year} · ${esc(slotLabel(p.g,p.co))}: a guardar…`);
    try{ p.uploadedAt=p.uploadedAt||new Date().toISOString(); p.file=p.file||('restauro '+file.name); const where=await saveUpload(p); S.uploads.set(slotKey(p.year,p.g,p.co),p); saved++; ln.innerHTML=`<span><span class="pill good">${p.year}</span> ${esc(slotLabel(p.g,p.co))} · ${fN(p.cols.tm.length)} marcas · ${where==='shared'?'plataforma':'navegador'}</span>`; }
    catch(e){ fail++; ln.innerHTML=`<span><span class="pill bad">${p.year}</span> ${esc(slotLabel(p.g,p.co))}: ${esc(e.message||e.code||String(e))}</span>`; }
  }
  const keep=msg.innerHTML+`<div><b>Restauro concluído:</b> ${saved} lista${saved!==1?'s':''} restaurada${saved!==1?'s':''}${fail?`, ${fail} com erro`:''}.</div>`;
  afterDataChange(root,'daBkMsg',keep); toast('Restauro concluído.');
}

</script>
<script>
'use strict';
/* ============================================================
   Exportação: Excel (SheetJS) · PDF (jsPDF) · Word (DOCX via JSZip)
   ============================================================ */
const NAVY=[4,44,83], BLUE=[24,95,165], GOLD=[186,117,23];
async function saveFile(filename, data){
  if(CAP.dl){
    try{ await CAP.dl.save({filename, data}); toast('Ficheiro pronto: '+filename); }
    catch(e){ if(e&&e.code==='declined') return; toast('Não foi possível guardar o ficheiro ('+(e.code||e.message)+').'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
  toast('Ficheiro gerado: '+filename);
}
function pairCharts(m){
  if(m.orientation!=='l') return m;
  const out=[]; const bl=m.blocks;
  for(let k=0;k<bl.length;k++){ if(bl[k].t==='chart' && bl[k+1] && bl[k+1].t==='chart'){ out.push({t:'charts', items:[bl[k],bl[k+1]]}); k++; } else out.push(bl[k]); }
  return Object.assign({}, m, {blocks:out});
}
async function exportModel(m, fmt){
  if(fmt!=='xlsx') m = pairCharts(m);
  const stamp = new Date().toLocaleDateString('pt-PT');
  if(fmt==='xlsx') return saveFile(m.filename+'.xlsx', buildXLSX(m, stamp));
  if(fmt==='pdf') return saveFile(m.filename+'.pdf', await buildPDF(m, stamp));
  if(fmt==='docx') return saveFile(m.filename+'.docx', await buildDOCX(m, stamp));
}

/* ---------- Excel ---------- */
function buildXLSX(m, stamp){
  if(!window.XLSX) throw new Error('Biblioteca Excel indisponível');
  const wb=XLSX.utils.book_new(), used=new Set();
  const sname = s => { let b=String(s||'Folha').replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31).trim()||'Folha', n=b, k=2; while(used.has(n)){ n=b.slice(0,28)+' '+k++; } used.add(n); return n; };
  const info=[[m.title],[m.subtitle||''],['Gerado em '+stamp+' · Observatório Natação Pura · FPN']];
  const kp=m.blocks.find(b=>b.t==='kpis'); if(kp){ info.push([]); kp.items.forEach(it=>info.push([it[0], it[1], it[2]||''])); }
  const p=m.blocks.filter(b=>b.t==='p'); if(m.decl) p.forEach(b=>info.push([],[b.text]));
  const ws0=XLSX.utils.aoa_to_sheet(info); ws0['!cols']=[{wch:34},{wch:18},{wch:50}]; XLSX.utils.book_append_sheet(wb, ws0, sname('Informação'));
  m.blocks.filter(b=>b.t==='table').forEach(b=>{
    const rows=b.rows.map(r=>r.map(v=>{ if(typeof v==='string' && /^[-+]?\d+(\.\d+)?$/.test(v.trim()) && v.trim().length<12 && !/^0\d/.test(v.trim())) return Number(v); return v; }));
    const ws=XLSX.utils.aoa_to_sheet([b.head, ...rows]);
    ws['!cols']=b.head.map((h,k)=>({wch: Math.min(48, Math.max(String(h).length, ...rows.slice(0,300).map(r=>String(r[k]??'').length))+2)}));
    ws['!autofilter']={ref: XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:b.head.length-1}})};
    ws['!freeze']={xSplit:0,ySplit:1};
    XLSX.utils.book_append_sheet(wb, ws, sname(b.sheet||'Tabela'));
  });
  return XLSX.write(wb,{bookType:'xlsx',type:'array'});
}

/* ---------- PDF ---------- */
async function buildPDF(m, stamp){
  if(!window.jspdf) throw new Error('Biblioteca PDF indisponível');
  const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:m.orientation||'p', unit:'mm', format:'a4'});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=m.decl?20:12, CW=W-2*M;
  let y;
  const newPage=()=>{ doc.addPage(); y=m.decl?20:16; };
  const need=h=>{ if(y+h>H-14) newPage(); };
  if(m.decl){ y=18; }
  else {
    doc.setFillColor(...NAVY); doc.rect(0,0,W,24,'F'); doc.setFillColor(...GOLD); doc.rect(0,24,W,1.2,'F');
    doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(m.title, M, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(200,215,235); doc.text(doc.splitTextToSize(m.subtitle||'', CW-60)[0]||'', M, 18);
    doc.setFontSize(8); doc.text('FPN · Direção Técnica Nacional', W-M, 11, {align:'right'}); doc.text('Gerado em '+stamp, W-M, 16, {align:'right'});
    y=32;
  }
  doc.setTextColor(20,27,43);
  for(const b of m.blocks){
    if(b.t==='letterhead'){
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...NAVY); doc.text('FEDERAÇÃO PORTUGUESA DE NATAÇÃO', M, y);
      doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...BLUE); doc.text('Direção Técnica Nacional', M, y+5.5);
      if(b.ref){ doc.setFontSize(9); doc.setTextColor(90,90,90); doc.text(b.ref, W-M, y+5.5, {align:'right'}); }
      doc.setDrawColor(...NAVY); doc.setLineWidth(.6); doc.line(M, y+8.5, W-M, y+8.5); y+=22; doc.setTextColor(26,26,26);
    } else if(b.t==='dtitle'){
      doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...NAVY); doc.setCharSpace(1.6); doc.text(b.text, W/2, y, {align:'center'}); doc.setCharSpace(0); y+=12; doc.setTextColor(26,26,26);
    } else if(b.t==='h'){
      need(14); y+=2; doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(...NAVY); doc.text(b.text, M, y); doc.setDrawColor(...GOLD); doc.setLineWidth(.5); doc.line(M, y+1.8, M+18, y+1.8); y+=7; doc.setTextColor(20,27,43);
    } else if(b.t==='p'){
      doc.setFont('helvetica','normal'); doc.setFontSize(m.decl?11:9.5); const lh=m.decl?5.6:4.4;
      const lines=doc.splitTextToSize(b.text, CW); if(b.space) y+=4; need(lines.length*lh+2);
      if(b.justify){ doc.text(b.text, M, y, {maxWidth:CW, align:'justify', lineHeightFactor:1.45}); } else doc.text(lines, M, y, {lineHeightFactor:1.45});
      y+=lines.length*lh+3;
    } else if(b.t==='kpis'){
      const n=Math.min(b.items.length, m.orientation==='l'?6:4), bw=(CW-(n-1)*3)/n, rowsN=Math.ceil(b.items.length/n);
      need(rowsN*17+2);
      b.items.forEach((it,k)=>{ const cx=M+(k%n)*(bw+3), cy=y+Math.floor(k/n)*17; doc.setDrawColor(210,218,228); doc.setFillColor(246,248,251); doc.roundedRect(cx,cy,bw,15,1.5,1.5,'FD');
        doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(86,102,122); doc.text(doc.splitTextToSize(String(it[0]).toUpperCase(), bw-5)[0], cx+3, cy+4.5);
        doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...NAVY); doc.text(String(it[1]), cx+3, cy+10.5);
        if(it[2]){ doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(86,102,122); doc.text(doc.splitTextToSize(String(it[2]), bw-6)[0], cx+3, cy+13.6); } });
      y+=rowsN*17+3; doc.setTextColor(20,27,43);
    } else if(b.t==='table'){
      const fs = b.small ? (b.head.length>11?6.5:7.5) : 8.5;
      doc.autoTable({startY:y, head:[b.head], body:b.rows.map(r=>r.map(v=>v==null?'':String(v))), margin:{left:M,right:M, top:16, bottom:14}, theme:'grid',
        styles:{font:'helvetica', fontSize:fs, cellPadding:1.3, textColor:[26,32,44], lineColor:[215,221,229], lineWidth:.15, overflow:'linebreak'},
        headStyles:{fillColor:NAVY, textColor:255, fontStyle:'bold', fontSize:fs},
        alternateRowStyles:{fillColor:[244,247,251]},
        columnStyles:Object.fromEntries((b.align||[]).map((a,k)=>[k,{halign:a==='r'?'right':'left'}])),
      });

      if(b.note && !m.decl){ doc.setFont('helvetica','italic'); doc.setFontSize(7.5); doc.setTextColor(110,120,135); doc.text(b.note, M, y-1.5); doc.setTextColor(20,27,43); y+=3; }
    } else if(b.t==='chart'){
      const img=await chartPNG(b.spec, 1500, 620, 'jpeg'); const h=CW*img.h/img.w * (m.orientation==='l'?0.62:1), w=h*img.w/img.h;
      need(h+9); doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(20,27,43); if(b.title) doc.text(b.title, M, y+3);
      doc.addImage(img.url,'JPEG', M, y+5, w, h, undefined, 'FAST'); y+=h+10;
    } else if(b.t==='charts'){
      const gw=(CW-6)/2; const imgs=[]; for(const it of b.items) imgs.push(await chartPNG(it.spec,1300,640,'jpeg'));
      const h=gw*640/1300; need(h+10);
      b.items.forEach((it,k)=>{ const x=M+k*(gw+6); doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(20,27,43); if(it.title) doc.text(doc.splitTextToSize(it.title,gw)[0], x, y+3); doc.addImage(imgs[k].url,'JPEG', x, y+5, gw, h, undefined, 'FAST'); });

    } else if(b.t==='sign'){
      need(40); y+=10; doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text(b.role, W/2, y, {align:'center'});
      doc.setDrawColor(60,60,60); doc.setLineWidth(.3); doc.line(W/2-35, y+18, W/2+35, y+18);

      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(110,110,110); const l=doc.splitTextToSize(b.text, CW); need(l.length*3.4+4);
      doc.setDrawColor(220,220,220); doc.line(M, y, W-M, y); doc.text(l, M, y+4); y+=l.length*3.4+5; doc.setTextColor(26,26,26);

    doc.text(m.decl ? 'Federação Portuguesa de Natação · Direção Técnica Nacional' : 'Observatório Natação Pura · FPN · '+m.title, M, H-7);
    doc.text('Página '+i+' de '+np, W-M, H-7, {align:'right'}); }
  return doc.output('arraybuffer');
}

const xe = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');

function wTable(head, rows, align, widthTw, fs){
  const n=head.length;
  const wt=head.map((h,k)=>{ let m=Math.min(14,String(h).length); for(const r of rows.slice(0,200)){ const l=String(r[k]??'').length; if(l>m) m=l; } return Math.max(4,Math.min(38,m)); });

  const bd=`<w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="D7DDE5"/>`).join('')}</w:tblBorders>`;
  const hr=`<w:tr><w:trPr><w:tblHeader/><w:cantSplit/></w:trPr>${head.map((h,k)=>cell(h,{k,b:1,color:'FFFFFF',fill:'042C53',jc:align&&align[k]==='r'?'right':'left'})).join('')}</w:tr>`;
  const br=rows.map((r,ri)=>`<w:tr><w:trPr><w:cantSplit/></w:trPr>${r.map((v,k)=>cell(v==null?'':String(v),{k,fill:ri%2?'F4F7FB':null,jc:align&&align[k]==='r'?'right':'left'})).join('')}</w:tr>`).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/>${bd}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:top w:w="28" w:type="dxa"/><w:left w:w="70" w:type="dxa"/><w:bottom w:w="28" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${cws.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${hr}${br}</w:tbl>`+wPara('',{after:120});

function wImage(rid, n, cx, cy){ return `<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${n}" name="Grafico ${n}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${n}" name="grafico${n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`; }

      body.push(`<w:tbl><w:tblPr><w:tblW w:w="${cwTw}" w:type="dxa"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(x=>`<w:${x} w:val="nil"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr><w:tblGrid><w:gridCol w:w="${half}"/><w:gridCol w:w="${cwTw-half}"/></w:tblGrid><w:tr>${cells.join('').replace(/(<\/w:tc>)$/,'$1')}${cells.length<2?`<w:tc><w:tcPr><w:tcW w:w="${cwTw-half}" w:type="dxa"/></w:tcPr><w:p/></w:tc>`:''}</w:tr></w:tbl>`+wPara('',{after:120}));

  const footTxt = m.decl ? 'Federação Portuguesa de Natação · Direção Técnica Nacional' : 'Observatório Natação Pura · '+m.title;
  const fr=(t)=>`<w:r><w:rPr><w:sz w:val="15"/><w:color w:val="828C9B"/></w:rPr>${t}</w:r>`;
  const footer=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:p><w:pPr><w:tabs><w:tab w:val="right" w:pos="${cwTw}"/></w:tabs></w:pPr>${fr(`<w:t xml:space="preserve">${xe(footTxt)}</w:t>`)}${fr('<w:tab/>')}${fr('<w:t xml:space="preserve">Página </w:t>')}${fr('<w:fldChar w:fldCharType="begin"/>')}${fr('<w:instrText xml:space="preserve"> PAGE </w:instrText>')}${fr('<w:fldChar w:fldCharType="separate"/>')}${fr('<w:t>1</w:t>')}${fr('<w:fldChar w:fldCharType="end"/>')}${fr('<w:t xml:space="preserve"> de </w:t>')}${fr('<w:fldChar w:fldCharType="begin"/>')}${fr('<w:instrText xml:space="preserve"> NUMPAGES </w:instrText>')}${fr('<w:fldChar w:fldCharType="separate"/>')}${fr('<w:t>1</w:t>')}${fr('<w:fldChar w:fldCharType="end"/>')}</w:p></w:ftr>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="20"/><w:szCs w:val="20"/><w:color w:val="1A202C"/><w:lang w:val="pt-PT"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style><w:style w:type="table" w:default="1" w:styleId="TableNormal"><w:name w:val="Normal Table"/><w:tblPr><w:tblInd w:w="0" w:type="dxa"/><w:tblCellMar><w:top w:w="0" w:type="dxa"/><w:left w:w="108" w:type="dxa"/><w:bottom w:w="0" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style></w:styles>`;

<script>
'use strict';
/* ============================================================
   Navegação e arranque
   ============================================================ */
const VIEWS = {painel:vPainel, evolucao:vEvolucao, rankings:vRankings, nadadores:vNadadores, comparar:vComparar, analises:vAnalises, alertas:vAlertas, declaracoes:vDeclaracoes, dados:vDados};
let READY=false, LOADING_UP=true;
function go(v){ if(location.hash.slice(1)===v) route(); else location.hash=v; }
function route(){
  if(!READY) return;
  const h=location.hash.slice(1)||'painel', main=$('#main');
  let tab=h, fn=VIEWS[h];
  if(/^n\d+$/.test(h)){ tab='nadadores'; fn=root=>vFicha(root, +h.slice(1)); }
  if(!fn){ tab='painel'; fn=vPainel; }
  if(!hasData() && tab!=='dados'){ const t=tab; fn=root=>{ root.innerHTML = LOADING_UP ? `<div class="loading"><div>A carregar os rankings guardados…</div><div class="bar"><i></i></div></div>` : `<div class="card empty" style="padding:40px"><h3 style="margin-bottom:8px">Ainda não há rankings carregados</h3><p class="muted">Carregue, para cada época, os rankings masculinos e femininos de piscina curta e de piscina longa.</p><button class="btn primary" onclick="go('dados')" style="margin-top:12px">Ir para Dados</button></div>`; }; }
  $$('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.v===tab)));
  $$('.has-chart').forEach(el=>{ if(el.__chart){ el.__chart.destroy(); el.__chart=null; } });
  main.innerHTML='<div class="view" id="view"></div>';
  try{ fn($('#view')); }catch(e){ console.error(e); $('#view').innerHTML=`<div class="card empty">Ocorreu um erro ao mostrar esta vista: ${esc(e.message)}</div>`; }
  window.scrollTo({top:0});
}
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(t) go(t.dataset.v); });
window.addEventListener('hashchange', route);
(async function init(){
  try{
    const capP = capInit();
    await loadBase();
    assemble();
    READY=true;
    $('#hdrSub').textContent = 'A carregar… · FPN · Direção Técnica Nacional';
    route();
    await capP;
    await loadUploads();
    LOADING_UP=false;
    assemble(); _clubOpts=null; refreshHeader();
    if(!hasData() && !location.hash.slice(1)) location.hash='dados'; else route();
  }catch(e){
    console.error(e); LOADING_UP=false;
    $('#main').innerHTML=`<div class="card empty">Não foi possível carregar os dados: ${esc(e.message||e)}</div>`;
  }
})();

</script>
