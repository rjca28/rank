<!doctype html>
<html lang="pt-PT">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body>
<title>Observatório Natação Pura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#042C53; --blue:#185FA5; --gold:#BA7517;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface2:#EEF2F7; --ink:#0E1B2B; --muted:#56667A; --faint:#8494A7;
  --line:#DCE3EC; --line2:#C9D3DF; --accent:#185FA5; --accent-ink:#FFFFFF; --accent-soft:#E3EDF8;
  --s1:#185FA5; --s2:#BA7517; --s3:#16876A;
  --seq1:#062A52; --seq2:#185FA5; --seq3:#4C8ED6; --seq4:#8DB8E8;
  --good:#1D7A4E; --bad:#B3372F; --good-soft:#E3F3EA; --bad-soft:#F8E6E4;
  --heat:24,95,165;
  --hdr:#042C53; --hdr-ink:#FFFFFF; --hdr-muted:#A9BFD8;
  --shadow:0 1px 2px rgba(4,44,83,.06),0 2px 8px rgba(4,44,83,.05);
  --fd:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Source Sans 3','Segoe UI',Calibri,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A121D; --surface:#111C2B; --surface2:#172538; --ink:#E4ECF5; --muted:#9AAABD; --faint:#6F8198;
    --line:#22334A; --line2:#2E4260; --accent:#4A8FDB; --accent-ink:#06121F; --accent-soft:#16304F;
    --s1:#4A8FDB; --s2:#BA7A20; --s3:#2FA684;
    --seq1:#D6E6F8; --seq2:#8DB8E8; --seq3:#4C8ED6; --seq4:#2A5E9E;
    --good:#4CC38A; --bad:#EE7A70; --good-soft:#12301F; --bad-soft:#3A1A18;
    --heat:74,143,219;
    --hdr:#07192D; --hdr-ink:#E4ECF5; --hdr-muted:#8FA6C2;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A121D; --surface:#111C2B; --surface2:#172538; --ink:#E4ECF5; --muted:#9AAABD; --faint:#6F8198;
  --line:#22334A; --line2:#2E4260; --accent:#4A8FDB; --accent-ink:#06121F; --accent-soft:#16304F;
  --s1:#4A8FDB; --s2:#BA7A20; --s3:#2FA684;
  --seq1:#D6E6F8; --seq2:#8DB8E8; --seq3:#4C8ED6; --seq4:#2A5E9E;
  --good:#4CC38A; --bad:#EE7A70; --good-soft:#12301F; --bad-soft:#3A1A18;
  --heat:74,143,219;
  --hdr:#07192D; --hdr-ink:#E4ECF5; --hdr-muted:#8FA6C2;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}
.tab-num,td.num,th.num,.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* header */
.hdr{background:var(--hdr);color:var(--hdr-ink);padding-inline:16px}
.hdr-in{max-width:1400px;margin:0 auto;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.brand-mark{width:38px;height:38px;flex:none}
.brand h1{font-size:26px;line-height:1;font-weight:700;letter-spacing:.02em}
.brand p{margin:3px 0 0;color:var(--hdr-muted);font-size:13px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--hdr-muted);padding:10px 14px 12px;font-family:var(--fd);font-size:17px;font-weight:600;letter-spacing:.03em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--hdr-ink)}
.tab[aria-selected="true"]{color:var(--hdr-ink);border-bottom-color:var(--gold)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
main{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
.view{display:grid;gap:18px}
.view-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between}
.view-head h2{font-size:30px;line-height:1.05}
.view-head .sub{color:var(--muted);font-size:14px;margin-top:3px;max-width:75ch}
/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.fbar.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],input[type=date],input[type=search],textarea{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;min-height:34px;max-width:100%}
input[type=number]{width:78px}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;min-height:34px}
.seg button{background:var(--surface);border:0;padding:5px 11px;cursor:pointer;font-size:14px;border-left:1px solid var(--line2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{background:var(--surface);border:1px solid var(--line2);border-radius:7px;padding:6px 12px;min-height:34px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:default}
.exp{display:flex;gap:6px;flex-wrap:wrap}
.exp .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;align-self:center;margin-right:2px}
/* cards */
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:980px){.g2,.g3,.g32{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:19px;line-height:1.15}
.card .note{color:var(--muted);font-size:13px;margin:2px 0 0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.chart{position:relative;height:300px}
.chart.tall{height:380px}
.chart.short{height:240px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--fd);font-size:32px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:13px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;max-width:100%}
.tbl-wrap.scroll{max-height:560px;overflow-y:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.t th{position:sticky;top:0;background:var(--surface2);text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;z-index:1}
table.t th.sortable{cursor:pointer;user-select:none}
table.t th.sortable:hover{color:var(--ink)}
table.t th[data-dir="asc"]::after{content:" ▲";font-size:9px}
table.t th[data-dir="desc"]::after{content:" ▼";font-size:9px}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface2)}
table.t td.num,table.t th.num{text-align:right}
table.t td.wrap{white-space:normal;min-width:180px}
table.t .time{font-weight:700}
.lnk{color:var(--accent);cursor:pointer;font-weight:600;background:none;border:0;padding:0;text-align:left}
.lnk:hover{text-decoration:underline}
.more{display:flex;justify-content:center;gap:10px;align-items:center;padding:10px;color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* swimmer header */
.sw-hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:760px){.sw-hd{grid-template-columns:minmax(0,1fr)}}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--fd);font-size:26px;font-weight:700}
.sw-name{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:14px;margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
/* search */
.search{position:relative;min-width:260px;flex:1;max-width:420px}
.search input{width:100%}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;max-height:340px;overflow:auto}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;padding:8px 10px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.sugg button:hover,.sugg button.act{background:var(--accent-soft)}
.sugg small{color:var(--muted)}
/* heat table */
td.heat{position:relative}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* declaration preview */
.decl-grid{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.decl-grid{grid-template-columns:minmax(0,1fr)}}
.decl-form{display:grid;gap:12px}
.decl-form .fld input:not([type=checkbox]),.decl-form .fld select,.decl-form .fld textarea{width:100%}
.decl-form .row>.fld{flex:1;min-width:90px}
.paper-wrap{overflow-x:auto;background:var(--surface2);border-radius:10px;padding:18px}
.paper{background:#fff;color:#1a1a1a;width:210mm;max-width:none;min-height:297mm;margin:0 auto;padding:18mm 20mm;box-shadow:0 4px 20px rgba(0,0,0,.15);font-family:Calibri,'Source Sans 3',Arial,sans-serif;font-size:11pt;line-height:1.5}
.paper .lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #042C53;padding-bottom:8px;margin-bottom:22px}
.paper .lh b{display:block;color:#042C53;font-size:14pt;letter-spacing:.02em}
.paper .lh span{color:#185FA5;font-size:10pt}
.paper .lh .ref{color:#555;font-size:9pt;text-align:right}
.paper h4{text-align:center;color:#042C53;font-size:16pt;letter-spacing:.2em;margin:10px 0 18px;font-family:Calibri,Arial,sans-serif}
.paper p{text-align:justify;margin:0 0 10px}
.paper table{border-collapse:collapse;width:100%;font-size:9pt;margin:8px 0 14px}
.paper th{background:#042C53;color:#fff;padding:4px 5px;text-align:left;font-weight:600}
.paper td{padding:3px 5px;border-bottom:1px solid #d7dde5}
.paper tr:nth-child(even) td{background:#f4f7fb}
.paper .sign{margin-top:36px;text-align:center}
.paper .sign .ln{width:60%;margin:40px auto 4px;border-top:1px solid #333}
.paper .src{font-size:8pt;color:#666;margin-top:26px;border-top:1px solid #ddd;padding-top:6px}
@media (max-width:760px){.fbar.sticky{position:static}.brand h1{font-size:21px}.view-head h2{font-size:26px}.sw-name{font-size:27px}}
.per{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg-s button{padding:4px 8px;font-size:13px}
.grid4{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.alert-badge{display:inline-flex;gap:6px;align-items:center;background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:99px;padding:3px 10px;font-weight:700;font-size:13px;cursor:pointer}
table.grid-t td{text-align:right;font-variant-numeric:tabular-nums}
table.grid-t td.up-c{background:var(--good-soft)} table.grid-t td.dn-c{background:var(--bad-soft)}
table.grid-t td small{display:block;color:var(--muted);font-size:11px;line-height:1.1}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav button{border:1px solid var(--line2);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:14px}
.subnav button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .subnav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}}
.chiplist{display:flex;flex-wrap:wrap;gap:4px}
.chiplist span{background:var(--surface2);border-radius:6px;padding:1px 7px;font-size:12.5px;white-space:nowrap}
.chiplist span.hot{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.sortbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:8px;font-size:13px}
.sortbar .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sortbar select{min-height:28px;padding:2px 8px;font-size:13px}
.sortbar .hint{color:var(--faint);font-size:12px;margin-left:auto}
.schip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:2px 4px 2px 4px;font-weight:600}
.schip b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px}
.schip button{border:0;background:none;cursor:pointer;color:var(--accent);font-size:12px;padding:1px 4px;border-radius:4px;font-weight:600}
.schip button:hover{background:var(--surface)}
sup.slv{font-size:9px;color:var(--accent);margin-left:2px}
@media (max-width:760px){.sortbar .hint{display:none}}
.slots-t td.slot-td{min-width:170px;vertical-align:top;white-space:normal}
.slots-t td.slot-td.over{outline:2px dashed var(--accent);outline-offset:-4px}
.slot{display:block;border-radius:8px;padding:6px 8px;font-size:13px;line-height:1.3}
.slot.ok{background:var(--good-soft)}
.slot.ok small{display:block;color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.slot.ok small.warn{color:var(--gold);font-weight:600}
.slot.empty{border:1.5px dashed var(--line2);color:var(--accent);font-weight:600;text-align:center;cursor:pointer;padding:10px}
.slot.empty:hover{border-color:var(--accent);background:var(--accent-soft)}
.slot-act{display:flex;gap:10px;margin-top:3px}
.lnkbtn{background:none;border:0;padding:0;color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
.lnkbtn:hover{text-decoration:underline}
.lnkbtn.danger,.btn.danger{color:var(--bad)}
details.tblx>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:600;font-size:14px;color:var(--accent);user-select:none}
details.tblx>summary::-webkit-details-marker{display:none}
details.tblx>summary::before{content:"▸";font-size:12px;transition:transform .15s}
details.tblx[open]>summary::before{transform:rotate(90deg)}
details.tblx>summary:hover{border-color:var(--accent)}
details.tblx>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
details.tblx .tx-o{display:none} details.tblx[open] .tx-o{display:inline} details.tblx[open] .tx-c{display:none}
details.tblx .tx-n{color:var(--muted);font-weight:400;font-size:13px}
details.tblx .tblx-in{margin-top:10px}
@media (prefers-reduced-motion:reduce){details.tblx>summary::before{transition:none}}
/* misc */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.sep{height:1px;background:var(--line);margin:4px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:99;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--muted);gap:10px;text-align:center}
.bar{height:6px;width:240px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:ld 1.1s infinite ease-in-out}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.drop{border:2px dashed var(--line2);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.evchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px 10px;font-size:14px}
.evchecks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.evchecks input{margin:0;flex:none}
details.method summary{cursor:pointer;font-weight:600}
details.method ul{margin:8px 0 0;padding-left:20px;color:var(--muted)}
.cmp-cell{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.bestA{color:var(--s1);font-weight:700}.bestB{color:var(--s2);font-weight:700}
.repopt{position:relative;display:inline-block}
.repopt>summary{list-style:none;cursor:pointer}
.repopt>summary::-webkit-details-marker{display:none}
.repopt .repbox{position:absolute;right:0;top:calc(100% + 6px);z-index:40;width:min(560px,calc(100vw - 32px));padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);text-align:left}
.repopt .chk{display:flex;gap:6px;align-items:flex-start;font-size:13px;padding:2px 0;cursor:pointer}
.repopt .chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 12px}
.repopt .lbl2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;display:flex;align-items:center;gap:8px}
.repopt .fld.inl{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0}
.repopt .fld.inl select{padding:2px 6px}
.modal-bg{position:fixed;inset:0;background:rgba(6,18,33,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal{width:min(1100px,100%);max-height:none;margin:0}
.modal .mh{margin:16px 0 6px;font-size:15px}

<script>
'use strict';
/* ============================================================
   Observatório Natação Pura — núcleo de dados
   ============================================================ */
const STROKE = {L:'Livres',C:'Costas',B:'Bruços',M:'Mariposa',E:'Estilos'};
const CO_S = ['PL','PC'];
const CO_L = ['Piscina longa (50 m)','Piscina curta (25 m)'];
const CO_M = ['PL 50 m','PC 25 m'];
const G_L = ['Masculinos','Femininos'];
const REGIONS = {ANL:'Lisboa',ANNP:'Norte de Portugal',ANMIN:'Minho',ANALG:'Algarve',ARNN:'Nordeste',ANMAD:'Madeira',ANDS:'Distrito de Setúbal',ANCNP:'Centro Norte de Portugal',ANDL:'Distrito de Leiria',ANRA:'Açores',ANC:'Centro',ANALEN:'Alentejo',ANIC:'Interior Centro'};
const ESC_G = [{n:'Cadetes',a:0,b:12},{n:'Infantis',a:13,b:14},{n:'Juvenis',a:15,b:16},{n:'Juniores',a:17,b:18},{n:'Seniores',a:19,b:99}];
const ESC_F = [{n:'Cadetes C',a:0,b:9},{n:'Cadetes B',a:10,b:11},{n:'Cadetes A',a:12,b:12},{n:'Infantis B',a:13,b:13},{n:'Infantis A',a:14,b:14},{n:'Juvenis B',a:15,b:15},{n:'Juvenis A',a:16,b:16},{n:'Juniores',a:17,b:18},{n:'Seniores',a:19,b:99}];
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let NG = 0; // grupos ano×prova×piscina×género (dimensionado em derive)

const S = {
  ev: [], sw: [], swKey: new Map(), cl: [], clKey: new Map(), mt: [], mtKey: new Map(),
  R: null, n: 0, years: [], yinfo: {}, regions: [],
  base: null, uploads: new Map(),
};

/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const nf0 = new Intl.NumberFormat('pt-PT',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1});
const nf2 = new Intl.NumberFormat('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fN = v => v==null||isNaN(v) ? '—' : nf0.format(v);
const f1 = v => v==null||isNaN(v) ? '—' : nf1.format(v);
const f2 = v => v==null||isNaN(v) ? '—' : nf2.format(v);
const fPct = (v, d=2) => v==null||!isFinite(v) ? '—' : (v>0?'+':v<0?'−':'') + (d===1?nf1:nf2).format(Math.abs(v)) + '%';
const fSgn = v => v==null||!isFinite(v) ? '—' : (v>0?'+':v<0?'−':'') + nf0.format(Math.abs(v));
function fT(cs){ if(cs==null||!isFinite(cs)) return '—'; cs=Math.round(cs); const m=Math.floor(cs/6000), s=(cs-m*6000)/100; return m ? m+':'+s.toFixed(2).padStart(5,'0') : s.toFixed(2); }
const fTs = sec => fT(sec*100);
const fDiffT = cs => cs==null||!isFinite(cs) ? '—' : (cs>0?'+':cs<0?'−':'±') + (Math.abs(cs)/100).toFixed(2) + ' s';
const EPOCH = Date.UTC(2000,0,1);
function dayToDate(d){ return new Date(EPOCH + d*86400000); }
function fD(d){ const x=dayToDate(d); return String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0')+'/'+x.getUTCFullYear(); }
function fBD(bd){ if(!bd) return '—'; const [y,m,d]=bd.split('-'); return d+'/'+m+'/'+y; }
function longDate(dt){ return dt.getDate()+' de '+MONTHS[dt.getMonth()]+' de '+dt.getFullYear(); }
function longBD(bd){ const [y,m,d]=bd.split('-').map(Number); return d+' de '+MONTHS[m-1]+' de '+y; }
function evLabel(e){ const c=S.ev[e]; const m=c.match(/^(\d+)([LCBME])$/); return m[1]+'m '+STROKE[m[2]]; }
function evShort(e){ const c=S.ev[e]; const m=c.match(/^(\d+)([LCBME])$/); return m[1]+' '+STROKE[m[2]].slice(0,3)+'.'; }
function escG(age){ for(let i=0;i<ESC_G.length;i++) if(age<=ESC_G[i].b) return i; return 4; }
function escF(age){ for(let i=0;i<ESC_F.length;i++) if(age<=ESC_F[i].b) return i; return ESC_F.length-1; }
const PARTICLES = new Set(['da','de','do','das','dos','e','d']);
function tcase(w){ return w.split(/([\s\-']+)/).map((p,i)=>{ const l=p.toLowerCase(); if(/^[\s\-']+$/.test(p)) return p; if(i>0 && PARTICLES.has(l)) return l; return l.charAt(0).toUpperCase()+l.slice(1); }).join(''); }
function niceName(full){ const [sur, giv] = String(full).split(','); if(giv===undefined) return tcase(sur.trim()); return (giv.trim()+' '+tcase(sur.trim())).replace(/\s+/g,' '); }
function initials(full){ const n=niceName(full).split(' ').filter(w=>!PARTICLES.has(w.toLowerCase())); return ((n[0]||'')[0]||'')+((n[n.length-1]||'')[0]||''); }
function regLabel(code){ return code ? (REGIONS[code] ? code+' · '+REGIONS[code] : code) : '—'; }
function quantile(sorted, q){ if(!sorted.length) return NaN; const p=(sorted.length-1)*q, b=Math.floor(p), r=p-b; return sorted[b+1]!==undefined ? sorted[b]+r*(sorted[b+1]-sorted[b]) : sorted[b]; }
function mean(a){ if(!a.length) return NaN; let s=0; for(const v of a) s+=v; return s/a.length; }
function median(a){ const s=[...a].sort((x,y)=>x-y); return quantile(s,.5); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }

/* ---------- descodificação ---------- */
async function gunzipB64(b64){
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const stream = new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).arrayBuffer();
}
const COL_T = {sw:Uint32Array, tm:Uint32Array, dt:Uint16Array, pt:Uint16Array, mt:Uint16Array, cl:Uint16Array, ev:Uint8Array, co:Uint8Array, yr:Uint8Array};

const EV_LIST = ['50L','100L','200L','400L','800L','1500L','5000L','50C','100C','200C','50B','100B','200B','50M','100M','200M','100E','200E','400E'];
/* Rankings por época, género e piscina (4 listas por época) */
const SLOTS = [['M',1],['M',0],['F',1],['F',0]];
const slotKey = (y,g,co) => `${y}_${g}_${co}`;
const slotLabel = (g,co) => (g==='M'?'Masculinos':'Femininos')+' · '+(+co?'PC 25 m':'PL 50 m');
async function loadBase(){ S.ev=[...EV_LIST]; S.base=null; }
function addSwimmer(name,bd,g,nat){ let k=name+'|'+bd, alias=null; const mk=S.mergeMap&&S.mergeMap.get(k); if(mk){ alias=name; k=mk; const p=mk.lastIndexOf('|'); name=mk.slice(0,p); bd=mk.slice(p+1); } let id=S.swKey.get(k); if(id===undefined){ id=S.sw.length; S.sw.push({id,name,bd,by:+String(bd).slice(0,4),g,nat,nn:norm(name)}); S.swKey.set(k,id);} else { const s=S.sw[id]; if(nat) s.nat=nat; } if(alias&&alias!==name){ const s=S.sw[id]; s.aka=s.aka||[]; if(!s.aka.includes(alias)){ s.aka.push(alias); s.nn+=' '+norm(alias); } } return id; }
function addClub(code,name,reg){ let id=S.clKey.get(code); if(id===undefined){ id=S.cl.length; S.cl.push({id,code,name,reg:reg||''}); S.clKey.set(code,id);} else { const c=S.cl[id]; if(name) c.name=name; if(reg) c.reg=reg; } return id; }
function addMeet(name,city){ const k=name+'|'+city; let id=S.mtKey.get(k); if(id===undefined){ id=S.mt.length; S.mt.push({name,city}); S.mtKey.set(k,id);} return id; }

/* Junta todas as listas carregadas (época × género × piscina) */
function assemble(){
  const upList = [...S.uploads.values()].map(p=>mapUpload(p));
  let n = 0; for(const u of upList) n += u.n;
  const R = {n, sw:new Uint32Array(n), tm:new Uint32Array(n), dt:new Int32Array(n), pt:new Uint16Array(n), mt:new Uint32Array(n), cl:new Uint16Array(n), ev:new Uint8Array(n), co:new Uint8Array(n), yr:new Uint16Array(n)};
  let j = 0;
  for(const u of upList){ for(let i=0;i<u.n;i++){ if(u.ev[i]<0) continue; for(const k of ['sw','tm','dt','pt','mt','cl','ev','co','yr']) R[k][j]=u[k][i]; j++; } }
  if(j<n){ for(const k of Object.keys(R)) if(k!=='n') R[k]=R[k].slice(0,j); R.n=n=j; }
  if(S.mergeMap&&S.mergeMap.size){ const R2=dedupeRows(R); S.R=R2; S.n=R2.n; } else { S.R = R; S.n = n; }
  derive();
}
function hasData(){ return S.n>0; }
function mapUpload(p){
  const swm = p.sw.map(([name,bd,g,nat])=>addSwimmer(name,bd,g,nat));
  const clm = p.cl.map(([code,name,reg])=>addClub(code,name,reg));
  const mtm = p.mt.map(([name,city])=>addMeet(name,city));
  const evm = p.ev.map(code=>S.ev.indexOf(code));
  const c = p.cols, n = c.tm.length, o = {n, sw:[],tm:c.tm,dt:c.dt,pt:c.pt,mt:[],cl:[],ev:[],co:c.co,yr:new Array(n).fill(p.year)};
  for(let i=0;i<n;i++){ o.sw[i]=swm[c.sw[i]]; o.mt[i]=mtm[c.mt[i]]; o.cl[i]=clm[c.cl[i]]; o.ev[i]=evm[c.ev[i]]; }
  return o;
}

/* ---------- derivados: idades, escalões, posições, médias de referência ---------- */
const D = {};
function derive(){
  const R = S.R, n = R.n;
  const G=new Uint8Array(n), AGE=new Uint8Array(n), POR=new Uint8Array(n), RG=new Uint8Array(n), ESC=new Uint8Array(n), GK=new Uint16Array(n);
  const regIdx = new Map(); S.regions = [];
  for(const c of S.cl){ if(c.reg && !regIdx.has(c.reg)){ regIdx.set(c.reg, S.regions.length); S.regions.push(c.reg);} c.ri = c.reg ? regIdx.get(c.reg) : 255; }
  const ys = new Set();
  for(let i=0;i<n;i++) ys.add(R.yr[i]);
  S.years = [...ys].sort((a,b)=>a-b);
  S.y0 = S.years.length? S.years[0] : 0; NG = S.years.length? (S.years[S.years.length-1]-S.y0+1)*128 : 128;
  for(let i=0;i<n;i++){
    const s=S.sw[R.sw[i]]; G[i]= s.g==='F'?1:0; const a=Math.max(0,Math.min(99,R.yr[i]-s.by)); AGE[i]=a; POR[i]= s.nat==='POR'?1:0;
    RG[i]=S.cl[R.cl[i]].ri; ESC[i]=escG(a); GK[i]=(((R.yr[i]-S.y0)*32+R.ev[i])*2+R.co[i])*2+G[i];
  }
  // ordenar por grupo e tempo
  const ord = new Uint32Array(n); for(let i=0;i<n;i++) ord[i]=i;
  const tm = R.tm; ord.sort((a,b)=> (GK[a]-GK[b]) || (tm[a]-tm[b]));
  const RK=new Uint16Array(n), RKE=new Uint16Array(n), RKA=new Uint16Array(n);
  const gCnt=new Uint32Array(NG+1), gSum=new Float64Array(NG+1), gPts=new Float64Array(NG+1);
  const eCnt=new Uint32Array((NG+1)*5), eSum=new Float64Array((NG+1)*5), ePts=new Float64Array((NG+1)*5);
  const aCnt=new Uint32Array((NG+1)*100), aSum=new Float64Array((NG+1)*100), aPts=new Float64Array((NG+1)*100), a10S=new Float64Array((NG+1)*100), a10C=new Uint8Array((NG+1)*100);
  let prevG=-1, r=0, lastT=-1, lastR=0; const eR=new Uint32Array(5), eLT=new Int32Array(5), eLR=new Uint32Array(5); const aR=new Uint32Array(100), aLT=new Int32Array(100), aLR=new Uint32Array(100);
  for(let k=0;k<n;k++){
    const i=ord[k], g=GK[i], t=tm[i];
    if(g!==prevG){ prevG=g; r=0; lastT=-1; eR.fill(0); eLT.fill(-1); aR.fill(0); aLT.fill(-1); }
    r++; if(t===lastT) RK[i]=lastR; else { RK[i]=r; lastT=t; lastR=r; }
    const e=ESC[i]; eR[e]++; if(t===eLT[e]) RKE[i]=eLR[e]; else { RKE[i]=eR[e]; eLT[e]=t; eLR[e]=eR[e]; }
    const a=AGE[i]; aR[a]++; if(t===aLT[a]) RKA[i]=aLR[a]; else { RKA[i]=aR[a]; aLT[a]=t; aLR[a]=aR[a]; }
    gCnt[g]++; gSum[g]+=t; gPts[g]+=R.pt[i];
    const ge=g*5+e; eCnt[ge]++; eSum[ge]+=t; ePts[ge]+=R.pt[i];
    const ga=g*100+a; aCnt[ga]++; aSum[ga]+=t; aPts[ga]+=R.pt[i]; if(a10C[ga]<10){ a10C[ga]++; a10S[ga]+=t; }
  }
  // índice por nadador (ordenado por ano, prova, piscina)
  const nsw = S.sw.length, cnt = new Uint32Array(nsw+1);
  for(let i=0;i<n;i++) cnt[R.sw[i]+1]++;
  for(let s=0;s<nsw;s++) cnt[s+1]+=cnt[s];
  const pos = cnt.slice(0, nsw), rows = new Uint32Array(n);
  for(let i=0;i<n;i++) rows[pos[R.sw[i]]++] = i;
  // resumo por nadador
  for(const s of S.sw){ s.n=0; s.first=9999; s.last=0; s.bestPt=0; s.bestRow=-1; s.lastDt=-1; s.club=-1; s.evs=0; }
  for(let sId=0; sId<nsw; sId++){
    const s=S.sw[sId], a=cnt[sId], b=cnt[sId+1]; s.n=b-a; if(!s.n) continue;
    const evset = new Set();
    for(let k=a;k<b;k++){ const i=rows[k]; const y=R.yr[i]; if(y<s.first) s.first=y; if(y>s.last) s.last=y; if(R.pt[i]>s.bestPt){ s.bestPt=R.pt[i]; s.bestRow=i; } if(R.dt[i]>s.lastDt){ s.lastDt=R.dt[i]; s.club=R.cl[i]; } evset.add(R.ev[i]*2+R.co[i]); }
    s.evs = evset.size;
  }
  // cobertura por ano
  const yinfo = {};
  for(const y of S.years) yinfo[y] = {rows:0, maxDt:0, sw:new Set(), slots:{}};
  for(let i=0;i<n;i++){ const o=yinfo[R.yr[i]]; o.rows++; if(R.dt[i]>o.maxDt) o.maxDt=R.dt[i]; o.sw.add(R.sw[i]); }
  for(const y in yinfo){ yinfo[y].nsw = yinfo[y].sw.size; delete yinfo[y].sw; }
  for(const p of S.uploads.values()){ const o=yinfo[p.year]; if(o) o.slots[p.g+'_'+p.co]={n:p.cols.tm.length, nsw:p.sw.length, file:p.file, at:p.uploadedAt}; }
  S.yinfo = yinfo;
  Object.assign(D, {G,AGE,POR,RG,ESC,GK,RK,RKE,RKA,gCnt,gSum,gPts,eCnt,eSum,ePts,aCnt,aSum,aPts,a10S,a10C, swStart:cnt, swRows:rows, cache:new Map()});
}
const gkey = (y,e,co,g) => (y<S.y0||y>S.years[S.years.length-1]) ? NG : (((y-S.y0)*32+e)*2+co)*2+g;
function lastYear(){ return S.years[S.years.length-1]; }
function isPartial(y){ const o=S.yinfo[y]; if(!o) return false; const d=dayToDate(o.maxDt); return d.getUTCFullYear()===y && (d.getUTCMonth()<11 || d.getUTCDate()<15); }
function yearLabel(y){ return isPartial(y) ? y+' (parcial)' : String(y); }
function swRows(id){ const a=D.swStart[id], b=D.swStart[id+1]; return Array.from(D.swRows.subarray(a,b)); }

/* ---------- referências nacionais ---------- */
// modo: 'age' média mesma idade no ano · 'top10' média top-10 da idade · 'esc' média do escalão · 'all' média absoluta do ano · 'hist' média histórica na idade
const REF_L = {age:'Média nacional (mesmo ano e idade)', top10:'Média Top‑10 (mesmo ano e idade)', esc:'Média do escalão (mesmo ano)', all:'Média absoluta do ano', hist:'Média histórica na mesma idade'};
function refTime(mode, y, e, co, g, age){
  if(mode==='hist') return histAgeMean(e,co,g,age);
  const k = gkey(y,e,co,g);
  if(mode==='age'){ const c=D.aCnt[k*100+age]; return c? D.aSum[k*100+age]/c : NaN; }
  if(mode==='top10'){ const c=D.a10C[k*100+age]; return c? D.a10S[k*100+age]/c : NaN; }
  if(mode==='esc'){ const e5=escG(age), c=D.eCnt[k*5+e5]; return c? D.eSum[k*5+e5]/c : NaN; }
  const c=D.gCnt[k]; return c? D.gSum[k]/c : NaN;
}
function refCount(mode, y, e, co, g, age){
  const k=gkey(y,e,co,g);
  if(mode==='age') return D.aCnt[k*100+age]; if(mode==='top10') return D.a10C[k*100+age];

      const ad=$('[data-sadd]',sb); if(ad) ad.onchange=()=>{ const k=ad.value; if(!k) return; const c=this.cols.find(c=>c.k===k); this.sorts.push({k,dir:this.defDir(c)}); this.render(); };
    }
    const m=$('[data-more]',this.el); if(m) m.onclick=()=>{ this.shown+=this.page; this.render(); };

  }
  sortDesc(){ if(!this.sorts.length) return ''; return 'Ordenado por '+this.sorts.map(s=>{ const c=this.cols.find(c=>c.k===s.k); return (c?c.l:s.k)+' ('+(s.dir==='asc'?'crescente':'decrescente')+')'; }).join(', depois ')+'.'; }

}
function stripTags(s){ const d=document.createElement('div'); d.innerHTML=String(s); return d.textContent; }
const swLink = (id, label) => `<button class="lnk" data-sw="${id}">${esc(label ?? niceName(S.sw[id].name))}</button>`;

/* ---------- pesquisa de nadadores ---------- */
function searchSwimmers(q, lim=12, filt){
  const t=norm(q).split(/[\s,]+/).filter(Boolean); if(!t.length) return [];
  const out=[];
  for(const s of S.sw){ if(!s.n) continue; if(filt && !filt(s)) continue; let ok=true; for(const w of t){ if(!s.nn.includes(w)){ ok=false; break; } } if(ok) out.push(s); }
  out.sort((a,b)=> b.last-a.last || b.bestPt-a.bestPt);
  return out.slice(0,lim);
}
function swPicker(el, {placeholder='Pesquisar nadador (nome ou apelido)…', onPick, value, filt}={}){
  if(typeof el==='string') el=document.getElementById(el);
  el.classList.add('search');
  el.innerHTML = `<input type="search" autocomplete="off" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" value="${value!=null&&S.sw[value]?esc(niceName(S.sw[value].name)):''}"><div class="sugg" hidden></div>`;
  const inp=$('input',el), box=$('.sugg',el); let act=-1, res=[];
  const show=()=>{ res=searchSwimmers(inp.value,14,filt); act=-1; if(!res.length){ box.hidden=true; return; } box.innerHTML=res.map((s,i)=>`<button type="button" data-i="${i}"><span>${esc(niceName(s.name))} <small>${s.by} · ${s.g==='F'?'F':'M'}</small></span><small>${esc(s.club>=0?S.cl[s.club].code:'')} · ${s.first}–${s.last}</small></button>`).join(''); box.hidden=false; };
  inp.addEventListener('input', show);
  inp.addEventListener('focus', ()=>{ if(inp.value) show(); });
  inp.addEventListener('keydown', e=>{ const b=$$('button',box); if(e.key==='ArrowDown'){ act=Math.min(b.length-1,act+1); } else if(e.key==='ArrowUp'){ act=Math.max(0,act-1); } else if(e.key==='Enter'){ if(res.length){ pick(res[Math.max(0,act)]); } e.preventDefault(); return; } else if(e.key==='Escape'){ box.hidden=true; return; } else return; b.forEach((x,i)=>x.classList.toggle('act',i===act)); e.preventDefault(); });
  box.addEventListener('mousedown', e=>{ const b=e.target.closest('button'); if(b){ e.preventDefault(); pick(res[+b.dataset.i]); } });
  inp.addEventListener('blur', ()=>setTimeout(()=>box.hidden=true,150));
  function pick(s){ inp.value=niceName(s.name); box.hidden=true; onPick && onPick(s.id); }
  return {set(id){ inp.value = id!=null&&S.sw[id]? niceName(S.sw[id].name):''; }};
}

/* ---------- seletor de época / período ---------- */
function perNorm(st, def='last'){
  const ys=S.years, a=ys[0], b=ys[ys.length-1];
  if(st.y1==null||!ys.includes(+st.y1)) st.y1=b;
  if(st.y0==null||!ys.includes(+st.y0)) st.y0 = def==='all' ? a : st.y1;
  st.y0=+st.y0; st.y1=+st.y1; if(st.y0>st.y1){ const t=st.y0; st.y0=st.y1; st.y1=t; }
}
function perLabel(st){ return st.y0===st.y1 ? 'Época '+yearLabel(st.y0) : `Período ${st.y0}–${st.y1}`; }
function perHTML(pfx, st, label='Época ou período', def='last', ys=S.years){
  perNorm(st, def); const o=ys.map(y=>[y, yearLabel(y)]);
  return `<div class="fld"><span>${esc(label)}</span><div class="per">${selHTML(pfx+'P0', o, st.y0, null, 'aria-label="De"')}<span class="muted small">a</span>${selHTML(pfx+'P1', o, st.y1, null, 'aria-label="Até"')}<div class="seg seg-s" role="group"><button type="button" data-q="1" title="Última época">Última</button><button type="button" data-q="4" title="Últimas 4 épocas (ciclo)">4 ép.</button><button type="button" data-q="all" title="Todas as épocas">Tudo</button></div></div></div>`;
}
function bindPer(root, pfx, st, cb, ys=S.years){
  const s0=$('#'+pfx+'P0',root), s1=$('#'+pfx+'P1',root); if(!s0) return;
  const sync=()=>{ s0.value=st.y0; s1.value=st.y1; };
  s0.onchange=()=>{ st.y0=+s0.value; if(st.y0>st.y1) st.y1=st.y0; sync(); cb(); };
  s1.onchange=()=>{ st.y1=+s1.value; if(st.y1<st.y0) st.y0=st.y1; sync(); cb(); };
  s0.parentElement.querySelector('.seg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const last=ys[ys.length-1], first=ys[0];
    if(b.dataset.q==='1'){ st.y0=st.y1=last; } else if(b.dataset.q==='4'){ st.y1=last; st.y0=Math.max(first,last-3); } else { st.y0=first; st.y1=last; } sync(); cb(); });
}

<script>

/* ============================================================
   Vistas: Painel nacional · Evolução · Rankings · Nadadores

function descFilters(f, skip=[]){
  const p=[];
  if(!skip.includes('y') && f.y0!=null) p.push(perLabel(f));
  if(!skip.includes('g')) p.push(f.g===''||f.g==null ? 'Ambos os géneros' : G_L[+f.g]);
  if(!skip.includes('co')) p.push(f.co===''||f.co==null ? 'PL e PC' : CO_M[+f.co]);
  if(!skip.includes('ev') && f.ev!=null) p.push(f.ev===''? 'Todas as provas' : evLabel(+f.ev));
  if(f.esc) p.push(escLabelFromVal(f.esc));
  if(f.amin||f.amax) p.push('Idade '+(f.amin||'…')+'–'+(f.amax||'…'));
  if(f.nat) p.push(f.nat==='POR'?'Nacionalidade portuguesa':'Nacionalidade estrangeira');
  if(f.reg) p.push(regLabel(f.reg));
  if(f.club){ const c=S.cl[S.clKey.get(f.club)]; p.push(c?c.name:f.club); }
  if(f.minp) p.push('≥ '+f.minp+' pts');
  return p.join(' · ');
}
function metricOf(vals, m){ if(!vals.length) return NaN; if(m==='median') return median(vals); if(m==='top50'){ const s=[...vals].sort((a,b)=>b-a).slice(0,50); return mean(s);} if(m==='top10'){ const s=[...vals].sort((a,b)=>b-a).slice(0,10); return mean(s);} return mean(vals); }
const METRIC_L = {top50:'Média dos 50 melhores', top10:'Média dos 10 melhores', mean:'Média', median:'Mediana'};

/* agregação: por época, melhor resultado (pontos) de cada nadador dentro do filtro (sem restrição de período) */
function aggBest(f){
  const ff=Object.assign({},f,{y0:null,y1:null}), filt=makeFilter(ff), R=S.R, per=new Map(), nrows=new Map();
  for(const y of S.years){ per.set(y,new Map()); nrows.set(y,0); }
  for(let i=0;i<R.n;i++){ if(!filt(i)) continue; const y=R.yr[i]; nrows.set(y,nrows.get(y)+1); const m=per.get(y), c=m.get(R.sw[i]); if(c===undefined || R.pt[i]>R.pt[c]) m.set(R.sw[i],i); }
  return {per, nrows};
}
function mergePer(per, y0, y1){ const out=new Map(); for(let y=y0;y<=y1;y++){ const m=per.get(y); if(!m) continue; for(const [sw,i] of m){ const c=out.get(sw); if(c===undefined||S.R.pt[i]>S.R.pt[c]) out.set(sw,i); } } return out; }
function dynTable(per){
  const first=new Map(), out=[];
  for(const y of S.years){ for(const sw of per.get(y).keys()) if(!first.has(sw)) first.set(sw,y); }
  for(const y of S.years){
    const cur=per.get(y), prev=per.get(y-1), next=per.get(y+1);
    let novos=0, cont=0, imp=0, sai=0; const dpts=[];
    for(const [sw,i] of cur){ if(first.get(sw)===y && y!==S.years[0]) novos++; if(prev&&prev.has(sw)){ cont++; const d=S.R.pt[i]-S.R.pt[prev.get(sw)]; dpts.push(d); if(d>0) imp++; } if(next && !next.has(sw)) sai++; }
    const pts=[...cur.values()].map(i=>S.R.pt[i]);
    out.push({y, n:cur.size, novos: y===S.years[0]?null:novos, cont: prev?cont:null, ret: prev&&prev.size? cont/prev.size*100 : null, sai: next? sai : null, imp: cont? imp/cont*100 : null, dmed: dpts.length? median(dpts) : null, pts: mean(pts)});
  }
  return {rows:out, first};
}

/* =================== PAINEL NACIONAL =================== */
const P = {y0:null, y1:null, g:'', co:'', esc:'', nat:'', reg:'', ev:'', metric:'top50', minp:'', dk:'1'};
function vPainel(root){
  perNorm(P);
  root.innerHTML = `
  <div class="view-head"><div><h2>Painel nacional</h2><div class="sub">Leitura coletiva dos rankings nacionais absolutos. Cada nadador conta uma vez, com a sua melhor pontuação (tabela AQUA 2026) na época ou período e dentro dos filtros escolhidos. Como cada lista anual tem um número fixo de marcas por prova, use a média dos 50 melhores ou uma pontuação mínima para comparar épocas.</div></div><div class="row" style="gap:10px;flex-wrap:wrap;justify-content:flex-end">${expHTML('pn')}<div class="exp"><span class="lbl">Relatório da época</span>${repOptsHTML()}<button class="btn" data-rep="pdf">PDF</button><button class="btn" data-rep="docx">Word</button></div></div></div>
  <div class="fbar sticky" id="pnF">
    ${perHTML('pn', P)}

    ${selHTML('pnNat', natOpts, P.nat, 'Nacionalidade')}
    ${selHTML('pnReg', regOpts(), P.reg, 'Associação')}
    ${selHTML('pnM', Object.entries(METRIC_L), P.metric, 'Indicador de nível')}

  </div>
  <div id="pnC" class="view"></div>`;
  const upd=()=>pnContent();
  [['pnEsc','esc'],['pnEv','ev'],['pnNat','nat'],['pnReg','reg'],['pnM','metric'],['pnMin','minp']].forEach(([id,k])=>$('#'+id).addEventListener('change',e=>{P[k]=e.target.value; upd();}));

  upd();
}
let PN = null;
function pnCompute(){
  const y0=P.y0, y1=P.y1, L=y1-y0+1, single=L===1;
  const {per,nrows}=aggBest(P), dyn=dynTable(per), gs = P.g===''?[0,1]:[+P.g];
  const sy = single ? S.years : yearsRange(y0,y1);
  const cnt = gs.map(g=>sy.map(y=>{ let c=0; for(const i of per.get(y).values()) if(D.G[i]===g) c++; return c; }));
  const lvl = gs.map(g=>sy.map(y=>{ const v=[]; for(const i of per.get(y).values()) if(D.G[i]===g) v.push(S.R.pt[i]); return v.length? Math.round(metricOf(v,P.metric)*10)/10 : null; }));
  const cur = mergePer(per,y0,y1), prev = mergePer(per,y0-L,y1-L), hasPrev = S.years.some(y=>y>=y0-L&&y<=y1-L);
  const curPts=[...cur.values()].map(i=>S.R.pt[i]), prevPts=[...prev.values()].map(i=>S.R.pt[i]);
  const nF=[...cur.values()].filter(i=>D.G[i]===1).length;
  let novos=0, cont=0, imp=0; for(const [sw,i] of cur){ const f=dyn.first.get(sw); if(f>=y0 && f!==S.years[0]) novos++; if(prev.has(sw)){ cont++; if(S.R.pt[i]>S.R.pt[prev.get(sw)]) imp++; } }
  const ret = hasPrev&&prev.size? cont/prev.size*100 : null;
  const clubs=new Set([...cur.values()].map(i=>S.R.cl[i]));
  let marks=0; for(let y=y0;y<=y1;y++) marks+=nrows.get(y)||0;
  const ageLab=[]; for(let a=10;a<=30;a++) ageLab.push(a===10?'≤10':a===30?'30+':String(a));
  const ages = gs.map(g=>{ const arr=new Array(21).fill(0); for(const i of cur.values()) if(D.G[i]===g){ const a=Math.min(30,Math.max(10,D.AGE[i])); arr[a-10]++; } return arr; });
  const escs = gs.map(g=>{ const arr=new Array(5).fill(0); for(const i of cur.values()) if(D.G[i]===g) arr[D.ESC[i]]++; return arr; });
  const binLab=[]; for(let b=300;b<1000;b+=50) binLab.push(b===300?'<350':b+'–'+(b+49)); binLab.push('1000+');
  const hist = gs.map(g=>{ const arr=new Array(binLab.length).fill(0); for(const i of cur.values()) if(D.G[i]===g){ const p=S.R.pt[i]; const k=Math.max(0,Math.min(binLab.length-1, Math.floor((p-300)/50))); arr[k]++; } return arr; });
  const regC=new Map(); for(const i of cur.values()){ const r=S.cl[S.R.cl[i]].reg||'—'; regC.set(r,(regC.get(r)||0)+1); }
  const regs=[...regC.entries()].sort((a,b)=>b[1]-a[1]);
  const heat = ESC_G.map((e,k)=>sy.map(y=>{ const v=[]; for(const i of per.get(y).values()) if(D.ESC[i]===k) v.push(S.R.pt[i]); return v.length>=3? metricOf(v,P.metric) : null; }));
  const heatN = ESC_G.map((e,k)=>sy.map(y=>{ let c=0; for(const i of per.get(y).values()) if(D.ESC[i]===k) c++; return c; }));
  const cm=new Map(); for(const [sw,i] of cur){ const c=S.R.cl[i]; let o=cm.get(c); if(!o){ o={c,n:0,m:0,f:0,s:0,best:-1}; cm.set(c,o);} o.n++; D.G[i]?o.f++:o.m++; o.s+=S.R.pt[i]; if(o.best<0||S.R.pt[i]>S.R.pt[o.best]) o.best=i; }

  const topRows=[...cur.values()].sort((a,b)=>S.R.pt[b]-S.R.pt[a]).map((i,k)=>({pos:k+1, i, sw:S.R.sw[i], g:D.G[i]?'F':'M', age:D.AGE[i], esc:ESC_G[D.ESC[i]].n, club:S.cl[S.R.cl[i]].code, ev:evLabel(S.R.ev[i])+' '+CO_S[S.R.co[i]], tm:S.R.tm[i], pts:S.R.pt[i], y:S.R.yr[i]}));

}
function heatHTML(rowsLab, cols, vals, ns, fmt=f1, head='Escalão', rowFmt){
  let mn=Infinity, mx=-Infinity; vals.forEach(r=>r.forEach(v=>{ if(v!=null&&isFinite(v)){ mn=Math.min(mn,v); mx=Math.max(mx,v);} }));
  const th=`<th>${esc(head)}</th>`+cols.map(c=>`<th class="num">${esc(c)}</th>`).join('');
  const tr=vals.map((r,k)=>`<tr><td><b>${rowFmt?rowFmt(k):esc(rowsLab[k])}</b></td>${r.map((v,j)=>{ if(v==null||!isFinite(v)) return `<td class="num muted">·</td>`; const a=mx>mn? .08+.62*(v-mn)/(mx-mn) : .3; return `<td class="num" style="background:rgba(var(--heat),${a.toFixed(3)})" title="${esc(rowsLab[k])} · ${esc(cols[j])}: ${fmt(v)}${ns?' · '+ns[k][j]+' nadadores':''}">${fmt(v)}</td>`; }).join('')}</tr>`).join('');
  return `<div class="tbl-wrap"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function pnContent(){
  const c=pnCompute(), el=$('#pnC'), yl=c.sy.map(String), pl=perLabel(P), prevL = c.single? String(c.y0-1) : `${c.y0-c.L}–${c.y1-c.L}`;

  el.innerHTML = `
  <div class="row"><span class="pill acc">${esc(pl)}</span>${partial}<span class="muted small">${esc(descFilters(P,['y']))}${c.single?'':' · cada nadador com a melhor marca do período'}</span></div>

    <div class="kpi"><div class="k">${esc(METRIC_L[P.metric])}</div><div class="v">${f1(lvlCur)}</div><div class="d">${isNaN(lvlPrev)?'pontos':`<span class="${lvlCur>=lvlPrev?'up':'down'}">${fSgn(lvlCur-lvlPrev)} pts</span> vs ${prevL}`}</div></div>
    <div class="kpi"><div class="k">Femininos</div><div class="v">${c.cur.size? f1(c.nF/c.cur.size*100)+'%' : '—'}</div><div class="d">${fN(c.nF)} F · ${fN(c.cur.size-c.nF)} M</div></div>
    <div class="kpi"><div class="k">Novos no ranking</div><div class="v">${fN(c.novos)}</div><div class="d">Retenção ${c.ret==null?'—':f1(c.ret)+'%'} face a ${prevL}</div></div>
    <div class="kpi"><div class="k">Melhoraram vs ${prevL}</div><div class="v">${c.cont?f1(c.imp/c.cont*100)+'%':'—'}</div><div class="d">dos que se mantiveram (${fN(c.cont)})</div></div>
    <div class="kpi"><div class="k">Clubes · marcas</div><div class="v">${fN(c.clubs.size)}</div><div class="d">${fN(c.marks)} marcas ranqueadas</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><div><h3>Nadadores no ranking por época</h3><p class="note">Nadadores distintos com pelo menos uma marca no ranking, por género.${c.single?' Época única escolhida: mostra-se toda a série para contexto.':''}</p></div></div><div class="chart" id="pnCh1"></div></div>
    <div class="card"><div class="card-h"><div><h3>Nível por época · ${esc(METRIC_L[P.metric].toLowerCase())}</h3><p class="note">Melhor pontuação de cada nadador na época (pontos AQUA 2026 em todas as épocas).</p></div></div><div class="chart" id="pnCh2"></div></div>
  </div>
  <div class="card"><div class="card-h"><div><h3>Nível por escalão ao longo das épocas</h3><p class="note">${esc(METRIC_L[P.metric])} da melhor pontuação por nadador. Tom mais escuro = nível mais alto.</p></div></div>${tblWrap('pnHeat', heatHTML(ESC_G.map(e=>e.n), yl, c.heat, c.heatN), ESC_G.length)}</div>
  <div class="grid g2">
    <div class="card"><h3>Distribuição de pontuação · ${esc(pl)}</h3><p class="note">Número de nadadores por intervalo de pontos (melhor marca).</p><div class="chart short" id="pnCh6"></div></div>
    <div class="card"><h3>Distribuição etária · ${esc(pl)}</h3><p class="note">Nadadores por idade na época da melhor marca.</p><div class="chart short" id="pnCh3"></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>Por escalão · ${esc(pl)}</h3><p class="note">Nadadores por escalão FPN.</p><div class="chart short" id="pnCh4"></div></div>

const E = {y0:null, y1:null, ev:'1', co:'0', g:'0', nat:''};
const DEPTH = [1,3,8,16,24,50,100];
function eraList(y0=S.years[0], y1=lastYear()){ const span=y1-y0+1; if(span<6) return [[y0,y1]]; const k=Math.ceil(span/3); const out=[]; for(let a=y0;a<=y1;a+=k) out.push([a,Math.min(y1,a+k-1)]); return out; }

/* taxas de progressão por idade (pares de épocas do mesmo nadador, janela w, anualizadas) com época final em [y0,y1] */
function pairMap(ev, co, g, nat=''){
  const ck=`pm${ev}_${co}_${g}_${nat}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, m=new Map();
  for(let i=0;i<R.n;i++){ if(R.ev[i]!==ev||R.co[i]!==co||D.G[i]!==g) continue; if(nat==='POR'&&!D.POR[i]) continue; if(nat==='EST'&&D.POR[i]) continue; let a=m.get(R.sw[i]); if(!a){ a=new Map(); m.set(R.sw[i],a);} a.set(R.yr[i], i); }
  D.cache.set(ck, m); return m;
}
function progRates(ev, co, g, nat='', y0=null, y1=null, w=1){
  const ck=`pr${ev}_${co}_${g}_${nat}_${y0}_${y1}_${w}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const R=S.R, m=pairMap(ev,co,g,nat), byAge=new Map(); const all=[];
  for(const a of m.values()) for(const [y,i] of a){ if(y0!=null&&(y<y0||y>y1)) continue; const p=a.get(y-w); if(p===undefined) continue; const d=(R.tm[p]-R.tm[i])/R.tm[p]*100/w; const age=D.AGE[i]; if(!byAge.has(age)) byAge.set(age,[]); byAge.get(age).push(d); all.push(d); }
  for(const v of byAge.values()) v.sort((x,y)=>x-y);
  all.sort((x,y)=>x-y); byAge.all=all;
  D.cache.set(ck, byAge); return byAge;
}
let EVX=null;
function evCompute(){
  const ev=+E.ev, co=+E.co, g=+E.g, nat=E.nat, R=S.R, y0=E.y0, y1=E.y1, sy=yearsRange(y0,y1);
  const byY=new Map(); sy.forEach(y=>byY.set(y,[]));
  const eras=eraList(y0,y1), byAgeEra=new Map();
  for(let i=0;i<R.n;i++){ if(R.ev[i]!==ev||R.co[i]!==co||D.G[i]!==g) continue; const y=R.yr[i]; if(y<y0||y>y1) continue; if(nat==='POR'&&!D.POR[i]) continue; if(nat==='EST'&&D.POR[i]) continue; byY.get(y).push(R.tm[i]); const e=eras.findIndex(([a,b])=>y>=a&&y<=b); const k=e*100+D.AGE[i]; if(!byAgeEra.has(k)) byAgeEra.set(k,[]); byAgeEra.get(k).push(R.tm[i]); }
  for(const v of byY.values()) v.sort((a,b)=>a-b);
  for(const v of byAgeEra.values()) v.sort((a,b)=>a-b);
  const depth = sy.map(y=>{ const t=byY.get(y); const o={y, n:t.length, top10: t.length>=10? mean(t.slice(0,10)) : NaN, top24: t.length>=24? mean(t.slice(0,24)) : NaN}; DEPTH.forEach(p=>o['p'+p]= t[p-1]); return o; });
  const ages=[]; for(let a=12;a<=30;a++) ages.push(a);
  const curves = eras.map((er,k)=>ages.map(a=>{ const v=byAgeEra.get(k*100+a)||[]; return v.length>=5? quantile(v,.5)/100 : null; }));
  const allAge = ages.map(a=>{ let v=[]; eras.forEach((er,k)=>{ const x=byAgeEra.get(k*100+a); if(x) v=v.concat(x); }); v.sort((x,y)=>x-y); return {a, n:v.length, p10:quantile(v,.1), p25:quantile(v,.25), p50:quantile(v,.5), p75:quantile(v,.75), best:v[0]}; }).filter(r=>r.n>0);
  const pr = progRates(ev,co,g,nat,y0,y1);
  const rates = []; for(let a=11;a<=30;a++){ const v=pr.get(a); if(!v||v.length<5) continue; rates.push({a, n:v.length, imp: v.filter(x=>x>0).length/v.length*100, mean:mean(v), p25:quantile(v,.25), p50:quantile(v,.5), p75:quantile(v,.75)}); }
  const yrRates = sy.map(y=>{ const v=progRates(ev,co,g,nat,y,y).all; return {y, n:v.length, mean:mean(v), p50:quantile(v,.5), imp: v.length? v.filter(x=>x>0).length/v.length*100 : NaN}; });
  EVX = {ev,co,g,nat,y0,y1,sy,depth,eras,ages,curves,allAge,rates,yrRates};
  return EVX;
}

    {k:'bestPt',l:'Melhor pts',num:1},
    {k:'sit',l:'Situação',f:r=>{ const d=dropInfo(S.sw[r.id],1); return d.active?'<span class="pill good">Ativo</span>':`<span class="pill">Saiu ${d.y} · ${d.age} anos</span>`; },x:r=>{ const d=dropInfo(S.sw[r.id],1); return d.active?'Ativo':'Saiu '+d.y+' ('+d.age+' anos)'; },sv:r=>{ const d=dropInfo(S.sw[r.id],1); return d.active?9999:d.y; }},
    {k:'bev',l:'Melhor prova',f:r=>evLabel(R.ev[r.best])+' '+CO_S[R.co[r.best]]+' · '+fT(R.tm[r.best])+' ('+R.yr[r.best]+')', sv:r=>R.ev[r.best]},
  ];
  NDX={t:new DataTable('ndT', cols, rows, {sort:{k:'bestPt',dir:'desc'}, page:100})};
  $('#ndInfo').innerHTML=`<span class="pill acc">${fN(rows.length)} nadadores</span><span class="muted small">${esc(perLabel(N))}</span>`;
}
async function ndModel(){ return {title:'Lista de nadadores — '+perLabel(N), subtitle:[N.q&&('Nome: '+N.q), N.g!==''&&G_L[+N.g], (N.by0||N.by1)&&('Nascidos '+(N.by0||'…')+'–'+(N.by1||'…')), N.reg&&regLabel(N.reg), N.minp&&('≥ '+N.minp+' pts')].filter(Boolean).join(' · ')||'Todos os nadadores', filename:'Nadadores_'+N.y0+'_'+N.y1, orientation:'l', blocks:[Object.assign({t:'table',sheet:'Nadadores',small:true}, NDX.t.exportRows())]}; }

<script>
'use strict';
/* ============================================================
   Vistas: Ficha individual · Comparar · Declarações
   ============================================================ */
const FS = {id:null, y0:null, y1:null, key:null, ref:'age', axis:'year', cmp:null, cev:null, caxis:'age', gco:'0'};
const INTL_RE = /\b(european|europe|world|olympic|olympics|mediterranean|commonwealth|eyof|universiade|fisu|multi ?nations|mare nostrum|len|championships|games|trophy|europeu|mundial|jogos)\b/i;
function isIntl(i){ return INTL_RE.test(S.mt[S.R.mt[i]].name); }

function swPBs(id, y0=null, y1=null){ const R=S.R, pb=new Map(); for(const i of swRowsP(id,y0,y1)){ const k=R.ev[i]*2+R.co[i]; if(!pb.has(k)||R.tm[i]<R.tm[pb.get(k)]) pb.set(k,i); } return pb; }
function swByYearBestPts(id, y0=null, y1=null){ const R=S.R, m=new Map(); for(const i of swRowsP(id,y0,y1)){ const y=R.yr[i]; if(!m.has(y)||R.pt[i]>R.pt[m.get(y)]) m.set(y,i); } return m; }
function swByAgeBestPts(id, y0=null, y1=null){ const R=S.R, m=new Map(); for(const i of swRowsP(id,y0,y1)){ const a=D.AGE[i]; if(!m.has(a)||R.pt[i]>R.pt[m.get(a)]) m.set(a,i); } return m; }
function swEventRows(id, key, y0=null, y1=null){ const R=S.R; return swRowsP(id,y0,y1).filter(i=>R.ev[i]*2+R.co[i]===key).sort((a,b)=>R.yr[a]-R.yr[b]); }
const keyLabel = k => evLabel(k>>1)+' · '+CO_S[k&1];
const ord = n => n+'.º';
function swMetaLine(s){ const cl=S.cl[s.club]; return `${s.g==='F'?'Feminino':'Masculino'} · nascid${s.g==='F'?'a':'o'} a ${fBD(s.bd)} · ${cl?cl.name:''}${cl&&cl.reg?' ('+cl.reg+')':''}`; }

/* listas históricas: melhor marca de cada nadador (carreira e por idade), por prova/piscina/género */
function allTime(ev, co, g){
  const ck=`at${ev}_${co}_${g}`; if(D.cache.has(ck)) return D.cache.get(ck);
  const m=pairMap(ev,co,g,''), R=S.R, best=[], byAge=new Map();
  for(const a of m.values()){ let b=Infinity; const ag=new Map(); for(const i of a.values()){ const t=R.tm[i]; if(t<b) b=t; const x=D.AGE[i]; if(!ag.has(x)||t<ag.get(x)) ag.set(x,t); } best.push(b); for(const [x,t] of ag){ if(!byAge.has(x)) byAge.set(x,[]); byAge.get(x).push(t); } }
  best.sort((x,y)=>x-y); for(const v of byAge.values()) v.sort((x,y)=>x-y);
  const o={best, byAge}; D.cache.set(ck,o); return o;
}
function lowerBound(arr, t){ let lo=0, hi=arr.length; while(lo<hi){ const m=(lo+hi)>>1; if(arr[m]<t) lo=m+1; else hi=m; } return lo; }
function histRank(i){ const R=S.R, a=allTime(R.ev[i],R.co[i],D.G[i]); return {r:lowerBound(a.best,R.tm[i])+1, n:a.best.length}; }
function histAgeRank(i){ const R=S.R, a=allTime(R.ev[i],R.co[i],D.G[i]).byAge.get(D.AGE[i])||[]; return {r:lowerBound(a,R.tm[i])+1, n:a.length}; }
/* distribuição das melhores pontuações por (época, género, idade) */
function ptsDist(y, g, age){
  const ck='pd'+y; let t=D.cache.get(ck);
  if(!t){ t=new Map(); const mm=bestPtsByYear().get(y); if(mm) for(const i of mm.values()){ const k=D.G[i]*100+D.AGE[i]; if(!t.has(k)) t.set(k,[]); t.get(k).push(S.R.pt[i]); } for(const v of t.values()) v.sort((a,b)=>a-b); D.cache.set(ck,t); }
  return t.get(g*100+age)||[];
}
function ptsPercentile(y,g,age,p){ const a=ptsDist(y,g,age); if(!a.length) return NaN; return lowerBound(a,p)/a.length*100; }

function evoRows(id, key, refMode, y0=null, y1=null){
  const R=S.R, rows=swEventRows(id,key,y0,y1), out=[]; if(!rows.length) return out;
  const t0=R.tm[rows[0]], s=S.sw[id], g=s.g==='F'?1:0;
  rows.forEach((i,k)=>{
    const p = k? rows[k-1] : null, y=R.yr[i], age=D.AGE[i];
    const pr = p!=null && R.yr[p]===y-1 ? progRates(R.ev[i],R.co[i],g).get(age) : null;
    const ref = refTime(refMode, y, R.ev[i], R.co[i], g, age);
    out.push({i, y, age, esc:ESC_F[escF(age)].n, tm:R.tm[i], pt:R.pt[i],
      dPrev: p!=null? (R.tm[p]-R.tm[i])/R.tm[p]*100 : null, gap: p!=null? y-R.yr[p] : null,
      dFirst: k? (t0-R.tm[i])/t0*100 : null,
      natMed: pr&&pr.length>=5? quantile(pr,.5) : null,
      rk:D.RK[i], n:groupSize(i), rke:D.RKE[i], ne:groupSizeEsc(i), rka:D.RKA[i], na:groupSizeAge(i),
      ref, dRef: isFinite(ref)? (ref-R.tm[i])/ref*100 : null, dt:R.dt[i], meet:S.mt[R.mt[i]].name, city:S.mt[R.mt[i]].city});
  });
  return out;
}

/* =================== FICHA INDIVIDUAL =================== */
let FX=null;
function vFicha(root, id){
  const s=S.sw[id];
  if(!s||!s.n){ root.innerHTML=`<div class="card empty">Nadador não encontrado. <button class="btn" onclick="go('nadadores')">Voltar à lista</button></div>`; return; }

  const R=S.R, y0=FS.y0, y1=FS.y1, rows=swRowsP(id,y0,y1), cl=S.cl[s.club], ageNow=lastYear()-s.by;
  const al = alertIndex().get(id);
  const head = `
  <div class="row" style="justify-content:space-between"><button class="btn ghost" onclick="history.length>1?history.back():go('nadadores')">← Voltar</button><div class="fbar" style="padding:8px 12px">${perHTML('fi', FS, 'Época ou período da ficha', 'all', sy)}</div></div>

        <div class="meta"><span><b>${s.g==='F'?'Feminino':'Masculino'}</b></span><span>Nascimento <b>${fBD(s.bd)}</b></span><span>Idade em ${lastYear()} <b>${ageNow}</b> · ${esc(ESC_F[escF(ageNow)].n)}</span><span>Nacionalidade <b>${esc(s.nat)}</b></span><span>Clube <b>${esc(cl?cl.name:'—')}</b></span><span>Associação <b>${esc(cl&&cl.reg?regLabel(cl.reg):'—')}</b></span><span>No ranking <b>${s.first}–${s.last}</b></span>${(()=>{ const d=dropInfo(s,1); return d.active?'<span class="pill good">Ativo</span>':`<span class="pill">Saiu do ranking após ${d.y}, aos ${d.age} anos</span>`; })()}</div>
        ${al?`<div style="margin-top:8px"><button class="alert-badge" id="fiAl" title="Ver alertas ${al.year}">⚑ Alerta de evolução ${al.year} · ${al.evs.length} prova${al.evs.length>1?'s':''}: ${esc(al.evs.map(e=>evShort(e.ev)+' '+CO_S[e.co]).join(', '))}</button></div>`:''}
      </div>
      <div class="row" style="justify-content:flex-end">${expHTML('fi')}<button class="btn primary" id="fiDecl">Emitir declaração</button></div>
    </div>
  </div>`;
  if(!rows.length){ root.innerHTML = head + `<div class="card empty">Sem marcas ranqueadas em ${esc(perLabel(FS))}.</div>`; fiBindHead(root,id); return; }
  const pb=swPBs(id,y0,y1), yrs=[...new Set(rows.map(i=>R.yr[i]))].sort((a,b)=>a-b);
  const bestRow = rows.reduce((b,i)=> R.pt[i]>R.pt[b]?i:b, rows[0]);
  const bestRk = rows.reduce((b,i)=> D.RK[i]<D.RK[b]||(D.RK[i]===D.RK[b]&&R.pt[i]>R.pt[b]) ? i : b, rows[0]);
  const top3 = rows.filter(i=>D.RK[i]<=3).length, top10=rows.filter(i=>D.RK[i]<=10).length, escPod=rows.filter(i=>D.RKE[i]<=3).length;
  const intl = rows.filter(isIntl);
  const byY = swByYearBestPts(id,y0,y1), fy=byY.get(yrs[0]), ly=byY.get(yrs[yrs.length-1]);
  const hr = histRank(bestRow), har = histAgeRank(bestRow);
  const g=s.g==='F'?1:0;
  // pontuação e percentil por época
  const yl=[]; for(let y=yrs[0]; y<=yrs[yrs.length-1]; y++) yl.push(y);
  const ch1 = {labels:yl.map(String), series:[
    {label:niceName(s.name), data:yl.map(y=>byY.has(y)?R.pt[byY.get(y)]:null), color:'s1'},
    {label:'Média nacional (mesmo género e idade)', data:yl.map(y=>{ const v=meanBestPtsAge(y,g,y-s.by); return isFinite(v)? Math.round(v):null; }), color:'s3', dash:true, points:false},
    {label:'Percentil 90 nacional', data:yl.map(y=>{ const a=ptsDist(y,g,y-s.by); return a.length>=10? Math.round(quantile(a,.9)) : null; }), color:'s2', dash:true, points:false}], yFmt:fN, zero:false};
  const pct = yl.map(y=> byY.has(y) ? +ptsPercentile(y,g,y-s.by,R.pt[byY.get(y)]).toFixed(1) : null);
  const chP = {labels:yl.map(String), series:[{label:'Percentil nacional', data:pct, color:'s1', fill:true}], yFmt:v=>fN(v), tipFmt:v=>'P'+f1(v)+' (acima de '+f1(v)+'% dos nadadores da mesma idade)', yMin:0, yMax:100, zero:true, legend:false};
  // perfis
  const keys=[...pb.keys()].sort((a,b)=>a-b), evs=[...new Set(keys.map(k=>k>>1))];
  const ch2 = {type:'bar', labels:evs.map(e=>evLabel(e)), series:[0,1].map(co=>({label:CO_M[co], data:evs.map(e=>pb.has(e*2+co)? R.pt[pb.get(e*2+co)] : null), color: co?'seq2':'seq0'})), zero:true, barMax:18, hardMin:0, hardMax:1000};
  const STK=['L','C','B','M','E'], DG=[['50 m',d=>d===50],['100 m',d=>d===100],['200 m',d=>d===200],['400 m+',d=>d>=400]];
  const bestBy = (pred,co)=>{ let b=null; for(const [k,i] of pb){ if((k&1)!==co) continue; if(pred(S.ev[k>>1])){ if(b==null||R.pt[i]>b) b=R.pt[i]; } } return b; };
  const chS = {type:'bar', labels:STK.map(x=>STROKE[x]), series:[0,1].map(co=>({label:CO_M[co], data:STK.map(x=>bestBy(c=>c.endsWith(x),co)), color:co?'seq2':'seq0'})), zero:true, barMax:22, hardMin:0, hardMax:1000};

function fiGrid(id, rows, yrs){
  const R=S.R, co=+FS.gco, el=$('#fiGrid');
  const evs=[...new Set(rows.filter(i=>R.co[i]===co).map(i=>R.ev[i]))].sort((a,b)=>a-b);
  if(!evs.length){ el.innerHTML=`<div class="empty">Sem marcas em ${CO_L[co].toLowerCase()} no período.</div>`; return {head:[],rows:[]}; }
  const cell=new Map(); for(const i of rows) if(R.co[i]===co) cell.set(R.ev[i]*10000+R.yr[i], i);
  const best=new Map(); for(const i of rows) if(R.co[i]===co){ const b=best.get(R.ev[i]); if(b==null||R.tm[i]<R.tm[b]) best.set(R.ev[i],i); }
  const html = `<div class="tbl-wrap"><table class="t grid-t"><thead><tr><th>Prova</th>${yrs.map(y=>`<th class="num">${y}</th>`).join('')}</tr></thead><tbody>${evs.map(e=>`<tr><td style="text-align:left"><b>${esc(evLabel(e))}</b></td>${yrs.map(y=>{ const i=cell.get(e*10000+y); if(i==null) return '<td class="muted">·</td>'; const p=cell.get(e*10000+y-1); const cls = p==null?'': R.tm[i]<R.tm[p]?'up-c':R.tm[i]>R.tm[p]?'dn-c':''; return `<td class="${cls}" title="${esc(evLabel(e))} ${y}: ${fT(R.tm[i])} · ${R.pt[i]} pts · ${D.RK[i]}.º nacional">${best.get(e)===i?'<b>'+fT(R.tm[i])+'</b>':fT(R.tm[i])}<small>${D.RK[i]}.º · ${R.pt[i]}</small></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.innerHTML = tblWrap('fiGrid', html, evs.length);
  return {head:['Prova',...yrs.map(String)], rows:evs.map(e=>[evLabel(e), ...yrs.map(y=>{ const i=cell.get(e*10000+y); return i==null?'':fT(R.tm[i])+' ('+D.RK[i]+'.º)'; })]), align:['l',...yrs.map(()=>'r')]};
}
function fiEvoSpec(id){
  const s=S.sw[id], key=FS.key, er=evoRows(id,key,FS.ref,FS.y0,FS.y1), cmp=FS.cmp;
  const cr = cmp!=null ? evoRows(cmp,key,FS.ref) : [];
  let labels, A, Rf, B;
  if(FS.axis==='age'){
    const ages=[...er.map(r=>r.age), ...cr.map(r=>r.age)]; const a0=Math.min(...ages), a1=Math.max(...ages); labels=[]; for(let a=a0;a<=a1;a++) labels.push(a);
    const at=(arr,a)=>{ const r=arr.find(x=>x.age===a); return r? r.tm/100 : null; };
    A=labels.map(a=>at(er,a)); B=labels.map(a=>at(cr,a)); Rf=labels.map(a=>{ const r=er.find(x=>x.age===a); return r&&isFinite(r.ref)? r.ref/100 : null; });
  } else {
    const ys=[...er.map(r=>r.y), ...cr.map(r=>r.y)]; const y0=Math.min(...ys), y1=Math.max(...ys); labels=[]; for(let y=y0;y<=y1;y++) labels.push(y);
    const at=(arr,y)=>{ const r=arr.find(x=>x.y===y); return r? r.tm/100 : null; };
    A=labels.map(y=>at(er,y)); B=labels.map(y=>at(cr,y)); Rf=labels.map(y=>{ const r=er.find(x=>x.y===y); return r&&isFinite(r.ref)? r.ref/100 : null; });
  }
  const series=[{label:niceName(s.name), data:A, color:'s1', spanGaps:true}, {label:REF_L[FS.ref], data:Rf, color:'s3', dash:true, points:false}];
  if(cmp!=null) series.push({label:niceName(S.sw[cmp].name), data:B, color:'s2'});

  ];

function renderCompare(el, a, b, st, pfx, per){
  const y0=per?per.y0:null, y1=per?per.y1:null;
  const R=S.R, A=S.sw[a], B=S.sw[b], pa=swPBs(a,y0,y1), pb=swPBs(b,y0,y1);
  const keys=[...new Set([...pa.keys(),...pb.keys()])].sort((x,y)=>x-y), common=keys.filter(k=>pa.has(k)&&pb.has(k));
  if(!keys.length){ el.innerHTML=`<div class="empty">Nenhum dos nadadores tem marcas no período escolhido.</div>`; return {model:async()=>[]}; }
  if(st.cev==null || !keys.includes(st.cev)) st.cev = common.length? common.reduce((m,k)=> R.pt[pa.get(k)]>R.pt[pa.get(m)]?k:m, common[0]) : keys[0];
  let wa=0, wb=0;
  const rows=keys.map(k=>{ const i=pa.get(k), j=pb.get(k); const d= i!=null&&j!=null ? R.tm[i]-R.tm[j] : null; if(d!=null){ if(d<0) wa++; else if(d>0) wb++; } return {k, ev:k>>1, co:k&1, ai:i, bi:j, d, dp: d!=null? d/R.tm[j]*100 : null}; });
  const nA=niceName(A.name), nB=niceName(B.name);
  const agesA=swByAgeBestPts(a,y0,y1), agesB=swByAgeBestPts(b,y0,y1), allAges=[...agesA.keys(),...agesB.keys()], a0=Math.min(...allAges), a1=Math.max(...allAges), al=[]; for(let x=a0;x<=a1;x++) al.push(x);
  const specPts={labels:al.map(String), series:[{label:nA, data:al.map(x=>agesA.has(x)?R.pt[agesA.get(x)]:null), color:'s1'},{label:nB, data:al.map(x=>agesB.has(x)?R.pt[agesB.get(x)]:null), color:'s2'}], zero:false, xTitle:'Idade'};
  const bA=[...pa.values()].reduce((m,i)=>m==null||R.pt[i]>R.pt[m]?i:m,null), bB=[...pb.values()].reduce((m,i)=>m==null||R.pt[i]>R.pt[m]?i:m,null);
  el.innerHTML = `
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="k" style="color:var(--s1)">● ${esc(nA)}</div><div class="v">${bA!=null?R.pt[bA]:'—'} pts</div><div class="d">${A.by} · ${esc(S.cl[A.club].code)} · ${A.first}–${A.last}</div></div>
    <div class="kpi"><div class="k" style="color:var(--s2)">● ${esc(nB)}</div><div class="v">${bB!=null?R.pt[bB]:'—'} pts</div><div class="d">${B.by} · ${esc(S.cl[B.club].code)} · ${B.first}–${B.last}</div></div>
    <div class="kpi"><div class="k">Provas em comum</div><div class="v">${common.length}</div><div class="d">melhor marca: ${esc(nA.split(' ')[0])} ${wa} · ${esc(nB.split(' ')[0])} ${wb}</div></div>
  </div>
  <div class="grid g2">
    <div><h3 style="font-size:17px">Pontuação por idade</h3><p class="note muted small">Melhor pontuação em cada idade.</p><div class="chart" id="${pfx}Ch1"></div></div>
    <div><div class="card-h"><div><h3 style="font-size:17px">Trajetória na prova</h3></div><div class="row">${selHTML(pfx+'Key', keys.map(k=>[k,keyLabel(k)+(common.includes(k)?'':' (só um)')]), st.cev)}${segHTML(pfx+'Ax',[['age','Idade'],['year','Época']],st.caxis)}</div></div><div class="chart" id="${pfx}Ch2"></div></div>
  </div>
  <h3 style="font-size:17px;margin-top:16px">Melhores marcas lado a lado</h3>
  <div id="${pfx}T1" style="margin-top:8px"></div>
  <h3 style="font-size:17px;margin-top:16px">À mesma idade · <span id="${pfx}KL">${esc(keyLabel(st.cev))}</span></h3>
  <div id="${pfx}T2" style="margin-top:8px"></div>`;
  draw(pfx+'Ch1', specPts);
  const t1=new DataTable(pfx+'T1',[
    {k:'ev',l:'Prova',f:r=>evLabel(r.ev)}, {k:'co',l:'Pisc.',f:r=>CO_S[r.co]},
    {k:'at',l:nA,num:1,f:r=>r.ai!=null?`<span class="${r.d!=null&&r.d<0?'bestA':''}">${fT(R.tm[r.ai])}</span>`:'—',x:r=>r.ai!=null?fT(R.tm[r.ai]):'',sv:r=>r.ai!=null?R.tm[r.ai]:null},
    {k:'ap',l:'Pts',num:1,f:r=>r.ai!=null?R.pt[r.ai]+` <span class="muted small">${R.yr[r.ai]}</span>`:'—',x:r=>r.ai!=null?R.pt[r.ai]:'',sv:r=>r.ai!=null?R.pt[r.ai]:null},
    {k:'bt',l:nB,num:1,f:r=>r.bi!=null?`<span class="${r.d!=null&&r.d>0?'bestB':''}">${fT(R.tm[r.bi])}</span>`:'—',x:r=>r.bi!=null?fT(R.tm[r.bi]):'',sv:r=>r.bi!=null?R.tm[r.bi]:null},
    {k:'bp',l:'Pts',num:1,f:r=>r.bi!=null?R.pt[r.bi]+` <span class="muted small">${R.yr[r.bi]}</span>`:'—',x:r=>r.bi!=null?R.pt[r.bi]:'',sv:r=>r.bi!=null?R.pt[r.bi]:null},
    {k:'d',l:'Diferença',num:1,f:r=>fDiffT(r.d),x:r=>r.d==null?'':(r.d/100).toFixed(2)},
    {k:'dp',l:'Dif. %',num:1,f:r=>r.dp==null?'—':fPct(r.dp),x:r=>r.dp==null?'':+r.dp.toFixed(2)},
    {k:'w',l:'Vantagem',f:r=>r.d==null?'—':r.d<0?`<span class="bestA">${esc(nA)}</span>`:r.d>0?`<span class="bestB">${esc(nB)}</span>`:'Empate',x:r=>r.d==null?'':r.d<0?nA:r.d>0?nB:'Empate',sv:r=>r.d},
  ], rows, {page:40});
  const out={t1, specPts};
  const evPart=()=>{
    const k=st.cev, ea=swEventRows(a,k,y0,y1), eb=swEventRows(b,k,y0,y1);
    const by = st.caxis==='age' ? (i=>D.AGE[i]) : (i=>R.yr[i]);
    const xs=[...ea.map(by),...eb.map(by)]; const x0=Math.min(...xs), x1=Math.max(...xs), lab=[]; for(let x=x0;x<=x1;x++) lab.push(x);
    const at=(arr,x)=>{ const i=arr.find(i=>by(i)===x); return i!=null? R.tm[i]/100 : null; };
    const spec={labels:lab.map(String), series:[{label:nA,data:lab.map(x=>at(ea,x)),color:'s1'},{label:nB,data:lab.map(x=>at(eb,x)),color:'s2'}], yRev:true, yFmt:fTs, zero:false, xTitle: st.caxis==='age'?'Idade':'Época'};
    draw(pfx+'Ch2', spec);
    const ages=[...new Set([...ea.map(i=>D.AGE[i]),...eb.map(i=>D.AGE[i])])].sort((x,y)=>x-y);
    const r2=ages.map(g=>{ const i=ea.find(i=>D.AGE[i]===g), j=eb.find(j=>D.AGE[j]===g); return {age:g, ai:i, bi:j, d: i!=null&&j!=null? R.tm[i]-R.tm[j] : null}; });
    out.t2=new DataTable(pfx+'T2',[
      {k:'age',l:'Idade',num:1,dir0:'asc'},
      {k:'a',l:nA,num:1,f:r=>r.ai!=null?`${fT(R.tm[r.ai])} <span class="muted small">(${R.yr[r.ai]})</span>`:'—',x:r=>r.ai!=null?fT(R.tm[r.ai]):''},
      {k:'b',l:nB,num:1,f:r=>r.bi!=null?`${fT(R.tm[r.bi])} <span class="muted small">(${R.yr[r.bi]})</span>`:'—',x:r=>r.bi!=null?fT(R.tm[r.bi]):''},
      {k:'d',l:'Diferença',num:1,f:r=>fDiffT(r.d),x:r=>r.d==null?'':(r.d/100).toFixed(2)},
    ], r2, {page:40});
    out.specEv=spec; const kl=$('#'+pfx+'KL'); if(kl) kl.textContent=keyLabel(k);
  };
  $('#'+pfx+'Key').onchange=e=>{ st.cev=+e.target.value; evPart(); };
  bindSeg(el, pfx+'Ax', v=>{ st.caxis=v; evPart(); });
  evPart();
  out.model = async ()=>[
    {t:'h', text:'Comparação: '+nA+' vs '+nB+(per?' · '+perLabel(per):'')},
    {t:'chart', title:'Pontuação por idade', spec:out.specPts},
    {t:'chart', title:'Trajetória em '+keyLabel(st.cev), spec:out.specEv},
    Object.assign({t:'table', sheet:'Comparação marcas', small:true}, out.t1.exportRows()),
    Object.assign({t:'table', sheet:'Mesma idade'}, out.t2.exportRows()),
  ];
  return out;
}

function dcData(){

  else rows.sort((a,b)=>R.yr[a]-R.yr[b]||R.co[a]-R.co[b]||R.ev[a]-R.ev[b]);

  if(DC.type==='pb') push('Época','l');
  if(DC.date) push('Data','l'); if(DC.meet) push('Competição','l'); if(DC.meet) push('Local','l'); if(clubs.length>1) push('Clube','l');
  const body=rows.map(i=>{ const r=[]; if(DC.type==='year') r.push(String(R.yr[i])); r.push(evLabel(R.ev[i]), CO_S[R.co[i]]==='PL'?'50 m':'25 m', fT(R.tm[i])); if(DC.pts) r.push(String(R.pt[i])); if(DC.rk) r.push(ord(D.RK[i])); if(DC.rke) r.push(ord(D.RKE[i])+' '+ESC_G[D.ESC[i]].n); if(DC.type==='pb') r.push(String(R.yr[i])); if(DC.date) r.push(fD(R.dt[i])); if(DC.meet){ r.push(S.mt[R.mt[i]].name); r.push(S.mt[R.mt[i]].city); } if(clubs.length>1) r.push(S.cl[R.cl[i]].code); return r; });
